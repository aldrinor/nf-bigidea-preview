<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wildfire Smoke — NanoFlashing</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--screenH:100vh}
html,body{height:100%;background:#edf0f2;overflow:hidden;overscroll-behavior:none}
header{position:fixed;top:0;left:0;width:100%;z-index:100;display:flex;align-items:center;justify-content:space-between;
padding:16px 30px;background:linear-gradient(180deg,rgba(237,240,242,0.92),rgba(237,240,242,0));pointer-events:none}
header a{pointer-events:auto;display:inline-flex}
header img{height:50px;width:auto;opacity:.95;display:block}
header .meta{font-family:'Space Mono',monospace;font-size:12px;color:#8a9095;letter-spacing:.04em}
.deck{position:relative;width:100%;transform:translateY(0);will-change:transform}
.deck.smooth{transition:transform 720ms cubic-bezier(.7,0,.2,1)}
.screen{height:var(--screenH);width:100%;overflow:hidden}
.screen iframe{width:100%;height:100%;border:0;display:block}
/* page-progress dots */
#dots{position:fixed;right:18px;top:50%;transform:translateY(-50%);z-index:101;display:flex;flex-direction:column;gap:11px}
#dots button{width:8px;height:8px;border-radius:50%;border:0;padding:0;cursor:pointer;background:rgba(20,24,28,.22);transition:background .3s,transform .3s}
#dots button.on{background:#1f2327;transform:scale(1.35)}
@media(max-width:700px){header img{height:38px}header{padding:12px 16px}#dots{right:10px}}
@media(prefers-reduced-motion:reduce){.deck.smooth{transition:none}html,body{overflow-y:auto}}
</style></head>
<body>
<header><a href="index.html" aria-label="NanoFlashing home"><img src="assets/brand/nanoflashing_black.svg" alt="NanoFlashing" onerror="this.style.display='none'"></a><div class="meta">Wildfire Smoke</div></header>
<div class="deck" id="deck">
  <section class="screen"><iframe src="wf_ball.html?v=20260629e" loading="eager" title="Charged particle" allow="autoplay"></iframe></section>
  <section class="screen"><iframe src="wfmap.html?v=20260629e" loading="eager" title="The map" allow="autoplay"></iframe></section>
  <section class="screen"><iframe src="wf_health.html?v=20260629e" loading="eager" title="In the body" allow="autoplay"></iframe></section>
  <section class="screen"><iframe src="wf_filter.html?v=20260629e" loading="lazy" title="The filter" allow="autoplay"></iframe></section>
  <section class="screen"><iframe src="wf_solution.html?v=20260629e" loading="lazy" title="The answer" allow="autoplay"></iframe></section>
</div>
<div id="dots" aria-hidden="true"></div>
<script>
(function(){
  var deck=document.getElementById('deck');
  var frames=[].slice.call(document.querySelectorAll('.screen iframe'));
  var N=frames.length, idx=0, locked=false;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return; // native scroll for reduced-motion users
  function setH(){
    document.documentElement.style.setProperty('--screenH', window.innerHeight+'px');
    deck.classList.remove('smooth');
    deck.style.transform='translateY(calc(-1 * '+idx+' * var(--screenH)))';
    requestAnimationFrame(function(){ deck.classList.add('smooth'); });
  }
  setH(); window.addEventListener('resize',setH); window.addEventListener('orientationchange',setH);
  // progress dots
  var dotsWrap=document.getElementById('dots'), dots=[];
  for(var i=0;i<N;i++){ (function(i){ var b=document.createElement('button');
    b.setAttribute('aria-label','Go to section '+(i+1)); b.addEventListener('click',function(){go(i);});
    dotsWrap.appendChild(b); dots.push(b); })(i); }
  function apply(){ deck.classList.add('smooth'); deck.style.transform='translateY(calc(-1 * '+idx+' * var(--screenH)))';
    for(var i=0;i<N;i++) dots[i].className = i===idx?'on':''; }
  function go(i){ i=Math.max(0,Math.min(N-1,i)); if(i===idx) return; idx=i; apply();
    locked=true; setTimeout(function(){locked=false;}, 780); }
  function wheel(e){ if(locked){ e.preventDefault(); return; }
    if(e.deltaY>16){ e.preventDefault(); go(idx+1); } else if(e.deltaY<-16){ e.preventDefault(); go(idx-1); } }
  var ty=null;
  function ts(e){ ty=(e.touches?e.touches[0]:e).clientY; }
  function te(e){ if(ty==null) return; var y=(e.changedTouches?e.changedTouches[0]:e).clientY, dy=ty-y; ty=null;
    if(locked) return; if(dy>44) go(idx+1); else if(dy<-44) go(idx-1); }
  window.addEventListener('wheel',wheel,{passive:false});
  window.addEventListener('touchstart',ts,{passive:true});
  window.addEventListener('touchend',te,{passive:true});
  window.addEventListener('keydown',function(e){ if(locked) return;
    if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(idx+1); }
    else if(e.key==='ArrowUp'||e.key==='PageUp'){ e.preventDefault(); go(idx-1); } });
  // forward wheel/touch from inside same-origin iframes so wheeling over a section still pages
  function attach(f){ try{ var w=f.contentWindow; if(!w) return;
    w.addEventListener('wheel',wheel,{passive:false}); w.addEventListener('touchstart',ts,{passive:true}); w.addEventListener('touchend',te,{passive:true}); }catch(e){} }
  frames.forEach(function(f){ f.addEventListener('load',function(){attach(f);});
    try{ if(f.contentDocument && f.contentDocument.readyState==='complete') attach(f); }catch(e){} });
  deck.classList.add('smooth'); apply();
})();
</script>
</body></html>

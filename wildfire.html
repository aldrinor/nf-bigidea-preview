<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wildfire Smoke — NanoFlashing</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    scroll-behavior: smooth;
    /* gentle snap — kept soft so the map section still feels interactive */
    scroll-snap-type: y proximity;
  }

  body {
    background: #0e1418;
    color: #e8eef2;
    font-family: 'Space Mono', ui-monospace, monospace;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Sticky header ---------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background: rgba(14, 20, 24, 0.8);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .brand-logo {
    display: inline-block;
    height: 26px;
    max-width: 200px;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }

  .brand-logo-fallback {
    display: none;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #e8eef2;
  }

  .section-tag {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: #7a8a92;
    letter-spacing: 0.02em;
  }

  /* ---------- Sections ---------- */
  .frame-section {
    height: 100vh;
    width: 100%;
    scroll-snap-align: start;
    scroll-snap-stop: normal;
    position: relative;
    overflow: hidden;
  }

  .frame-section iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: #0e1418;
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 640px) {
    .site-header { height: 52px; padding: 0 16px; }
    .brand-logo { height: 22px; }
    .section-tag { font-size: 11px; }
    .frame-section { min-height: 600px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; scroll-snap-type: none; }
  }
</style>
</head>
<body>

  <header class="site-header">
    <img
      class="brand-logo"
      src="assets/brand/nanoflashing_black.svg"
      alt="NanoFlashing"
      onerror="this.style.display='none'; document.getElementById('brandFallback').style.display='inline-block';"
    >
    <span id="brandFallback" class="brand-logo-fallback">NanoFlashing</span>
    <span class="section-tag">Wildfire Smoke</span>
  </header>

  <main>
    <section class="frame-section">
      <iframe src="wf_ball.html" title="Charged particle hero" loading="eager"></iframe>
    </section>

    <section class="frame-section">
      <iframe src="wfmap.html" title="Smoke map and timeline" loading="lazy"></iframe>
    </section>

    <section class="frame-section">
      <iframe src="wf_health.html" title="Breathing body" loading="lazy"></iframe>
    </section>

    <section class="frame-section">
      <iframe src="wf_filter.html" title="Charge-fades principle" loading="lazy"></iframe>
    </section>

    <section class="frame-section">
      <iframe src="wf_solution.html" title="NanoFlashing solution" loading="lazy"></iframe>
    </section>
  </main>

</body>
</html>

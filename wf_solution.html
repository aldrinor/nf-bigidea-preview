<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoFlashing — Built to stay charged</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#1f2327;
    --muted:#8a9095;
    --accent:#1b7bff;
    --hair:rgba(20,24,28,0.08);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Space Grotesk",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  .solution{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(64px,12vh,140px) clamp(24px,6vw,80px);
    overflow:hidden;
    isolation:isolate;
  }

  /* faint cool-blue radial glow behind the logo */
  .solution::before{
    content:"";
    position:absolute;
    left:50%;
    top:52%;
    transform:translate(-50%,-50%);
    width:min(720px,90vw);
    height:min(720px,90vw);
    background:radial-gradient(circle at center,
      rgba(27,123,255,0.14) 0%,
      rgba(27,123,255,0.06) 38%,
      rgba(27,123,255,0) 68%);
    pointer-events:none;
    z-index:0;
  }

  .stack{
    position:relative;
    z-index:1;
    max-width:640px;
    margin:0 auto;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
  }

  .kicker{
    font-family:"Space Mono",monospace;
    font-size:13px;
    letter-spacing:0.02em;
    color:var(--muted);
    margin-bottom:28px;
  }

  .headline{
    font-family:-apple-system,system-ui,'Inter','Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(30px,4.6vw,58px);
    line-height:1.06;
    color:#1a1a1a;
    letter-spacing:-0.022em;
    margin-bottom:22px;
  }

  .headline em{
    font-style:normal;
    font-weight:700;
    color:var(--accent);
  }

  .lede{
    font-family:"Space Grotesk",sans-serif;
    font-size:18px;
    line-height:1.55;
    color:var(--muted);
    max-width:520px;
    margin:0 auto 64px;
  }

  .logo-link{
    display:inline-block;
    text-decoration:none;
    color:inherit;
    line-height:0;
    transition:transform .35s cubic-bezier(.2,.7,.2,1);
    position:relative;
  }

  .logo-link::after{
    content:"";
    position:absolute;
    left:12%;
    right:12%;
    bottom:-6px;
    height:1px;
    background:var(--accent);
    transform:scaleX(0);
    transform-origin:center;
    opacity:0;
    transition:transform .35s cubic-bezier(.2,.7,.2,1),opacity .35s ease;
  }

  .logo-link:hover{
    transform:scale(1.03);
  }

  .logo-link:hover::after{
    transform:scaleX(1);
    opacity:.7;
  }

  .logo-link img{
    display:block;
    height:clamp(48px,9vw,110px);
    width:auto;
    opacity:.92;
    transition:filter .35s ease;
  }

  .logo-link:hover img{
    filter:drop-shadow(0 0 18px rgba(27,123,255,0.18));
  }

  .cta{
    display:inline-block;
    margin-top:36px;
    font-family:"Space Mono",monospace;
    font-size:13px;
    color:var(--accent);
    text-decoration:none;
    letter-spacing:0.01em;
    transition:opacity .25s ease,transform .25s ease;
  }

  .cta:hover{
    opacity:.75;
    transform:translateX(3px);
  }

  @media (max-width:640px){
    .lede{ margin-bottom:52px; font-size:17px; }
    .kicker{ margin-bottom:22px; }
  }
</style>
</head>
<body>

<section class="solution">
  <div class="stack">
    <p class="kicker">The answer</p>

    <h1 class="headline">Built to stay <em>charged</em></h1>

    <p class="lede">NanoFlashing makes a material that holds its charge — so it keeps capturing what an ordinary filter lets through once its charge is gone.</p>

    <a class="logo-link" href="#">
      <img src="assets/brand/nanoflashing_black.svg"
           alt="NanoFlashing"
           onerror="this.style.display='none'">
    </a>

    <a class="cta" href="#">Explore the platform →</a>
  </div>
</section>

</body>
</html>

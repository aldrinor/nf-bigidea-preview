<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoFlashing — The Answer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1418;
    --ink:#eef2f4;
    --muted:#9aa7ad;
    --cyan:#34e1ff;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  .section{
    position:relative;
    min-height:100vh;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(64px,10vw,140px) 24px;
    overflow:hidden;
    isolation:isolate;
  }

  /* ambient cyan glow behind logo */
  .glow{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:clamp(320px,60vw,720px);
    height:clamp(320px,60vw,720px);
    border-radius:50%;
    background:radial-gradient(circle at center, rgba(52,225,255,0.18) 0%, rgba(52,225,255,0.06) 35%, rgba(52,225,255,0) 70%);
    filter:blur(20px);
    z-index:0;
    animation:pulse 6s ease-in-out infinite;
    pointer-events:none;
  }

  @keyframes pulse{
    0%,100%{opacity:0.55; transform:translate(-50%,-50%) scale(1);}
    50%{opacity:0.95; transform:translate(-50%,-50%) scale(1.08);}
  }

  /* faint grid texture for premium feel */
  .grid-bg{
    position:absolute;
    inset:0;
    z-index:0;
    background-image:
      linear-gradient(rgba(52,225,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(52,225,255,0.04) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%);
    -webkit-mask-image:radial-gradient(ellipse at center, rgba(0,0,0,0.6) 0%, transparent 70%);
    pointer-events:none;
  }

  .stack{
    position:relative;
    z-index:2;
    max-width:640px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
  }

  .kicker{
    font-family:'Space Mono',monospace;
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--cyan);
    margin-bottom:28px;
    opacity:0.85;
  }

  .kicker::before{
    content:"";
    display:inline-block;
    width:24px;
    height:1px;
    background:var(--cyan);
    vertical-align:middle;
    margin-right:10px;
    opacity:0.6;
  }

  .headline{
    font-family:'Instrument Serif',serif;
    font-weight:400;
    font-size:clamp(32px,5vw,64px);
    line-height:1.05;
    letter-spacing:-0.01em;
    color:var(--ink);
    margin-bottom:24px;
  }

  .lede{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    line-height:1.55;
    font-weight:300;
    color:var(--muted);
    max-width:520px;
    margin:0 auto 56px;
  }

  .logo-link{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    text-decoration:none;
    color:inherit;
    padding:18px 28px;
    border-radius:14px;
    transition:transform 0.5s cubic-bezier(0.16,1,0.3,1), filter 0.5s ease;
    position:relative;
  }

  .logo-link::after{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:18px;
    border:1px solid rgba(52,225,255,0);
    transition:border-color 0.5s ease, box-shadow 0.5s ease;
    pointer-events:none;
  }

  .logo-link:hover{
    transform:scale(1.03);
    filter:brightness(1.15);
  }

  .logo-link:hover::after{
    border-color:rgba(52,225,255,0.25);
    box-shadow:0 0 60px rgba(52,225,255,0.15), inset 0 0 30px rgba(52,225,255,0.05);
  }

  .logo-img{
    height:clamp(48px,9vw,110px);
    width:auto;
    filter:invert(1) brightness(1.6);
    display:block;
    transition:filter 0.5s ease;
  }

  .logo-link:hover .logo-img{
    filter:invert(1) brightness(2.1);
  }

  .cta{
    font-family:'Space Mono',monospace;
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--cyan);
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:gap 0.4s ease, color 0.4s ease;
  }

  .logo-link:hover .cta{
    gap:14px;
    color:#aef3ff;
  }

  .cta .arrow{
    display:inline-block;
    transition:transform 0.4s cubic-bezier(0.16,1,0.3,1);
  }

  .logo-link:hover .cta .arrow{
    transform:translateX(4px);
  }

  /* small footer mark */
  .mark{
    position:absolute;
    bottom:32px;
    left:50%;
    transform:translateX(-50%);
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:0.12em;
    color:var(--muted);
    opacity:0.4;
    z-index:2;
  }

  @media (max-width:560px){
    .lede{font-size:16px; margin-bottom:44px;}
    .kicker{font-size:11px;}
    .mark{font-size:10px;}
  }

  @media (prefers-reduced-motion: reduce){
    .glow{animation:none;}
    *{transition:none !important;}
  }
</style>
</head>
<body>

<section class="section" aria-label="The answer — NanoFlashing">
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <div class="stack">
    <p class="kicker">The answer</p>
    <h2 class="headline">Built to stay charged</h2>
    <p class="lede">NanoFlashing makes a material that holds its charge — so it keeps capturing what an ordinary filter lets through once its charge is gone.</p>

    <a class="logo-link" href="#" aria-label="Go to the NanoFlashing platform">
      <img
        class="logo-img"
        src="assets/brand/nanoflashing_black.svg"
        alt="NanoFlashing"
        onerror="this.style.display='none';"
      >
      <span class="cta">Explore the platform <span class="arrow">→</span></span>
    </a>
  </div>

  <div class="mark">NanoFlashing · closing</div>
</section>

<script>
  // subtle parallax of the glow following pointer, very restrained
  const glow = document.querySelector('.glow');
  const section = document.querySelector('.section');
  let raf = null;

  section.addEventListener('pointermove', (e) => {
    if (raf) return;
    raf = requestAnimationFrame(() => {
      const r = section.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      glow.style.transform = `translate(calc(-50% + ${x * 30}px), calc(-50% + ${y * 30}px)) scale(1)`;
      raf = null;
    });
  });

  section.addEventListener('pointerleave', () => {
    glow.style.transform = 'translate(-50%,-50%) scale(1)';
  });
</script>

</body>
</html>

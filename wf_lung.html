<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where the smoke settles — wildfire PM and the lungs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2; --ink:#1f2327; --muted:#6b7178;
    --red:#e23b3b; --line:#d4d8dc; --paper:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Space Mono',monospace;-webkit-font-smoothing:antialiased}
  .wrap{max-width:520px;margin:0 auto;padding:10px}
  .fig-frame{position:relative;width:100%;aspect-ratio:880/1168;
    background:var(--paper);border:1px solid var(--line);border-radius:4px;
    overflow:hidden;box-shadow:0 1px 0 rgba(31,35,39,.02)}
  .fig-frame img{position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
  #lungCanvas{position:absolute;inset:0;width:100%;height:100%;
    pointer-events:none;transition:opacity .5s ease}

  /* clickable regions */
  .region{position:absolute;z-index:4;border-radius:50%;cursor:pointer;
    background:transparent;border:0;padding:0;
    transform:translate(-50%,-50%);outline:none}
  .region:focus-visible{box-shadow:0 0 0 2px var(--red);border-radius:50%}
  .region .marker{position:absolute;inset:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;pointer-events:none}
  .region .ring{position:absolute;inset:0;border-radius:50%;
    border:1px solid rgba(31,35,39,.18);background:rgba(31,35,39,.025);
    transition:background .2s ease,border-color .2s ease,transform .2s ease}
  .region:hover .ring{background:rgba(226,59,59,.06);border-color:rgba(226,59,59,.45)}
  .region.active .ring{background:rgba(226,59,59,.10);border-color:rgba(226,59,59,.7)}
  /* hollow red ring marker — reads as UI affordance, not a particle */
  .region .pulse{position:absolute;left:50%;top:50%;width:14px;height:14px;
    margin:-7px 0 0 -7px;border-radius:50%;
    border:1.5px solid var(--red);background:transparent;
    opacity:.8;animation:rgn-pulse 2.4s ease-out infinite}
  .region .dot{position:absolute;left:50%;top:50%;width:14px;height:14px;
    margin:-7px 0 0 -7px;border-radius:50%;
    border:1.5px solid var(--red);background:var(--paper);
    opacity:1}
  @keyframes rgn-pulse{
    0%{transform:scale(.7);opacity:.7}
    70%{transform:scale(2.6);opacity:0}
    100%{transform:scale(2.6);opacity:0}
  }

  .hint{position:absolute;left:10px;bottom:8px;z-index:5;
    font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.06em;
    color:var(--muted);background:rgba(255,255,255,.7);padding:3px 7px;
    border-radius:2px;pointer-events:none;backdrop-filter:blur(2px)}

  /* impact card */
  .card-scrim{position:absolute;inset:0;z-index:8;background:rgba(237,240,242,0);
    pointer-events:none;transition:background .25s ease}
  .card-scrim.show{background:rgba(31,35,39,.18);pointer-events:auto}
  .impact-card{position:absolute;z-index:9;background:var(--paper);
    border:1px solid var(--line);border-left:3px solid var(--red);
    border-radius:3px;padding:14px 16px 12px;width:78%;max-width:340px;
    box-shadow:0 8px 28px rgba(31,35,39,.14);
    opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .28s ease,transform .28s ease}
  .impact-card.show{opacity:1;transform:translateY(0);pointer-events:auto}
  .impact-card .ic-label{font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
    margin:0 0 8px;font-weight:700}
  .impact-card .ic-body{font-family:'Space Grotesk',sans-serif;font-size:13px;
    line-height:1.5;color:#2a2f34;margin:0 0 10px}
  .impact-card .ic-cite{font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.04em;color:#4a4f55;margin:0 0 10px;font-weight:500}
  .impact-card .ic-close{position:absolute;top:6px;right:6px;width:22px;height:22px;
    border:0;background:transparent;cursor:pointer;border-radius:2px;
    color:var(--muted);font-family:'Space Mono',monospace;font-size:14px;
    display:flex;align-items:center;justify-content:center;line-height:1}
  .impact-card .ic-close:hover{background:var(--bg);color:var(--ink)}

  .controls{display:flex;align-items:center;justify-content:space-between;
    margin-top:16px;gap:12px;flex-wrap:wrap}
  .replay-btn{font-family:'Space Mono',monospace;font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
    background:transparent;border:1px solid var(--ink);padding:9px 16px;
    cursor:pointer;border-radius:2px;transition:background .18s,color .18s}
  .replay-btn:hover{background:var(--ink);color:#fff}
  .replay-btn:active{transform:translateY(1px)}
  .replay-btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  .legend{display:flex;gap:14px;font-size:10px;color:var(--muted);letter-spacing:.08em;
    align-items:center;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%}
  .dot.pm10{background:#b23a2d}
  .dot.pm25{background:var(--ink);opacity:.85}
  .dot.cross{background:#ec1330}
</style>
</head>
<body>
<div class="wrap">
  <figure class="fig-frame" id="figFrame">
    <img src="assets/wf_lung.png" alt="Anatomical illustration of the lungs, airways and alveoli">
    <canvas id="lungCanvas"></canvas>

    <button class="region" data-region="brain" aria-label="Brain — cognition impact" type="button"></button>
    <button class="region" data-region="airway" aria-label="Upper airway impact" type="button"></button>
    <button class="region" data-region="lungs" aria-label="Lungs — children impact" type="button"></button>
    <button class="region" data-region="heart" aria-label="Heart and bloodstream impact" type="button"></button>

    <div class="hint" id="hint">Tap a region to see the impact</div>

    <div class="card-scrim" id="cardScrim"></div>
    <article class="impact-card" id="impactCard" role="dialog" aria-modal="false" aria-labelledby="icLabel">
      <button class="ic-close" id="icClose" aria-label="Close impact card" type="button">×</button>
      <p class="ic-label" id="icLabel"></p>
      <p class="ic-body" id="icBody"></p>
      <p class="ic-cite" id="icCite"></p>
    </article>
  </figure>

  <div class="controls">
    <button class="replay-btn" id="replayBtn">Replay breath</button>
    <div class="legend">
      <span><i class="dot pm10"></i>PM10 · coarse</span>
      <span><i class="dot pm25"></i>PM2.5 · fine</span>
      <span><i class="dot cross"></i>PM2.5 → blood</span>
    </div>
  </div>
</div>

<script>
/* ============================================================
   Airway waypoints — anatomically traced through the illustration
   (fractions of the image box; x→right, y→down)
   ============================================================ */
const AIR = {
  entry:     {x:0.72, y:0.29},   // mouth/nose opening
  pharynx:   {x:0.61, y:0.35},   // behind the jaw
  larynx:    {x:0.53, y:0.42},   // top of the trachea
  tracheaTop:{x:0.50, y:0.46},
  tracheaMid:{x:0.495,y:0.51},   // straight DOWN the trachea tube
  carina:    {x:0.49, y:0.55},   // the split
  rightMid:  {x:0.58, y:0.64},   // right main bronchus
  alveoli:   {x:0.70, y:0.84},   // the magnified grape cluster (lower-right)
  leftDeep:  {x:0.34, y:0.66},   // left main bronchus into the left lung
  blood:     {x:0.55, y:0.70}    // up a pulmonary vessel toward the heart
};
const UPPER_DEPOSIT = {x:0.50, y:0.49};   // PM10 lodges along the trachea

/* clickable regions — normalized centers + sizes (fraction of frame) */
const REGIONS = {
  brain:  {x:0.55, y:0.13, size:0.16,
    label:"Brain — cognition",
    body:"Children score lower on tests after a school-year of wildfire-smoke exposure.",
    cite:"Stanford, Nature Sustainability, 2022"},
  airway: {x:0.54, y:0.40, size:0.14,
    label:"Upper airway",
    body:"Coarse PM10 is trapped here — irritation and coughing as the body works to clear it.",
    cite:"US EPA, Particulate Matter Basics"},
  lungs:  {x:0.42, y:0.62, size:0.16,
    label:"Lungs — children",
    body:"Children show up to about ten times the rise in respiratory visits from wildfire PM2.5 versus equal-mass PM2.5 from other sources.",
    cite:"UC San Diego, Pediatrics, 2021"},
  heart:  {x:0.62, y:0.74, size:0.16,
    label:"Heart & bloodstream",
    body:"The finest PM2.5 crosses from the alveoli into the blood; the EPA finds a causal link to heart attack and stroke.",
    cite:"US EPA, Integrated Science Assessment for PM, 2019"}
};

const INK        = '#1f2327';
const PM10_RED   = '#b23a2d';   // matte brick red — coarse, lodged
const BLOOD_RED  = '#ec1330';   // bright arterial red — crossing into blood
const MUTED      = '#6b7178';

const canvas = document.getElementById('lungCanvas');
const ctx    = canvas.getContext('2d');
const frame  = document.getElementById('figFrame');
const btn    = document.getElementById('replayBtn');

/* impact card elements */
const cardEl    = document.getElementById('impactCard');
const scrimEl   = document.getElementById('cardScrim');
const icLabel   = document.getElementById('icLabel');
const icBody    = document.getElementById('icBody');
const icCite    = document.getElementById('icCite');
const icClose   = document.getElementById('icClose');
const hintEl    = document.getElementById('hint');
let activeRegion = null;

let dpr = 1, W = 0, H = 0;
let particles = [];
let cycleStart = 0, lastSpawn = 0, lastFrame = 0;
let spawnIndex = 0, spawnPlan = [];
let phase = 'idle';
let pauseStart = 0;
let hasStarted = false;

/* ---------- sizing ---------- */
function resize(){
  const r = frame.getBoundingClientRect();
  W = r.width; H = r.height;
  dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  positionRegions();
  positionCard();
}
function positionRegions(){
  frame.querySelectorAll('.region').forEach(el=>{
    const r = REGIONS[el.dataset.region];
    if(!r) return;
    const s = r.size*100;
    el.style.left = (r.x*100)+'%';
    el.style.top  = (r.y*100)+'%';
    el.style.width = s+'%';
    el.style.height= s+'%';
    // build marker once
    if(!el.querySelector('.marker')){
      const m = document.createElement('div'); m.className='marker';
      const ring = document.createElement('div'); ring.className='ring';
      const pulse = document.createElement('div'); pulse.className='pulse';
      const dot = document.createElement('div'); dot.className='dot';
      ring.appendChild(pulse); ring.appendChild(dot);
      m.appendChild(ring);
      el.appendChild(m);
    }
  });
}
function positionCard(){
  if(!activeRegion){ return; }
  const r = REGIONS[activeRegion];
  // place card to the side of the region, clamped within frame
  const cardW = Math.min(340, W*0.78);
  let leftPx = r.x*W + 24;
  let topPx  = r.y*H - 30;
  if(leftPx + cardW > W - 8) leftPx = r.x*W - cardW - 24;
  if(leftPx < 8) leftPx = 8;
  if(topPx < 8) topPx = 8;
  // estimate card height ~ 150
  if(topPx + 170 > H - 8) topPx = H - 178;
  cardEl.style.left = leftPx + 'px';
  cardEl.style.top  = topPx + 'px';
  cardEl.style.width = cardW + 'px';
}

/* ---------- path math ---------- */
function pathLen(p){
  let L=0; for(let i=1;i<p.length;i++) L+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y); return L;
}
function posAt(path,t){
  const L=pathLen(path);
  if(L===0) return {x:path[0].x,y:path[0].y,segIdx:1,segT:0,dir:{x:0,y:0}};
  let target=Math.max(0,Math.min(1,t))*L;
  for(let i=1;i<path.length;i++){
    const sl=Math.hypot(path[i].x-path[i-1].x,path[i].y-path[i-1].y);
    if(target<=sl || i===path.length-1){
      const u = sl>0 ? target/sl : 0;
      return {
        x: path[i-1].x+(path[i].x-path[i-1].x)*u,
        y: path[i-1].y+(path[i].y-path[i-1].y)*u,
        segIdx:i, segT:u,
        dir:{ x:(path[i].x-path[i-1].x)/(sl||1), y:(path[i].y-path[i-1].y)/(sl||1) }
      };
    }
    target-=sl;
  }
  const last=path[path.length-1];
  return {x:last.x,y:last.y,segIdx:path.length-1,segT:1,dir:{x:0,y:0}};
}
function hexRgba(hex,a){
  const h=hex.replace('#','');
  return 'rgba('+parseInt(h.substr(0,2),16)+','+parseInt(h.substr(2,2),16)+','+parseInt(h.substr(4,2),16)+','+a+')';
}

/* trachea position interpolating between tracheaTop and carina (vertical tube) */
function tracheaAt(y){
  if(y <= AIR.tracheaTop.y){
    const u = (y - AIR.larynx.y) / (AIR.tracheaTop.y - AIR.larynx.y);
    return { x: AIR.larynx.x + (AIR.tracheaTop.x - AIR.larynx.x)*u, y };
  } else {
    const u = (y - AIR.tracheaTop.y) / (AIR.carina.y - AIR.tracheaTop.y);
    return { x: AIR.tracheaTop.x + (AIR.carina.x - AIR.tracheaTop.x)*u, y };
  }
}

/* ---------- spawn plan ---------- */
function buildPlan(){
  spawnPlan = [];
  const pm10Count = 14;
  const pm25Count = 26;
  for(let i=0;i<pm10Count;i++) spawnPlan.push({type:'pm10'});
  // exactly 3 crossers, staggered across the PM2.5 spawn range
  const crossIdx = new Set([
    Math.floor(pm25Count*0.22),
    Math.floor(pm25Count*0.50),
    Math.floor(pm25Count*0.78)
  ]);
  for(let i=0;i<pm25Count;i++){
    spawnPlan.push({
      type:'pm25',
      cross: crossIdx.has(i),
      goLeft: !crossIdx.has(i) && Math.random()<0.22
    });
  }
}

/* ---------- particle factory ---------- */
function jitterPoint(base,amp){
  return { x: base.x + (Math.random()-0.5)*amp, y: base.y + (Math.random()-0.5)*amp };
}
function spawnParticle(plan){
  if(plan.type==='pm10'){
    // PM10 travels entry→pharynx→larynx→tracheaTop, then lodges along the trachea near UPPER_DEPOSIT
    const dy = UPPER_DEPOSIT.y + (Math.random()-0.5)*0.020;   // 0.48–0.50
    const base = tracheaAt(dy);
    const deposit = { x: base.x + (Math.random()-0.5)*0.010, y: dy + (Math.random()-0.5)*0.008 };
    return {
      type:'pm10',
      path:[AIR.entry, AIR.pharynx, AIR.larynx, AIR.tracheaTop, deposit],
      t:0, speed:0.20+Math.random()*0.05,
      size:5+Math.random()*2,
      color:PM10_RED, baseAlpha:0.92, alpha:0.92,
      noiseAmp:0.010, noiseSeed:Math.random()*1000, noiseFreq:14+Math.random()*6,
      lodged:false, lodgeTime:0, jitter:{x:0,y:0}, fade:0,
      shapeSeed:Math.random()*100, x:0, y:0
    };
  }

  if(plan.cross){
    // crossing PM2.5 — travels through the full airway to alveoli, pauses, then crosses to blood
    const path = [AIR.entry, AIR.pharynx, AIR.larynx, AIR.tracheaTop,
                  AIR.tracheaMid, AIR.carina, AIR.rightMid,
                  jitterPoint(AIR.alveoli,0.010)];
    return {
      type:'pm25', path, t:0, speed:0.40+Math.random()*0.08,
      size:3.6+Math.random()*0.4,
      color:INK, baseAlpha:0.85, alpha:0.85,
      noiseAmp:0.0065, noiseSeed:Math.random()*1000, noiseFreq:22+Math.random()*8,
      lodged:false, lodgeTime:0, crossing:true,
      crossPhase:'approach', crossPhaseStart:0, glideT:0,
      fade:0, trail:[], x:0, y:0
    };
  }

  const goLeft = plan.goLeft;
  const path = goLeft
    ? [AIR.entry, AIR.pharynx, AIR.larynx, AIR.tracheaTop, AIR.tracheaMid,
       AIR.carina, jitterPoint(AIR.leftDeep,0.02)]
    : [AIR.entry, AIR.pharynx, AIR.larynx, AIR.tracheaTop, AIR.tracheaMid,
       AIR.carina, AIR.rightMid, jitterPoint(AIR.alveoli,0.014)];
  return {
    type:'pm25', path, t:0, speed:0.42+Math.random()*0.12,
    size:2.5+Math.random()*1.0, color:INK, baseAlpha:0.85, alpha:0.85,
    noiseAmp:0.007, noiseSeed:Math.random()*1000, noiseFreq:22+Math.random()*10,
    lodged:false, lodgeTime:0, crossing:false,
    crossPhase:'approach', crossPhaseStart:0, glideT:0,
    fade:0, trail:[], x:0, y:0
  };
}

/* ---------- cycle ---------- */
function startCycle(){
  particles = [];
  buildPlan();
  spawnIndex = 0;
  cycleStart = performance.now();
  lastSpawn = -0.12;
  phase = 'running';
}

function update(dt, elapsed, now){
  const spawnDur = 3.0, spawnInt = 0.06;
  if(spawnIndex < spawnPlan.length && elapsed < spawnDur && elapsed - lastSpawn > spawnInt){
    particles.push(spawnParticle(spawnPlan[spawnIndex]));
    spawnIndex++;
    lastSpawn = elapsed;
  }

  const bp = (elapsed % 3.6) / 3.6;
  const breath = 0.72 + 0.55 * Math.sin(bp * Math.PI);

  for(const p of particles){

    if(p.crossing){
      if(p.crossPhase==='approach'){
        p.t += p.speed * dt * breath;
        if(p.t >= 1){
          p.t = 1;
          p.crossPhase = 'pulse';
          p.crossPhaseStart = elapsed;
        }
      } else if(p.crossPhase==='pulse'){
        if(elapsed - p.crossPhaseStart > 0.40){
          p.crossPhase = 'glide';
          p.crossPhaseStart = elapsed;
          p.glideT = 0;
        }
      } else if(p.crossPhase==='glide'){
        p.glideT += dt / 0.9;
        if(p.glideT >= 1){
          p.glideT = 1;
          p.crossPhase = 'done';
          p.lodgeTime = elapsed;
          p.lodged = true;
        }
      } else if(p.crossPhase==='done'){
        const since = elapsed - p.lodgeTime;
        if(since > 1.5){
          p.fade = Math.min(1, (since-1.5)/1.0);
          p.alpha = p.baseAlpha * (1 - p.fade);
        }
      }
    } else {
      if(p.t < 1){
        p.t += p.speed * dt * breath;
        if(p.t >= 1){
          p.t = 1; p.lodged = true; p.lodgeTime = elapsed;
        }
      }
    }

    let nx, ny;
    if(p.crossing && (p.crossPhase==='pulse')){
      nx = AIR.alveoli.x; ny = AIR.alveoli.y;
    } else if(p.crossing && (p.crossPhase==='glide' || p.crossPhase==='done')){
      const g = p.glideT;
      const eg = g*g*(3-2*g);
      nx = AIR.alveoli.x + (AIR.blood.x - AIR.alveoli.x)*eg;
      ny = AIR.alveoli.y + (AIR.blood.y - AIR.alveoli.y)*eg;
    } else {
      const pos = posAt(p.path, p.t);
      const perpX = -pos.dir.y, perpY = pos.dir.x;
      const n = Math.sin(p.noiseSeed + p.t * p.noiseFreq) * p.noiseAmp;
      nx = pos.x + perpX*n;
      ny = pos.y + perpY*n;
      if(p.lodged && p.type==='pm10'){
        p.jitter.x = (Math.random()-0.5)*0.004;
        p.jitter.y = (Math.random()-0.5)*0.004;
        nx += p.jitter.x; ny += p.jitter.y;
      } else if(p.lodged && p.type==='pm25'){
        const tt = now*0.002;
        nx += Math.sin(p.noiseSeed*2+tt)*0.0022;
        ny += Math.cos(p.noiseSeed*3+tt)*0.0022;
      }
    }
    p.x = nx * W; p.y = ny * H;

    if(p.type==='pm25'){
      const moving = p.crossing
        ? (p.crossPhase==='approach' || p.crossPhase==='glide')
        : (!p.lodged);
      if(moving){
        p.trail.push({x:p.x, y:p.y});
        if(p.trail.length > 5) p.trail.shift();
      } else if(p.trail.length){
        p.trail.shift();
      }
    }

    if(!p.crossing && p.lodged){
      const since = elapsed - p.lodgeTime;
      const life = p.type==='pm10' ? 3.2 : 2.8;
      if(since > life){
        p.fade = Math.min(1, (since-life)/1.1);
        p.alpha = p.baseAlpha * (1 - p.fade);
      }
    }
  }
  particles = particles.filter(p => p.fade < 1);

  if(phase==='running' && elapsed > 4.5 && particles.length === 0){
    phase = 'pausing';
    pauseStart = performance.now();
  }
}

/* ---------- render ---------- */
function render(now){
  ctx.clearRect(0,0,W,H);
  drawHaze();
  for(const p of particles) drawParticle(p, now);
}

function drawHaze(){
  const paths = [
    [AIR.entry, AIR.pharynx, AIR.larynx, AIR.tracheaTop, AIR.tracheaMid,
     AIR.carina, AIR.rightMid, AIR.alveoli],
    [AIR.carina, AIR.leftDeep]
  ];
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const path of paths){
    ctx.beginPath();
    for(let i=0;i<path.length;i++){
      const x=path[i].x*W, y=path[i].y*H;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle='rgba(31,35,39,0.035)';
    ctx.lineWidth=14; ctx.stroke();
    ctx.strokeStyle='rgba(31,35,39,0.06)';
    ctx.lineWidth=3; ctx.stroke();
  }
}

function drawParticle(p, now){
  if(p.type==='pm10'){ drawPM10(p); return; }

  const tl = p.trail.length;
  const isBloodPhase = p.crossing && (p.crossPhase==='glide' || p.crossPhase==='done' || p.crossPhase==='pulse');
  const trailColor = isBloodPhase ? BLOOD_RED : INK;
  for(let i=0;i<tl;i++){
    const tp = p.trail[i];
    const f = (i+1)/tl;
    const ta = p.alpha * f * 0.45;
    const ts = p.size * (0.4 + f*0.55);
    ctx.fillStyle = hexRgba(trailColor, ta);
    ctx.beginPath();
    ctx.arc(tp.x, tp.y, Math.max(0.4, ts), 0, Math.PI*2);
    ctx.fill();
  }

  let color = p.color, size = p.size;

  if(p.crossing){
    if(p.crossPhase==='approach'){
      color = INK; size = p.size;
    } else if(p.crossPhase==='pulse'){
      color = BLOOD_RED;
      size = p.size * 2.3;
      const since = (now/1000) - (cycleStart/1000) - p.crossPhaseStart;
      const pulseDur = 0.30;
      const pulse = Math.max(0, 1 - since/pulseDur);
      if(pulse > 0){
        const ringR = size * (0.8 + (1-pulse)*3.8);
        ctx.strokeStyle = hexRgba(BLOOD_RED, 0.70*pulse);
        ctx.lineWidth = 2.2;
        ctx.beginPath(); ctx.arc(p.x, p.y, ringR, 0, Math.PI*2); ctx.stroke();
      }
    } else if(p.crossPhase==='glide'){
      color = BLOOD_RED;
      size = p.size * 2.3;
    } else {
      color = BLOOD_RED;
      size = p.size * 1.7;
    }
  }

  /* soft glow/halo for blood-crossing particles */
  if(isBloodPhase){
    const haloR = Math.max(1, size * 2.8);
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, haloR);
    grad.addColorStop(0, hexRgba(BLOOD_RED, 0.35 * p.alpha));
    grad.addColorStop(0.5, hexRgba(BLOOD_RED, 0.12 * p.alpha));
    grad.addColorStop(1, hexRgba(BLOOD_RED, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, haloR, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = hexRgba(color, p.alpha);
  ctx.beginPath();
  ctx.arc(p.x, p.y, Math.max(0.5, size), 0, Math.PI*2);
  ctx.fill();
}

function drawPM10(p){
  const x = p.x, y = p.y;
  const size = Math.max(1, p.size);
  ctx.fillStyle = hexRgba(p.color, p.alpha);
  ctx.beginPath();
  const N = 7;
  for(let i=0;i<N;i++){
    const a = (i/N)*Math.PI*2;
    const wobble = 0.82
      + 0.16*Math.sin(p.shapeSeed*1.3 + i*1.7)
      + 0.10*Math.cos(p.shapeSeed*0.7 + i*2.3);
    const r = size * wobble;
    const px = x + Math.cos(a)*r;
    const py = y + Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = hexRgba('#7a2a22', p.alpha*0.5);
  ctx.beginPath();
  ctx.arc(x - size*0.22, y - size*0.22, Math.max(0.4, size*0.18), 0, Math.PI*2);
  ctx.fill();
}

/* ---------- loop ---------- */
function loop(now){
  if(!lastFrame) lastFrame = now;
  const dt = Math.min(0.05, (now-lastFrame)/1000);
  lastFrame = now;

  if(phase==='running'){
    const elapsed = (now - cycleStart)/1000;
    update(dt, elapsed, now/1000);
    render(now);
    const bp = (elapsed % 3.6)/3.6;
    canvas.style.opacity = (0.92 + 0.08*Math.sin(bp*Math.PI)).toFixed(3);
  } else if(phase==='pausing'){
    ctx.clearRect(0,0,W,H);
    drawHaze();
    canvas.style.opacity = '0.9';
    if(now - pauseStart > 600){
      startCycle();
    }
  }
  requestAnimationFrame(loop);
}

/* ---------- intersection start ---------- */
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting && e.intersectionRatio >= 0.4 && !hasStarted){
      hasStarted = true;
      startCycle();
    }
  });
}, { threshold:[0, 0.4, 0.6] });
io.observe(frame);

/* ---------- replay ---------- */
btn.addEventListener('click', startCycle);

/* ---------- clickable regions + impact card ---------- */
function openRegion(key){
  const r = REGIONS[key];
  if(!r) return;
  // only one open at a time
  frame.querySelectorAll('.region').forEach(el=>{
    el.classList.toggle('active', el.dataset.region===key);
  });
  activeRegion = key;
  icLabel.textContent = r.label;
  icBody.textContent  = r.body;
  icCite.textContent  = r.cite;
  positionCard();
  cardEl.classList.add('show');
  scrimEl.classList.add('show');
  hintEl.style.opacity = '0';
  hintEl.style.transition = 'opacity .3s ease';
}
function closeRegion(){
  activeRegion = null;
  cardEl.classList.remove('show');
  scrimEl.classList.remove('show');
  frame.querySelectorAll('.region').forEach(el=>el.classList.remove('active'));
  hintEl.style.opacity = '';
}

frame.querySelectorAll('.region').forEach(el=>{
  el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const key = el.dataset.region;
    if(activeRegion === key){ closeRegion(); return; }
    openRegion(key);
  });
  el.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===' '){
      e.preventDefault();
      el.click();
    }
  });
});
icClose.addEventListener('click', (e)=>{ e.stopPropagation(); closeRegion(); });
scrimEl.addEventListener('click', closeRegion);
document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape' && activeRegion) closeRegion();
});

/* ---------- resize ---------- */
const ro = new ResizeObserver(()=> resize());
ro.observe(frame);
const img = frame.querySelector('img');
if(img.complete) resize();
else { img.addEventListener('load', resize); img.addEventListener('error', resize); }

requestAnimationFrame(loop);
</script>
</body>

html.deck-mode,body.deck-mode{height:100%;overflow:hidden;overscroll-behavior:none}
body.deck-mode .deck{position:relative;width:100%;transform:translateY(0);will-change:transform}
body.deck-mode .deck.smooth{transition:transform 720ms cubic-bezier(.7,0,.2,1)}
body.deck-mode .screen{height:var(--screenH);width:100%;overflow:hidden}
body.deck-mode .screen iframe{width:100%;height:100%;border:0;display:block}

/* FLOW MODE (Phones / Short screens) */
html.flow-mode,body.flow-mode{height:auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:auto}
body.flow-mode .deck{transform:none;position:relative;width:100%}
body.flow-mode .screen{height:auto;min-height:100vh;min-height:100dvh;overflow:visible}
body.flow-mode .screen iframe{width:100%;border:0;display:block}

body.flow-mode #dots{display:none}

body.flow-mode header{position:absolute;background:none}

@media(max-width:700px){header img{height:72px}header{padding:12px 16px}#dots{right:10px}}
@media(prefers-reduced-motion:reduce){.deck.smooth{transition:none}}

<script src=&quot;https://unpkg.com/leaflet@1.9.4/dist/leaflet.js&quot;></script>
<script>
// ============================================================
//  Airborne bacterial infections — choropleth by state, yearly
// ============================================================
const isEmbedded = window.self !== window.top;

const map = L.map('map', {
  zoomControl: false, scrollWheelZoom: !isEmbedded,
  minZoom: 3, maxZoom: 12,
  maxBounds: [[8, -140], [62, -52]], maxBoundsViscosity: 0.85
});
L.control.zoom({ position: 'topright' }).addTo(map);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 19, attribution: '© OpenStreetMap © CARTO', detectRetina: true
}).addTo(map);

const US_BOUNDS = L.latLngBounds([[24.4, -124.8], [49.4, -66.9]]);
function fitUS(){
  const w = window.innerWidth;
  if (w > 820){
    map.fitBounds(US_BOUNDS, { paddingTopLeft: [Math.min(520, w*0.40), 40], paddingBottomRight: [40, 160] });
  } else {
    map.fitBounds(US_BOUNDS, { paddingTopLeft: [16, 210], paddingBottomRight: [16, 150] });
  }
}

const PLAY_INTERVAL = 700;
const NO_DATA_COLOR = '#d7dbde';

const RAMP_STOPS = [[1,'#f3cdc6'],[8.25,'#eea799'],[15.5,'#e87f6d'],[22.75,'#e4554a'],[30,'#e23b3b']];

let years = [];
let tsData = { states: {} };
let currentYearIdx = 0;
let playing = false;
let playTimer = null;
let stateLayer = null;
let openTooltipLayer = null;

function hexToRgb(h){ h = h.replace('#',''); return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
function rgbToHex(r,g,b){
  return '#' + [r,g,b].map(function(x){
    const s = Math.max(0, Math.min(255, Math.round(x))).toString(16);
    return s.length < 2 ? '0'+s : s;
  }).join('');
}

function scoreColor(v){
  if (v == null || isNaN(v)) return NO_DATA_COLOR;
  if (v <= 1) return RAMP_STOPS[0][1];
  if (v >= 30) return RAMP_STOPS[RAMP_STOPS.length-1][1];
  let a = RAMP_STOPS[0], b = RAMP_STOPS[RAMP_STOPS.length-1];
  for (let i=0;i<RAMP_STOPS.length-1;i++){
    if (v >= RAMP_STOPS[i][0] &amp;&amp; v <= RAMP_STOPS[i+1][0]){ a = RAMP_STOPS[i]; b = RAMP_STOPS[i+1]; break; }
  }
  const span = (b[0]-a[0]) || 1;
  const k = (v-a[0])/span;
  const ca = hexToRgb(a[1]), cb = hexToRgb(b[1]);
  return rgbToHex(ca[0]+(cb[0]-ca[0])*k, ca[1]+(cb[1]-ca[1])*k, ca[2]+(cb[2]-ca[2])*k);
}

function rateFor(stateName, yearIdx){
  if (!tsData.states[stateName]) return null;
  const year = years[yearIdx];
  const rec = tsData.states[stateName][String(year)];
  if (!rec) return null;
  return rec.rate;
}

function casesFor(stateName, yearIdx){
  if (!tsData.states[stateName]) return null;
  const year = years[yearIdx];
  const rec = tsData.states[stateName][String(year)];
  if (!rec) return null;
  return rec.cases;
}

function styleFor(stateName, yearIdx){
  const v = rateFor(stateName, yearIdx);
  const fill = (v == null) ? NO_DATA_COLOR : scoreColor(v);
  const op  = (v == null) ? 0.35 : 0.78;
  return { fillColor: fill, fillOpacity: op, weight: 1, color: '#ffffff' };
}

function tooltipText(stateName, yearIdx){
  const v = rateFor(stateName, yearIdx);
  if (v == null) return stateName;
  const c = casesFor(stateName, yearIdx);
  const year = years[yearIdx];
  return stateName + ' — ' + Number(v).toFixed(2) + ' per 100,000 · ' + (c != null ? c.toLocaleString() : '—') + ' cases (' + year + ')';
}

function totalCasesForYear(yearIdx){
  const year = years[yearIdx];
  let total = 0;
  for (const name in tsData.states){
    const rec = tsData.states[name][String(year)];
    if (rec &amp;&amp; typeof rec.cases === 'number') total += rec.cases;
  }
  return total;
}

function recolor(yearIdx){
  if (!years.length) return;
  yearIdx = Math.max(0, Math.min(years.length-1, yearIdx|0));
  currentYearIdx = yearIdx;
  document.getElementById('dateLabel').textContent = String(years[yearIdx]);
  document.getElementById('frameSlider').value = yearIdx;
  const total = totalCasesForYear(yearIdx);
  document.getElementById('tcCounter').textContent = total.toLocaleString() + ' cases';
  if (!stateLayer) return;
  stateLayer.eachLayer(function(layer){
    const name = layer.feature &amp;&amp; layer.feature.properties &amp;&amp; layer.feature.properties.name;
    const v = rateFor(name, yearIdx);
    const fill = (v == null) ? NO_DATA_COLOR : scoreColor(v);
    const op  = (v == null) ? 0.35 : 0.78;
    layer.setStyle({ fillColor: fill, fillOpacity: op });
    if (layer === openTooltipLayer){
      try { layer.setTooltipContent(tooltipText(name, yearIdx)); } catch(e){}
    }
  });
}

function play(){
  playing = true;
  document.getElementById('playIcon').innerHTML = '<path d=&quot;M6 4h4v16H6zM14 4h4v16h-4z&quot;/>';
  document.getElementById('playBtn').setAttribute('aria-label','Pause');
  // If already at the last year, restart from the first
  if (currentYearIdx >= years.length - 1) {
    recolor(0);
  }
  playTimer = setTimeout(playLoop, PLAY_INTERVAL);
}
function pause(){
  playing = false;
  document.getElementById('playIcon').innerHTML = '<path d=&quot;M8 5v14l11-7z&quot;/>';
  document.getElementById('playBtn').setAttribute('aria-label','Play');
  if (playTimer){ clearTimeout(playTimer); playTimer = null; }
}
function togglePlay(){ if (playing) pause(); else play(); }
function playLoop(){
  if (!playing) return;
  const next = currentYearIdx + 1;
  if (next >= years.length - 1){
    recolor(years.length - 1);
    pause();
    return;
  }
  recolor(next);
  playTimer = setTimeout(playLoop, PLAY_INTERVAL);
}

function setupYearTicks(){
  const container = document.getElementById('yearTicks');
  container.innerHTML = '';
  if (years.length < 2) return;
  const lastIdx = years.length - 1;
  const step = years.length <= 6 ? 1 : 2;
  for (let i=0;i<years.length;i+=step){
    const y = years[i];
    const pct = i / lastIdx * 100;
    const tick = document.createElement('span');
    tick.className = 'tc-tick';
    if (pct <= 2){ tick.style.left = '0'; tick.style.transform = 'none'; }
    else if (pct >= 98){ tick.style.left = '100%'; tick.style.transform = 'translateX(-100%)'; }
    else { tick.style.left = pct + '%'; }
    tick.textContent = String(y);
    container.appendChild(tick);
  }
}

function escapeHtml(s){ return String(s).replace(/[&amp;<>&quot;']/g, function(c){ return ({ '&amp;':'&amp;amp;','<':'&amp;lt;','>':'&amp;gt;','&quot;':'&amp;quot;',&quot;'&quot;:'&amp;#39;' })[c]; }); }

async function loadData(){
  try {
    const [geoResp, tsResp] = await Promise.all([
      fetch('data/bacteria_map/us_states.geojson'),
      fetch('data/bacteria_map/us_airborne_timeseries.json')
    ]);
    const geo = await geoResp.json();
    tsData = await tsResp.json();
    years = (tsData.years || []).slice(-3); // last 3 years — same recent window as the wildfire/fungi maps

    if (years.length){
      currentYearIdx = years.length - 1;
      document.getElementById('frameSlider').min = 0;
      document.getElementById('frameSlider').max = years.length - 1;
      document.getElementById('frameSlider').value = currentYearIdx;
      setupYearTicks();
    }

    stateLayer = L.geoJSON(geo, {
      filter: function(feature){
        const name = feature.properties.name;
        return name !== 'Alaska' &amp;&amp; name !== 'Hawaii' &amp;&amp; name !== 'Puerto Rico';
      },
      style: function(feature){ return styleFor(feature.properties.name, currentYearIdx); },
      onEachFeature: function(feature, layer){
        const name = feature.properties.name;
        layer.bindTooltip(tooltipText(name, currentYearIdx), { sticky: true, direction: 'top', opacity: 1 });
        layer.on('mouseover', function(){
          try { layer.bringToFront(); } catch(e){}
          layer.setStyle({ weight: 2, color: '#1f2327' });
          openTooltipLayer = layer;
        });
        layer.on('mouseout', function(){
          layer.setStyle({ weight: 1, color: '#ffffff' });
          if (layer === openTooltipLayer) openTooltipLayer = null;
        });
      }
    }).addTo(map);
    recolor(currentYearIdx);
    fitUS();

    // Auto-play once on arrival unless reduced motion
    if (years.length &amp;&amp; !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      play();
    }
  } catch (e) {
    fitUS();
  }
}

// Source line
(function buildSource(){
  const el = document.getElementById('chromeSource');
  el.innerHTML = 'CDC — National Notifiable Diseases Surveillance System (updated weekly)';
})();

loadData();

document.getElementById('playBtn').addEventListener('click', togglePlay);
document.getElementById('frameSlider').addEventListener('input', function(e){
  if (playing) pause();
  recolor(parseInt(e.target.value, 10));
});

document.addEventListener('keydown', function(e){
  if (e.target &amp;&amp; e.target.tagName === 'INPUT') return;
  if (!years.length) return;
  if (e.code === 'Space'){ e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowLeft'){ pause(); recolor(Math.max(0, currentYearIdx - 1)); }
  if (e.code === 'ArrowRight'){ pause(); recolor(Math.min(years.length - 1, currentYearIdx + 1)); }
});

let resizeTimer = null;
window.addEventListener('resize', function(){
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){ map.invalidateSize(); fitUS(); }, 100);
});

// Embedded in the deck wrapper: pause when scrolled away, replay from first year when active.
if (isEmbedded) {
  window.addEventListener('message', function(ev){
    const d = ev.data || {};
    if (d.type === 'nf-inactive') { pause(); }
    else if (d.type === 'nf-active') {
      if (!playing &amp;&amp; !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        recolor(0);
        play();
      }
    }
  });
}
</script>
</body>

    aspect-ratio:688/962;
    max-width:100%;
    transform-origin:center center;
    transition:transform .7s cubic-bezier(.16,1,.3,1);
    will-change:transform;
  }
  .figure.zoomed .body-img{
    animation:none;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.012)}
  }

  /* BODY IMG — fills the wrapper exactly */
  .body-img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
    user-select:none;
    animation:breathe 4.5s ease-in-out infinite;
  }

  /* GLOW HALO — blooms over the selected organ */
  .glow{
    position:absolute;
    transform:translate(-50%,-50%);
    width:120px; height:120px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(226,59,59,0.28) 0%, rgba(226,59,59,0.08) 45%, transparent 70%);
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
    z-index:1;
  }
  .glow.show{
    opacity:1;
    animation:glowPulse 2.4s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{transform:translate(-50%,-50%) scale(var(--inv,1));opacity:0.85}
    50%{transform:translate(-50%,-50%) scale(calc(var(--inv,1) * 1.15));opacity:1}
  }

  /* HOTSPOTS */
  .hotspots{position:absolute;inset:0;pointer-events:none;z-index:2}
  .hotspot{
    position:absolute;
    transform-origin:center center;
    transform:translate(-50%,-50%) scale(var(--inv,1));
    width:18px;height:18px;
    border:0;background:transparent;
    padding:0;cursor:pointer;
    pointer-events:auto;
    transition:opacity .4s ease, width .3s ease, height .3s ease, transform .7s cubic-bezier(.16,1,.3,1);
  }
  .hotspot::before{
    content:&quot;&quot;;
    position:absolute;inset:0;
    border-radius:50%;
    background:var(--red);
    transform:scale(0.38);
    box-shadow:0 0 0 1px rgba(255,255,255,0.6);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .hotspot::after{
    content:&quot;&quot;;
    position:absolute;inset:0;
    border-radius:50%;
    border:1.5px solid var(--red);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(0.5);opacity:0.9}
    100%{transform:scale(1.9);opacity:0}
  }
  .hotspot:hover::before{transform:scale(0.5)}
  .hotspot .label{
    position:absolute;
    left:50%;top:100%;
    transform:translate(-50%,8px);
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink);
    background:var(--bg);
    padding:3px 7px;
    border:1px solid var(--hair);
    border-radius:4px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .hotspot:hover .label,.hotspot:focus-visible .label{opacity:1}
  .hotspot:focus-visible{outline:none}
  .hotspot:focus-visible::after{border-color:var(--accent);animation:none;transform:scale(1.4);opacity:1}

  /* ACTIVE STATE — solid red dot + white ring */
  .hotspot.active{
    width:26px; height:26px;
    z-index:3;
  }
  .hotspot.active::before{
    transform:scale(1);
    box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--red), 0 0 12px 2px rgba(226,59,59,0.4);
  }
  .hotspot.active::after{
    animation:pulse 1.8s ease-out infinite;
    border-width:2px;
  }
  .hotspot.dimmed{
    opacity:0.35;
  }

  /* MOBILE */
  @media (max-width:880px){
    .grid{
      grid-template-columns:1fr;
      align-items:start;
      min-height:auto;
    }
    .left{
      order:1;
      max-height:none;
      padding:0 clamp(20px,6vw,32px);
      z-index:10;
      background:var(--bg);
      padding-bottom:20px;
    }
    .right{
      position:relative;
      order:2;
      height:clamp(400px, 68vh, 680px);
      max-height:none;
    }
    .card{min-height:180px}
    h1.headline{max-width:none}
    .index-row{padding:8px 6px 8px 14px}
    .index-row .nm{font-size:16px}
  }

  @media (prefers-reduced-motion:reduce){
    .figure{animation:none;transition:transform .2s ease}
    .glow{animation:none;transition:opacity .2s ease}
    .hotspot::after{animation:none}
    .card-inner{transition:opacity .2s ease}
  }

/* wfhealth_landscape_v2 — landscape-phone 2-col */
@media (max-width: 900px) and (orientation: landscape) and (max-height: 560px) {

}

</style>

<body>
<section class=&quot;health&quot; aria-labelledby=&quot;health-headline&quot;>
  <div class=&quot;grid&quot;>

      <h1 class=&quot;headline&quot; id=&quot;health-headline&quot;>What the bacteria do <em>inside you</em></h1>

      <div class=&quot;card&quot;>
        <div class=&quot;card-inner&quot; id=&quot;cardInner&quot; aria-live=&quot;polite&quot;>
          <h2 class=&quot;card-name&quot; id=&quot;cardName&quot; style=&quot;display:none&quot;></h2>

      <div class=&quot;figure&quot; id=&quot;figure&quot;>
        <img class=&quot;body-img&quot; id=&quot;bodyImg&quot; src=&quot;assets/body/body_premium.png&quot; alt=&quot;Anatomical figure showing where bacteria affect the body&quot; draggable=&quot;false&quot;>
        <div class=&quot;glow&quot; id=&quot;glow&quot;></div>
        <div class=&quot;hotspots&quot; id=&quot;hotspots&quot;></div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  const DATA = {
    overview: {
      name: &quot;&quot;,
      intro: &quot;Bacteria ride the air into your lungs \u2014 but the infection rarely stays there. It reaches the heart, brain, and kidneys, and the harm can outlast the illness by years.&quot;,
      impacts: [
        {text:&quot;A University of Louisville study found that among older adults hospitalized for pneumonia, [38% were dead within a year] \u2014 the year after is deadlier than the hospital stay itself.&quot;, url:&quot;https://pubmed.ncbi.nlm.nih.gov/31916246/&quot;},
        {text:&quot;The UK government's O'Neill review projected that antibiotic-resistant infections could [kill 10 million people a year by 2050] \u2014 more than cancer kills today.&quot;, url:&quot;https://amr-review.org/sites/default/files/160518_Final%20paper_with%20cover.pdf&quot;},
        {text:&quot;In Clinical Infectious Diseases, researchers counted [about 1.6 million American adults hospitalized with pneumonia] a year.&quot;, url:&quot;https://pubmed.ncbi.nlm.nih.gov/29020164/&quot;}
      ],
      ox:0.5, oy:0.5
    },
    lungs: {
      name:&quot;Lungs&quot;,
      impacts:[
        {text:&quot;The CDC's EPIC study, in the New England Journal of Medicine, found pneumonia hospitalizes [about 1 in 400 adults] a year, and sends 1 in 5 of them to intensive care.&quot;, url:&quot;https://pubmed.ncbi.nlm.nih.gov/26172429/&quot;},
        {text:&quot;Pneumonia is a leading trigger of acute respiratory distress syndrome \u2014 when the lungs flood with fluid \u2014 and a 50-country study found ARDS [kills about 4 in 10 in intensive care].&quot;, url:&quot;https://pubmed.ncbi.nlm.nih.gov/26903337/&quot;},
        {text:&quot;Legionnaires' disease was born in the air: a Philadelphia hotel's air-conditioning spread it through a 1976 convention, [sickening 182 people and killing 29].&quot;, url:&quot;https://pubmed.ncbi.nlm.nih.gov/335244/&quot;}
      ],
      ox:0.43, oy:0.24, label:&quot;Lungs&quot;
    },
    bloodstream: {
      name:&quot;Blood&quot;,
      impacts:[
        {text:&quot;When infection breaks into the blood it triggers sepsis \u2014 the CDC counts [1.7 million American adults] with it each year, and at least 350,000 die.&quot;, url:&quot;https://www.cdc.gov/sepsis/about/index.html&quot;},
        {text:&quot;A Harvard study in JAMA of nearly 3 million patients found sepsis was present in [1 in every 3 hospital deaths].&quot;, url:&quot;https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5710396/&quot;}
      ],
      ox:0.55, oy:0.17, label:&quot;Blood&quot;
    },
    heart: {
      name:&quot;Heart&quot;,
      impacts:[
        {text:&quot;A JAMA study found the risk of a [heart attack or stroke jumps about fourfold] in the 30 days after a pneumonia \u2014 and stays raised for years.&quot;, url:&quot;https://pubmed.ncbi.nlm.nih.gov/25602997/&quot;},
        {text:&quot;Strep throat's long shadow \u2014 rheumatic heart disease, which scars the heart's valves \u2014 [killed about 319,000 people] worldwide in a single year.&quot;, url:&quot;https://pubmed.ncbi.nlm.nih.gov/28834488/&quot;},
        {text:&quot;When bacteria settle on a heart valve, infective endocarditis eats it away \u2014 [up to 30% of patients die], and half need surgery.&quot;, url:&quot;https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6964163/&quot;}
      ],
      ox:0.53, oy:0.28, label:&quot;Heart&quot;
    },
    brain: {
      name:&quot;Brain&quot;,
      impacts:[
        {text:&quot;Meningococcal disease can kill within hours \u2014 the CDC reports it [kills up to 1 in 7 even when treated], and leaves as many as 1 in 5 survivors deaf or with amputated limbs.&quot;, url:&quot;https://www.ncbi.nlm.nih.gov/books/NBK620871/&quot;},
        {text:&quot;A University of Michigan study in JAMA found that surviving severe sepsis [tripled the odds of lasting memory and thinking loss] \u2014 declines that persisted for up to 8 years.&quot;, url:&quot;https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3345288/&quot;},
        {text:&quot;Sepsis survivors also carry a measurably [higher risk of dementia] in the years that follow.&quot;, url:&quot;https://www.ncbi.nlm.nih.gov/pmc/articles/PMC8959917/&quot;}
      ],
      ox:0.50, oy:0.05, oyAnchor:0.42, label:&quot;Brain&quot;
    },
    kidneys: {
      name:&quot;Kidneys&quot;,
      impacts:[
        {text:&quot;As sepsis takes hold it can shut down the kidneys \u2014 the CDC lists [acute kidney injury] among its most common and dangerous complications, and many patients end up on dialysis.&quot;, url:&quot;https://www.cdc.gov/sepsis/about/index.html&quot;}
      ],
      ox:0.57, oy:0.37, label:&quot;Kidneys&quot;
    }
  };

  const ORDER = [&quot;overview&quot;,&quot;brain&quot;,&quot;lungs&quot;,&quot;bloodstream&quot;,&quot;heart&quot;,&quot;kidneys&quot;];
  const INDEX_LABELS = {
    overview:&quot;Overview&quot;, lungs:&quot;Lungs&quot;, bloodstream:&quot;Blood&quot;, heart:&quot;Heart&quot;, brain:&quot;Brain&quot;, kidneys:&quot;Kidneys&quot;
  };

  const hotspotsEl = document.getElementById('hotspots');
  const backBtn = document.getElementById('backBtn');
  const rightEl = document.getElementById('right');
  const figure = document.getElementById('figure');
  const glow = document.getElementById('glow');
  const cardInner = document.getElementById('cardInner');
  const cardName = document.getElementById('cardName');
  const cardIntro = document.getElementById('cardIntro');
  const cardImpacts = document.getElementById('cardImpacts');
  const indexEl = document.getElementById('index');

  let current = &quot;overview&quot;;
  let targetScale = 1;
  let targetX = 0;
  let targetY = 0;

  function linkify(text, url){
    const m = text.match(/\[(.+?)\]/);
    if(!m) return text;
    const idx = text.indexOf(m[0]);
    const pre = text.slice(0, idx);
    const post = text.slice(idx + m[0].length);
    return pre + '<a href=&quot;'+url+'&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;>'+m[1]+'</a>' + post;
  }

  function renderCard(key){
    const d = DATA[key];
    if(key === &quot;overview&quot;){
      cardName.style.display = 'none';
      cardName.textContent = '';
    } else {
      cardName.style.display = '';
      cardName.textContent = d.name;
    }
    if(d.intro){
      cardIntro.style.display = '';
      cardIntro.textContent = d.intro;
    } else {
      cardIntro.style.display = 'none';
    }
    cardImpacts.innerHTML = d.impacts.map(im =>
      '<p>'+linkify(im.text, im.url)+'</p>'
    ).join('');
  }

  function applyTransform() {
    figure.style.transform = `translate(${targetX}px, ${targetY}px) scale(${targetScale})`;
  }

  // Horizontal offset so the resting figure lines up with the particle on the
  // sibling hero page (centered in the right 54% column of a 46/54 grid with
  // clamp(24px,6vw,96px) padding + clamp(32px,5vw,80px) gap). 0 when stacked.
  function restOffsetX(){
    const aw = rightEl.clientWidth;
    const vw = window.innerWidth;
    if (vw <= 880) return 0;
    const padX = Math.min(96, Math.max(24, 0.06*vw));
    const gap  = Math.min(80, Math.max(32, 0.05*vw));
    const innerW = vw - 2*padX - gap;
    const anchorX = padX + innerW*0.46 + gap + innerW*0.54/2;
    return anchorX - aw/2;
  }

  function setHighlight(key){
    if(key === &quot;overview&quot;){
      backBtn.classList.remove('show');
      glow.classList.remove('show');
      figure.classList.remove('zoomed');
      targetScale = 1;
      targetX = restOffsetX();
      targetY = 0;
      figure.style.setProperty('--inv', '1');
      applyTransform();
      hotspotsEl.querySelectorAll('.hotspot').forEach(h=>{
        h.classList.remove('active','dimmed');
      });
    } else {
      const d = DATA[key];
      backBtn.classList.add('show');
      glow.style.left = (d.ox*100)+'%';
      glow.style.top = (d.oy*100)+'%';
      glow.classList.add('show');
      figure.classList.add('zoomed');
      
      // Compute zoom: scale up to 2.5, but clamp so figure width never exceeds area width
      const areaW = rightEl.clientWidth;
      const areaH = rightEl.clientHeight;
      const figW = figure.offsetWidth || (areaH * 688 / 962);

      let scale = 0.86 / Math.max(d.oy, 0.40); scale = Math.min(2.5, Math.max(1.5, scale));
      const maxScale = areaW / figW;
      if (scale > maxScale) scale = maxScale;
      if (scale < 1) scale = 1; // never shrink

      targetScale = scale;
      // Counter-scale the dots + labels so they keep a constant size when zoomed
      figure.style.setProperty('--inv', (1/scale).toFixed(4));
      
      // The organ is a fraction (ox,oy) of the figure box; the figure is flex-
      // centered in the area. Use the UNSCALED box size (offset*, transform-free)
      // so this is correct even when going organ -> organ. Place every organ on
      // the SAME aligned column as the resting figure (and the hero particle),
      // vertically centered, so the figure never jumps sideways between clicks.
      const fW = figure.offsetWidth;
      const fH = figure.offsetHeight;
      targetX = restOffsetX() - (d.ox - 0.5) * fW * scale;
      targetY = fH * (0.06 - 0.5 + 0.5 * scale);
      
      applyTransform();
      
      hotspotsEl.querySelectorAll('.hotspot').forEach(h=>{
        if(h.dataset.key === key){
          h.classList.add('active');
          h.classList.remove('dimmed');
        } else {
          h.classList.add('dimmed');
          h.classList.remove('active');
        }
      });
    }
  }

  function select(key, force){
    if(current === key &amp;&amp; !force){
      current = &quot;overview&quot;;
    } else {
      current = key;
    }
    cardInner.classList.add('leaving');
    setTimeout(()=>{
      renderCard(current);
      setHighlight(current);
      cardInner.classList.remove('leaving');
    }, 200);
    indexEl.querySelectorAll('.index-row').forEach(c=>{
      c.setAttribute('aria-pressed', c.dataset.key === current ? 'true' : 'false');
    });
  }

  // Build hotspots
  ORDER.forEach(key=>{
    if(key === &quot;overview&quot;) return;
    const d = DATA[key];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'hotspot';
    b.style.left = (d.ox*100)+'%';
    b.style.top = (d.oy*100)+'%';
    b.dataset.key = key;
    b.setAttribute('aria-label', 'Show impact on '+d.label);
    const lab = document.createElement('span');
    lab.className = 'label';
    lab.textContent = d.label;
    b.appendChild(lab);
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      select(key);
    });
    hotspotsEl.appendChild(b);
  });

  // Build anatomy index
  ORDER.forEach((key, i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'index-row';
    b.dataset.key = key;
    b.setAttribute('aria-pressed', key === 'overview' ? 'true' : 'false');
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = INDEX_LABELS[key];
    b.appendChild(nm);
    b.addEventListener('click', ()=>select(key));
    indexEl.appendChild(b);
  });

  backBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    select('overview', true);
  });

  // Clicking the background returns to overview
  rightEl.addEventListener('click', (e)=>{
    if(e.target.closest('.hotspot') || e.target.closest('.back-btn')) return;
    if(current !== 'overview') select('overview', true);
  });

  // Recalculate position/zoom on resize (rest offset is width-dependent)
  window.addEventListener('resize', () => {
    setHighlight(current);
  });

  // Init (UAT: ?organ=KEY preselects an organ for verification)
  const _uat = new URLSearchParams(location.search).get('organ');
  const _init = (_uat &amp;&amp; DATA[_uat]) ? _uat : 'overview';
  current = _init;
  renderCard(_init);
  setHighlight(_init);
  indexEl.querySelectorAll('.index-row').forEach(c=>{
    c.setAttribute('aria-pressed', c.dataset.key === _init ? 'true' : 'false');
  });
})();
</script>

(function(){
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const videoStack = document.getElementById('videoStack');
  const videoA = document.getElementById('videoA');
  const bigNumber = document.getElementById('bigNumber');

  /* ---------- Video: do NOT autoplay on load; play from the start only on arrival ---------- */
  if (reducedMotion) {
    videoStack.classList.add('reduced');
  }
  const isEmbedded = window.self !== window.top;
  function startFilter(){
    if (reducedMotion) return;
    try { videoA.currentTime = 0; videoA.play(); } catch(e){}
    bigNumber.textContent = '0';
    animateNumber();
  }
  function stopFilter(){ try { videoA.pause(); } catch(e){} }

  /* ---------- Number animation ---------- */
  function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }

  function animateNumber(){
    const DURATION = 1600;
    const start = performance.now();

    function step(now){
      const p = Math.min(1, (now - start) / DURATION);
      const e = easeOutCubic(p);

      // count big number 0 -> 26,000
      const n = Math.round(e * 26000);
      bigNumber.textContent = n.toLocaleString();

      if (p < 1) {
        requestAnimationFrame(step);
      } else {
        bigNumber.textContent = '26,000';
      }
    }

    requestAnimationFrame(step);
  }

  if (reducedMotion) {
    bigNumber.textContent = '26,000';
  } else {
    bigNumber.textContent = '0';
    if (isEmbedded) {
      // In the deck: play the discharge video + count only when this section becomes active.
      window.addEventListener('message', function(e){
        if (!e.data) return;
        if (e.data.type === 'nf-active') startFilter();

      const io = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => { if (entry.isIntersecting) { startFilter(); observer.disconnect(); } });

      io.observe(document.getElementById('section'));
    }
  }

<script>
/* Falling-bacteria particle system — window.nfBact = { start(), stop(), stopSpawning() }.
   Each particle targets a random point inside the (dry-stage) slab quad, split 50/50 into
   two equal-area halves, so bacteria land evenly and none fall off. Captured (blue flash)
   on the NanoFlashing half, settle on the conventional half. Spawns only during the dry
   tests; stopSpawning() is called when the water stage begins. */
window.nfBact = (function () {
  let container = null, spores = [], running = false, spawning = false, rafId = null;
  let lastTime = 0, spawnAccum = 0, nextSpawnInterval = 200, rect = { width: 0, height: 0 }, resizeHandler = null;
  // slab TOP FACE quad (bacteria dry stage) + the SLANTED blue/white boundary (measured):
  // fx = BND_M*fy + BND_B. Splitting on the real slanted line means &quot;blue&quot; targets truly
  // sit on the blue half, so the azure fires ONLY on the NanoFlashing area.
  const TL=[0.409,0.225], TR=[0.730,0.286], BR=[0.634,0.746], BL=[0.312,0.636];
  const BND_M=-0.198, BND_B=0.599;
  function boundaryFx(fy){ return BND_M*fy + BND_B; }
  function lerp2(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }
  function splitOn(A,B){ const dx=B[0]-A[0], dy=B[1]-A[1]; const u=(BND_M*A[1]+BND_B-A[0])/(dx-BND_M*dy); return [A[0]+dx*u, A[1]+dy*u]; }
  const TS=splitOn(TL,TR), BS=splitOn(BL,BR);
  const BLUEQ=[TL,TS,BS,BL], WHITEQ=[TS,TR,BR,BS];
  function biln(q,u,v){ const top=lerp2(q[0],q[1],u), bot=lerp2(q[3],q[2],u); return lerp2(top,bot,v); }
  function readRect(){ if(!container) return; const r=container.getBoundingClientRect(); rect.width=r.width||window.innerWidth; rect.height=r.height||window.innerHeight; }
  function coverMap(){ const s=Math.max(rect.width/1280, rect.height/720); return { s:s, offX:(rect.width-1280*s)/2, offY:(rect.height-720*s)/2 }; }
  function createSpore(){
    if(rect.width===0||rect.height===0) return;
    const m=coverMap();
    const el=document.createElement('div'); el.className='spore';
    const size=1.5+Math.random()*2; el.style.width=size+'px'; el.style.height=size+'px'; // small dots
    const onBlue=Math.random()<0.5;
    const t=biln(onBlue?BLUEQ:WHITEQ, Math.random(), Math.random());
    const tx=m.offX+t[0]*1280*m.s;
    const fall=0.10+Math.random()*0.22;
    const sp={ el:el, tx:tx, x:tx, hs:size/2, blue:(t[0] < boundaryFx(t[1]) - 0.010), targetY:m.offY+t[1]*720*m.s, y:m.offY+(t[1]-fall)*720*m.s,
      vy:40+Math.random()*50, wobbleAmp:4+Math.random()*6, wobbleFreq:0.4+Math.random()*0.7, wobblePhase:Math.random()*Math.PI*2, age:0, done:false };
    el.style.transform='translate('+(tx-sp.hs)+'px,'+(sp.y-sp.hs)+'px)';
    container.appendChild(el); spores.push(sp);
  }
  function update(dt){
    if(spawning){ spawnAccum+=dt; if(spawnAccum>=nextSpawnInterval){ spawnAccum=0; nextSpawnInterval=10+Math.random()*20; const cap=window.innerWidth>880?2200:700; const deficit=cap-spores.length; const count=deficit>0?Math.min(deficit,60):24; for(let i=0;i<count&amp;&amp;spores.length<cap;i++) createSpore(); } }
    for(let i=spores.length-1;i>=0;i--){
      const s=spores[i]; if(s.done) continue;
      s.age+=dt; const sec=dt/1000; s.y+=s.vy*sec;
      s.x=s.tx+Math.sin((s.age/1000)*Math.PI*2*s.wobbleFreq+s.wobblePhase)*s.wobbleAmp;
      if(s.y>=s.targetY){ s.done=true; s.el.style.transform='translate('+(s.x-s.hs)+'px,'+(s.targetY-s.hs)+'px)'; s.el.classList.add(s.blue?'captured':'settled'); const e=s.el; setTimeout(function(){ if(e&amp;&amp;e.parentNode) e.parentNode.removeChild(e); },640); spores.splice(i,1); continue; }
      s.el.style.transform='translate('+(s.x-s.hs)+'px,'+(s.y-s.hs)+'px)'; s.el.style.opacity=s.age<250?(s.age/250):1;
    }
  }
  function loop(time){ if(!running) return; if(!lastTime) lastTime=time; let dt=time-lastTime; lastTime=time; if(dt>100) dt=100; update(dt); if(!spawning&amp;&amp;spores.length===0){ running=false; rafId=null; return; } rafId=requestAnimationFrame(loop); }
  function clearAll(){ spores.forEach(function(s){ if(s.el&amp;&amp;s.el.parentNode) s.el.parentNode.removeChild(s.el); }); spores=[]; }
  function begin(){ running=true; spawning=true; lastTime=0; spawnAccum=0; nextSpawnInterval=200; resizeHandler=function(){ readRect(); }; window.addEventListener('resize',resizeHandler); rafId=requestAnimationFrame(loop); }
  function stopSpawning(){ spawning=false; }
  function start(){ if(running) return; container=document.querySelector('.anno'); if(!container) return; if(window.matchMedia&amp;&amp;window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; clearAll(); readRect(); if(rect.width===0||rect.height===0){ requestAnimationFrame(function(){ readRect(); if(rect.width===0||rect.height===0) return; begin(); }); return; } begin(); }
  function stop(){ running=false; spawning=false; if(rafId) cancelAnimationFrame(rafId); rafId=null; if(resizeHandler){ window.removeEventListener('resize',resizeHandler); resizeHandler=null; } clearAll(); }
  return { start:start, stop:stop, stopSpawning:stopSpawning };
})();

<script>
(function(){
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const videoStack = document.getElementById('videoStack');
  const videoA = document.getElementById('videoA');
  const bigNumber = document.getElementById('bigNumber');
  const annoTest = document.getElementById('annoTest');
  const annoDose = document.getElementById('annoDose');
  const lblNf = document.querySelector('.anno-lbl-nf');
  const lblCv = document.querySelector('.anno-lbl-cv');
  const annoTimeline = document.getElementById('annoTimeline');
  const tlFill = document.getElementById('tlFill');
  const tlMarker = document.getElementById('tlMarker');
  const AGE_START = 8.8, AGE_END = 13.2;
  const isEmbedded = window.self !== window.top;
  if (reducedMotion) videoStack.classList.add('reduced');

  // The 4-in-1 montage plays once (dust / heat+humidity / aging / water). Through the
  // three DRY stages the slab floats in one locked spot, so the material labels track
  // its two half-centres (blue 0.408, white 0.620), cover-mapped to hold at any width.
  // In the WATER stage the slab drops and grows past the panel crop (its half-centres
  // fall off-screen), so the material labels FADE OUT there — the &quot;Water submersion&quot;
  // caption + the blue/fouled split carry it.  Boundaries: dust<4.4 heat<8.8 aging<13.2
  const TESTS = [
    { until: 4.4,  test: 'Dust-loaded filter', dose: '<b>100 million</b> live bacteria', water:false },
    { until: 8.8,  test: 'Heat and humidity',  dose: 'live bacteria challenge',           water:false },
    { until: 13.2, test: 'Accelerated aging',  dose: 'live bacteria challenge',           water:false },
    { until: 99,   test: 'Water submersion',   dose: '<b>100×</b> dose, fully soaked',    water:true  }
  ];
  const NF_FRAC = 0.433, CV_FRAC = 0.597, TOP_FRAC = 0.524;  // visual centre of mass of each slab half

  function coverPct(fx){
    const W = videoStack.clientWidth, H = videoStack.clientHeight;
    if (!W || !H) return null;
    const s = Math.max(W/1280, H/720);
    const offX = (W - 1280*s)/2;
    return ((offX + fx*1280*s)/W*100).toFixed(2) + '%';
  }
  let curWater = false;
  function positionAnno(){
    const top = document.querySelector('.anno-top');
    if (window.innerWidth <= 880){
      if (lblNf) lblNf.style.left = '';
      if (lblCv) lblCv.style.left = '';
      if (top) top.style.left = '';
    } else {
      const pn = coverPct(NF_FRAC), pc = coverPct(CV_FRAC), pt = coverPct(TOP_FRAC);
      if (pn &amp;&amp; lblNf) lblNf.style.left = pn;
      if (pc &amp;&amp; lblCv) lblCv.style.left = pc;
      if (pt &amp;&amp; top) top.style.left = pt;
    }
  }
  positionAnno();
  window.addEventListener('resize', positionAnno);
  window.addEventListener('load', positionAnno);

  let curTest = -1;
  function updateTest(){
    const t = videoA.currentTime || 0;
    let i = 0;
    while (i < TESTS.length - 1 &amp;&amp; t >= TESTS[i].until) i++;
    if (i !== curTest){
      curTest = i;
      curWater = TESTS[i].water;
      positionAnno();
      // stop new falling bacteria once the slab leaves its locked dry spot (water)
      if (TESTS[i].water &amp;&amp; window.nfBact) window.nfBact.stopSpawning();
      // the aging timeline shows only during the accelerated-aging test
      if (annoTimeline){ annoTimeline.classList.toggle('on', i === 2); }
      annoTest.style.opacity = '0';
      annoDose.style.opacity = '0';
      setTimeout(function(){
        annoTest.textContent = TESTS[i].test;
        annoDose.innerHTML = TESTS[i].dose;
        annoTest.style.opacity = '1';
        annoDose.style.opacity = '1';
      }, 200);
    }
  }
  function updateTimeline(){
    if (!tlFill) return;
    let p = ((videoA.currentTime || 0) - AGE_START) / (AGE_END - AGE_START);
    p = Math.max(0, Math.min(1, p));
    const pct = (p * 100).toFixed(1) + '%';
    tlFill.style.width = pct;
    if (tlMarker) tlMarker.style.left = pct;
  }
  videoA.addEventListener('timeupdate', function(){ updateTest(); updateTimeline(); });

  function startFilter(){
    if (reducedMotion) return;
    try { videoA.currentTime = 0; videoA.play(); } catch(e){}
    curTest = -1; curWater = false; positionAnno();
    annoTest.textContent = TESTS[0].test; annoDose.innerHTML = TESTS[0].dose;
    annoTest.style.opacity = '1'; annoDose.style.opacity = '1';
    if (annoTimeline) annoTimeline.classList.remove('on');
    if (tlFill) tlFill.style.width = '0%';
    if (tlMarker) tlMarker.style.left = '0%';
    bigNumber.textContent = '0%';
    animateNumber();
    if (window.nfBact) window.nfBact.start();
  }
  function stopFilter(){ try { videoA.pause(); } catch(e){} if (window.nfBact) window.nfBact.stop(); }

  function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
  function animateNumber(){
    const DURATION = 1600, TARGET = 99.9, start = performance.now();
    function step(now){
      const p = Math.min(1, (now - start) / DURATION);
      const n = easeOutCubic(p) * TARGET;
      bigNumber.textContent = n.toFixed(1) + '%';
      if (p < 1) requestAnimationFrame(step); else bigNumber.textContent = '99.9%';
    }
    requestAnimationFrame(step);
  }

  if (reducedMotion) {
    bigNumber.textContent = '99.9%';
  } else {
    bigNumber.textContent = '0%';
    if (isEmbedded) {
      window.addEventListener('message', function(e){
        if (!e.data) return;
        if (e.data.type === 'nf-active') startFilter();
        else if (e.data.type === 'nf-inactive') stopFilter();
      });
    } else {
      const io = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => { if (entry.isIntersecting) { startFilter(); observer.disconnect(); } });
      }, { threshold: 0.35 });
      io.observe(document.getElementById('section'));
    }
  }
})();

<script>
(function(){
  var deck=document.getElementById('deck');
  var frames=[].slice.call(document.querySelectorAll('.screen iframe'));
  var dotsWrap=document.getElementById('dots'), dots=[];
  var N=frames.length, idx=0, locked=false;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DECK=matchMedia('(min-width:900px) and (min-height:600px) and (pointer:fine)');
  var isDeck=null;
  var observers=[], intervalTimers=[];

  // Tell each iframe whether its section is active, so per-section media
  // (e.g. the filter discharge video) plays FROM THE START only on arrival.
  var flowIO=null;
  function signalActive(a){
    for(var i=0;i<frames.length;i++){
      try{ if(frames[i].contentWindow) frames[i].contentWindow.postMessage({type: i===a?'nf-active':'nf-inactive'}, '*'); }catch(e){}
    }
  }

  // Cache-bust so refresh always shows the latest
  var __t=Date.now();
  frames.forEach(function(f,i){
    f.addEventListener('load', function(){
      try{ if(f.contentWindow && isDeck) f.contentWindow.postMessage({type: i===idx?'nf-active':'nf-inactive'}, '*'); }catch(e){}
    });
  });

  function setH(){
    document.documentElement.style.setProperty('--screenH', window.innerHeight+'px');
    if(isDeck){
      deck.classList.remove('smooth');
      deck.style.transform='translateY(calc(-1 * '+idx+' * var(--screenH)))';
      requestAnimationFrame(function(){ deck.classList.add('smooth'); });
    }
  }

  function measureFrame(f){
    try{
      var d=f.contentDocument;
      if(!d || !d.documentElement) return;
      var h=Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0);
      if(!h || h<1) return;
      var minH=window.innerHeight;
      if(h<minH) h=minH;
      f.style.height=h+'px';
    }catch(e){}
  }

  function setupObserver(f){
    try{
      var d=f.contentDocument;
      if(!d || !d.documentElement) return;
      var ro=new ResizeObserver(function(){ measureFrame(f); });
      ro.observe(d.documentElement);
      if(d.body) ro.observe(d.body);
      observers.push(ro);
    }catch(e){}
  }

  function setupInterval(f){
    var start=Date.now();
    var timer=setInterval(function(){
      measureFrame(f);
      if(Date.now()-start>10000 && intervalTimers.indexOf(timer)>-1){
        clearInterval(timer);
        intervalTimers.splice(intervalTimers.indexOf(timer), 1);
      }
    }, 800);
    intervalTimers.push(timer);
  }

  function apply(){
    if(!isDeck) return;
    deck.classList.add('smooth');
    deck.style.transform='translateY(calc(-1 * '+idx+' * var(--screenH)))';
    for(var i=0;i<N;i++) dots[i].className = i===idx?'on':'';
    document.body.classList.toggle('compact-logo', idx!==0);
    signalActive(idx);
  }

  function go(i){
    if(!isDeck) return;
    i=Math.max(0,Math.min(N-1,i));
    if(i===idx) return;
    idx=i; apply();
    locked=true; setTimeout(function(){locked=false;}, 780);
  }

  function wheel(e){
    if(!isDeck) return;
    if(locked){ e.preventDefault(); return; }
    if(e.deltaY>16){ e.preventDefault(); go(idx+1); }
    else if(e.deltaY<-16){ e.preventDefault(); go(idx-1); }
  }

  var ty=null;
  function ts(e){ if(!isDeck) return; ty=(e.touches?e.touches[0]:e).clientY; }
  function te(e){
    if(!isDeck) return;
    if(ty==null) return;
    var y=(e.changedTouches?e.changedTouches[0]:e).clientY, dy=ty-y; ty=null;
    if(locked) return;
    if(dy>44) go(idx+1);
    else if(dy<-44) go(idx-1);
  }

  function keydown(e){
    if(!isDeck) return;
    if(locked) return;
    if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(idx+1); }
    else if(e.key==='ArrowUp'||e.key==='PageUp'){ e.preventDefault(); go(idx-1); }
  }

  function attachFrameEvents(f){
    try{
      var w=f.contentWindow; if(!w) return;
      w.addEventListener('wheel',wheel,{passive:false});
      w.addEventListener('touchstart',ts,{passive:true});
      w.addEventListener('touchend',te,{passive:true});
    }catch(e){}
  }

  function clearFlow(){
    if(flowIO){ try{flowIO.disconnect();}catch(e){} flowIO=null; }
    observers.forEach(function(ro){ try{ro.disconnect();}catch(e){} });
    observers=[];
    intervalTimers.forEach(function(t){ clearInterval(t); });
    intervalTimers=[];
    frames.forEach(function(f){
      f.style.height='';
      try{
        var w=f.contentWindow;
        if(w){
          w.removeEventListener('wheel',wheel);
          w.removeEventListener('touchstart',ts);
          w.removeEventListener('touchend',te);
        }
      }catch(e){}
    });
  }

  function setupFlow(){
    frames.forEach(function(f){
      measureFrame(f);
      setupObserver(f);
      setupInterval(f);
    });
    // In flow mode, activate a section's media when it's centred in the viewport.
    if('IntersectionObserver' in window){
      flowIO = new IntersectionObserver(function(entries){
        entries.forEach(function(en){ if(en.isIntersecting){ var fi=frames.indexOf(en.target); if(fi>=0) signalActive(fi); } });
      }, {rootMargin:'-45% 0px -45% 0px', threshold:0});
      frames.forEach(function(f){ flowIO.observe(f); });
    }
  }

  function applyMode(){
    var newIsDeck = DECK.matches && !reduce;
    if(newIsDeck===isDeck && isDeck){
      setH(); return;
    }
    if(newIsDeck===isDeck && !isDeck){
      frames.forEach(function(f){ measureFrame(f); });
      return;
    }

    isDeck=newIsDeck;

    if(isDeck){
      document.documentElement.classList.remove('flow-mode');
      document.documentElement.classList.add('deck-mode');
      document.body.classList.remove('flow-mode');
      document.body.classList.add('deck-mode');
      clearFlow();
      window.scrollTo(0,0);
      deck.style.transform='';
      setH();
      apply();
      frames.forEach(attachFrameEvents);
    } else {
      document.documentElement.classList.remove('deck-mode');
      document.documentElement.classList.add('flow-mode');
      document.body.classList.remove('deck-mode');
      document.body.classList.add('flow-mode');
      deck.classList.remove('smooth');
      deck.style.transform='none';
      window.scrollTo(0,0);
      setupFlow();
    }
  }

  // Build progress dots
  for(var i=0;i<N;i++){
    (function(i){
      var b=document.createElement('button');
      b.setAttribute('aria-label','Go to section '+(i+1));
      b.addEventListener('click',function(){go(i);});
      dotsWrap.appendChild(b); dots.push(b);
    })(i);
  }

  // Global listeners
  window.addEventListener('wheel',wheel,{passive:false});
  window.addEventListener('touchstart',ts,{passive:true});
  window.addEventListener('touchend',te,{passive:true});
  window.addEventListener('keydown',keydown);
  window.addEventListener('resize', applyMode);
  window.addEventListener('orientationchange', applyMode);

  // Iframe load listeners
  frames.forEach(function(f){
    f.addEventListener('load', function(){
      if(isDeck){
        attachFrameEvents(f);
      } else {
        measureFrame(f);
        setupObserver(f);
        setupInterval(f);
      }
    });
  });

  // Init
  applyMode();
})();
</script>

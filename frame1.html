<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoFlashing — The Big Idea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a2622; --muted:#8a817a; --charge:#1b7bff; --charge-deep:#1558c8;
    --paper:#ece7e1;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:'Space Grotesk',system-ui,sans-serif; color:var(--ink);
    background:#ece7e1 url('assets/Background.png') center/cover no-repeat;
    cursor:none;
  }
  #scene{position:fixed;inset:0;z-index:1;}
  /* soft scrim only behind the headline (upper-left) so type stays legible on the wall */
  .scrim{position:fixed;top:0;left:0;width:62%;height:52%;z-index:2;pointer-events:none;
    background:radial-gradient(120% 95% at 8% 18%, rgba(236,231,225,0.78) 0%, rgba(236,231,225,0.30) 42%, rgba(236,231,225,0) 70%);}
  .hero{position:fixed;z-index:3;top:7.5vh;left:5vw;max-width:46ch;pointer-events:none;}
  .eyebrow{display:flex;align-items:center;gap:9px;font-family:'Space Mono',monospace;
    font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-bottom:20px;}
  .eyebrow .sym{width:14px;height:14px;flex:0 0 auto;}
  h1{font-family:-apple-system,system-ui,'Inter','Space Grotesk',sans-serif;font-weight:600;
    font-size:clamp(24px,2.7vw,34px);line-height:1.32;letter-spacing:-0.022em;color:#1a1a1a;}
  h1 .chg{font-style:italic;color:var(--charge);}
  .sub{margin-top:22px;font-size:19px;line-height:1.55;color:#1a1a1a;max-width:440px;font-weight:400;}
  /* instrument readout, lower-left */
  .readout{position:fixed;z-index:3;left:5vw;bottom:6vh;font-family:'Space Mono',monospace;
    display:flex;align-items:center;gap:18px;pointer-events:none;}
  .readout .live{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
  .readout .dot{width:7px;height:7px;border-radius:50%;background:var(--charge);box-shadow:0 0 9px rgba(27,123,255,.7);animation:pulse 2.2s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  .readout .name{font-size:13px;letter-spacing:.06em;color:var(--ink);min-width:13ch;}
  .readout .chg{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--charge-deep);}
  .readout .count{font-size:11px;letter-spacing:.14em;color:var(--muted);}
  .hint{position:fixed;z-index:3;right:5vw;bottom:6vh;font-family:'Space Mono',monospace;
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);opacity:.8;pointer-events:none;}
  @media (max-width:720px){ .hero{left:6vw;top:6vh;max-width:none} .readout{left:6vw} .hint{display:none} .scrim{width:100%;height:44%} }
</style>
</head>
<body>
<!-- bigidea_charge_v2 -->
<canvas id="scene"></canvas>
<div class="scrim"></div>
<div class="hero">
  <div class="eyebrow">
    <svg class="sym" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#1b7bff" stroke-width="2"/><rect x="7" y="11" width="10" height="2" rx="1" fill="#1b7bff"/></svg>
    The Big Idea
  </div>
  <h1>Most harmful pollutants<br>carry an <span class="chg">electric charge.</span></h1>
  <p class="sub">Clean-looking air is full of them — drifting, invisible, charged. Move your cursor to scan.</p>
</div>
<div class="readout">
  <span class="live"><span class="dot"></span>Scanning the air</span>
  <span class="name" id="r-name">—</span>
  <span class="chg"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#1558c8" stroke-width="2"/><rect x="7" y="11" width="10" height="2" rx="1" fill="#1558c8"/></svg>Negative</span>
  <span class="count" id="r-count">01 / 07</span>
</div>
<div class="hint">Idle → auto-scan</div>

<script>
const cv=document.getElementById('scene'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
// order: smoke → fungal spore → virus → bacteria → ultrafine → pfas → pollen
const SPECS=[
  {file:'Wildfire_Smoke_Particle.png', video:'Wildfire_Smoke_Particle.mp4', name:'Wildfire Smoke'},
  {file:'Fungal_Spore.png',            video:'Fungal_Spore.mp4',            name:'Fungal spore'},
  {file:'Virus.png',                   video:'Virus.mp4',                   name:'Virus'},
  {file:'Bacteria.png',                video:'Bacteria.mp4',                name:'Bacteria'},
  {file:'Ultrafine_Particle.png',      video:'Ultrafine_Particle.mp4',      name:'Ultrafine particle'},
  {file:'PFAS.png',                    video:'PFAS.mp4',                    name:'PFAS'},
  {file:'Pollen.png',                  video:'Pollen.mp4',                  name:'Pollen'},
];
SPECS.forEach(s=>{
  const im=new Image(); im.src='assets/'+s.file; s.img=im; s.ready=false; im.onload=()=>s.ready=true;
  const v=document.createElement('video'); v.src='assets/'+s.video; v.muted=true; v.loop=true; v.playsInline=true; v.setAttribute('playsinline',''); v.preload='auto';
  s.vid=v; s.vReady=false; v.addEventListener('loadeddata',()=>{s.vReady=true;});
});
const rName=document.getElementById('r-name'), rCount=document.getElementById('r-count');

const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let dustB=[], purifier={x:0.76,y:0.42};
const NB=8;  // alpha buckets → batch fillStyle once per bucket (keeps 4000+ motes at 60fps)
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const n=Math.round(Math.min(4200, W*H/460));   // 5× dust field
  dustB=[]; for(let b=0;b<NB;b++) dustB.push({a:0.09+b*0.05, motes:[]});
  for(let i=0;i<n;i++) dustB[(Math.random()*NB)|0].motes.push(mote());
}
function mote(){return {x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,
  r:.55+Math.random()*1.7};}

const bub={x:innerWidth*.55,y:innerHeight*.5,tx:innerWidth*.55,ty:innerHeight*.5,R:0};
const BUBBLE=0.195;  // bubble radius as fraction of min(W,H) — bigger so the specimen + ⊖ charge read clearly
const PROBE=new URLSearchParams(location.search).get('probe');  // ?probe=N parks the bubble on a specimen for UAT
let mouseActive=false,lastMove=-9999,specIndex=0,lastAdvance=0,autoTarget=null,autoT=0,distSinceAdvance=0,prevx=bub.x,prevy=bub.y;
function now(){return performance.now();}
addEventListener('mousemove',e=>{bub.tx=e.clientX;bub.ty=e.clientY;mouseActive=true;lastMove=now();});
addEventListener('mouseleave',()=>{mouseActive=false;});
addEventListener('resize',resize);

function pickAutoPoint(){ // a calm point in the open room air — gentle, stays central (no darting)
  const ang=autoT*0.7; autoT++;
  return {x:W*(0.42+0.22*Math.sin(ang*1.3)), y:H*(0.37+0.14*Math.sin(ang*0.9+1))};
}
function easeInOut(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

function setSpec(i){
  specIndex=((i%SPECS.length)+SPECS.length)%SPECS.length;
  SPECS.forEach((s,k)=>{ if(s.vid){ if(k===specIndex){ s.vid.play().catch(()=>{}); } else { try{s.vid.pause();}catch(e){} } } });
  rName.textContent=SPECS[specIndex].name; rCount.textContent=String(specIndex+1).padStart(2,'0')+' / 07';
}
setSpec(PROBE!==null?+PROBE:0);

function tick(){
  const t=now();
  if(PROBE!==null){ bub.x=W*0.5; bub.y=H*0.46; bub.R+=(Math.min(W,H)*BUBBLE - bub.R)*0.2; draw(t); requestAnimationFrame(tick); return; }
  if(mouseActive && t-lastMove<2500){
    // cursor mode: bubble follows pointer; advance specimen as you sweep to new air
    bub.x+=(bub.tx-bub.x)*.14; bub.y+=(bub.ty-bub.y)*.14;
    distSinceAdvance+=Math.hypot(bub.x-prevx,bub.y-prevy);
    if(distSinceAdvance>230){ setSpec(specIndex+1); distSinceAdvance=0; }
  } else {
    // auto mode: a SLOW eased drift to a point, then a CALM dwell on the specimen — gentle, unhurried, harmonic
    if(!autoTarget){autoTarget=pickAutoPoint(); bub.sx=bub.x; bub.sy=bub.y; bub.t0=t;}
    const GLIDE=REDUCED?4800:4200, DWELL=3000, el=t-bub.t0;
    if(el<GLIDE){ const e=easeInOut(el/GLIDE); bub.x=bub.sx+(autoTarget.x-bub.sx)*e; bub.y=bub.sy+(autoTarget.y-bub.sy)*e; }
    else if(el<GLIDE+DWELL){ bub.x=autoTarget.x; bub.y=autoTarget.y; }
    else { setSpec(specIndex+1); autoTarget=null; }
  }
  prevx=bub.x; prevy=bub.y;
  bub.R += (Math.min(W,H)*BUBBLE - bub.R)*0.12;
  draw(t);
  requestAnimationFrame(tick);
}

function draw(t){
  ctx.clearRect(0,0,W,H);
  // ---- dust (drifts, gentle pull toward the wall air-purifier) — batched by alpha bucket ----
  for(const bucket of dustB){
    ctx.fillStyle='rgba(74,66,58,'+bucket.a.toFixed(2)+')';
    for(const d of bucket.motes){
      if(!REDUCED){
        d.vx+=(Math.random()-.5)*.012; d.vy+=(Math.random()-.5)*.012;
        d.vx*=.95; d.vy*=.95; d.x+=d.vx; d.y+=d.vy;   // gentle Brownian float — stays dispersed (capture-into-purifier is a LATER frame)
      }
      if(d.x<-4)d.x=W+4; if(d.x>W+4)d.x=-4; if(d.y<-4)d.y=H+4; if(d.y>H+4)d.y=-4;
      ctx.fillRect(d.x-d.r,d.y-d.r,d.r*2,d.r*2);
    }
  }

  // ---- magnifier bubble ----
  const R=bub.R, x=bub.x, y=bub.y, s=SPECS[specIndex];
  // soft outer shadow / lens
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,R,0,6.2832);
  ctx.shadowColor='rgba(40,34,28,.28)'; ctx.shadowBlur=34; ctx.shadowOffsetY=14;
  ctx.fillStyle='rgba(236,231,225,0.92)'; ctx.fill();
  ctx.restore();
  // clip to lens, draw the specimen render (its own warm bg blends with the room)
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,R-1,0,6.2832); ctx.clip();
  ctx.fillStyle='rgba(238,233,227,0.96)'; ctx.fillRect(x-R,y-R,2*R,2*R);
  {  // the seamless-looped Seedance clip provides the rotation; gentle float
    const bob=Math.sin(t*0.0017)*R*0.03, sway=Math.cos(t*0.0011)*R*0.012;
    const d=R*2.0*(s.scale||1);
    ctx.save(); ctx.translate(x+sway, y+bob);
    if(s.vReady && s.vid.readyState>=2){ ctx.drawImage(s.vid, -d/2,-d/2,d,d); }
    else if(s.ready){ ctx.drawImage(s.img, -d/2,-d/2,d,d); }
    ctx.restore();
  }
  ctx.restore();
  // lens rim (charge-blue) + inner highlight
  ctx.lineWidth=2; ctx.strokeStyle='rgba(27,123,255,.85)'; ctx.beginPath(); ctx.arc(x,y,R,0,6.2832); ctx.stroke();
  ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(x,y,R-3,0,6.2832); ctx.stroke();
  // crosshair ticks (instrument)
  ctx.strokeStyle='rgba(27,123,255,.55)'; ctx.lineWidth=1.4;
  for(const ang of [0,Math.PI/2,Math.PI,3*Math.PI/2]){ctx.beginPath(); ctx.moveTo(x+Math.cos(ang)*(R-7),y+Math.sin(ang)*(R-7)); ctx.lineTo(x+Math.cos(ang)*(R-1),y+Math.sin(ang)*(R-1)); ctx.stroke();}
  // tethered label
  const lx=x+R*0.86, ly=y-R*0.86;
  ctx.strokeStyle='rgba(27,123,255,.55)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x+R*0.7,y-R*0.7); ctx.lineTo(lx,ly); ctx.stroke();
  ctx.font='700 22px "Space Mono",monospace'; ctx.fillStyle='#2a2622'; ctx.textBaseline='middle';
  ctx.fillText(s.name, lx+6, ly);
}
resize(); requestAnimationFrame(tick);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>North America Wildfire Smoke — Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#1f2327;
    --muted:#6b7178;
    --hair:rgba(20,24,28,0.18);
    --land:#eef0f2;
    --faint:#aab2b8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;width:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Mono', ui-monospace, monospace;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #app{position:fixed;inset:0;}
  svg{display:block;width:100%;height:100%;}

  .land{fill:var(--land);}
  .border{fill:none;stroke:var(--hair);stroke-width:0.5;stroke-linejoin:round;stroke-linecap:round;}
  .smoke{stroke:none;}

  .monitor{stroke:#ffffff;stroke-width:0.6;stroke-opacity:0.85;}
  .monitor-worst{stroke:#ffffff;stroke-width:1.2;}

  .caption{
    position:absolute;left:14px;top:12px;
    font-size:10px;line-height:1.5;color:var(--muted);
    max-width:60%;letter-spacing:0.02em;
    pointer-events:none;
  }
  .caption b{color:var(--ink);font-weight:700;}
  .caption .count{color:var(--ink);}

  .legend{
    position:absolute;left:16px;bottom:16px;
    font-family:'Space Mono',monospace;
    font-size:9px;line-height:1.6;color:var(--muted);
    pointer-events:none;
  }
  .legend .title{
    letter-spacing:0.12em;text-transform:uppercase;
    font-size:8.5px;color:var(--faint);margin-bottom:4px;
  }
  .legend .row{display:flex;align-items:center;gap:8px;margin:2px 0;}
  .legend .sw{width:18px;height:10px;display:inline-block;border:1px solid rgba(20,24,28,0.12);}
  .legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,0.9);}
  .legend .sep{height:6px;}

  .status{
    position:absolute;right:14px;top:12px;
    font-size:10px;color:var(--muted);text-align:right;
    line-height:1.5;letter-spacing:0.02em;
    pointer-events:none;max-width:40%;
  }
  .status .err{color:#9a3b3b;}

  .tooltip{
    position:absolute;pointer-events:none;
    background:#1f2327;color:#f4f6f7;
    font-family:'Space Mono',monospace;font-size:11px;
    padding:6px 8px;border-radius:2px;
    line-height:1.45;letter-spacing:0.01em;
    box-shadow:0 4px 14px rgba(20,24,28,0.18);
    white-space:nowrap;z-index:30;
    transform:translate(-50%, calc(-100% - 10px));
    opacity:0;transition:opacity 0.12s ease-out;
  }
  .tooltip.show{opacity:1;}
  .tooltip .v{color:#ff8a7a;font-weight:700;}

  .loader{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:11px;color:var(--muted);letter-spacing:0.04em;
    text-align:center;
  }
  .loader .dot{
    display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--ink);margin:0 2px;opacity:0.3;
    animation:pulse 1.2s infinite ease-in-out;
  }
  .loader .dot:nth-child(2){animation-delay:0.15s;}
  .loader .dot:nth-child(3){animation-delay:0.3s;}
  @keyframes pulse{0%,100%{opacity:0.2;transform:scale(0.8);}50%{opacity:0.9;transform:scale(1.1);}}

  @media (max-width:560px){
    .caption{max-width:80%;font-size:9px;}
    .legend{font-size:9px;padding:8px 10px;}
    .status{max-width:55%;font-size:9px;}
  }
</style>
</head>
<body>
<div id="app">
  <svg id="map" role="img" aria-label="North America wildfire smoke and PM2.5 monitor map"></svg>

  <div class="caption">
    <b>Near-real-time</b> · NOAA satellite smoke + EPA PM2.5 monitors · updated through the day<br>
    <span id="counts"></span>
  </div>

  <div class="status" id="status">
    <span id="status-text">Loading live smoke data<span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
  </div>

  <div class="legend" id="legend" style="display:none;">
    <div class="title">Smoke density</div>
    <div class="row"><span class="sw" style="background:rgba(70,75,80,0.10)"></span>Light</div>
    <div class="row"><span class="sw" style="background:rgba(70,75,80,0.20)"></span>Medium</div>
    <div class="row"><span class="sw" style="background:rgba(70,75,80,0.34)"></span>Heavy</div>
    <div class="sep"></div>
    <div class="title">PM2.5 µg/m³</div>
    <div class="row"><span class="dot" style="background:#c2c8cc"></span>0</div>
    <div class="row"><span class="dot" style="background:#e0a0a0"></span>~35</div>
    <div class="row"><span class="dot" style="background:#e23b3b"></span>75+</div>
  </div>

  <div class="tooltip" id="tooltip"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
(function(){
  "use strict";

  const svg = d3.select("#map");
  const tooltip = d3.select("#tooltip");
  const statusEl = document.getElementById("status-text");
  const countsEl = document.getElementById("counts");
  const legendEl = document.getElementById("legend");

  // ---- Projection ----
  const projection = d3.geoConicConformal()
    .rotate([98, 0])
    .center([0, 38])
    .parallels([20, 60])
    .scale(1)
    .translate([0,0]);

  const path = d3.geoPath(projection);

  const layers = {
    basemap: svg.append("g").attr("class","layer-basemap"),
    smoke:   svg.append("g").attr("class","layer-smoke"),
    monitors:svg.append("g").attr("class","layer-monitors")
  };

  let _basemap = null;
  let _smoke = null;
  let _monitors = null;

  function fitProjection(){
    if(!_basemap) return;
    const W = window.innerWidth, H = window.innerHeight;
    // Fit the full basemap, then zoom in about the viewport centre so the populated band
    // fills the frame and the empty edges (ocean / arctic) crop off. Robust at any aspect.
    projection.fitSize([W, H], _basemap);
    const k = 1.45;
    const s = projection.scale();
    const t = projection.translate();
    projection.scale(s * k)
              .translate([ W/2 + (t[0] - W/2) * k, H/2 + (t[1] - H/2) * k ]);
  }

  function renderBasemap(){
    if(!_basemap) return;
    const g = layers.basemap;
    g.selectAll("path.land").data(_basemap.features).join(
      enter => enter.append("path").attr("class","land")
    )
      .attr("d", path)
      .attr("fill","#eef0f2");
    g.selectAll("path.border").data(_basemap.features).join(
      enter => enter.append("path").attr("class","border")
    )
      .attr("d", path);
  }

  function renderSmoke(){
    const g = layers.smoke;
    g.selectAll("*").remove();
    if(!_smoke || !_smoke.features) return;
    const colorByDensity = {
      "Light":  "rgba(70,75,80,0.10)",
      "Medium": "rgba(70,75,80,0.20)",
      "Heavy":  "rgba(70,75,80,0.34)"
    };
    g.selectAll("path.smoke")
      .data(_smoke.features)
      .join(
        enter => enter.append("path").attr("class","smoke")
      )
      .attr("d", path)
      .attr("fill", d => colorByDensity[(d.properties && d.properties.Density)] || colorByDensity["Light"])
      .attr("stroke","none");
  }

  function pm25Color(v){
    // 0 -> #c2c8cc, 35 -> #e0a0a0, 75+ -> #e23b3b
    if(v == null || isNaN(v)) return "#c2c8cc";
    const t = Math.max(0, Math.min(1, v/75));
    // piecewise: 0->35 ramp grey->pink, 35->75 ramp pink->red
    const stops = [
      [0,   [194,200,204]],
      [35,  [224,160,160]],
      [75,  [226,59,59]]
    ];
    let a=stops[0], b=stops[stops.length-1];
    for(let i=0;i<stops.length-1;i++){
      if(v>=stops[i][0] && v<=stops[i+1][0]){a=stops[i];b=stops[i+1];break;}
    }
    const span = b[0]-a[0] || 1;
    const k = (v-a[0])/span;
    const r = Math.round(a[1][0]+(b[1][0]-a[1][0])*k);
    const gg= Math.round(a[1][1]+(b[1][1]-a[1][1])*k);
    const bl= Math.round(a[1][2]+(b[1][2]-a[1][2])*k);
    return `rgb(${r},${gg},${bl})`;
  }

  function renderMonitors(){
    const g = layers.monitors;
    g.selectAll("*").remove();
    if(!_monitors || _monitors.length===0) return;

    // Worst air accent
    let worst = null;
    for(const m of _monitors){
      if(m.pm25!=null && !isNaN(m.pm25)){
        if(!worst || m.pm25 > worst.pm25) worst = m;
      }
    }

    g.selectAll("circle.monitor")
      .data(_monitors.filter(m => m.lat!=null && m.lon!=null && m.pm25!=null && !isNaN(m.pm25)))
      .join(
        enter => enter.append("circle").attr("class","monitor")
      )
      .attr("cx", d => {
        const p = projection([d.lon, d.lat]); return p?p[0]:0;
      })
      .attr("cy", d => {
        const p = projection([d.lon, d.lat]); return p?p[1]:0;
      })
      .attr("r", d => (d===worst?4.2:2.8))
      .attr("fill", d => pm25Color(d.pm25))
      .attr("class", d => (d===worst?"monitor monitor-worst":"monitor"))
      .style("cursor","pointer")
      .on("mousemove", function(event, d){
        const [mx,my] = d3.pointer(event, document.body);
        const name = (d.siteName && d.siteName.trim()) ? d.siteName : (d.aqsid || "site");
        tooltip
          .style("left", mx+"px")
          .style("top", my+"px")
          .html(`<div>${escapeHtml(name)}</div><div>PM2.5 — <span class="v">${d.pm25}</span> µg/m³</div>`)
          .classed("show", true);
      })
      .on("mouseout", () => tooltip.classed("show", false));
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function updateCounts(){
    const nSmoke = (_smoke && _smoke.features) ? _smoke.features.length : 0;
    const nMon = _monitors ? _monitors.length : 0;
    if(nSmoke > 0){
      countsEl.innerHTML = `<span class="count">${nSmoke}</span> smoke plumes · <span class="count">${nMon}</span> air-quality monitors`;
    } else {
      // Honest, non-broken state when satellites detect no active smoke right now.
      countsEl.innerHTML = `No active wildfire smoke detected · <span class="count">${nMon}</span> air-quality monitors reporting`;
    }
  }

  function setStatus(html, isError){
    statusEl.innerHTML = html;
    const parent = document.getElementById("status");
    parent.classList.toggle("err", !!isError);
  }

  function clearLoader(){
    const loader = document.querySelector(".loader");
    if(loader) loader.remove();
  }

  // ---- Fetch helpers ----
  async function fetchJson(url){
    const r = await fetch(url, {mode:"cors"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }

  async function fetchText(url){
    const r = await fetch(url, {mode:"cors"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.text();
  }

  // ---- Basemap ----
  async function loadBasemap(){
    const urls = [
      "https://cdn.jsdelivr.net/gh/martynafford/natural-earth-geojson/110m/cultural/ne_110m_admin_1_states_provinces.json",
      "https://cdn.jsdelivr.net/gh/martynafford/natural-earth-geojson/50m/cultural/ne_50m_admin_1_states_provinces.json"
    ];
    let lastErr;
    for(const u of urls){
      try{
        const data = await fetchJson(u);
        if(!data || !data.features || !data.features.length) throw new Error("empty");
        _basemap = data;
        return;
      }catch(e){ lastErr = e; }
    }
    throw lastErr || new Error("basemap failed");
  }

  // ---- Smoke ----
  async function loadSmoke(){
    const url = "https://services2.arcgis.com/C8EMgrsFcRFL6LrL/arcgis/rest/services/NOAA_Satellite_Smoke_Detection_(v1)/FeatureServer/0/query?where=1%3D1&outFields=Density&f=geojson&resultRecordCount=2000";
    try{
      const data = await fetchJson(url);
      if(data && data.features){
        _smoke = data;
      }
    }catch(e){
      // silent — partial render
    }
  }

  // ---- AirNow sites ----
  function parseSitesDat(text){
    // Pipe-delimited, no header. AQSID is field 0.
    // Known layout: AQSID|SiteCode|SiteName|Status|AgencyID|AgencyName|EPARegion|Latitude|Longitude|Elevation|...
    // Be defensive: find lat/lon by scanning for numeric decimal-degree fields.
    const lines = text.split(/\r?\n/);
    const sites = new Map();
    for(const line of lines){
      if(!line) continue;
      const cols = line.split("|");
      if(cols.length < 4) continue;
      const aqsid = cols[0].trim();
      if(!aqsid) continue;
      // Try known indices first
      // Real layout: AQSID|..|..|..|..|..|SiteName(6)|..|Lat(8)|Lon(9)
      let lat = parseFloat(cols[8]);
      let lon = parseFloat(cols[9]);
      let siteName = cols[6] ? cols[6].trim() : "";
      // Fallback: scan for plausible lat/lon if known indices invalid
      if((isNaN(lat) || isNaN(lon)) && cols.length >= 6){
        const cands = [];
        for(let i=3;i<cols.length;i++){
          const v = parseFloat(cols[i]);
          if(!isNaN(v) && Math.abs(v) <= 90){
            cands.push({i, v});
          }
        }
        // pick two: smallest abs as lat? heuristic: lat in [-90,90], lon in [-180,180]
        // find a pair where one |v|<=90 and another |v|<=180 and >90 in abs
        let latC=null, lonC=null;
        for(const a of cands){
          for(const b of cands){
            if(a===b) continue;
            if(Math.abs(a.v) <= 90 && Math.abs(b.v) <= 180 && Math.abs(b.v) > 90){
              latC = a; lonC = b; break;
            }
          }
          if(latC) break;
        }
        if(latC && lonC){
          lat = latC.v; lon = lonC.v;
        }
      }
      if(!isNaN(lat) && !isNaN(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180){
        sites.set(aqsid, {aqsid, lat, lon, siteName});
      }
    }
    return sites;
  }

  function parseHourlyDat(text){
    // AQSID|SiteName|GMTOffset|ParameterName|Date|Time|Value|Unit|...
    // Filter ParameterName === "PM2.5"
    const lines = text.split(/\r?\n/);
    const out = [];
    for(const line of lines){
      if(!line) continue;
      const cols = line.split("|");
      if(cols.length < 7) continue;
      // Real layout: Date|Time|AQSID|Site|GMToff|Param|Unit|Value
      const aqsid = cols[2] ? cols[2].trim() : "";
      const param = cols[5] ? cols[5].trim() : "";
      if(param !== "PM2.5") continue;
      let val = parseFloat(cols[7]);
      let unit = cols[6] ? cols[6].trim() : "";
      if(isNaN(val)){
        // scan for first numeric after param
        for(let i=4;i<cols.length;i++){
          const v = parseFloat(cols[i]);
          if(!isNaN(v)){ val = v; break; }
        }
      }
      if(!isNaN(val)){
        out.push({aqsid, pm25: val, unit});
      }
    }
    return out;
  }

  function utcHourStamp(d){
    const pad = n => String(n).padStart(2,"0");
    return `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}${pad(d.getUTCHours())}`;
  }

  async function loadMonitors(){
    let sites;
    try{
      const txt = await fetchText("https://files.airnowtech.org/airnow/today/monitoring_site_locations.dat");
      sites = parseSitesDat(txt);
    }catch(e){
      sites = new Map();
    }

    // Walk back up to 12 UTC hours and pick the DENSEST hour (most PM2.5 rows), so a
    // sparse early-reporting hour doesn't leave the map nearly empty. Stop early once a
    // substantial hour (>=150 rows) is found.
    const now = new Date();
    let hourlyRows = null;
    let usedStamp = null;
    let bestCount = 0;
    for(let back=0; back<=12; back++){
      const d = new Date(now.getTime() - back*3600*1000);
      const stamp = utcHourStamp(d);
      const url = `https://files.airnowtech.org/airnow/today/HourlyData_${stamp}.dat`;
      try{
        const txt = await fetchText(url);
        const rows = parseHourlyDat(txt);
        if(rows.length > bestCount){
          bestCount = rows.length;
          hourlyRows = rows;
          usedStamp = stamp;
        }
        if(bestCount >= 150) break;
      }catch(e){
        // continue to previous hour
      }
    }

    if(!hourlyRows || sites.size === 0){
      _monitors = [];
      return usedStamp;
    }

    // Join
    const monitors = [];
    for(const row of hourlyRows){
      const s = sites.get(row.aqsid);
      if(s){
        monitors.push({
          aqsid: s.aqsid,
          lat: s.lat,
          lon: s.lon,
          siteName: s.siteName || row.siteName || "",
          pm25: row.pm25
        });
      }
    }
    _monitors = monitors;
    return usedStamp;
  }

  // ---- Main load ----
  async function load(){
    setStatus('Loading live smoke data<span class="dot"></span><span class="dot"></span><span class="dot"></span>');
    const results = await Promise.allSettled([
      loadBasemap(),
      loadSmoke(),
      loadMonitors()
    ]);

    const basemapR = results[0];
    const smokeR   = results[1];
    const monR     = results[2];

    if(basemapR.status === "fulfilled"){
      fitProjection();
      renderBasemap();
      renderSmoke();
      renderMonitors();
      updateCounts();
      legendEl.style.display = "block";

      const notes = [];
      if(smokeR.status === "rejected" || !_smoke) notes.push("smoke feed unavailable");
      if(monR.status === "rejected" || !_monitors || _monitors.length === 0) notes.push("PM2.5 feed unavailable");
      if(notes.length){
        setStatus(`<span class="err">${notes.join(" · ")}</span>`, true);
      }else{
        setStatus("");
      }
    }else{
      setStatus('<span class="err">Basemap failed to load</span>', true);
    }
  }

  // ---- Resize ----
  let resizeTimer;
  function onResize(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      svg.attr("viewBox", `0 0 ${window.innerWidth} ${window.innerHeight}`);
      if(_basemap){
        fitProjection();
        renderBasemap();
        renderSmoke();
        renderMonitors();
      }
    }, 120);
  }
  window.addEventListener("resize", onResize);

  // init
  svg.attr("viewBox", `0 0 ${window.innerWidth} ${window.innerHeight}`);
  load();

})();
</script>
</body>
</html>

<!doctype html>
<html lang="en" style="background:#c3d3e2">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Manhattan</title>
<style>
  html,body{margin:0;height:100%;background:#c3d3e2;overflow:hidden;
    font-family:Montserrat,-apple-system,"Segoe UI",Arial,sans-serif;color:#000}
  canvas{display:block}
  .hud{position:fixed;left:26px;bottom:24px;z-index:3;font-size:12px;font-weight:600;
    letter-spacing:.09em;opacity:.60;line-height:1.9;pointer-events:none}
  .hud b{display:block;font-size:13px;letter-spacing:.11em;opacity:1;margin-bottom:4px}
  .load{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:#c3d3e2;
    font-size:12px;font-weight:650;letter-spacing:.12em;color:#5b6672;transition:opacity .8s}
  .load.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <b>Manhattan</b>
  23,728 buildings · real footprints · real heights
</div>
<div class="load" id="load">LOADING</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';

const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({canvas, antialias:true});
r.setSize(innerWidth, innerHeight);
r.setPixelRatio(Math.min(devicePixelRatio, 2));
r.toneMapping = THREE.ACESFilmicToneMapping;
r.toneMappingExposure = 1.06;
r.shadowMap.enabled = true;
r.shadowMap.type = THREE.PCFSoftShadowMap;

const SKY = 0xc3d3e2, HAZE = 0xc9d7e4;

const sc = new THREE.Scene();
sc.background = new THREE.Color(SKY);
/* Heavy enough that the plate never ends anywhere the eye can see: the city dissolves
   into air the way a real skyline does at distance. This is what hides the edge --
   not a bigger ground plane. */
sc.fog = new THREE.FogExp2(HAZE, 0.000082);

const cam = new THREE.PerspectiveCamera(23, innerWidth/innerHeight, 8, 40000);

/* the mountain's rig, warmed very slightly, so the two acts sit together */
const sun = new THREE.DirectionalLight(0xfff3e2, 3.25);
sun.position.set(-3600, 2350, 4300);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const S = 3400;
Object.assign(sun.shadow.camera, {left:-S, right:S, top:S, bottom:-S, near:200, far:14000});
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 1.4;
sc.add(sun);
sc.add(new THREE.HemisphereLight(0xd2dfec, 0x8e959b, 0.62));
const fill = new THREE.DirectionalLight(0xe6ecf3, 0.40);
fill.position.set(3200, 1400, -2400);
sc.add(fill);

/* No photograph anywhere. One flat ground in the same grey family as the buildings,
   large enough that fog swallows it long before it ends. Removing the aerial plate
   also takes 2.56 MB off the page. */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(90000, 90000),
  new THREE.MeshStandardMaterial({color:0x7b8794, roughness:0.97, metalness:0.0})
);
ground.rotation.x = -Math.PI/2; ground.position.y = -0.5;
ground.receiveShadow = true; sc.add(ground);

/* Greyscale massing. Tone comes from height and from a stable per-building seed, so
   23,728 buildings read as many separate objects without loading a single texture. */
function cityMaterial(){
  const m = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.82, metalness:0.02, flatShading:true});
  m.onBeforeCompile = sh => {
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>',
        '#include <common>\nattribute vec3 _BLD;\nvarying vec3 vWPos;\nvarying vec3 vBld;')
      .replace('#include <worldpos_vertex>',
        '#include <worldpos_vertex>\n vWPos=(modelMatrix*vec4(transformed,1.0)).xyz;\n vBld=_BLD;');
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>',
        '#include <common>\nvarying vec3 vWPos;\nvarying vec3 vBld;')
      .replace('#include <map_fragment>', `
        vec3 fnrm = normalize(cross(dFdx(vWPos), dFdy(vWPos)));
        float up = abs(fnrm.y);
        float seed = vBld.y;
        float H = vBld.z * 3.5;

        /* one grey family, spread by seed and by height */
        float t = clamp(H / 150.0, 0.0, 1.0);
        float g = 0.30 + 0.19 * seed + 0.20 * t;

        /* faint floor banding so a tall wall is not one flat sheet */
        g *= 0.975 + 0.025 * sin(vWPos.y * 1.85 + seed * 8.0);

        /* roofs a touch lighter than walls */
        g *= mix(1.0, 1.10, smoothstep(0.55, 0.80, up));

        /* a darker line where a building meets the street */
        g *= 0.66 + 0.34 * smoothstep(0.0, 7.0, vWPos.y);

        /* the barest cool cast, matching the mountain */
        diffuseColor.rgb = vec3(g) * vec3(0.985, 0.995, 1.015);
      `);
  };
  return m;
}

const controls = new OrbitControls(cam, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 400;
controls.maxDistance = 14000;
controls.maxPolarAngle = Math.PI * 0.492;

new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('./nyc_city_v3.glb', gl => {
  const m = gl.scene;
  m.traverse(o => { if (o.isMesh) {
    o.castShadow = true; o.receiveShadow = true;
    /* positions only in the file; the quantization scale is uniform, so normals
       computed here are correct, and flatShading keeps the corners crisp */
    o.geometry.computeVertexNormals();
    o.material = cityMaterial();
  }});
  sc.add(m);

  /* The angle: low over Midtown looking downtown, so the towers stack against each
     other and the avenue grid runs away into haze. Turned so no shoreline reaches a
     corner of frame. */
  const c = new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3());
  cam.position.set(c.x - 2350, 1180, c.z + 3750);
  controls.target.set(c.x + 150, 90, c.z - 250);
  controls.update();

  document.getElementById('load').classList.add('gone');
  window.__ready = true;
}, undefined, err => {
  const el = document.getElementById('load');
  el.textContent = 'FAILED TO LOAD';
  window.__err = String(err);
});

window.__setCam = (p,t) => { cam.position.set(p[0],p[1],p[2]); controls.target.set(t[0],t[1],t[2]); controls.update(); };

addEventListener('resize', () => {
  cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
  r.setSize(innerWidth, innerHeight);
});

r.setAnimationLoop(() => { controls.update(); r.render(sc, cam); });
</script>
</body>
</html>

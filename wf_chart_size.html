<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<title>Wildfire Smoke — Editorial Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#1f2327;
    --muted:#828a90;
    --faint:#aab2b8;
    --hair:rgba(20,24,28,0.12);
    --red:#e23b3b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Space Grotesk',sans-serif;}
  body{padding:36px 40px 48px;}
  .masthead{
    max-width:1180px;margin:0 auto 28px;
    border-top:2px solid var(--ink);
    padding-top:14px;
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:'Space Mono',monospace;font-size:10.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  }
  .masthead .brand{color:var(--ink);font-weight:700;letter-spacing:.18em;}
  .deck{max-width:1180px;margin:0 auto 24px;}
  .deck h1{font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:26px;margin:0 0 6px;letter-spacing:-0.01em;}
  .deck p{font-family:'Space Mono',monospace;font-size:10.5px;
    letter-spacing:.10em;text-transform:uppercase;color:var(--muted);margin:0;}
  .grid{
    max-width:1180px;margin:0 auto;
    display:grid;grid-template-columns:1fr 1fr;gap:28px;
  }
  .cell{
    background:transparent;
    padding:0;
  }
  .cell .label{
    font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    margin:0 0 4px;display:flex;justify-content:space-between;
    border-bottom:1px solid var(--hair);padding-bottom:8px;
  }
  .cell .label .tag{color:var(--red);font-weight:700;}
  .cell h2{
    font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:18px;margin:0 0 14px;letter-spacing:-0.005em;
    line-height:1.2;
  }
  .cell svg{display:block;width:100%;height:auto;}
  .cell .source{
    font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    margin:6px 0 0;
  }
</style>
</head>
<style>
 html,body{margin:0;padding:0;height:100%;background:#edf0f2;display:flex;align-items:center;justify-content:center;}
 .cell{width:100%;max-width:100%;max-width:620px;padding:0 12px;}
 .cell h2{font-size:18px;}
 svg{width:100%;height:auto;}
</style>
<body><div class="cell">
    <div class="label"><span>FIG. 04 · PARTICLE-SIZE</span><span class="tag">▲ SCALE</span></div>
    <h2>PM₂.₅ sits at the edge of what the lung can hold back</h2>
    <svg viewBox="0 0 560 360" role="img" aria-label="Particle size comparison circles">
      <style>
        .mono{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.10em;text-transform:uppercase;fill:#828a90;}
        .mono-ink{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.10em;text-transform:uppercase;fill:#1f2327;}
      </style>

      <!-- Concentric circles, shared center.
           Hair ~70 microns => r=120 (largest)
           PM10 ~10 microns => r=120*10/70 = 17.14
           PM2.5 ~2.5 microns => r=120*2.5/70 = 4.28
      -->
      <g transform="translate(190,182)">
        <!-- hair -->
        <circle r="120" fill="rgba(20,24,28,0.05)" stroke="#aab2b8" stroke-width="1.25"/>
        <!-- pm10 -->
        <circle r="17.14" fill="#828a90" fill-opacity="0.25" stroke="#1f2327" stroke-width="1.25"/>
        <!-- pm2.5 red -->
        <circle r="4.28" fill="#e23b3b"/>
        <circle r="4.28" fill="none" stroke="#e23b3b" stroke-width="1" opacity="0.35" transform="scale(2.2)"/>
      </g>

      <!-- leader lines + labels -->
      <!-- Hair: leader from outer ring top-right -->
      <g>
        <line x1="275" y1="97" x2="370" y2="60" stroke="rgba(20,24,28,0.45)" stroke-width="1"/>
        <line x1="370" y1="60" x2="510" y2="60" stroke="rgba(20,24,28,0.45)" stroke-width="1"/>
        <text class="mono-ink" x="378" y="55">Human hair</text>
        <text class="mono" x="378" y="69">~70 microns</text>
      </g>
      <!-- PM10: leader from medium circle -->
      <g>
        <line x1="207" y1="170" x2="370" y2="150" stroke="rgba(20,24,28,0.45)" stroke-width="1"/>
        <line x1="370" y1="150" x2="510" y2="150" stroke="rgba(20,24,28,0.45)" stroke-width="1"/>
        <text class="mono-ink" x="378" y="145">PM10</text>
        <text class="mono" x="378" y="159">under 10 microns</text>
      </g>
      <!-- PM2.5: leader from red dot -->
      <g>
        <line x1="194" y1="186" x2="370" y2="240" stroke="rgba(20,24,28,0.45)" stroke-width="1"/>
        <line x1="370" y1="240" x2="510" y2="240" stroke="rgba(20,24,28,0.45)" stroke-width="1"/>
        <text class="mono-ink" x="378" y="235" style="fill:#e23b3b;font-weight:700;">PM2.5</text>
        <text class="mono" x="378" y="249">under 2.5 microns</text>
      </g>

      <!-- scale note -->
      <line x1="40" y1="320" x2="525" y2="320" stroke="rgba(20,24,28,0.12)"/>
      <text class="mono" x="40" y="335">circles drawn to true relative diameter</text>
      <text class="mono" x="525" y="335" text-anchor="end">PM2.5 ≈ 1/28 of a hair</text>

      <!-- bottom annotation -->
      <g transform="translate(40,348)">
        <text class="mono-ink" x="0" y="0">PM2.5 is small enough to reach deep in the lungs and cross into the blood.</text>
      </g>
    </svg>
    <p class="source">Source: US EPA, PM Basics</p>
  </div></body></html>

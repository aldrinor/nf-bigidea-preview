<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wildfire Smoke — Editorial Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#1f2327;
    --muted:#828a90;
    --faint:#aab2b8;
    --red:#e23b3b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Space Grotesk',sans-serif;}
  body{padding:40px 40px 56px;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .cell{width:100%;max-width:620px;padding:0 8px;}
  .cell .label{
    font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    margin:0 0 10px;display:flex;justify-content:space-between;
    border-top:2px solid var(--ink);padding-top:12px;
  }
  .cell .label .tag{color:var(--red);font-weight:700;}
  .cell h2{
    font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:20px;margin:0 0 18px;letter-spacing:-0.01em;line-height:1.2;
  }
  .cell svg{display:block;width:100%;height:auto;}
  .cell .source{
    font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.10em;text-transform:uppercase;color:var(--muted);
    margin:14px 0 0;
  }
</style>
</head>
<body>
  <div class="cell">
    <div class="label"><span>FIG. 01 · PARTICLE SIZE</span><span class="tag">▲ SCALE</span></div>
    <h2>PM2.5 sits at the edge of what the lung can hold back</h2>
    <svg viewBox="0 0 600 360" role="img" aria-label="Particle size comparison: human hair shown at true scale with PM10 and PM2.5, plus a magnified inset loupe">
      <defs>
        <clipPath id="plot01">
          <rect x="66" y="54" width="490" height="246"/>
        </clipPath>
        <clipPath id="loupe01">
          <circle cx="400" cy="185" r="75"/>
        </clipPath>
      </defs>
      <style>
        .leader{fill:none;stroke:rgba(20,24,28,0.40);stroke-width:1;}
        .leader-red{fill:none;stroke:rgba(226,59,59,0.55);stroke-width:1;}
        .desc{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;fill:#828a90;}
        .desc-red{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;fill:#e23b3b;font-weight:700;}
        .val{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.04em;fill:#1f2327;}
        .val-red{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.04em;fill:#e23b3b;}
        .tick{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;fill:#828a90;text-transform:uppercase;}
        .tick-ink{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;fill:#1f2327;font-weight:700;text-transform:uppercase;}
        .take{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.10em;fill:#1f2327;font-weight:700;text-transform:uppercase;}
      </style>

      <!-- faint plot frame (shared system gridlines) -->
      <line x1="66"  y1="54"  x2="556" y2="54"  stroke="rgba(20,24,28,0.08)" stroke-width="1"/>
      <line x1="66"  y1="300" x2="556" y2="300" stroke="rgba(20,24,28,0.18)" stroke-width="1"/>
      <line x1="66"  y1="54"  x2="66"  y2="300" stroke="rgba(20,24,28,0.08)" stroke-width="1"/>
      <line x1="556" y1="54"  x2="556" y2="300" stroke="rgba(20,24,28,0.08)" stroke-width="1"/>

      <!-- ============ LEFT HALF : TRUE SCALE ============ -->
      <!-- HAIR ≈70 microns  ->  r = 92  (true-scale reference disc) -->
      <g clip-path="url(#plot01)">
        <circle cx="160" cy="185" r="92"
                fill="rgba(20,24,28,0.05)" stroke="#aab2b8" stroke-width="1.25"/>
        <!-- subtle inner ring to read as a cross-section -->
        <circle cx="160" cy="185" r="84"
                fill="none" stroke="rgba(20,24,28,0.06)" stroke-width="1"/>
      </g>

      <!-- PM10 under 10 microns  ->  r = 92 * 10/70 = 13.14  (sits on hair edge) -->
      <circle cx="265.14" cy="185" r="13.14"
              fill="rgba(20,24,28,0.07)" stroke="#1f2327" stroke-width="1.25"/>

      <!-- PM2.5 under 2.5 microns  ->  r = 92 * 2.5/70 = 3.29  (barely-visible red speck) -->
      <circle cx="281.57" cy="185" r="3.29" fill="#e23b3b"/>

      <!-- HAIR leader + label (orthogonal, right-angle) -->
      <polyline class="leader" points="160,93 160,70 196,70"/>
      <text class="desc" x="201" y="68">HUMAN HAIR</text>
      <text class="val"  x="201" y="82">≈70 microns</text>

      <!-- true-scale annotation tucked under the small cluster -->
      <polyline class="leader-red" points="273,199 273,214"/>
      <text class="tick" x="273" y="224" text-anchor="middle" fill="#e23b3b">TRUE SCALE</text>

      <!-- ============ MAGNIFIER CONNECTOR (viewing cone) ============ -->
      <polygon points="285,181 335,147.5 335,222.5 285,189"
               fill="rgba(20,24,28,0.035)" stroke="none"/>
      <line x1="285" y1="181" x2="335" y2="147.5" stroke="rgba(20,24,28,0.30)" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="285" y1="189" x2="335" y2="222.5" stroke="rgba(20,24,28,0.30)" stroke-width="1" stroke-dasharray="2 2"/>

      <!-- ============ RIGHT HALF : MAGNIFIED LOUPE ============ -->
      <!-- loupe outer ring (lens) -->
      <circle cx="400" cy="185" r="75"
              fill="#ffffff" stroke="#1f2327" stroke-width="1.25"/>
      <circle cx="400" cy="185" r="70"
              fill="none" stroke="rgba(20,24,28,0.10)" stroke-width="1"/>

      <!-- magnified contents (M ≈ 3.5×) : PM10 r=46, PM2.5 r=11.5  (ratio 4:1 preserved) -->
      <g clip-path="url(#loupe01)">
        <!-- PM10 -->
        <circle cx="400" cy="160" r="46"
                fill="rgba(20,24,28,0.07)" stroke="#1f2327" stroke-width="1.25"/>
        <!-- PM2.5 (red accent) -->
        <circle cx="400" cy="235" r="11.5" fill="#e23b3b"/>
      </g>

      <!-- magnification label -->
      <text class="tick-ink" x="400" y="100" text-anchor="middle">MAGNIFIED ~3.5×</text>

      <!-- PM10 leader + label (exits loupe to the right) -->
      <polyline class="leader" points="446,160 470,160"/>
      <text class="desc" x="475" y="158">PM10</text>
      <text class="val"  x="475" y="172">under 10 microns</text>

      <!-- PM2.5 leader + label (RED — the one critical point) -->
      <polyline class="leader-red" points="411.5,235 470,235"/>
      <text class="desc-red" x="475" y="233">PM2.5</text>
      <text class="val-red"  x="475" y="247">under 2.5 microns</text>

      <!-- ============ TAKEAWAY, anchored to plot left edge ============ -->
      <text class="take" x="66" y="322">PM2.5 ≈ 1/28 the width of a human hair — small enough to reach deep in the lungs.</text>
    </svg>
    <p class="source">Source: US EPA, PM Basics</p>
  </div>
</body>
</html>

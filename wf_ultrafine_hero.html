<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultrafine Particle — NanoFlashing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500&family=Space+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1418;
    --ink:#eef2f4;
    --muted:#9aa7ad;
    --line:rgba(255,255,255,.14);
    --accent:#34e1ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  body{font-family:"Space Grotesk",sans-serif;overflow-x:hidden}

  .hero{
    position:relative;
    min-height:100vh;
    width:100%;
    background:
      radial-gradient(125% 125% at 71% 50%, #1a1f24 0%, #0e1418 46%, #07090b 100%);
    overflow:hidden;
    display:flex;
    align-items:center;
  }

  .hero::before{
    content:"";
    position:absolute;inset:0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.018) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.018) 1px, transparent 1px);
    background-size:64px 64px;
    mask-image:radial-gradient(ellipse 70% 60% at 70% 50%, #000 30%, transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse 70% 60% at 70% 50%, #000 30%, transparent 80%);
    pointer-events:none;
  }

  .grain{
    position:fixed;
    inset:0;
    z-index:50;
    pointer-events:none;
    opacity:.14;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    background-size:220px 220px;
  }

  .wrap{
    position:relative;
    z-index:2;
    width:100%;
    max-width:1440px;
    margin:0 auto;
    padding:0 clamp(24px,5vw,72px);
    display:grid;
    grid-template-columns:42fr 58fr;
    gap:clamp(24px,4vw,64px);
    align-items:center;
  }

  .text{max-width:560px}
  .kicker{
    font-family:"Space Mono",monospace;
    font-size:12px;
    letter-spacing:.04em;
    color:var(--accent);
    margin-bottom:28px;
    display:inline-flex;align-items:center;gap:10px;
  }
  .kicker::before{
    content:"";width:22px;height:1px;background:var(--accent);opacity:.7;
  }
  .headline{
    font-family:"Instrument Serif",serif;
    font-weight:400;
    font-size:clamp(40px,6vw,84px);
    line-height:0.92;
    letter-spacing:0.012em;
    color:var(--ink);
    margin-bottom:30px;
  }
  .headline em{
    font-style:italic;
    color:var(--accent);
    font-weight:400;
  }
  .body{
    font-family:"Space Grotesk",sans-serif;
    font-size:19px;
    line-height:1.6;
    color:var(--muted);
    max-width:440px;
    font-weight:300;
  }
  .body sup a{
    font-family:"Space Mono",monospace;
    font-size:11px;
    color:var(--accent);
    text-decoration:none;
    padding:0 1px;
    transition:opacity .2s;
  }
  .body sup a:hover{opacity:.7}
  .source{
    margin-top:22px;
    font-family:"Space Mono",monospace;
    font-size:11px;
    color:var(--muted);
    opacity:.7;
    line-height:1.5;
  }
  .source a{
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    transition:color .2s, border-color .2s;
  }
  .source a:hover{color:var(--accent);border-color:var(--accent)}

  .scroll-line{
    margin-top:44px;
    width:1px;
    height:52px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(to bottom, var(--line), transparent);
  }
  .scroll-line::after{
    content:"";
    position:absolute;
    left:0;top:-60%;
    width:1px;height:60%;
    background:var(--accent);
    box-shadow:0 0 6px rgba(52,225,255,.8);
    animation:scrollSlide 2.6s ease-in-out infinite;
  }
  @keyframes scrollSlide{
    0%{top:-60%}
    100%{top:100%}
  }

  .stage{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    max-height:84vh;
    display:flex;align-items:center;justify-content:center;
  }
  .stage-inner{
    position:relative;
    width:100%;height:100%;
  }

  .particle-layer{
    position:absolute;
    inset:0;
    will-change:transform;
  }

  /* CORONA — soft glowing cyan aura hugging the particle surface, emanating outward */
  .corona{
    position:absolute;
    inset:8%;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%,
        transparent 44%,
        rgba(52,225,255,.10) 50%,
        rgba(52,225,255,.22) 56%,
        rgba(52,225,255,.10) 64%,
        transparent 78%);
    filter:blur(6px);
    mix-blend-mode:screen;
    animation:coronaBreathe 6s ease-in-out infinite;
    pointer-events:none;
  }
  .glow{
    position:absolute;
    inset:2%;
    border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(52,225,255,.18), rgba(52,225,255,.05) 42%, transparent 72%);
    filter:blur(30px);
    animation:glowBreathe 6s ease-in-out infinite;
    pointer-events:none;
    mix-blend-mode:screen;
  }
  @keyframes glowBreathe{
    0%,100%{transform:scale(1);opacity:.6}
    50%{transform:scale(1.08);opacity:.9}
  }
  @keyframes coronaBreathe{
    0%,100%{transform:scale(1);opacity:.7}
    50%{transform:scale(1.05);opacity:1}
  }

  .ball{
    position:absolute;
    inset:12%;
    background-image:url("assets/charged/Ultrafine_Particle_cool.png");
    background-size:contain;
    background-repeat:no-repeat;
    background-position:center;
    mix-blend-mode:screen;
    -webkit-mask-image:radial-gradient(ellipse 70% 70% at center, #000 55%, transparent 78%);
    mask-image:radial-gradient(ellipse 70% 70% at center, #000 55%, transparent 78%);
    animation:breathe 6s ease-in-out infinite;
    will-change:transform,opacity;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1);opacity:.94}
    50%{transform:scale(1.025);opacity:1}
  }

  .charge-layer{
    position:absolute;
    inset:0;
    will-change:transform;
  }
  canvas.charges{
    position:absolute;
    inset:0;
    width:100%;height:100%;
    pointer-events:none;
  }

  .corner{
    position:absolute;
    width:14px;height:14px;
    border:1px solid var(--line);
    z-index:3;
    pointer-events:none;
  }
  .corner.tl{top:24px;left:24px;border-right:none;border-bottom:none}
  .corner.tr{top:24px;right:24px;border-left:none;border-bottom:none}
  .corner.bl{bottom:24px;left:24px;border-right:none;border-top:none}
  .corner.br{bottom:24px;right:24px;border-left:none;border-top:none}

  @media (max-width:860px){
    .hero{min-height:auto;padding:96px 0 80px}
    .wrap{
      grid-template-columns:1fr;
      gap:48px;
      padding:0 24px;
    }
    .stage{order:-1;max-height:60vh;aspect-ratio:1/1;width:100%}
    .text{max-width:100%}
    .corner{display:none}
  }

  @media (prefers-reduced-motion: reduce){
    .glow,.corona,.ball,.scroll-line::after{animation:none !important}
  }
</style>
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<section class="hero" id="hero">

  <span class="corner tl"></span>
  <span class="corner tr"></span>
  <span class="corner bl"></span>
  <span class="corner br"></span>

  <div class="wrap">

    <div class="text">
      <div class="kicker">Ultrafine Particle</div>
      <h1 class="headline">Ultrafine particles carry a <em>charge</em></h1>
      <p class="body">The smallest pollutants of all — under 100 nanometres — slip past most filters. Even these carry an electric charge.</p>
      
      <div class="scroll-line" aria-hidden="true"></div>
    </div>

    <div class="stage">
      <div class="stage-inner">
        <div class="particle-layer" id="particleLayer">
          <div class="glow"></div>
          <div class="corona"></div>
          <div class="ball"></div>
        </div>
        <div class="charge-layer" id="chargeLayer">
          <canvas class="charges" id="charges"></canvas>
        </div>
      </div>
    </div>

  </div>

</section>

<script>
(function(){
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const canvas = document.getElementById("charges");
  const ctx = canvas.getContext("2d");
  const particleLayer = document.getElementById("particleLayer");
  const chargeLayer = document.getElementById("chargeLayer");
  const hero = document.getElementById("hero");

  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize(){
    const rect = chargeLayer.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }

  // ---- Charged field: field-line arcs curving outward from the particle perimeter ----
  let lines = [];
  let riders = []; // minus signs riding the outer ends of field lines

  function initField(){
    lines = [];
    riders = [];
    const R = Math.min(W, H);
    const cx = W / 2, cy = H / 2;
    const innerR = R * 0.30;   // particle surface radius
    const N = 7;               // 7 field lines

    for (let i = 0; i < N; i++){
      const baseAng = (i / N) * Math.PI * 2 + (Math.random() * 0.18 - 0.09);
      // curve direction: alternate clockwise / counter
      const curveDir = (i % 2 === 0) ? 1 : -1;
      const sweep = (0.55 + Math.random() * 0.35) * curveDir;
      const outAng = baseAng + sweep;
      const outR = innerR * (1.55 + Math.random() * 0.55);

      const sx = cx + Math.cos(baseAng) * innerR;
      const sy = cy + Math.sin(baseAng) * innerR;
      const ex = cx + Math.cos(outAng) * outR;
      const ey = cy + Math.sin(outAng) * outR;

      // control point pushed outward + sideways to make an arc
      const midAng = baseAng + sweep * 0.5;
      const midR = (innerR + outR) * 0.52 * (1.05 + Math.random() * 0.08);
      const cpx = cx + Math.cos(midAng) * midR;
      const cpy = cy + Math.sin(midAng) * midR;

      lines.push({
        sx, sy, ex, ey, cpx, cpy,
        baseAlpha: 0.16 + Math.random() * 0.06,
        phase: Math.random() * Math.PI * 2,
        shimmerSpeed: 0.00018 + Math.random() * 0.00012,
        shimmerPhase: Math.random() * Math.PI * 2,
        drift: (Math.random() < 0.5 ? 1 : -1) * (0.00003 + Math.random() * 0.00003),
        ang: baseAng,
        sweep, outR, innerR
      });
    }

    // 4–5 minus signs riding the OUTER ends of selected field lines
    const riderCount = 5;
    const chosen = [];
    while (chosen.length < riderCount && chosen.length < lines.length){
      const idx = Math.floor(Math.random() * lines.length);
      if (!chosen.includes(idx)) chosen.push(idx);
    }
    for (const idx of chosen){
      riders.push({
        lineIdx: idx,
        t: 0.74 + Math.random() * 0.18,      // position along curve (outer region)
        tVel: (Math.random() < 0.5 ? 1 : -1) * (0.000035 + Math.random() * 0.00003),
        tMin: 0.66, tMax: 0.96,
        size: 7.5 + Math.random() * 2.5,    // half-bar length
        stroke: 2.6,
        glow: 11,
        alpha: 0.82 + Math.random() * 0.1,
        phase: Math.random() * Math.PI * 2,
        flickerSpeed: 0.0004 + Math.random() * 0.0004,
        flickerDepth: 0.14
      });
    }
  }

  // quadratic bezier point + tangent
  function bez(line, t){
    const mt = 1 - t;
    const x = mt * mt * line.sx + 2 * mt * t * line.cpx + t * t * line.ex;
    const y = mt * mt * line.sy + 2 * mt * t * line.cpy + t * t * line.ey;
    // tangent
    const tx = 2 * mt * (line.cpx - line.sx) + 2 * t * (line.ex - line.cpx);
    const ty = 2 * mt * (line.cpy - line.sy) + 2 * t * (line.ey - line.cpy);
    return { x, y, tx, ty };
  }

  // Mouse parallax
  let mx = 0, my = 0;
  let px = 0, py = 0;

  function onMove(e){
    const r = hero.getBoundingClientRect();
    const nx = (e.clientX - r.left) / r.width;
    const ny = (e.clientY - r.top) / r.height;
    mx = (nx - 0.5) * 2;
    my = (ny - 0.5) * 2;
  }
  window.addEventListener("mousemove", onMove, {passive:true});

  let t0 = performance.now();
  function frame(now){
    const t = now - t0;

    px += (mx - px) * 0.045;
    py += (my - py) * 0.045;

    const pShiftX = px * 12;
    const pShiftY = py * 9;
    particleLayer.style.transform = `translate3d(${pShiftX}px, ${pShiftY}px, 0)`;

    const cShiftX = px * 26;
    const cShiftY = py * 20;
    chargeLayer.style.transform = `translate3d(${cShiftX}px, ${cShiftY}px, 0)`;

    ctx.clearRect(0, 0, W, H);

    // 1) FIELD LINES — faint cyan arcs curving outward, with a slow shimmer pulse travelling outward
    for (let i = 0; i < lines.length; i++){
      const L = lines[i];

      if (!reduce){
        L.shimmerPhase += L.shimmerSpeed * 16;
      }

      // base faint arc
      ctx.save();
      ctx.lineCap = "round";
      ctx.shadowColor = "rgba(52,225,255,0.9)";
      ctx.shadowBlur = 6;
      ctx.strokeStyle = `rgba(52,225,255,${L.baseAlpha})`;
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(L.sx, L.sy);
      ctx.quadraticCurveTo(L.cpx, L.cpy, L.ex, L.ey);
      ctx.stroke();
      ctx.restore();

      // shimmer: a bright pulse travelling outward along the line
      if (!reduce){
        const tt = ((t * L.shimmerSpeed) + L.shimmerPhase) % 1;
        const p = bez(L, tt);
        const pulseAlpha = 0.5 * Math.sin(tt * Math.PI); // fades at ends
        ctx.save();
        ctx.lineCap = "round";
        ctx.shadowColor = "rgba(52,225,255,1)";
        ctx.shadowBlur = 10;
        ctx.strokeStyle = `rgba(180,240,255,${Math.max(pulseAlpha, 0)})`;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        // short bright segment centred on p
        const seg = 0.04;
        const a = bez(L, Math.max(tt - seg, 0));
        const b = bez(L, Math.min(tt + seg, 1));
        ctx.moveTo(a.x, a.y);
        ctx.quadraticCurveTo(p.x, p.y, b.x, b.y);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 2) CHARGE SIGNS RIDE THE FIELD — small glowing "−" at outer ends of field lines
    for (let i = 0; i < riders.length; i++){
      const r = riders[i];
      const L = lines[r.lineIdx];

      if (!reduce){
        r.t += r.tVel;
        if (r.t > r.tMax) { r.t = r.tMax; r.tVel *= -1; }
        if (r.t < r.tMin) { r.t = r.tMin; r.tVel *= -1; }
      }

      const p = bez(L, r.t);

      let a;
      if (reduce){
        a = r.alpha * 0.85;
      } else {
        const f = 0.5 + 0.5 * Math.sin(t * r.flickerSpeed + r.phase);
        a = r.alpha * (1 - r.flickerDepth + r.flickerDepth * f);
      }

      drawMinus(p.x, p.y, r.size, a, r.stroke, r.glow);
    }

    requestAnimationFrame(frame);
  }

  function drawMinus(x, y, s, alpha, stroke, glow){
    const col = "52,225,255";
    ctx.save();
    ctx.translate(x, y);
    ctx.lineCap = "round";

    ctx.shadowColor = `rgba(${col},${Math.min(alpha, 1)})`;
    ctx.shadowBlur = glow;

    // cyan minus bar
    ctx.strokeStyle = `rgba(${col},${alpha})`;
    ctx.lineWidth = stroke;
    ctx.beginPath();
    ctx.moveTo(-s, 0);
    ctx.lineTo(s, 0);
    ctx.stroke();

    // bright white core for crispness
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.6})`;
    ctx.lineWidth = stroke * 0.34;
    ctx.beginPath();
    ctx.moveTo(-s * 0.72, 0);
    ctx.lineTo(s * 0.72, 0);
    ctx.stroke();

    ctx.restore();
  }

  function init(){
    resize();
    initField();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", () => {
    resize();
    initField();
  });

  init();
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultrafine Particle — NanoFlashing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#1f2327;
    --muted:#8a9095;
    --accent:#1b7bff;
    --red:#e23b3b;
    --hair:rgba(20,24,28,0.08);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Space Grotesk",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  body{
    min-height:100vh;
    overflow-x:hidden;
  }

  .hero{
    min-height:100vh;
    width:100%;
    display:grid;
    grid-template-columns:42fr 58fr;
    align-items:center;
    gap:clamp(32px,5vw,80px);
    padding:clamp(40px,7vw,96px) clamp(24px,6vw,96px);
    background:var(--bg);
  }

  /* faint paper grain — barely there */
  .hero::before{
    content:"";
    position:absolute;inset:0;
    background:
      radial-gradient(1200px 700px at 80% 30%, rgba(27,123,255,0.04), transparent 60%),
      radial-gradient(900px 600px at 10% 90%, rgba(20,24,28,0.025), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  .text{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    gap:28px;
    max-width:520px;
  }

  .kicker{
    font-family:"Space Mono",monospace;
    font-size:12px;
    letter-spacing:0.04em;
    color:var(--muted);
    font-weight:400;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .kicker::before{
    content:"";
    width:28px;height:1px;
    background:var(--muted);
    opacity:0.6;
  }

  .headline{
    font-family:"Instrument Serif",serif;
    font-weight:400;
    font-size:clamp(40px,6vw,84px);
    line-height:1.04;
    letter-spacing:-0.01em;
    color:var(--ink);
    max-width:9.5ch;
  }
  .headline em{
    color:var(--accent);
    font-style:italic;
    font-weight:400;
  }

  .body{
    font-family:"Space Grotesk",sans-serif;
    font-size:19px;
    line-height:1.55;
    color:var(--ink);
    max-width:440px;
    font-weight:400;
  }
  .body sup a{
    color:var(--accent);
    text-decoration:none;
    font-family:"Space Mono",monospace;
    font-size:11px;
    padding:0 1px;
  }
  .body sup a:hover{ text-decoration:underline; }

  .source{
    font-family:"Space Mono",monospace;
    font-size:11px;
    color:var(--muted);
    line-height:1.5;
    padding-top:4px;
  }
  .source a{
    color:var(--accent);
    text-decoration:none;
    border-bottom:1px solid rgba(27,123,255,0.25);
  }
  .source a:hover{ border-bottom-color:var(--accent); }

  .scroll-cue{
    margin-top:24px;
    display:flex;
    align-items:center;
    gap:14px;
    font-family:"Space Mono",monospace;
    font-size:11px;
    color:var(--muted);
  }
  .scroll-cue .line{
    position:relative;
    width:64px;
    height:1px;
    background:var(--hair);
    overflow:hidden;
  }
  .scroll-cue .line::after{
    content:"";
    position:absolute;
    top:0;left:-40%;
    width:40%;height:100%;
    background:var(--muted);
    animation:travel 2.6s ease-in-out infinite;
  }
  @keyframes travel{
    0%{ left:-40%; }
    60%{ left:100%; }
    100%{ left:100%; }
  }

  /* particle / video column */
  .media{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:60vh;
  }

  .video-frame{
    position:relative;
    width:min(560px,100%);
    aspect-ratio:1/1;
    filter:
      drop-shadow(0 30px 60px rgba(20,24,28,0.08))
      drop-shadow(0 8px 24px rgba(27,123,255,0.06));
  }

  video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    -webkit-mask-image:radial-gradient(circle at center, #000 60%, transparent 78%);
            mask-image:radial-gradient(circle at center, #000 60%, transparent 78%);
  }

  /* tiny corner registration marks — editorial, restrained */
  .reg{
    position:absolute;
    width:14px;height:14px;
    border:1px solid var(--hair);
  }
  .reg.tl{ top:-2px;left:-2px;border-right:none;border-bottom:none; }
  .reg.tr{ top:-2px;right:-2px;border-left:none;border-bottom:none; }
  .reg.bl{ bottom:-2px;left:-2px;border-right:none;border-top:none; }
  .reg.br{ bottom:-2px;right:-2px;border-left:none;border-top:none; }

  .caption{
    position:absolute;
    bottom:-28px;
    right:0;
    font-family:"Space Mono",monospace;
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.02em;
  }

  @media (max-width:860px){
    .hero{
      grid-template-columns:1fr;
      gap:24px;
      padding:48px 24px 64px;
      align-items:start;
    }
    .media{
      min-height:auto;
      order:1;
    }
    .video-frame{
      width:min(440px,92vw);
    }
    .text{
      order:2;
      max-width:100%;
      gap:22px;
    }
    .headline{ max-width:none; }
    .caption{ bottom:-22px; }
  }

  @media (prefers-reduced-motion: reduce){
    .scroll-cue .line::after{ animation:none; left:30%; }
    video{ }
  }
</style>
</head>
<body>
  <section class="hero">
    <div class="text">
      <span class="kicker">Ultrafine Particle</span>
      <h1 class="headline">Ultrafine particles carry a <em>charge</em></h1>
      <p class="body">The smallest pollutants of all — under 100 nanometres — slip past most filters. Even these carry an electric charge.</p>
      
      <div class="scroll-cue" aria-hidden="true">
        <span class="line"></span>
        <span>Scroll to continue</span>
      </div>
    </div>

    <div class="media">
      <div class="video-frame">
        <span class="reg tl"></span>
        <span class="reg tr"></span>
        <span class="reg bl"></span>
        <span class="reg br"></span>
        <video poster="assets/videos/posters/Ultrafine_Particle.jpg" src="assets/videos/Ultrafine_Particle_flashloop_c2.mp4" autoplay loop muted playsinline preload="auto"></video>
        <span class="caption">fig. 01 — charged specimen</span>
      </div>
    </div>
  </section>
</body>
</html>

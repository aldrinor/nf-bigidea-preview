<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<title>Wildfire Smoke — Editorial Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#1f2327;
    --muted:#828a90;
    --faint:#aab2b8;
    --hair:rgba(20,24,28,0.12);
    --red:#e23b3b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Space Grotesk',sans-serif;}
  body{padding:36px 40px 48px;}
  .masthead{
    max-width:1180px;margin:0 auto 28px;
    border-top:2px solid var(--ink);
    padding-top:14px;
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:'Space Mono',monospace;font-size:10.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  }
  .masthead .brand{color:var(--ink);font-weight:700;letter-spacing:.18em;}
  .deck{max-width:1180px;margin:0 auto 24px;}
  .deck h1{font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:26px;margin:0 0 6px;letter-spacing:-0.01em;}
  .deck p{font-family:'Space Mono',monospace;font-size:10.5px;
    letter-spacing:.10em;text-transform:uppercase;color:var(--muted);margin:0;}
  .grid{
    max-width:1180px;margin:0 auto;
    display:grid;grid-template-columns:1fr 1fr;gap:28px;
  }
  .cell{
    background:transparent;
    padding:0;
  }
  .cell .label{
    font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    margin:0 0 4px;display:flex;justify-content:space-between;
    border-bottom:1px solid var(--hair);padding-bottom:8px;
  }
  .cell .label .tag{color:var(--red);font-weight:700;}
  .cell h2{
    font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:18px;margin:0 0 14px;letter-spacing:-0.005em;
    line-height:1.2;
  }
  .cell svg{display:block;width:100%;height:auto;}
  .cell .source{
    font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    margin:6px 0 0;
  }
</style>
</head>
<style>
 html,body{margin:0;padding:0;height:100%;background:#edf0f2;display:flex;align-items:center;justify-content:center;}
 .cell{max-width:96%;width:620px;}
 .cell h2{font-size:18px;}
 svg{width:100%;height:auto;}
</style>
<body><div class="cell">
    <div class="label"><span>FIG. 01 · MORTALITY-CLIMB</span><span class="tag">▲ TREND</span></div>
    <h2>Annual U.S. deaths attributable to wildfire-smoke PM₂.₅</h2>
    <svg viewBox="0 0 560 360" role="img" aria-label="Cumulative mortality line chart">
      <!-- defs -->
      <defs>
        <pattern id="projdash" patternUnits="userSpaceOnUse" width="6" height="2">
          <rect width="3" height="2" fill="#aab2b8"/>
        </pattern>
      </defs>
      <style>
        .mono{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.10em;text-transform:uppercase;fill:#828a90;}
        .mono-ink{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.10em;text-transform:uppercase;fill:#1f2327;}
        .gnum{font-family:'Space Grotesk',sans-serif;font-size:11px;fill:#828a90;}
        .red{fill:#e23b3b;}
        .ink{fill:#1f2327;}
      </style>

      <!-- faint gridlines -->
      <g stroke="rgba(20,24,28,0.08)" stroke-width="1">
        <line x1="60" y1="62"  x2="525" y2="62"/>
        <line x1="60" y1="124" x2="525" y2="124"/>
        <line x1="60" y1="186" x2="525" y2="186"/>
        <line x1="60" y1="248" x2="525" y2="248"/>
      </g>
      <!-- y-axis labels -->
      <g class="mono" text-anchor="end">
        <text x="52" y="294">30k</text>
        <text x="52" y="252">40k</text>
        <text x="52" y="190">50k</text>
        <text x="52" y="128">60k</text>
        <text x="52" y="66">70k</text>
      </g>
      <!-- baseline -->
      <line x1="60" y1="290" x2="525" y2="290" stroke="#1f2327" stroke-width="1"/>

      <!-- x ticks -->
      <g class="mono" text-anchor="middle">
        <text x="60"  y="312">2015</text>
        <text x="191" y="312">2025</text>
        <text x="323" y="312">2035</text>
        <text x="454" y="312">2045</text>
        <text x="525" y="312">2050</text>
      </g>
      <!-- minor ticks -->
      <g stroke="#1f2327" stroke-width="1">
        <line x1="60"  y1="290" x2="60"  y2="294"/>
        <line x1="191" y1="290" x2="191" y2="294"/>
        <line x1="323" y1="290" x2="323" y2="294"/>
        <line x1="454" y1="290" x2="454" y2="294"/>
        <line x1="525" y1="290" x2="525" y2="294"/>
      </g>

      <!-- Observed segment (2015-2025): 38000 -> 41000 -> 43000 -->
      <!-- 2015: x60 y246 ; 2020: x125.7 y229 ; 2025: x191 y218 -->
      <polyline fill="none" stroke="#1f2327" stroke-width="2"
        points="60,246 126,229 191,218"/>

      <!-- Projected segment (2025-2050) DASHED -->
      <!-- 2025: 191,218 ; 2035: 323,151 ; 2050: 525,62 -->
      <polyline fill="none" stroke="#aab2b8" stroke-width="2" stroke-dasharray="5 4"
        points="191,218 323,151 525,62"/>

      <!-- 2020 marker + label -->
      <circle cx="126" cy="229" r="3" fill="#1f2327"/>
      <g>
        <line x1="126" y1="229" x2="126" y2="190" stroke="rgba(20,24,28,0.35)" stroke-width="1"/>
        <text class="mono-ink" x="132" y="186">41,000 / YR</text>
        <text class="mono" x="132" y="200">2011–2020 avg</text>
      </g>

      <!-- 2025 split marker -->
      <circle cx="191" cy="218" r="3" fill="#1f2327"/>
      <text class="mono" x="191" y="206" text-anchor="middle">projected →</text>

      <!-- 2050 RED endpoint -->
      <circle cx="525" cy="62" r="5" fill="#e23b3b"/>
      <circle cx="525" cy="62" r="9" fill="none" stroke="#e23b3b" stroke-width="1" opacity="0.35"/>
      <g>
        <text class="mono-ink" x="519" y="48" text-anchor="end" style="fill:#e23b3b;font-weight:700;">71,000 / YR</text>
        <text class="mono" x="519" y="60" text-anchor="end">by 2050</text>
      </g>

      <!-- 2035 tick -->
      <circle cx="323" cy="151" r="2.5" fill="#aab2b8"/>
      <text class="mono" x="323" y="143" text-anchor="middle">~55,000</text>

      <!-- Callout block -->
      <g transform="translate(258,330)">
        <rect x="0" y="0" width="262" height="22" fill="#1f2327"/>
        <text x="10" y="14.5" style="font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;fill:#edf0f2;">~1.9M cumulative deaths · 2026–2055</text>
      </g>
    </svg>
    <p class="source">Source: Qiu et al., Nature, 2025</p>
  </div></body></html>

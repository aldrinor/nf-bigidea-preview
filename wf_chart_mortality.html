<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wildfire Smoke — Editorial Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#1f2327;
    --muted:#828a90;
    --faint:#aab2b8;
    --hair:rgba(20,24,28,0.12);
    --red:#e23b3b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);
    color:var(--ink);font-family:'Space Grotesk',sans-serif;
    display:flex;align-items:center;justify-content:center;}
  body{padding:36px 40px 48px;}
  .cell{width:100%;max-width:620px;padding:0 12px;}
  .cell .label{
    font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    margin:0 0 4px;display:flex;justify-content:space-between;
    border-bottom:1px solid var(--hair);padding-bottom:8px;
  }
  .cell .label .tag{color:var(--red);font-weight:700;}
  .cell h2{
    font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:18px;margin:0 0 14px;letter-spacing:-0.005em;
    line-height:1.2;
  }
  .cell svg{display:block;width:100%;height:auto;}
  .cell .source{
    font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    margin:10px 0 0;
  }
</style>
</head>
<body>
<div class="cell">
  <div class="label"><span>FIG. 02 · MORTALITY CLIMB</span><span class="tag">▲ TREND</span></div>
  <h2>Annual U.S. deaths attributable to wildfire-smoke PM₂.₅</h2>
  <svg viewBox="0 0 600 360" role="img" aria-label="Annual mortality line chart, observed 2015-2025 and projected to 2050">
    <defs>
      <style>
        .mono{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.10em;text-transform:uppercase;fill:#828a90;}
        .mono-ink{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.10em;text-transform:uppercase;fill:#1f2327;}
        .mono-bold{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.10em;text-transform:uppercase;fill:#1f2327;font-weight:700;}
        .red-bold{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.10em;text-transform:uppercase;fill:#e23b3b;font-weight:700;}
      </style>
    </defs>

    <!-- faint gridlines (40k / 50k / 60k / 70k) -->
    <g stroke="rgba(20,24,28,0.08)" stroke-width="1">
      <line x1="66" y1="285.5" x2="556" y2="285.5"/>
      <line x1="66" y1="213.5" x2="556" y2="213.5"/>
      <line x1="66" y1="141" x2="556" y2="141"/>
      <line x1="66" y1="68.5" x2="556" y2="68.5"/>
    </g>

    <!-- y-axis labels -->
    <g class="mono" text-anchor="end">
      <text x="58" y="289">40k</text>
      <text x="58" y="217">50k</text>
      <text x="58" y="144.5">60k</text>
      <text x="58" y="72">70k</text>
    </g>

    <!-- axis-break indicator at origin (38k floor) -->
    <g stroke="#1f2327" stroke-width="1" fill="none">
      <polyline points="60,294 64,298 68,294 72,298"/>
    </g>
    <text class="mono" x="58" y="306" text-anchor="end" style="font-size:8.5px;letter-spacing:.06em;">≈38k</text>

    <!-- baseline -->
    <line x1="66" y1="300" x2="556" y2="300" stroke="#1f2327" stroke-width="1"/>

    <!-- x ticks -->
    <g class="mono" text-anchor="middle">
      <text x="66" y="316">2015</text>
      <text x="206" y="316">2025</text>
      <text x="346" y="316">2035</text>
      <text x="486" y="316">2045</text>
      <text x="556" y="316">2050</text>
    </g>
    <g stroke="#1f2327" stroke-width="1">
      <line x1="66" y1="300" x2="66" y2="304"/>
      <line x1="206" y1="300" x2="206" y2="304"/>
      <line x1="346" y1="300" x2="346" y2="304"/>
      <line x1="486" y1="300" x2="486" y2="304"/>
      <line x1="556" y1="300" x2="556" y2="304"/>
    </g>

    <!-- vertical divider at 2025 (observed | projected) -->
    <line x1="206" y1="60" x2="206" y2="300" stroke="rgba(20,24,28,0.22)" stroke-width="1" stroke-dasharray="2 3"/>
    <text class="mono" x="212" y="72" text-anchor="start">projected →</text>
    <text class="mono" x="200" y="72" text-anchor="end">← observed</text>

    <!-- Observed segment (2015-2025): solid -->
    <polyline fill="none" stroke="#1f2327" stroke-width="2.25"
      points="66,293 136,278.5 206,264"/>

    <!-- Projected segment (2025-2050) DASHED -->
    <polyline fill="none" stroke="#1f2327" stroke-width="2.25" stroke-dasharray="6 4"
      points="206,264 346,177 556,61"/>

    <!-- 2020 marker + standardized annotation -->
    <circle cx="136" cy="278.5" r="3" fill="#1f2327"/>
    <line x1="136" y1="278.5" x2="150" y2="252" stroke="rgba(20,24,28,0.40)" stroke-width="1"/>
    <text class="mono-bold" x="155" y="248">41,000 / YR</text>
    <text class="mono" x="155" y="261">2011–2020 avg</text>

    <!-- 2025 split marker: OPEN circle -->
    <circle cx="206" cy="264" r="4" fill="#edf0f2" stroke="#1f2327" stroke-width="2"/>

    <!-- 2035 waypoint tick (no annotation, keeps the climb legible) -->
    <circle cx="346" cy="177" r="2.5" fill="#1f2327"/>

    <!-- 2050 RED endpoint: small solid red dot, NO halo ring -->
    <circle cx="556" cy="61" r="4" fill="#e23b3b"/>
    <line x1="556" y1="61" x2="540" y2="42" stroke="rgba(20,24,28,0.40)" stroke-width="1"/>
    <text class="red-bold" x="535" y="38" text-anchor="end">71,000 / YR</text>
    <text class="mono" x="535" y="51" text-anchor="end">by 2050</text>

    <!-- Footer metadata: 1.9M cumulative deaths (plain typeset, no fill block) -->
    <text class="mono" x="66" y="340" text-anchor="start">1.9M cumulative deaths · 2026–2055</text>
  </svg>
  <p class="source">Source: Qiu et al., Nature, 2025</p>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Narrative</title>
<style>
  :root{
    --screenH: 100vh;
  }
  html,body{
    margin:0; padding:0; height:100%;
    background:#edf0f2;
    overflow:hidden;
    overscroll-behavior:none;
  }
  .deck{
    position:relative;
    width:100%;
    transform: translateY(calc(-1 * 0 * var(--screenH)));
    will-change: transform;
  }
  .deck.smooth{
    transition: transform 700ms cubic-bezier(.7,0,.2,1);
  }
  .screen{
    height: var(--screenH);
    width:100%;
    overflow:hidden;
  }
  .screen iframe{
    width:100%; height:100%;
    border:0; display:block;
    allow:"autoplay";
  }
  #cue{
    position:fixed;
    bottom:26px; left:50%;
    transform: translateX(-50%);
    z-index:5;
    pointer-events:auto;
    cursor:pointer;
    opacity:1;
    transition: opacity .4s ease;
    background:transparent;
    border:0;
    padding:8px;
    display:block;
  }
  #cue.hidden{ opacity:0; pointer-events:none; }
  #cue svg{
    display:block;
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(6px); }
  }
  @media (prefers-reduced-motion: reduce){
    .deck.smooth{ transition: none; }
    #cue svg{ animation: none; }
  }
</style>
</head>
<body>
  <div class="deck" id="deck">
    <section class="screen"><iframe id="f0" src="home_hero.html" allow="autoplay"></iframe></section>
    <section class="screen"><iframe id="f1" src="act1.html?c3" allow="autoplay"></iframe></section>
    <section class="screen"><iframe id="f2" src="frame2.html?c2" allow="autoplay"></iframe></section>
  </div>
  <button id="cue" aria-label="Continue">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <path d="M5 9 L13 17 L21 9" stroke="#5a6066" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

<script>
(function(){
  const deck = document.getElementById('deck');
  const f0 = document.getElementById('f0');
  const f1 = document.getElementById('f1');
  const f2 = document.getElementById('f2');
  const cue = document.getElementById('cue');

  let idx = 0;
  let locked = false;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- reveal progress p for hero<->act1 transition ----
  let pCurrent = 0;
  let pFrom = 0, pTo = 0, pStart = 0, pRAF = 0;
  const P_DUR = 700;

  function postReveal(){
    try{ f1.contentWindow.postMessage({type:'nf-reveal', p: pCurrent}, '*'); }catch(e){}
  }

  function pAnimLoop(t){
    const elapsed = t - pStart;
    const k = Math.min(1, elapsed / P_DUR);
    const e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
    pCurrent = pFrom + (pTo - pFrom) * e;
    postReveal();
    if (k < 1) {
      pRAF = requestAnimationFrame(pAnimLoop);
    } else {
      pCurrent = pTo;
      postReveal();
      pRAF = 0;
    }
  }

  function setPTarget(target){
    if (reduceMotion) {
      pCurrent = target;
      postReveal();
      return;
    }
    pFrom = pCurrent;
    pTo = target;
    pStart = performance.now();
    if (!pRAF) pRAF = requestAnimationFrame(pAnimLoop);
  }

  function setScreenH(){
    const h = window.innerHeight;
    document.documentElement.style.setProperty('--screenH', h + 'px');
    // re-apply transform with new height immediately (no transition drift)
    deck.classList.remove('smooth');
    deck.style.transform = 'translateY(calc(-1 * ' + idx + ' * var(--screenH)))';
    // re-enable smooth on next frame
    requestAnimationFrame(function(){
      if(!reduceMotion) deck.classList.add('smooth');
    });
  }
  setScreenH();
  window.addEventListener('resize', setScreenH);
  window.addEventListener('orientationchange', setScreenH);

  function applyTransform(){
    if(reduceMotion){
      deck.classList.remove('smooth');
    } else {
      deck.classList.add('smooth');
    }
    deck.style.transform = 'translateY(calc(-1 * ' + idx + ' * var(--screenH)))';
  }

  function goTo(i){
    if(i < 0) i = 0;
    if(i > 2) i = 2;
    if(i === idx) return;
    idx = i;
    applyTransform();
    locked = true;
    window.setTimeout(function(){ locked = false; }, 760);
    updateCue();
    setPTarget(idx === 0 ? 0 : 1);
    if(idx === 2){
      try{ f2.contentWindow.postMessage({type:'nf-play'}, '*'); }catch(e){}
    }
  }

  function updateCue(){
    if(idx === 0) cue.classList.remove('hidden');
    else cue.classList.add('hidden');
  }

  // ---- Wheel ----
  function wheelHandler(e){
    if(locked) return;
    // Frame-1 detail-active guard: only meaningful when event originates from f1
    // We detect via e.target's ownerDocument defaultView === f1.contentWindow
    let fromF1 = false;
    try{
      const t = e.target;
      const doc = t && t.ownerDocument;
      const win = doc && doc.defaultView;
      if(win === f1.contentWindow){
        fromF1 = true;
        if(doc.body && doc.body.classList.contains('detail-active')){
          return; // let the iframe handle scrolling
        }
      }
    }catch(err){}

    if(e.deltaY > 18){ e.preventDefault(); goTo(idx + 1); }
    else if(e.deltaY < -18){ e.preventDefault(); goTo(idx - 1); }
  }

  // ---- Touch ----
  let touchStartY = null;
  function onTouchStart(e){
    const t = e.touches ? e.touches[0] : e;
    touchStartY = t.clientY;
  }
  function onTouchEnd(e){
    if(touchStartY == null) return;
    const t = e.changedTouches ? e.changedTouches[0] : e;
    const endY = t.clientY;
    const dy = touchStartY - endY;
    touchStartY = null;
    if(locked) return;

    // Frame-1 guard
    let fromF1 = false;
    try{
      const doc = e.target && e.target.ownerDocument;
      const win = doc && doc.defaultView;
      if(win === f1.contentWindow){
        fromF1 = true;
        if(doc.body && doc.body.classList.contains('detail-active')){
          return;
        }
      }
    }catch(err){}

    if(dy > 45){ goTo(idx + 1); }
    else if(dy < -45){ goTo(idx - 1); }
  }

  // Wrapper-level listeners
  window.addEventListener('wheel', wheelHandler, {passive:false});
  window.addEventListener('touchstart', onTouchStart, {passive:true});
  window.addEventListener('touchend', onTouchEnd, {passive:true});

  // Keyboard
  window.addEventListener('keydown', function(e){
    if(locked) return;
    const k = e.key;
    if(k === 'ArrowDown' || k === 'PageDown'){ e.preventDefault(); goTo(idx + 1); }
    else if(k === 'ArrowUp' || k === 'PageUp'){ e.preventDefault(); goTo(idx - 1); }
  });

  // Cue click
  cue.addEventListener('click', function(){ goTo(1); });

  // Attach inside iframes once loaded
  function attachIframe(iframe){
    let win;
    try{ win = iframe.contentWindow; }catch(e){ return; }
    if(!win) return;
    try{
      win.addEventListener('wheel', wheelHandler, {passive:false});
      win.addEventListener('touchstart', onTouchStart, {passive:true});
      win.addEventListener('touchend', onTouchEnd, {passive:true});
    }catch(e){}
  }

  function onIframeLoad(iframe){
    attachIframe(iframe);
  }

  f0.addEventListener('load', function(){ onIframeLoad(f0); });
  f1.addEventListener('load', function(){ onIframeLoad(f1); postReveal(); });
  f2.addEventListener('load', function(){ onIframeLoad(f2); });

  // Also try attaching immediately in case load already fired / cached
  try{ if(f0.contentDocument && f0.contentDocument.readyState === 'complete') attachIframe(f0); }catch(e){}
  try{ if(f1.contentDocument && f1.contentDocument.readyState === 'complete'){ attachIframe(f1); postReveal(); } }catch(e){}
  try{ if(f2.contentDocument && f2.contentDocument.readyState === 'complete') attachIframe(f2); }catch(e){}

  // Initial state
  updateCue();
  if(!reduceMotion) deck.classList.add('smooth');
})();
</script>
</body>
</html>

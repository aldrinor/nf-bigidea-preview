<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Narrative</title>
<style>
  html,body{
    margin:0; padding:0; height:100%;
    background:#edf0f2;
    overflow:hidden;
    overscroll-behavior:none;
  }
  .screen{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    will-change:opacity;
  }
  .screen iframe{
    width:100%; height:100%;
    border:0; display:block;
  }
  #cue{
    position:fixed;
    bottom:26px; left:50%;
    transform: translateX(-50%);
    z-index:10;
    pointer-events:auto;
    cursor:pointer;
    opacity:1;
    transition: opacity .4s ease;
    background:transparent;
    border:0;
    padding:8px;
    display:block;
  }
  #cue.hidden{ opacity:0; pointer-events:none; }
  #cue svg{
    display:block;
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(6px); }
  }
  @media (prefers-reduced-motion: reduce){
    #cue svg{ animation: none; }
  }
</style>
</head>
<body>
  <div class="screen" id="s0" style="z-index:3;opacity:1;pointer-events:auto;">
    <iframe id="f0" src="home_hero.html" allow="autoplay"></iframe>
  </div>
  <div class="screen" id="s1" style="z-index:2;opacity:1;pointer-events:none;">
    <iframe id="f1" allow="autoplay"></iframe>
  </div>
  <div class="screen" id="s2" style="z-index:1;opacity:0;pointer-events:none;">
    <iframe id="f2" src="frame2.html?c2" allow="autoplay"></iframe>
  </div>
  <button id="cue" aria-label="Continue">
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
      <path d="M5 9 L13 17 L21 9" stroke="#5a6066" stroke-width="1.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

<script>
(function(){
  const s0 = document.getElementById('s0');
  const s1 = document.getElementById('s1');
  const s2 = document.getElementById('s2');
  const f0 = document.getElementById('f0');
  const f1 = document.getElementById('f1');
  const f2 = document.getElementById('f2');
  const cue = document.getElementById('cue');

  let idx = 0;
  let locked = false;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Freeze hook (?freeze=0..1) ----
  const freezeParam = new URLSearchParams(location.search).get('freeze');
  const frozen = freezeParam !== null;
  const freezeQ = frozen ? Math.max(0, Math.min(1, parseFloat(freezeParam) || 0)) : 0;

  // Set act1 iframe src (include reveal param when frozen for instant exact state)
  f1.src = frozen
    ? 'act1.html?c3&reveal=' + freezeQ
    : 'act1.html?c3';

  // ---- Transition state ----
  let transFrom = 0, transTo = 0;
  let animStart = 0, animRAF = 0;
  const DUR = 800;

  function easeInOut(k){
    return k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k+2, 2)/2;
  }

  function applyState(from, to, q){
    var heroOp, act1Op, act1Rev, frame2Op;

    if(from === to){
      if(from === 0){ heroOp=1; act1Op=1; act1Rev=0; frame2Op=0; }
      else if(from === 1){ heroOp=0; act1Op=1; act1Rev=1; frame2Op=0; }
      else { heroOp=0; act1Op=0; act1Rev=1; frame2Op=1; }
    } else if(from === 0 && to === 1){
      heroOp = 1 - q; act1Op = 1; act1Rev = q; frame2Op = 0;
    } else if(from === 1 && to === 0){
      heroOp = q; act1Op = 1; act1Rev = 1 - q; frame2Op = 0;
    } else if(from === 1 && to === 2){
      heroOp = 0; act1Op = 1 - q; act1Rev = 1; frame2Op = q;
    } else if(from === 2 && to === 1){
      heroOp = 0; act1Op = q; act1Rev = 1; frame2Op = 1 - q;
    } else {
      heroOp = from === 0 ? 1 : 0;
      act1Op = from === 1 ? 1 : 0;
      act1Rev = from >= 1 ? 1 : 0;
      frame2Op = from === 2 ? 1 : 0;
    }

    s0.style.opacity = heroOp;
    s1.style.opacity = act1Op;
    s2.style.opacity = frame2Op;

    // Pointer events: target screen receives input
    s0.style.pointerEvents = (to === 0) ? 'auto' : 'none';
    s1.style.pointerEvents = (to === 1) ? 'auto' : 'none';
    s2.style.pointerEvents = (to === 2) ? 'auto' : 'none';

    try{ f1.contentWindow.postMessage({type:'nf-reveal', p: act1Rev}, '*'); }catch(e){}
  }

  function animLoop(t){
    var elapsed = t - animStart;
    var k = Math.min(1, elapsed / DUR);
    var e = easeInOut(k);
    applyState(transFrom, transTo, e);
    if(k < 1){
      animRAF = requestAnimationFrame(animLoop);
    } else {
      applyState(transFrom, transTo, 1);
      animRAF = 0;
      idx = transTo;
      transFrom = transTo;
      locked = false;
      updateCue();
      if(idx === 2){
        try{ f2.contentWindow.postMessage({type:'nf-play'}, '*'); }catch(e){}
      }
    }
  }

  function goTo(target){
    if(frozen) return;
    if(target < 0) target = 0;
    if(target > 2) target = 2;
    if(locked) return;
    if(target === idx) return;

    transFrom = idx;
    transTo = target;

    if(reduceMotion){
      applyState(transFrom, transTo, 1);
      idx = transTo;
      transFrom = transTo;
      updateCue();
      if(idx === 2){
        try{ f2.contentWindow.postMessage({type:'nf-play'}, '*'); }catch(e){}
      }
      return;
    }

    animStart = performance.now();
    locked = true;
    animRAF = requestAnimationFrame(animLoop);
  }

  function updateCue(){
    if(idx === 0) cue.classList.remove('hidden');
    else cue.classList.add('hidden');
  }

  // ---- Wheel ----
  function wheelHandler(e){
    if(locked || frozen) return;

    try{
      var t = e.target;
      var doc = t && t.ownerDocument;
      var win = doc && doc.defaultView;
      if(win === f1.contentWindow){
        if(doc.body && doc.body.classList.contains('detail-active')){
          return;
        }
      }
    }catch(err){}

    if(e.deltaY > 18){ e.preventDefault(); goTo(idx + 1); }
    else if(e.deltaY < -18){ e.preventDefault(); goTo(idx - 1); }
  }

  // ---- Touch ----
  var touchStartY = null;
  function onTouchStart(e){
    var t = e.touches ? e.touches[0] : e;
    touchStartY = t.clientY;
  }
  function onTouchEnd(e){
    if(touchStartY == null) return;
    var t = e.changedTouches ? e.changedTouches[0] : e;
    var endY = t.clientY;
    var dy = touchStartY - endY;
    touchStartY = null;
    if(locked || frozen) return;

    try{
      var doc = e.target && e.target.ownerDocument;
      var win = doc && doc.defaultView;
      if(win === f1.contentWindow){
        if(doc.body && doc.body.classList.contains('detail-active')){
          return;
        }
      }
    }catch(err){}

    if(dy > 45){ goTo(idx + 1); }
    else if(dy < -45){ goTo(idx - 1); }
  }

  window.addEventListener('wheel', wheelHandler, {passive:false});
  window.addEventListener('touchstart', onTouchStart, {passive:true});
  window.addEventListener('touchend', onTouchEnd, {passive:true});

  window.addEventListener('keydown', function(e){
    if(locked || frozen) return;
    var k = e.key;
    if(k === 'ArrowDown' || k === 'PageDown'){ e.preventDefault(); goTo(idx + 1); }
    else if(k === 'ArrowUp' || k === 'PageUp'){ e.preventDefault(); goTo(idx - 1); }
  });

  cue.addEventListener('click', function(){ if(!frozen) goTo(1); });

  function attachIframe(iframe){
    var win;
    try{ win = iframe.contentWindow; }catch(e){ return; }
    if(!win) return;
    try{
      win.addEventListener('wheel', wheelHandler, {passive:false});
      win.addEventListener('touchstart', onTouchStart, {passive:true});
      win.addEventListener('touchend', onTouchEnd, {passive:true});
    }catch(e){}
  }

  f0.addEventListener('load', function(){ attachIframe(f0); });
  f1.addEventListener('load', function(){
    attachIframe(f1);
    if(frozen){
      applyState(0, 1, freezeQ);
    } else {
      try{ f1.contentWindow.postMessage({type:'nf-reveal', p: 0}, '*'); }catch(e){}
    }
  });
  f2.addEventListener('load', function(){ attachIframe(f2); });

  try{ if(f0.contentDocument && f0.contentDocument.readyState === 'complete') attachIframe(f0); }catch(e){}
  try{ if(f1.contentDocument && f1.contentDocument.readyState === 'complete') attachIframe(f1); }catch(e){}
  try{ if(f2.contentDocument && f2.contentDocument.readyState === 'complete') attachIframe(f2); }catch(e){}

  // ---- Initial state ----
  if(frozen){
    transFrom = 0;
    transTo = 1;
    applyState(0, 1, freezeQ);
    if(freezeQ >= 1){ idx = 1; }
    updateCue();
  } else {
    applyState(0, 0, 0);
    updateCue();
  }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NanoFlashing — Transition Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#1a1d21;
    --muted:#7a828a;
    --accent:#1466e6;
    --hair:rgba(26,29,33,0.10);
    --pill-bg:rgba(255,255,255,0.72);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:'Space Mono',monospace;-webkit-font-smoothing:antialiased}

  .stage{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
  .stage iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}

  .topbar{
    position:fixed;top:18px;left:20px;z-index:20;
    font-size:12px;letter-spacing:0.02em;color:var(--muted);
    line-height:1.4;max-width:60vw;
    text-shadow:0 1px 0 rgba(255,255,255,0.6);
    pointer-events:none;
  }
  .topbar b{color:var(--ink);font-weight:700}

  .controls{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    z-index:30;
    display:flex;align-items:center;gap:8px;
    padding:6px;border-radius:999px;
    background:var(--pill-bg);
    backdrop-filter:saturate(140%) blur(14px);
    -webkit-backdrop-filter:saturate(140%) blur(14px);
    border:1px solid var(--hair);
    box-shadow:0 8px 30px rgba(26,29,33,0.10), 0 1px 0 rgba(255,255,255,0.5) inset;
    max-width:calc(100vw - 24px);
  }
  .pills{
    display:flex;align-items:center;gap:4px;
    overflow-x:auto;scrollbar-width:none;
  }
  .pills::-webkit-scrollbar{display:none}

  .pill{
    appearance:none;border:0;cursor:pointer;
    font-family:inherit;font-size:13px;line-height:1;
    color:var(--ink);
    padding:9px 14px;border-radius:999px;
    background:transparent;
    border:1px solid transparent;
    white-space:nowrap;
    transition:background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
    display:inline-flex;align-items:center;gap:8px;
  }
  .pill:hover{background:rgba(26,29,33,0.05)}
  .pill .num{font-size:11px;color:var(--muted);font-weight:400}
  .pill[aria-pressed="true"]{
    background:var(--accent);color:#fff;
    box-shadow:0 2px 8px rgba(20,102,230,0.35);
  }
  .pill[aria-pressed="true"] .num{color:rgba(255,255,255,0.7)}

  .index{
    font-size:12px;color:var(--muted);
    padding:0 10px 0 6px;
    border-left:1px solid var(--hair);
    margin-left:4px;
    white-space:nowrap;
  }
  .index b{color:var(--ink);font-weight:700}

  .hint{
    position:fixed;right:20px;bottom:26px;z-index:20;
    font-size:11px;color:var(--muted);
    text-shadow:0 1px 0 rgba(255,255,255,0.6);
    pointer-events:none;
  }
  .hint kbd{
    font-family:inherit;font-size:10px;
    padding:2px 5px;border-radius:4px;
    background:rgba(255,255,255,0.7);
    border:1px solid var(--hair);
    color:var(--ink);
  }

  @media (max-width:680px){
    .topbar{font-size:11px;top:14px;left:14px}
    .controls{bottom:14px;gap:4px;padding:5px;border-radius:18px}
    .pill{padding:8px 11px;font-size:12px}
    .hint{display:none}
    .index{padding:0 8px 0 6px}
  }
</style>
</head>
<body>

<div class="stage">
  <iframe id="stage" src="trans_inversion.html" title="Transition study" allow="autoplay; fullscreen"></iframe>
</div>

<div class="topbar">
  <b>NanoFlashing</b> — hero → big idea · transition studies
</div>

<nav class="controls" aria-label="Transition study chooser">
  <div class="pills" id="pills">
    <button class="pill" data-i="0" data-src="trans_inversion.html" aria-pressed="true">
      <span class="num">01</span>Charge Inversion
    </button>
    <button class="pill" data-i="1" data-src="trans_iris.html" aria-pressed="false">
      <span class="num">02</span>Aperture Iris
    </button>
    <button class="pill" data-i="2" data-src="trans_collapse.html" aria-pressed="false">
      <span class="num">03</span>Polarity Collapse
    </button>
    <button class="pill" data-i="3" data-src="trans_pullthrough.html" aria-pressed="false">
      <span class="num">04</span>Magnetic Pull-Through
    </button>
  </div>
  <div class="index"><b id="cur">1</b>/<span id="tot">4</span></div>
</nav>

<div class="hint">
  <kbd>←</kbd> <kbd>→</kbd> or <kbd>1</kbd>–<kbd>4</kbd>
</div>

<script>
  (function(){
    const stage = document.getElementById('stage');
    const pills = Array.from(document.querySelectorAll('.pill'));
    const cur = document.getElementById('cur');
    let active = 0;

    function select(i){
      if(i<0) i = pills.length-1;
      if(i>=pills.length) i = 0;
      active = i;
      pills.forEach((p,idx)=>{
        const on = idx===i;
        p.setAttribute('aria-pressed', on ? 'true' : 'false');
        if(on){
          // scroll into view on mobile
          p.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
        }
      });
      const src = pills[i].dataset.src;
      if(stage.getAttribute('src') !== src){
        stage.setAttribute('src', src);
      }
      cur.textContent = String(i+1);
    }

    pills.forEach((p,idx)=>{
      p.addEventListener('click', ()=>select(idx));
    });

    window.addEventListener('keydown', (e)=>{
      if(e.metaKey||e.ctrlKey||e.altKey) return;
      const k = e.key;
      if(k==='ArrowRight'){ e.preventDefault(); select(active+1); }
      else if(k==='ArrowLeft'){ e.preventDefault(); select(active-1); }
      else if(k>='1' && k<='4'){
        const idx = parseInt(k,10)-1;
        if(idx>=0 && idx<pills.length){ e.preventDefault(); select(idx); }
      }
    });

    // initial sync
    select(0);
  })();
</script>
</body>
</html>

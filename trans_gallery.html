<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NanoFlashing — Transition Studies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#0b0d10;
    --muted:#6b7480;
    --accent:#1466e6;
    --pill-bg:rgba(255,255,255,.72);
    --pill-bd:rgba(11,13,16,.10);
    --pill-bd-active:rgba(20,102,230,.0);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:'Space Mono',ui-monospace,monospace;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;}
  body{position:relative}

  /* iframe fills screen */
  #stage{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:var(--bg)}

  /* top-left label */
  .meta{
    position:fixed;top:18px;left:20px;z-index:20;
    font-size:11px;line-height:1.5;color:var(--muted);
    letter-spacing:.02em;max-width:60vw;
    text-shadow:0 0 1px rgba(255,255,255,.6);
    pointer-events:none;
  }
  .meta b{font-weight:700;color:#3a424c}

  /* control bar */
  .bar{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    z-index:30;display:flex;align-items:center;gap:8px;
    padding:8px;border-radius:999px;
    background:rgba(255,255,255,.62);
    backdrop-filter:saturate(140%) blur(14px);
    -webkit-backdrop-filter:saturate(140%) blur(14px);
    border:1px solid var(--pill-bd);
    box-shadow:0 8px 30px rgba(11,13,16,.10), 0 1px 0 rgba(255,255,255,.6) inset;
    max-width:calc(100vw - 24px);
  }
  .pills{
    display:flex;align-items:center;gap:6px;
    overflow-x:auto;scrollbar-width:none;
  }
  .pills::-webkit-scrollbar{display:none}

  .pill{
    flex:0 0 auto;
    appearance:none;border:1px solid var(--pill-bd);
    background:var(--pill-bg);
    color:#3a424c;
    font-family:inherit;font-size:13px;line-height:1;
    letter-spacing:.01em;
    padding:10px 14px;border-radius:999px;
    cursor:pointer;white-space:nowrap;
    transition:background .25s ease,color .25s ease,border-color .25s ease,transform .15s ease;
  }
  .pill:hover{color:var(--ink);background:rgba(255,255,255,.92)}
  .pill:active{transform:translateY(1px)}
  .pill.is-active{
    background:var(--accent);color:#fff;border-color:var(--pill-bd-active);
    box-shadow:0 4px 14px rgba(20,102,230,.32);
  }
  .pill.is-active:hover{background:var(--accent);color:#fff}

  .idx{
    flex:0 0 auto;
    font-size:11px;color:var(--muted);
    padding:0 10px 0 6px;letter-spacing:.04em;
    user-select:none;
  }
  .idx b{color:var(--ink);font-weight:700}

  /* fade between studies */
  #stage.swap{opacity:0;transition:opacity .18s ease}

  @media (max-width:680px){
    .meta{font-size:10px;top:14px;left:14px}
    .bar{bottom:14px;gap:4px;padding:6px}
    .pill{font-size:12px;padding:9px 11px}
    .idx{font-size:10px;padding:0 6px 0 4px}
  }
  @media (prefers-reduced-motion:reduce){
    #stage.swap{transition:none}
  }
</style>
</head>
<body>

  <iframe id="stage" src="trans_become.html" title="Transition study" allow="autoplay; fullscreen"></iframe>

  <div class="meta"><b>NanoFlashing</b> — hero → big idea · transition studies</div>

  <nav class="bar" aria-label="Transition study chooser">
    <div class="pills" id="pills" role="tablist">
      <button class="pill is-active" data-src="trans_become.html"  data-i="1" role="tab" aria-selected="true">A · Charge becomes the room</button>
      <button class="pill"           data-src="trans_through.html" data-i="2" role="tab" aria-selected="false">B · Travel through the charge</button>
      <button class="pill"           data-src="trans_zoom.html"    data-i="3" role="tab" aria-selected="false">C · Zoom into the material</button>
      <button class="pill"           data-src="trans_quiet.html"   data-i="4" role="tab" aria-selected="false">D · Quiet reveal</button>
    </div>
    <span class="idx"><b id="cur">1</b>/4</span>
  </nav>

<script>
(function(){
  const stage = document.getElementById('stage');
  const pills = Array.from(document.querySelectorAll('.pill'));
  const cur   = document.getElementById('cur');
  let active = pills[0];

  function setActive(p){
    if(!p || p === active) return;
    active = p;
    pills.forEach(x=>{
      const on = x === p;
      x.classList.toggle('is-active', on);
      x.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    cur.textContent = p.dataset.i;

    // gentle fade swap
    stage.classList.add('swap');
    const tgt = p.dataset.src;
    setTimeout(()=>{
      stage.src = tgt;
      // restore opacity on load
      const onLoad = ()=>{ stage.classList.remove('swap'); stage.removeEventListener('load', onLoad); };
      stage.addEventListener('load', onLoad);
      // safety timeout
      setTimeout(()=>stage.classList.remove('swap'), 600);
    }, 160);
  }

  pills.forEach(p=>p.addEventListener('click',()=>setActive(p)));

  function move(dir){
    const i = pills.indexOf(active);
    const n = (i + dir + pills.length) % pills.length;
    setActive(pills[n]);
    // keep active pill in view on mobile
    pills[n].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  }

  document.addEventListener('keydown',e=>{
    if(e.key === 'ArrowRight'){ e.preventDefault(); move(1); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); move(-1); }
    else if(e.key >= '1' && e.key <= '4'){
      const idx = parseInt(e.key,10) - 1;
      if(pills[idx]){ setActive(pills[idx]); pills[idx].scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'}); }
    }
  });
})();
</script>
</body>
</html>

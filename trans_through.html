<style>
:root{
  --bg:#edf0f2;
  --ink:#1f2327;
  --headline-ink:#1a1a1a;

  --accent:#1466e6;
  --tip:#5aa0ff;
  --red:#e23b3b;
  --hair:rgba(20,24,28,0.08);
  --stack:-apple-system, system-ui, 'Inter', 'Space Grotesk', sans-serif;

*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--stack);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  width:100%;
  height:100%;
  overflow:hidden;
}
#stage{
  position:fixed;
  inset:0;
  background:var(--bg);
  overflow:hidden;
}
.room{
  position:absolute;
  inset:0;
  z-index:1;
  opacity:0;
  background-image:url('assets/Background_c2.png');
  background-size:cover;
  background-position:center;
  will-change:opacity;
}
#dust-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  opacity:0;
  will-change:opacity;
}
.room-headline{
  position:absolute;
  left:clamp(28px, 4.5vw, 72px);
  bottom:clamp(40px, 7vh, 92px);
  max-width:62vw;
  font-family:var(--stack);
  font-size:clamp(22px, 3.4vw, 46px);
  line-height:1.18;
  font-weight:500;
  letter-spacing:-0.01em;
  color:var(--headline-ink);
  pointer-events:none;
  will-change:opacity;
  opacity:0;
}
.room-headline .charge{ color:var(--red); font-weight:600; }
.room-logo{
  position:absolute;
  left:clamp(22px, 3vw, 40px);
  top:clamp(20px, 3vh, 34px);
  height:34px;
  width:auto;
  pointer-events:none;
  will-change:opacity;
  opacity:0;
}
.room-logo img{ height:100%; width:auto; display:block; }
#wave-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  pointer-events:none;
  display:block;
}
.hero{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  will-change:opacity;
}
.hero-logo{
  position:absolute;
  left:clamp(28px, 4.5vw, 72px);
  top:clamp(28px, 5vh, 56px);
  height:clamp(56px, 7vw, 96px);

  overflow:hidden;
  display:flex;
  align-items:center;
}
.hero-logo img{ height:100%; width:auto; display:block; }
.hero-tag{
  position:absolute;
  left:clamp(28px, 4.5vw, 72px);
  top:calc(clamp(28px, 5vh, 56px) + clamp(56px, 7vw, 96px) + 18px);
  font-family:var(--stack);
  font-size:clamp(15px, 1.25vw, 19px);
  line-height:1.5;
  color:#3a4046;
  max-width:46ch;
  letter-spacing:0.002em;
}
.hero-tag .hl{ color:var(--accent); font-weight:600; }
.concept-label{
  position:absolute;
  right:clamp(18px, 3vw, 36px);
  bottom:clamp(16px, 3vh, 28px);
  z-index:5;
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.06em;
  color:var(--muted);
  pointer-events:none;
  white-space:nowrap;
}
.concept-label .p-val{ color:var(--accent); }
@media (max-width: 720px){
  .room-headline{ font-size:clamp(20px, 6vw, 30px); max-width:84vw; }
  .hero-logo{ height:clamp(44px, 12vw, 64px); }
  .hero-tag{ font-size:14px; max-width:80vw; }
}
</style>

<script type="module">
import * as THREE from 'three';

(function () {
  'use strict';

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('wave-canvas');
  const roomEl = document.getElementById('room');
  const dustCanvas = document.getElementById('dust-canvas');
  const heroEl = document.getElementById('hero');
  const pValEl = document.getElementById('p-val');

  const reduced = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || false;

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setClearColor(0xedf0f2, 0);
  const dprCap = 2;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 400);
  const CAM_BASE = new THREE.Vector3(0, 15, 26);
  const CAM_TARGET = new THREE.Vector3(0, -4, -8);
  camera.position.copy(CAM_BASE);
  camera.lookAt(CAM_TARGET);

  const GRID_X = 150;
  const GRID_Z = 55;
  const SURF_W = 150;
  const SURF_D = 36;
  const Z_FAR = -11;
  const SURF_COUNT = GRID_X * GRID_Z;

  function waveHeight(x, z, t) {
    var dome = -0.00044 * x * x;
    var zNorm = (z - Z_FAR) / SURF_D;
    var farRise = (1.0 - zNorm) * 3.0;
    var und1 = Math.sin(x * 0.06 + t * 0.393) * 0.8;
    var und2 = Math.sin(z * 0.04 + t * 0.314 + 1.5) * 0.8;
    return dome + farRise + und1 + und2;
  }

  // hash for per-point stagger
  function hash3(x, y, z) {
    const h = Math.sin(x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453;
    return h - Math.floor(h);
  }

  const surfaceGeo = new THREE.BufferGeometry();
  const sPositions = new Float32Array(SURF_COUNT * 3);
  const sBoosts = new Float32Array(SURF_COUNT);
  const sRows = new Float32Array(SURF_COUNT);
  const sNoise = new Float32Array(SURF_COUNT);

  for (let ix = 0; ix < GRID_X; ix++) {
    for (let iz = 0; iz < GRID_Z; iz++) {
      const i = ix * GRID_Z + iz;
      const px = (ix / (GRID_X - 1) - 0.5) * SURF_W;
      const pz = Z_FAR + (iz / (GRID_Z - 1)) * SURF_D;
      sPositions[i * 3] = px;
      sPositions[i * 3 + 1] = 0;
      sPositions[i * 3 + 2] = pz;
      sBoosts[i] = 0;
      sRows[i] = iz / (GRID_Z - 1);
      // per-point noise drives stagger; bias slightly by row so far points transform first (camera reaches them first)
      const rowBias = (iz / (GRID_Z - 1)) * 0.25;
      sNoise[i] = Math.max(0, Math.min(1, hash3(px, pz, 1.3) * 0.85 + rowBias));
    }
  }

  const basePositions = new Float32Array(sPositions);

  surfaceGeo.setAttribute('position', new THREE.BufferAttribute(sPositions, 3));
  surfaceGeo.setAttribute('aBoost', new THREE.BufferAttribute(sBoosts, 1));
  surfaceGeo.setAttribute('aRow', new THREE.BufferAttribute(sRows, 1));
  surfaceGeo.setAttribute('aNoise', new THREE.BufferAttribute(sNoise, 1));

  const surfaceMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPixelRatio: { value: renderer.getPixelRatio() },
      uResolution: { value: new THREE.Vector2(1, 1) },
      uSize: { value: 2.7 },
      uBaseColor: { value: new THREE.Color(0x96baf0) },
      uChargeColor: { value: new THREE.Color(0x1466e6) },
      uTipColor: { value: new THREE.Color(0x5aa0ff) },
      uFogColor: { value: new THREE.Color(0xedf0f2) },
      uFogNear: { value: 52 },
      uFogFar: { value: 128 },
      uMouse: { value: new THREE.Vector2(9999, 9999) },
      uMouseStr: { value: 0 },
      uFade: { value: 1.0 },
      uProgress: { value: 0.0 },
      uDustColor: { value: new THREE.Color(0x3a404a) },
      uHazeStrength: { value: 0.0 },
    },
    vertexShader: `
      attribute float aBoost;
      attribute float aRow;
      attribute float aNoise;
      uniform float uTime;
      uniform float uPixelRatio;
      uniform vec2 uResolution;
      uniform float uSize;
      uniform vec2 uMouse;
      uniform float uMouseStr;
      uniform float uProgress;
      varying float vBoost;
      varying float vDist;
      varying float vHeight;
      varying float vMouse;
      varying float vRow;
      varying float vWorldX;
      varying vec2 vArmX;
      varying vec2 vArmZ;
      varying float vLocalP;
      varying float vClipX;

      float waveHeight(float x, float z, float t) {
        float dome = -0.00044 * x * x;
        float zNorm = (z + 11.0) / 36.0;
        float farRise = (1.0 - zNorm) * 3.0;
        float und1 = sin(x * 0.06 + t * 0.393) * 0.8;
        float und2 = sin(z * 0.04 + t * 0.314 + 1.5) * 0.8;
        return dome + farRise + und1 + und2;
      }

      float cursorBump(vec2 xz) {
        vec2 d = xz - uMouse;
        return uMouseStr * 2.8 * exp(-dot(d, d) / 140.0);
      }

      void main() {
        vec3 pos = position;

        // staggered per-point transformation progress
        float thresh = aNoise * 0.55;
        float localP = clamp((uProgress - thresh) / max(0.45, 1.0 - thresh), 0.0, 1.0);
        localP = smoothstep(0.0, 1.0, localP);
        vLocalP = localP;

        float cb = cursorBump(pos.xz);
        pos.y = waveHeight(pos.x, pos.z, uTime) + cb;

        // gentle curl-like drift as the point transforms into dust
        float drift = localP;
        float n1 = aNoise * 6.2831;
        pos.x += sin(uTime * 0.45 + n1) * drift * 1.6;
        pos.z += cos(uTime * 0.38 + n1 * 1.3) * drift * 1.1;
        pos.y += drift * 0.7;

        vMouse = clamp(cb / 2.8, 0.0, 1.0);
        vHeight = pos.y;
        vRow = aRow;
        vWorldX = pos.x;
        vBoost = aBoost;

        vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
        vDist = -mvPos.z;
        vec4 clip0 = projectionMatrix * mvPos;
        gl_Position = clip0;
        vClipX = clip0.x / max(abs(clip0.w), 1e-4);

        float e = 0.7;
        vec3 pX = vec3(pos.x + e, waveHeight(pos.x + e, pos.z, uTime) + cursorBump(vec2(pos.x + e, pos.z)), pos.z);
        vec3 pZ = vec3(pos.x, waveHeight(pos.x, pos.z + e, uTime) + cursorBump(vec2(pos.x, pos.z + e)), pos.z + e);
        vec4 clipX = projectionMatrix * modelViewMatrix * vec4(pX, 1.0);
        vec4 clipZ = projectionMatrix * modelViewMatrix * vec4(pZ, 1.0);
        vec2 s0 = clip0.xy / clip0.w;
        vec2 rawX = ((clipX.xy / clipX.w) - s0) * uResolution;
        vec2 rawZ = ((clipZ.xy / clipZ.w) - s0) * uResolution;
        float armM = max(length(rawX), length(rawZ)) + 1e-4;
        vArmX = (rawX / armM) * 0.5;
        vArmZ = (rawZ / armM) * 0.5;

        float sz = uSize * (1.0 + aBoost * 1.6 + vMouse * 0.1);
        float rawSize = sz * uPixelRatio * (120.0 / max(vDist, 1.0));
        gl_PointSize = clamp(rawSize, 6.0 * uPixelRatio, 22.0 * uPixelRatio);
      }
    `,
    fragmentShader: `
      varying float vBoost;
      varying float vDist;
      varying float vHeight;
      varying float vMouse;
      varying float vRow;
      varying float vWorldX;
      varying vec2 vArmX;
      varying vec2 vArmZ;
      varying float vLocalP;
      varying float vClipX;
      uniform vec3 uBaseColor;
      uniform vec3 uChargeColor;
      uniform vec3 uTipColor;
      uniform vec3 uFogColor;
      uniform vec3 uDustColor;
      uniform float uFogNear;
      uniform float uFogFar;
      uniform float uFade;
      uniform float uHazeStrength;

      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        uv.y = -uv.y;

        float thick = 0.11;
        float lenX = length(vArmX);
        float lenZ = length(vArmZ);
        vec2 uX = vArmX / max(lenX, 1e-4);
        vec2 uZ = vArmZ / max(lenZ, 1e-4);
        lenX = max(lenX, 0.16);
        lenZ = max(lenZ, 0.16);
        float distX = abs(dot(uv, vec2(-uX.y, uX.x)));
        float distZ = abs(dot(uv, vec2(-uZ.y, uZ.x)));
        float armX = (1.0 - smoothstep(thick * 0.6, thick, distX)) *
                     (1.0 - smoothstep(lenX - 0.06, lenX, abs(dot(uv, uX))));
        float armZ = (1.0 - smoothstep(thick * 0.6, thick, distZ)) *
                     (1.0 - smoothstep(lenZ - 0.06, lenZ, abs(dot(uv, uZ))));
        float plus  = max(armX, armZ);
        if (plus < 0.05) discard;

        float heightFactor = smoothstep(-1.0, 1.0, vHeight);
        vec3 baseShaded = mix(uBaseColor * 0.85, uBaseColor * 1.15, heightFactor);

        float baseAlpha = 0.58;

        float charge = clamp(vMouse, 0.0, 1.0);
        vec3 color = mix(baseShaded, uChargeColor, charge * 0.42);
        float tip = charge * smoothstep(0.7, 1.0, charge) * 0.28;
        color = mix(color, uTipColor, tip);

        color = mix(color, uChargeColor, clamp(vBoost, 0.0, 1.0) * 0.9);
        color = mix(color, uTipColor, smoothstep(0.45, 1.0, vBoost) * 0.55);

        // color morph: pale charge-blue -> pollutant dust grey/ink
        color = mix(color, uDustColor, vLocalP * 0.92);

        // distance fog (kept from hero)
        float fog = smoothstep(uFogNear, uFogFar, vDist);
        color = mix(color, uFogColor, fog * 0.85);

        // veil haze: thickens around the midpoint, clears at both ends
        color = mix(color, uFogColor, uHazeStrength * 0.72);

        float depthFade = smoothstep(35.0, 12.0, vDist);
        float topFade = smoothstep(0.0, 0.22, vRow);
        float leftFade = smoothstep(-60.0, -20.0, vWorldX);

        // behind-camera fade (points the camera has passed stream past and vanish)
        float behindFade = smoothstep(0.0, 2.5, vDist);

        // soft edge fade so streaming points dissolve at frame sides
        float edgeFade = 1.0 - smoothstep(0.72, 1.08, abs(vClipX));

        // transforming points gently dissolve
        float transFade = 1.0 - vLocalP * 0.82;

        // haze also reduces alpha so the veil reads as fog, not a tint
        float hazeAlpha = 1.0 - uHazeStrength * 0.45;

        float alpha = plus * depthFade * topFade * leftFade * (baseAlpha + vBoost * 0.6 + charge * 0.4);
        alpha *= (1.0 - fog * 0.7);
        alpha *= behindFade * edgeFade * transFade * hazeAlpha;
        alpha *= uFade;

        gl_FragColor = vec4(color, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
  });

  const surfacePoints = new THREE.Points(surfaceGeo, surfaceMat);
  surfacePoints.renderOrder = 0;
  scene.add(surfacePoints);

  const dustCtx = dustCanvas.getContext('2d');
  let dustMotes = [];
  let dustW = 0, dustH = 0;

  function buildDust2D() {
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    dustW = w; dustH = h;
    dustCanvas.width = Math.floor(w * Math.min(window.devicePixelRatio || 1, dprCap));
    dustCanvas.height = Math.floor(h * Math.min(window.devicePixelRatio || 1, dprCap));
    dustCanvas.style.width = w + 'px';
    dustCanvas.style.height = h + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, dprCap);
    dustCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.round(Math.min(420, (w * h) / 4200));
    dustMotes = [];
    for (let i = 0; i < count; i++) {
      dustMotes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.12,
        vy: -0.04 - Math.random() * 0.08,
        r: 0.4 + Math.random() * 1.4,
        a: 0.05 + Math.random() * 0.14,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function drawDust2D(t) {
    if (dustW === 0 || dustH === 0) return;
    dustCtx.clearRect(0, 0, dustW, dustH);
    for (let i = 0; i < dustMotes.length; i++) {
      const m = dustMotes[i];
      m.x += m.vx + Math.sin(t * 0.3 + m.phase) * 0.05;
      m.y += m.vy;
      if (m.y < -4) { m.y = dustH + 4; m.x = Math.random() * dustW; }
      if (m.x < -4) m.x = dustW + 4;
      if (m.x > dustW + 4) m.x = -4;
      dustCtx.beginPath();
      dustCtx.fillStyle = 'rgba(58,64,74,' + m.a.toFixed(3) + ')';
      dustCtx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      dustCtx.fill();
    }
  }

  function resize() {
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    if (w === 0 || h === 0) return;
    const dpr = Math.min(window.devicePixelRatio || 1, dprCap);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    surfaceMat.uniforms.uPixelRatio.value = dpr;
    surfaceMat.uniforms.uResolution.value.set(w, h);
    buildDust2D();
  }

  /* ===== transition helpers ===== */
  function smoothstep(a, b, x) {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  const headlineEl = roomEl.querySelector('.room-headline');
  const roomLogoEl = roomEl.querySelector('.room-logo');
  const heroLogoEl = heroEl.querySelector('.hero-logo');
  const heroTagEl = heroEl.querySelector('.hero-tag');

  // camera dolly endpoints
  const CAM_END = new THREE.Vector3(0, 7.5, -19);
  const CAM_TARGET_END = new THREE.Vector3(0, -6, -26);

  function applyTransition(p) {
    const cp = Math.max(0, Math.min(1, p));
    const t = smoothstep(0, 1, cp);

    // --- one persistent camera dollies forward through the field ---
    camera.position.set(
      CAM_BASE.x + (CAM_END.x - CAM_BASE.x) * t,
      CAM_BASE.y + (CAM_END.y - CAM_BASE.y) * t,
      CAM_BASE.z + (CAM_END.z - CAM_BASE.z) * t
    );
    const lx = CAM_TARGET.x + (CAM_TARGET_END.x - CAM_TARGET.x) * t;
    const ly = CAM_TARGET.y + (CAM_TARGET_END.y - CAM_TARGET.y) * t;
    const lz = CAM_TARGET.z + (CAM_TARGET_END.z - CAM_TARGET.z) * t;
    camera.lookAt(lx, ly, lz);

    // --- uniforms ---
    surfaceMat.uniforms.uProgress.value = cp;
    // haze veil: peaks at the midpoint, clears at both ends
    const haze = Math.sin(cp * Math.PI);
    surfaceMat.uniforms.uHazeStrength.value = Math.max(0, haze) * 0.85;
    // overall wave alpha: hold until late, then dissolve (camera has passed everything by then)
    surfaceMat.uniforms.uFade.value = 1.0 - smoothstep(0.82, 1.0, cp);

    // --- DOM layers ---
    // hero wordmark + tag OUT EARLY (by ~0.3)
    const heroOp = 1.0 - smoothstep(0.12, 0.30, cp);
    heroEl.style.opacity = String(heroOp);

    // room photo emerges through the haze (mid), fully resolved by ~0.7
    roomEl.style.opacity = String(smoothstep(0.30, 0.68, cp));
    dustCanvas.style.opacity = String(smoothstep(0.34, 0.72, cp));

    // room headline + logo IN LATE (after 0.65) so text blocks never collide
    headlineEl.style.opacity = String(smoothstep(0.66, 0.90, cp));
    roomLogoEl.style.opacity = String(smoothstep(0.66, 0.90, cp));
  }

  /* ===== viewing harness ===== */
  const params = new URLSearchParams(window.location.search);
  const qaP = params.get('p');
  let qaFixed = false;
  let qaValue = 0;
  if (qaP !== null) {
    const v = parseFloat(qaP);
    if (!isNaN(v)) {
      qaFixed = true;
      qaValue = Math.max(0, Math.min(1, v));
    }
  }

  let p = 0;
  let autoDir = 1;
  let autoPaused = false;
  let autoResumeAt = 0;
  let holdUntil = 0;
  const LEG = 2.4;
  const HOLD_AT_ONE = 1.8;
  const HOLD_AT_ZERO = 1.2;

  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }

  let lastT = 0;
  let clock = 0;
  let running = false;
  let rafId = 0;

  function step(t) {
    if (!running) return;
    rafId = requestAnimationFrame(step);
    const dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0.016;
    lastT = t;
    clock += dt;

    surfaceMat.uniforms.uTime.value = clock;

    const decay = Math.pow(0.945, dt * 60);
    for (let i = 0; i < SURF_COUNT; i++) sBoosts[i] *= decay;
    surfaceGeo.attributes.aBoost.needsUpdate = true;

    if (qaFixed) {
      p = qaValue;
    } else if (reduced) {
      // clean static state at hero for reduced motion
      p = 0;
    } else if (autoPaused) {
      if (t >= autoResumeAt) autoPaused = false;
    } else {
      if (t < holdUntil) {
        // holding
      } else {
        const dir = autoDir;
        const speed = 1 / LEG;
        p += dir * speed * dt;
        if (p >= 1) {
          p = 1;
          autoDir = -1;
          holdUntil = t + HOLD_AT_ONE * 1000;
        } else if (p <= 0) {
          p = 0;
          autoDir = 1;
          holdUntil = t + HOLD_AT_ZERO * 1000;
        }
      }
    }

    let pDisplay = p;
    if (!qaFixed && !reduced && !autoPaused && t >= holdUntil) {
      const legFrac = autoDir === 1 ? p : (1 - p);
      const easedFrac = easeInOutCubic(legFrac);
      pDisplay = autoDir === 1 ? easedFrac : (1 - easedFrac);
    } else {
      pDisplay = p;
    }

    applyTransition(pDisplay);
    pValEl.textContent = pDisplay.toFixed(2);

    drawDust2D(clock);

    renderer.render(scene, camera);
  }

  function pauseAutoFor(ms) {
    if (qaFixed || reduced) return;
    autoPaused = true;
    autoResumeAt = performance.now() + ms;
    holdUntil = 0;
  }

  function scrubBy(deltaPx) {
    if (qaFixed || reduced) return;
    pauseAutoFor(1400);
    const k = 0.0024;
    p = Math.max(0, Math.min(1, p + deltaPx * k));
    autoDir = p < 0.5 ? 1 : -1;
  }

  window.addEventListener('wheel', function (e) {
    if (qaFixed || reduced) return;
    e.preventDefault();
    scrubBy(-e.deltaY);
  }, { passive: false });

  let dragging = false;
  let lastY = 0;
  stage.addEventListener('pointerdown', function (e) {
    if (qaFixed || reduced) return;
    dragging = true;
    lastY = e.clientY;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging || qaFixed || reduced) return;
    const dy = e.clientY - lastY;
    lastY = e.clientY;
    scrubBy(-dy);
  });
  stage.addEventListener('pointerup', function (e) {
    dragging = false;
    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  stage.addEventListener('pointercancel', function () { dragging = false; });

  function start() {
    if (!running) {
      running = true;
      lastT = 0;
      rafId = requestAnimationFrame(step);
    }
  }
  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  resize();
  applyTransition(qaFixed ? qaValue : 0);
  pValEl.textContent = (qaFixed ? qaValue : 0).toFixed(2);

  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(function (entries) {
      for (let i = 0; i < entries.length; i++) {
        if (entries[i].isIntersecting) start();
        else stop();
      }
    }, { threshold: [0, 0.1] });
    io.observe(stage);
  } else {
    start();
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop();
    else if (!running) { running = true; lastT = 0; rafId = requestAnimationFrame(step); }
  });

  let rt = 0;
  window.addEventListener('resize', function () {
    if (rt) clearTimeout(rt);
    rt = setTimeout(resize, 180);
  });
})();
</script>

</body>

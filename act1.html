<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoFlashing — Microscope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,system-ui,'Inter','Space Grotesk',sans-serif;
    color:#2a2622;
    background:#edf0f2;
    cursor:none;
    -webkit-font-smoothing:antialiased;
    --reveal:0;
    --reveal-room:0;
    --reveal-text:0;
    --reveal-lens:0;
  }
  #roomVid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:var(--reveal-room,0);background:#edf0f2;}
  #scene{position:fixed;inset:0;z-index:1;cursor:none;opacity:1;}
  body.lens-hover #scene{cursor:pointer;}
  body.detail-active{cursor:auto;}
  body.detail-active #scene{cursor:default;}
  .scrim{position:fixed;top:0;left:0;width:64%;height:62%;z-index:2;pointer-events:none;
    background:radial-gradient(120% 95% at 12% 22%, rgba(237,240,242,0.72) 0%, rgba(237,240,242,0.28) 48%, rgba(237,240,242,0) 76%);
    opacity:var(--reveal-room,0);}
  .brand{position:fixed;top:26px;left:32px;z-index:7;height:114px;pointer-events:none;opacity:var(--reveal-text,0);}
  .brand img{height:100%;width:auto;display:block;}
  .hero{position:fixed;z-index:3;left:3vw;max-width:none;pointer-events:none;
    top:50%;transform:translateY(-50%);opacity:var(--hero-op,0);}
  body.detail-active .hero{opacity:0;}
  h1{
    font-family:-apple-system,system-ui,'Inter','Space Grotesk',sans-serif;
    font-weight:600;
    font-size:49px;
    line-height:1.1;
    letter-spacing:-0.022em;
    color:#1a1a1a;
    text-wrap:balance;
  }
  h1 .line { display:block; white-space:nowrap; }
  h1 .chg{
    color:#e23b3b;
    font-weight:700;
    letter-spacing:-0.02em;
    white-space:nowrap;
  }
  /* resolution words — appear only after the room is clean; black + blue */
  .resolve{position:fixed;z-index:3;left:3vw;max-width:none;pointer-events:none;
    top:50%;transform:translateY(-50%);opacity:var(--resolve-op,0);}
  body.detail-active .resolve{opacity:0;}
  .resolve .rh{
    font-family:-apple-system,system-ui,'Inter','Space Grotesk',sans-serif;
    font-weight:600;font-size:49px;line-height:1.1;letter-spacing:-0.022em;
    color:#1a1a1a;white-space:nowrap;
  }
  .resolve .rh .catch{color:#1b7bff;font-weight:700;letter-spacing:-0.02em;}
  .resolve .deck{
    margin-top:18px;max-width:600px;
    font-size:20px;line-height:1.5;font-weight:450;color:#2a2622;letter-spacing:0;
  }
  .resolve .deck b{font-weight:600;color:#1b7bff;}
  .tag{
    position:fixed;z-index:5;pointer-events:none;
    display:flex;flex-direction:column;
    background:#ffffff;
    border-radius:8px;
    box-shadow:0 4px 14px rgba(0,0,0,0.08), inset 0 0 0 1px rgba(20,20,20,0.07);
    padding:10px 16px 11px;
    opacity:0;
    will-change:transform,opacity;
  }
  .tag.show{opacity:var(--reveal-lens,0);}
  body.detail-active .tag{opacity:0 !important;}
  .tag .name{
    font-size:22px;font-weight:500;color:#1a1a1a;line-height:1.2;letter-spacing:-0.005em;
  }
  .tag .whisper{
    font-size:11.5px;font-weight:400;color:#8a817a;line-height:1.3;margin-top:3px;
  }

  /* ---------- detail mode ---------- */
  .detail{
    position:fixed; z-index:6;
    top:0; right:0; height:100%; width:54%;
    display:flex; align-items:center;
    padding:8vh 5vw 8vh 4vw;
    opacity:0; visibility:hidden;
    transform:translateX(22px);
    transition:opacity .55s ease, transform .6s cubic-bezier(.2,.7,.2,1), visibility .55s;
    pointer-events:none;
    overflow-y:auto;
  }
  .detail.open{opacity:1; visibility:visible; transform:none; pointer-events:auto;}
  .detail-close{
    position:absolute; top:3.2vh; right:3vw;
    background:none; border:0; cursor:pointer;
    font-size:22px; color:#1a1a1a; opacity:.45;
    padding:10px 12px; line-height:1;
    transition:opacity .2s ease;
    font-family:inherit;
  }
  .detail-close:hover{opacity:.9;}
  .detail-inner{max-width:560px; width:100%;}
  .kicker{
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:#8a817a; font-weight:500; margin-bottom:14px;
    display:flex; align-items:center;
  }
  .charge-mark{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background:#e23b3b; opacity:.75; margin-right:10px;
  }
  .detail h2{
    font-size:clamp(30px,3.6vw,46px); font-weight:600;
    letter-spacing:-.022em; color:#1a1a1a; line-height:1.08;
  }
  .detail .sub{font-size:15px; color:#8a817a; margin-top:8px;}
  .sec{padding:20px 0; border-top:1px solid rgba(20,20,20,0.09);}
  .sec:first-of-type{border-top:0; padding-top:26px;}
  .sec .lab{
    font-size:12px; letter-spacing:0;
    color:#8a817a; font-weight:600;
  }
  .sec .body{font-size:16.5px; line-height:1.6; color:#2a2622; margin-top:10px;}
  .sec .src{font-size:12px; color:#8a7f74; margin-top:10px; font-style:italic;}

  .detail-screen{position:fixed; inset:0; z-index:4; background:#edf0f2;
    opacity:0; visibility:hidden; transition:opacity .5s ease, visibility .5s; pointer-events:none;}
  body.detail-active .detail-screen{opacity:1; visibility:visible;}
  .detail-vid{position:fixed; z-index:5; left:5vw; top:50%; transform:translateY(-50%);
    width:min(40vw,500px); height:auto; opacity:0; visibility:hidden;
    transition:opacity .5s ease, visibility .5s; pointer-events:none;
    -webkit-mask:radial-gradient(circle at 50% 50%, #000 56%, transparent 76%);
    mask:radial-gradient(circle at 50% 50%, #000 56%, transparent 76%);}
  body.detail-active .detail-vid{opacity:1; visibility:visible;}

  @media (max-width:720px){
    .brand{height:90px;top:18px;left:18px;transform:none;}
    body.detail-active .brand{opacity:0;}
    .hero{top:calc(18px + 90px + 4vh);left:4vw;max-width:none;right:5vw;transform:none;}
    .resolve{top:calc(18px + 90px + 4vh);left:4vw;max-width:none;right:5vw;transform:none;}
    .resolve .rh{font-size:clamp(26px, 8vw, 44px);white-space:normal;}
    .resolve .deck{font-size:15px;margin-top:14px;line-height:1.45;}
    h1{font-size:clamp(26px, 8vw, 44px);}
    h1 .line{white-space:normal;}
    .tag{padding:9px 14px 10px;}
    .tag .name{font-size:14px;}
    .tag .whisper{font-size:11px;}
    .detail{
      width:100%; height:auto; top:42vh; bottom:0; right:0;
      padding:22px 6vw 5vh; align-items:flex-start;
      transform:translateY(18px);
      overflow-y:auto;
    }
    .detail.open{transform:none;}
    .detail-close{top:14px; right:16px; font-size:20px;}
    .detail h2{font-size:clamp(26px,7vw,38px);}
    .sec .body{font-size:15.5px;}
    .sec{padding:16px 0;}
    .sec:first-of-type{padding-top:20px;}
  }
</style>
</head>
<body>
<!-- act1_electric_v3 -->
<video id="roomVid" src="screen2_full.mp4?v=2" muted playsinline preload="auto"></video>
<canvas id="scene"></canvas>
<div class="scrim"></div>
<div class="brand"><img src="assets/brand/nanoflashing_black.svg" alt="NanoFlashing"></div>
<div class="hero">
  <h1><span class="line">Most harmful pollutants</span><span class="line">carry an <span class="chg">electric charge.</span></span></h1>
</div>
<div class="resolve" id="resolve" aria-hidden="true">
  <h1 class="rh">What they carry, we <span class="catch">catch.</span></h1>
  <p class="deck">Positive polarity captures particles, destroys up to <b>99.9%</b> of pathogens by a physical mechanism.</p>
</div>
<div class="tag" id="tag">
  <div class="name" id="t-name">—</div>
  <div class="whisper">Electrically Charged</div>
</div>
<div class="detail-screen" aria-hidden="true"></div>
<video class="detail-vid" id="detailVid" muted loop playsinline preload="auto"></video>
<aside class="detail" id="detail" aria-hidden="true">
  <button class="detail-close" id="detailClose" aria-label="Close detail view">&#10005;</button>
  <div class="detail-inner" id="detailInner"></div>
</aside>
<script>
function easeInOut(k){ return k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2; }

// ---------- image-anchored device rectangles ----------
// The room photo's native pixel size; CSS uses center/cover so we replicate that transform.
const IMG_W = 1344, IMG_H = 752;
// Device bounding boxes as fractions OF THE IMAGE (1344x752)
const DEVICE_IMG_RECTS = [
  { fx0:0.446, fy0:0.092, fx1:0.567, fy1:0.186, round:0.10 },  // supply vent (square)
  { fx0:0.622, fy0:0.392, fx1:0.682, fy1:0.560, round:0.42 }   // wall purifier (nudged down)
];
// pixel rects recomputed on resize via the same cover transform CSS uses
let capPxRects = DEVICE_IMG_RECTS.map(()=>({
  x:0,y:0,w:0,h:0,rx:0,ry:0,cx:0,cy:0
}));

// ---------- reveal (scroll-linked dilute-in from hero) ----------
const inPager = window.top !== window.self;
const revealQP = new URLSearchParams(location.search).get('reveal');
let revealTarget, currentReveal, revealFixed;
if (revealQP !== null) {
  const v = parseFloat(revealQP);
  currentReveal = isNaN(v) ? 1 : Math.max(0, Math.min(1, v));
  revealTarget = currentReveal;
  revealFixed = true;
} else if (!inPager) {
  revealTarget = 1;
  currentReveal = 1;
  revealFixed = false;
} else {
  revealTarget = 0;
  currentReveal = 0;
  revealFixed = false;
}
document.body.style.setProperty('--reveal', currentReveal);

// ---------- capture progress (now drives video scrub) ----------
const captureQP = new URLSearchParams(location.search).get('capture');
let captureTarget, displayCp, captureFixed;
if (captureQP !== null) {
  const v = parseFloat(captureQP);
  captureTarget = isNaN(v) ? 0 : Math.max(0, Math.min(1, v));
  displayCp = captureTarget;
  captureFixed = true;
} else {
  captureTarget = 0;
  displayCp = 0;
  captureFixed = false;
}

// ---------- staged reveal helpers ----------
let roomO=0, textO=0, lensO=0;
function stageOpacity(r, start, end){
  if(r<=start) return 0;
  if(r>=end) return 1;
  return (r-start)/(end-start);
}

window.addEventListener('message', function(e){
  if (!e.data) return;
  if (e.data.type === 'nf-reveal' && !revealFixed) {
    revealTarget = Math.max(0, Math.min(1, e.data.p || 0));
  } else if (e.data.type === 'nf-capture' && !captureFixed) {
    captureTarget = Math.max(0, Math.min(1, e.data.p || 0));
  }
});

const cv=document.getElementById('scene'), ctx=cv.getContext('2d');
const tagEl=document.getElementById('tag'), tName=document.getElementById('t-name');
const detailEl=document.getElementById('detail');
const detailInner=document.getElementById('detailInner');
const detailClose=document.getElementById('detailClose');
const detailVid=document.getElementById('detailVid');
const heroEl=document.querySelector('.hero');
const brandEl=document.querySelector('.brand');
const roomVid=document.getElementById('roomVid');

let W=0,H=0,DPR=1,lastT=performance.now();

const SPECS=[
  {key:'Wildfire_Smoke_Particle', name:'Wildfire Smoke', rate:1.0},
  {key:'Fungal_Spore',            name:'Fungal Spore',    rate:1.0},
  {key:'Virus',                   name:'Virus',           rate:1.0},
  {key:'Bacteria',                name:'Bacteria',        rate:1.0},
  {key:'Ultrafine_Particle',      name:'Ultrafine Particle', rate:1.0},
  {key:'PFAS',                    name:'PFAS',            rate:1.0},
  {key:'Pollen',                  name:'Pollen',          rate:1.0},
];
SPECS.forEach(s=>{
  const im=new Image(); im.src='assets/glow/'+s.key+'_glow_opt.jpg'; s.img=im; s.ready=false; im.onload=()=>s.ready=true;
  const v=document.createElement('video');
  v.src='assets/videos/'+s.key+'_flashloop_c2.mp4';
  v.muted=true; v.loop=true; v.playsInline=true; v.setAttribute('playsinline',''); v.preload='auto';
  s.vid=v; s.vReady=false;
  const applyRate=()=>{ try{ v.playbackRate=s.rate; }catch(e){} };
  v.addEventListener('loadeddata',()=>{ s.vReady=true; applyRate(); });
  v.addEventListener('canplay',applyRate);
  v.addEventListener('play',applyRate);
  v.addEventListener('ratechange',()=>{ if(Math.abs(v.playbackRate-s.rate)>0.001){ try{v.playbackRate=s.rate;}catch(e){} } });
});

const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const PROBE=new URLSearchParams(location.search).get('probe');
const DETAIL_QP=new URLSearchParams(location.search).get('detail');

const POSITIONS_DESKTOP=[
  {x:0.46,y:0.66},
  {x:0.66,y:0.64},
  {x:0.56,y:0.78},
  {x:0.72,y:0.74},
  {x:0.42,y:0.78},
  {x:0.62,y:0.70},
  {x:0.52,y:0.62}
];
const POSITIONS_MOBILE=[
  {x:0.60,y:0.30},
  {x:0.82,y:0.40},
  {x:0.48,y:0.56},
  {x:0.74,y:0.62},
  {x:0.36,y:0.70},
  {x:0.86,y:0.74},
  {x:0.58,y:0.82}
];

function pollutantPoint(i){
  const pos = W < 720 ? POSITIONS_MOBILE : POSITIONS_DESKTOP;
  const p = pos[i%pos.length];
  return {x:p.x*W, y:p.y*H};
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // recompute capture rect pixel geometry via the SAME cover transform CSS uses
  const scale = Math.max(W / IMG_W, H / IMG_H);
  const drawnW = IMG_W * scale, drawnH = IMG_H * scale;
  const offX = (W - drawnW) / 2, offY = (H - drawnH) / 2;
  capPxRects = DEVICE_IMG_RECTS.map(r=>{
    const x = offX + r.fx0 * drawnW;
    const y = offY + r.fy0 * drawnH;
    const w = (r.fx1 - r.fx0) * drawnW;
    const h = (r.fy1 - r.fy0) * drawnH;
    const rad = r.round * Math.min(w, h);
    return { x, y, w, h, rx:rad, ry:rad, cx:x+w/2, cy:y+h/2 };
  });
  // adjust dust count for breakpoint
  if (typeof dustMotes !== 'undefined' && dustMotes && dustMotes.length > 0) {
    const target = W < 720 ? (REDUCED ? 300 : 500) : (REDUCED ? 400 : 700);
    while (dustMotes.length > target) dustMotes.pop();
    while (dustMotes.length < target) dustMotes.push(makeMote());
  }
}

// ---------- dust particle system (synced to roomVid.currentTime) ----------
const DUST_RGB = [[110,118,127], [122,128,136], [94,102,110]];
let dustSprites = [];
let dustMotes = [];
let prevCT = 0;
const FLOAT_END = 3.6;
const SUCK_END = 7.9;   // clip re-timed to 8.58s (seam cross-dissolve removed 0.5s); force-absorb before the clean end

function makeDustSprites() {
  dustSprites = DUST_RGB.map(function(rgb){
    var r=rgb[0], g=rgb[1], b=rgb[2];
    var s=document.createElement('canvas');
    s.width=24; s.height=24;
    var sc=s.getContext('2d');
    var grd=sc.createRadialGradient(12,12,0, 12,12,12);
    grd.addColorStop(0, 'rgba('+r+','+g+','+b+',1)');
    grd.addColorStop(0.35, 'rgba('+r+','+g+','+b+',0.5)');
    grd.addColorStop(1, 'rgba('+r+','+g+','+b+',0)');
    sc.fillStyle=grd;
    sc.fillRect(0,0,24,24);
    return s;
  });
}

function makeMote() {
  return {
    x: Math.random()*W,
    y: Math.random()*H,
    vx: (Math.random()-0.5)*0.4,
    vy: (Math.random()-0.5)*0.4,
    size: 1.0+Math.random()*3.0,
    baseAlpha: 0.15+Math.random()*0.45,
    spriteIdx: Math.floor(Math.random()*3),
    phase: Math.random()*Math.PI*2,
    state: 'float',
    suckStart: FLOAT_END+Math.random()*2.9,
    suckDur: 0.6+Math.random()*0.8,
    tx: 0, ty: 0,
    startX: 0, startY: 0,
    curveAmt: 0,
    absorbed: false
  };
}

function initDust() {
  if (dustSprites.length === 0) makeDustSprites();
  var count = W < 720 ? (REDUCED ? 300 : 500) : (REDUCED ? 400 : 700);
  dustMotes = [];
  for (var i=0; i<count; i++) dustMotes.push(makeMote());
}

function resetDust() {
  for (var i=0; i<dustMotes.length; i++) {
    var m=dustMotes[i];
    m.state='float';
    m.absorbed=false;
    m.x=Math.random()*W;
    m.y=Math.random()*H;
    m.vx=(Math.random()-0.5)*0.4;
    m.vy=(Math.random()-0.5)*0.4;
    m.suckStart=FLOAT_END+Math.random()*2.9;
    m.suckDur=0.6+Math.random()*0.8;
    m.curveAmt=0;
  }
}

function updateDust(t, dt) {
  var ct = (roomVid && isFinite(roomVid.currentTime)) ? roomVid.currentTime : 0;
  // detect video restart (currentTime jumps backward)
  if (ct < prevCT - 0.3) resetDust();
  prevCT = ct;

  var dts = Math.min(2.5, dt/16.67);

  for (var i=0; i<dustMotes.length; i++) {
    var m=dustMotes[i];
    if (m.absorbed) continue;

    // past suck end — force absorb
    if (ct >= SUCK_END) {
      m.absorbed=true; m.state='absorbed';
      continue;
    }

    if (m.state === 'suck') {
      var elapsed = ct - m.suckStart;
      var progress = Math.min(1, Math.max(0, elapsed/m.suckDur));
      if (progress >= 1) {
        m.absorbed=true; m.state='absorbed';
        continue;
      }
      // easeInQuad for accelerating suck
      var ep = progress*progress;
      m.x = m.startX + (m.tx-m.startX)*ep;
      m.y = m.startY + (m.ty-m.startY)*ep;
      // curved path (perpendicular offset peaking mid-flight)
      var dx = m.tx-m.startX, dy = m.ty-m.startY;
      var len = Math.hypot(dx,dy) || 1;
      var curve = Math.sin(progress*Math.PI) * m.curveAmt;
      m.x += (-dy/len)*curve;
      m.y += (dx/len)*curve;
    } else {
      // float phase — check if this mote should start sucking
      if (ct >= m.suckStart && ct >= FLOAT_END) {
        m.state='suck';
        m.startX=m.x; m.startY=m.y;
        // pick nearer device
        var d0=Math.hypot(m.x-capPxRects[0].cx, m.y-capPxRects[0].cy);
        var d1=Math.hypot(m.x-capPxRects[1].cx, m.y-capPxRects[1].cy);
        var rect = d0<=d1 ? capPxRects[0] : capPxRects[1];
        // random target spread across whole device rect
        m.tx = rect.x + Math.random()*rect.w;
        m.ty = rect.y + Math.random()*rect.h;
        var dist = Math.hypot(m.tx-m.startX, m.ty-m.startY);
        m.curveAmt = (Math.random()-0.5) * Math.min(80, dist*0.25);
        continue;
      }
      // Brownian + gentle curl
      m.vx += (Math.random()-0.5)*0.06*dts;
      m.vy += (Math.random()-0.5)*0.06*dts;
      m.vx += Math.sin(m.y*0.005 + t*0.00015)*0.012*dts;
      m.vy += Math.cos(m.x*0.005 + t*0.00015)*0.012*dts;
      m.vx *= Math.pow(0.95, dts);
      m.vy *= Math.pow(0.95, dts);
      m.x += m.vx*dts;
      m.y += m.vy*dts;
      // wrap edges
      if (m.x < -15) m.x = W+15;
      if (m.x > W+15) m.x = -15;
      if (m.y < -15) m.y = H+15;
      if (m.y > H+15) m.y = -15;
    }
  }
}

function drawDust(t) {
  if (roomO <= 0.001) return;
  if (dustSprites.length === 0) makeDustSprites();
  if (dustMotes.length === 0) return;

  var ct = (roomVid && isFinite(roomVid.currentTime)) ? roomVid.currentTime : 0;

  ctx.save();
  ctx.globalCompositeOperation = 'source-over';

  for (var i=0; i<dustMotes.length; i++) {
    var m=dustMotes[i];
    if (m.absorbed) continue;

    var alpha = m.baseAlpha;
    if (m.state === 'suck') {
      var elapsed = ct - m.suckStart;
      var progress = Math.min(1, Math.max(0, elapsed/m.suckDur));
      // fade stays visible during travel, drops near arrival
      alpha = m.baseAlpha * (1 - progress*progress);
    }
    // gentle twinkle
    alpha *= (0.75 + 0.25*Math.sin(t*0.001 + m.phase));
    // honor room reveal
    alpha *= roomO;
    if (alpha < 0.003) continue;

    ctx.globalAlpha = alpha;
    var ds = m.size * 4;
    ctx.drawImage(dustSprites[m.spriteIdx], m.x-ds/2, m.y-ds/2, ds, ds);
  }

  ctx.globalAlpha = 1;
  ctx.restore();
}

// ---------- lens state ----------
const bub={x:0,y:0,tx:0,ty:0,R:0};
let mouseActive=false,lastMove=-9999;
let specIndex=0;
let mode='auto';

function targetR(){
  const mobile = W<720;
  if(mobile) return W*0.32*0.5;
  return Math.min(W,H)*0.36*0.5;
}

function detailLensTarget(){
  if(W<720){
    return {x: W*0.5, y: H*0.22, R: Math.min(W*0.34, H*0.21)};
  }
  return {x: W*0.27, y: H*0.5, R: Math.min(W*0.205, H*0.40)};
}

function setSpec(i){
  specIndex=((i%SPECS.length)+SPECS.length)%SPECS.length;
  SPECS.forEach((s,k)=>{
    if(!s.vid) return;
    if(k===specIndex){ s.vid.play().catch(()=>{}); try{s.vid.playbackRate=s.rate;}catch(e){} }
    else { try{s.vid.pause();}catch(e){} }
  });
  tName.textContent=SPECS[specIndex].name;
}

function findNearestSpec(x,y){
  let best=0,bd=1e9;
  for(let i=0;i<POSITIONS_DESKTOP.length;i++){
    const p=pollutantPoint(i);
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<bd){bd=d;best=i;}
  }
  return best;
}

addEventListener('mousemove',e=>{
  bub.tx=e.clientX; bub.ty=e.clientY;
  mouseActive=true; lastMove=performance.now();
  if(mode!=='detail') mode='mouse';
  if(!detailMode){
    const over=Math.hypot(e.clientX-bub.x, e.clientY-bub.y) <= bub.R*1.04;
    document.body.classList.toggle('lens-hover', over);
  }

function renderDetail(i){
  const s=SPECS[i];
  const d=DETAIL_DATA[s.key];
  let html='';
  if(d){
    html+=`<h2>${d.title}</h2><div class="sub">${d.sub}</div>`;
    d.sections.forEach(sec=>{
      html+=`<div class="sec"><div class="lab">${sec.label}</div><div class="body">${sec.body}</div><div class="src">Source: ${sec.source}</div></div>`;
    });
  } else {
    html+=`<h2>${s.name}</h2><div class="sub">Detail coming soon</div>`;
  }
  detailInner.innerHTML=html;
}

function enterDetail(i){
  if(detailMode) return;
  detailMode=true; detailIndex=((i%SPECS.length)+SPECS.length)%SPECS.length;
  document.body.classList.add('detail-active');
  document.body.classList.remove('lens-hover');
  detailEl.classList.add('open');
  detailEl.setAttribute('aria-hidden','false');
  heroEl.style.opacity='0';
  if(W<720) brandEl.style.opacity='0';
  mode='detail';
  if(specIndex!==detailIndex) setSpec(detailIndex);
  renderDetail(detailIndex);
  detailVid.src='assets/videos/'+SPECS[detailIndex].key+'_flashloop_c2.mp4';
  detailVid.play().catch(()=>{});
}

function exitDetail(){
  if(!detailMode) return;
  detailMode=false;
  document.body.classList.remove('detail-active');
  detailEl.classList.remove('open');
  detailEl.setAttribute('aria-hidden','true');
  heroEl.style.opacity='';
  brandEl.style.opacity='';
  try{ detailVid.pause(); }catch(e){}
  autoT0=performance.now(); autoState='glide'; autoStart={x:bub.x,y:bub.y};
  mode='auto';
}

function lensHit(cx,cy){
  const r=cv.getBoundingClientRect();
  const x=cx-r.left, y=cy-r.top;
  return Math.hypot(x-bub.x, y-bub.y) <= bub.R*1.04;
}
cv.addEventListener('click', e=>{
  if(detailMode) return;
  if(lensHit(e.clientX, e.clientY)) gotoDetail(specIndex);
});
let touchStart=null;
cv.addEventListener('touchstart', e=>{
  if(detailMode) return;
  if(e.touches[0]) touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
cv.addEventListener('touchend', e=>{
  if(detailMode||!touchStart) return;
  const t=e.changedTouches[0];
  if(t && Math.hypot(t.clientX-touchStart.x, t.clientY-touchStart.y)<10){
    if(lensHit(t.clientX, t.clientY)) gotoDetail(specIndex);
  }
  touchStart=null;
});

// ---------- video auto-play state ----------
let autoPlayed = false;   // screen 2 auto-plays its video once on arrival, at a gentle pace
const AUTOPLAY_RATE = 0.5;   // gentle — slows the whole sequence, incl. the baked-in blue turn-on

// ---------- resolution swap: the words change ONLY after the room video fully ends (all dust cleaned) ----------
const resolveQP = new URLSearchParams(location.search).get('resolve');
const resolveForced = (resolveQP !== null);          // ?resolve=1 forces the resolution shown (QA hook)
let resolveRaw = (resolveForced && parseFloat(resolveQP) > 0) ? 1 : 0;
let roomEnded = false;
roomVid.addEventListener('ended', function(){ roomEnded = true; });
// Prime the decoder on load (muted play->pause) so the first frame is painted and playback resumes
// INSTANTLY when the room reveals — kills the static-frame-then-video hitch.
let primed = false;
function primeVideo(){
  if(primed) return; primed = true;
  try { roomVid.play().then(function(){ if(!autoPlayed){ roomVid.pause(); roomVid.currentTime = 0; } }).catch(function(){}); } catch(e){}
}
roomVid.addEventListener('loadeddata', primeVideo);
if (roomVid.readyState >= 2) primeVideo();

// ---------- main loop ----------
function tick(t){
  const dt=Math.min(40, t-lastT);
  lastT=t;

  if (!revealFixed) {
    currentReveal += (revealTarget - currentReveal) * 0.14;
    if (Math.abs(revealTarget - currentReveal) < 0.001) currentReveal = revealTarget;
  }
  document.body.style.setProperty('--reveal', currentReveal);

  roomO = stageOpacity(currentReveal, 0.00, 0.42);
  textO = stageOpacity(currentReveal, 0.38, 0.70);
  lensO = stageOpacity(currentReveal, 0.66, 1.00);
  document.body.style.setProperty('--reveal-room', roomO);
  document.body.style.setProperty('--reveal-text', textO);
  document.body.style.setProperty('--reveal-lens', lensO);

  // Start the room video AS SOON AS the room begins to reveal — so it is ALREADY in motion when it
  // appears, never a static first-frame that then jumps to video. It plays through the morph (behind the
  // hero) at a gentle pace, so screen 2 lands on a live, already-moving room.
  if (!autoPlayed && currentReveal > 0.02 && roomVid && roomVid.readyState >= 2) {
    autoPlayed = true;
    try { roomVid.playbackRate = AUTOPLAY_RATE; roomVid.currentTime = 0; roomVid.play().catch(function(){}); } catch(e){}
  }
  // Reset only once fully back on screen 1, so the next arrival replays cleanly from the top.
  if (currentReveal < 0.02) { autoPlayed = false; roomEnded = false; resolveRaw = 0; }

  // The resolution words appear ONLY after the room video has fully finished (all dust cleaned) — never during float or suck-in.
  if (!resolveForced) {
    const dur = roomVid.duration || 9;
    const ended = roomEnded || (roomVid.readyState >= 1 && dur > 1 && isFinite(roomVid.currentTime) && roomVid.currentTime >= dur - 0.05);
    if (ended && currentReveal > 0.85) resolveRaw = Math.min(1, resolveRaw + dt / 900);   // ~0.9s gentle cross-fade
  }
  const rp = easeInOut(Math.max(0, Math.min(1, resolveRaw)));
  document.body.style.setProperty('--hero-op', textO * (1 - rp));    // problem headline fades out
  document.body.style.setProperty('--resolve-op', textO * rp);        // resolution fades in

  if(detailMode){
    const d=detailLensTarget();
    bub.x += (d.x-bub.x)*0.10;
    bub.y += (d.y-bub.y)*0.10;
    bub.R += (d.R-bub.R)*0.10;
    if(specIndex!==detailIndex) setSpec(detailIndex);
  } else if(PROBE!==null){
    const p=pollutantPoint(+PROBE||0);
    bub.x+=(p.x-bub.x)*0.2; bub.y+=(p.y-bub.y)*0.2;
    bub.R+=(targetR()-bub.R)*0.15;
    if(specIndex!==(+PROBE||0)) setSpec(+PROBE||0);
  } else if(mode==='mouse' && t-lastMove<2600){
    bub.x+=(bub.tx-bub.x)*0.16;
    bub.y+=(bub.ty-bub.y)*0.16;
    const near=findNearestSpec(bub.x,bub.y);
    if(near!==specIndex) setSpec(near);
  } else {
    mode='auto';
    const target=pollutantPoint(autoIdx);
    if(autoState==='glide'){
      const GLIDE=REDUCED?100:2400;
      const el=t-autoT0;
      if(el>=GLIDE){
        bub.x=target.x; bub.y=target.y;
        autoState='dwell'; autoT0=t;
        if(specIndex!==autoIdx) setSpec(autoIdx);
      } else {
        const e=easeInOut(el/GLIDE);
        bub.x=autoStart.x+(target.x-autoStart.x)*e;
        bub.y=autoStart.y+(target.y-autoStart.y)*e;
        if(el>GLIDE-30){bub.x=target.x;bub.y=target.y;}
        if(el>GLIDE*0.55 && specIndex!==autoIdx) setSpec(autoIdx);
      }
    } else {
      const DWELL=2500;
      const el=t-autoT0;
      bub.x=target.x; bub.y=target.y;
      if(el>=DWELL){
        autoIdx=(autoIdx+1)%SPECS.length;
        autoState='glide'; autoT0=t;
        autoStart={x:bub.x,y:bub.y};
      }
    }
  }

  if(!detailMode) bub.R+=(targetR()-bub.R)*0.12;
  updateDust(t, dt);
  draw(t);
  requestAnimationFrame(tick);
}

autoStart={x:bub.x,y:bub.y};
autoT0=performance.now();

function draw(t){
  ctx.clearRect(0,0,W,H);
  drawDust(t);
  drawLens(t);
  positionTag();
}

function drawLens(t){
  if(lensO<=0.001) return;
  const R=bub.R, x=bub.x, y=bub.y, s=SPECS[specIndex];

  ctx.save();
  ctx.globalAlpha = lensO;
  ctx.beginPath();
  ctx.arc(x, y+8, R*0.94, 0, Math.PI*2);
  ctx.fillStyle='rgba(30,34,40,0.18)';
  ctx.filter='blur(14px)';
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = lensO;
  ctx.beginPath();
  ctx.arc(x, y, R, 0, Math.PI*2);
  ctx.clip();
  const vw=(s.vReady && s.vid.videoWidth)?s.vid.videoWidth:(s.ready?s.img.naturalWidth:2);
  const vh=(s.vReady && s.vid.videoHeight)?s.vid.videoHeight:(s.ready?s.img.naturalHeight:2);
  const d=R*2;
  let dw=d, dh=d;
  if(vw&&vh){
    const scale=Math.max(d/vw, d/vh);
    dw=vw*scale; dh=vh*scale;
  }
  if(s.vReady && s.vid.readyState>=2){
    ctx.drawImage(s.vid, x-dw/2, y-dh/2, dw, dh);
  } else if(s.ready){
    ctx.drawImage(s.img, x-dw/2, y-dh/2, dw, dh);
  } else {
    ctx.fillStyle='#e2e6ea';
    ctx.fillRect(x-R,y-R,2*R,2*R);
  }

  const vg=ctx.createRadialGradient(x,y,R*0.74, x,y,R);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(0.7,'rgba(16,20,26,0.04)');
  vg.addColorStop(1,'rgba(16,20,26,0.22)');
  ctx.fillStyle=vg;
  ctx.fillRect(x-R,y-R,2*R,2*R);

  const gloss=ctx.createRadialGradient(x-R*0.42, y-R*0.42, R*0.02, x-R*0.42, y-R*0.42, R*0.95);
  gloss.addColorStop(0,'rgba(255,255,255,0.42)');
  gloss.addColorStop(0.35,'rgba(255,255,255,0.14)');
  gloss.addColorStop(0.7,'rgba(255,255,255,0.0)');
  gloss.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gloss;
  ctx.fillRect(x-R,y-R,2*R,2*R);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = lensO;
  ctx.lineWidth=6;
  const bezel=ctx.createLinearGradient(x-R, y-R, x+R, y+R);
  bezel.addColorStop(0,'rgba(255,255,255,0.55)');
  bezel.addColorStop(0.5,'rgba(170,176,184,0.28)');
  bezel.addColorStop(1,'rgba(255,255,255,0.42)');
  ctx.strokeStyle=bezel;
  ctx.beginPath(); ctx.arc(x,y,R-3,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = lensO;
  ctx.lineWidth=1.8;
  ctx.strokeStyle='rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.arc(x,y,R-0.9,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = lensO;
  ctx.lineWidth=2.2;
  ctx.lineCap='round';
  const rimGrad=ctx.createLinearGradient(x-R*0.7, y-R*0.7, x+R*0.7, y+R*0.7);
  rimGrad.addColorStop(0,'rgba(255,255,255,0.98)');
  rimGrad.addColorStop(0.45,'rgba(255,255,255,0.75)');
  rimGrad.addColorStop(1,'rgba(255,255,255,0.25)');
  ctx.strokeStyle=rimGrad;
  ctx.beginPath(); ctx.arc(x,y,R-0.9, Math.PI*0.95, Math.PI*1.7); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = lensO;
  ctx.lineWidth=3.2;
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(x,y,R-1.6, Math.PI*1.08, Math.PI*1.5); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = lensO;
  ctx.lineWidth=2;
  ctx.strokeStyle='rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.arc(x,y,R+1.2,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = lensO;
  ctx.lineWidth=1;
  ctx.strokeStyle='rgba(255,255,255,0.30)';
  ctx.beginPath(); ctx.arc(x,y,R-6.5,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  ctx.globalAlpha=1;
}

function positionTag(){
  if(detailMode){ tagEl.classList.remove('show'); return; }
  const R=bub.R, x=bub.x, y=bub.y;
  const chipW=tagEl.offsetWidth||220, chipH=tagEl.offsetHeight||96;
  const mobile = W < 720;
  
  let ax, ay, ex, ey, cx, cy;
  if (mobile) {
    const sideRight = (x + R + 28 + chipW/2 < W - 8);
    const side = sideRight ? 1 : -1;
    const placeAbove = (y - R*0.5 - chipH/2 - 12 > 8);
    const ang = side===1 ? (placeAbove? -Math.PI*0.28 : Math.PI*0.28)
                         : (placeAbove? -Math.PI*0.72 : Math.PI*0.72);
    ax = x + Math.cos(ang)*R;
    ay = y + Math.sin(ang)*R;
    ex = x + Math.cos(ang)*(R+22);
    ey = y + Math.sin(ang)*(R+22);
    cx = ex + side*(chipW/2 + 6);
    cy = ey;
  } else {
    const sideRight = (x + R + 28 + chipW < W - 8);
    const side = sideRight ? 1 : -1;
    const ang = side===1 ? 0 : Math.PI;
    ax = x + Math.cos(ang)*R;
    ay = y + Math.sin(ang)*R;
    ex = x + Math.cos(ang)*(R+22);
    ey = y + Math.sin(ang)*(R+22);
    cx = ex + side*(chipW/2 + 6);
    cy = ey;
  }

  const left = Math.max(8, Math.min(W-chipW-8, cx-chipW/2));
  let top  = Math.max(8, Math.min(H-chipH-8, cy-chipH/2));
  const safeTop = mobile ? H * 0.32 : H * 0.42;
  if (top < safeTop) top = safeTop;
  tagEl.style.transform=`translate(${left}px, ${top}px)`;
  tagEl.classList.add('show');
}

requestAnimationFrame(tick);
</script>
</body>
</html>

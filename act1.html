<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoFlashing — Microscope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:-apple-system,system-ui,'Inter','Space Grotesk',sans-serif;
    color:#2a2622;
    background:#ece7e1 url('assets/Background.png') center/cover no-repeat;
    cursor:none;
    -webkit-font-smoothing:antialiased;
  }
  #scene{position:fixed;inset:0;z-index:1;}
  .scrim{position:fixed;top:0;left:0;width:64%;height:62%;z-index:2;pointer-events:none;
    background:radial-gradient(120% 95% at 12% 22%, rgba(236,231,225,0.72) 0%, rgba(236,231,225,0.28) 48%, rgba(236,231,225,0) 76%);}
  .brand{position:fixed;top:4vh;left:5vw;z-index:3;height:140px;pointer-events:none;}
  .brand img{height:100%;width:auto;display:block;}
  .hero{position:fixed;z-index:3;left:5vw;max-width:26ch;pointer-events:none;
    top:calc(4vh + 140px + 5vh);}
  h1{
    font-family:-apple-system,system-ui,'Inter','Space Grotesk',sans-serif;
    font-weight:600;
    font-size:clamp(34px,5.4vw,72px);
    line-height:1.05;
    letter-spacing:-0.022em;
    color:#1a1a1a;
    text-wrap:balance;
  }
  h1 .chg{
    color:#e23b3b;
    font-weight:700;
    letter-spacing:-0.02em;
    white-space:nowrap;
  }
  /* premium annotation card */
  .tag{
    position:fixed;z-index:5;pointer-events:none;
    background:rgba(255,255,255,0.96);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    backdrop-filter:blur(14px) saturate(140%);
    border:1px solid rgba(20,20,20,0.08);
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12), 0 1px 3px rgba(0,0,0,0.06);
    padding:15px 16px 13px;
    min-width:218px;max-width:248px;
    opacity:0;transition:opacity .28s ease;
    will-change:transform,opacity;
  }
  .tag.show{opacity:1;}
  .tag .name{
    font-weight:600;font-size:17px;letter-spacing:-0.012em;
    color:#1a1a1a;line-height:1.2;
  }
  .tag .charge{
    display:flex;align-items:center;gap:7px;margin-top:8px;
    font-size:13px;letter-spacing:0;color:#6a6a6a;
  }
  .tag .charge .badge{
    display:inline-flex;align-items:center;justify-content:center;
    width:16px;height:16px;flex:0 0 auto;border-radius:50%;
    background:#e23b3b;color:#fff;font-size:11px;line-height:1;font-weight:700;
  }
  .tag .divider{
    height:1px;margin:11px 0 9px;
    background:rgba(20,20,20,0.08);
  }
  .tag .more{
    display:inline-flex;align-items:center;gap:5px;pointer-events:auto;cursor:pointer;
    font-size:13px;color:#e23b3b;font-weight:500;
    text-decoration:none;user-select:none;
    border-bottom:1px solid transparent;
    transition:color .15s ease, border-color .15s ease, gap .18s ease;
  }
  .tag .more:hover{border-bottom-color:#e23b3b;gap:8px;}
  .tag .more .arrow{transition:transform .18s ease;}
  .tag .more:hover .arrow{transform:translateX(2px);}
  @media (max-width:720px){
    .brand{height:92px;top:3vh;}
    .hero{top:calc(3vh + 92px + 4vh);max-width:none;right:5vw;}
    h1{font-size:clamp(26px,7.2vw,40px);}
    .tag{min-width:188px;max-width:208px;padding:13px 14px 11px;}
    .tag .name{font-size:15px;}
    .tag .charge{font-size:12px;}
    .tag .more{font-size:12px;}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="scrim"></div>
<div class="brand"><img src="assets/brand/nanoflashing_black.svg" alt="NanoFlashing"></div>
<div class="hero">
  <h1>Most pollutants<br>carry a<br><span class="chg">negative charge.</span></h1>
</div>
<div class="tag" id="tag">
  <div class="name" id="t-name">—</div>
  <div class="charge"><span class="badge">⊖</span> Negatively charged</div>
  <div class="divider"></div>
  <a class="more" id="t-more" href="#">Learn more <span class="arrow">→</span></a>
</div>
<script>
const cv=document.getElementById('scene'), ctx=cv.getContext('2d');
const tagEl=document.getElementById('tag'), tName=document.getElementById('t-name'), tMore=document.getElementById('t-more');
tMore.addEventListener('click',e=>{e.preventDefault();});

let W=0,H=0,DPR=1,lastT=performance.now();

const SPECS=[
  {key:'Wildfire_Smoke_Particle', name:'Wildfire smoke', rate:0.78},
  {key:'Fungal_Spore',            name:'Fungal spore',    rate:0.67},
  {key:'Virus',                   name:'Virus',           rate:0.54},
  {key:'Bacteria',                name:'Bacteria',        rate:0.65},
  {key:'Ultrafine_Particle',      name:'Ultrafine particle', rate:0.50},
  {key:'PFAS',                    name:'PFAS',            rate:0.97},
  {key:'Pollen',                  name:'Pollen',          rate:1.57},
];
SPECS.forEach(s=>{
  const im=new Image(); im.src='assets/charged/'+s.key+'_charged.png'; s.img=im; s.ready=false; im.onload=()=>s.ready=true;
  const v=document.createElement('video');
  v.src='assets/videos/'+s.key+'_flashloop.mp4';
  v.muted=true; v.loop=true; v.playsInline=true; v.setAttribute('playsinline',''); v.preload='auto';
  s.vid=v; s.vReady=false;
  const applyRate=()=>{ try{ v.playbackRate=s.rate; }catch(e){} };
  v.addEventListener('loadeddata',()=>{ s.vReady=true; applyRate(); });
  v.addEventListener('canplay',applyRate);
  v.addEventListener('play',applyRate);
  v.addEventListener('ratechange',()=>{ if(Math.abs(v.playbackRate-s.rate)>0.001){ try{v.playbackRate=s.rate;}catch(e){} } });
});

const REDUCED=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const PROBE=new URLSearchParams(location.search).get('probe');

const POSITIONS=[
  {x:0.60,y:0.30},
  {x:0.82,y:0.40},
  {x:0.48,y:0.56},
  {x:0.74,y:0.62},
  {x:0.36,y:0.70},
  {x:0.86,y:0.74},
  {x:0.58,y:0.82},
];

function pollutantPoint(i){
  const p=POSITIONS[i%POSITIONS.length];
  return {x:p.x*W, y:p.y*H};
}

// ---------- dust ----------
const NB=8;
let dustB=[];
function mote(){
  const ang=Math.random()*Math.PI*2;
  const sp=0.18+Math.random()*0.32;
  return {
    x:Math.random()*W, y:Math.random()*H,
    vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
    r:.55+Math.random()*1.7
  };
}
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const n=Math.round(Math.min(3800, W*H/520));
  dustB=[]; for(let b=0;b<NB;b++) dustB.push({a:0.08+b*0.045, motes:[]});
  for(let i=0;i<n;i++) dustB[(Math.random()*NB)|0].motes.push(mote());
}
function updateDust(dt){
  const f=dt/16.67;
  for(const bucket of dustB){
    for(const d of bucket.motes){
      if(!REDUCED){
        d.vx += (Math.random()-.5)*0.018*f;
        d.vy += (Math.random()-.5)*0.018*f;
        d.vx *= Math.pow(0.992, f);
        d.vy *= Math.pow(0.992, f);
        let sp = Math.hypot(d.vx, d.vy);
        if(sp < 0.12){
          if(sp < 1e-6){ const a=Math.random()*Math.PI*2; d.vx=Math.cos(a)*0.18; d.vy=Math.sin(a)*0.18; }
          else { const k=0.18/sp; d.vx*=k; d.vy*=k; }
          sp = 0.18;
        } else if(sp > 0.5){
          const k=0.5/sp; d.vx*=k; d.vy*=k; sp=0.5;
        }
        d.x += d.vx*f; d.y += d.vy*f;
      }
      if(isNaN(d.x)||isNaN(d.y)||!isFinite(d.x)||!isFinite(d.y)){
        d.x=Math.random()*W; d.y=Math.random()*H;
        const a=Math.random()*Math.PI*2; const s=0.25;
        d.vx=Math.cos(a)*s; d.vy=Math.sin(a)*s;
        continue;
      }
      if(d.x<-4)d.x=W+4; else if(d.x>W+4)d.x=-4;
      if(d.y<-4)d.y=H+4; else if(d.y>H+4)d.y=-4;
    }
  }
}
// soft round mote sprite (built once) — replaces hard square fillRect
const moteSprite=document.createElement('canvas'); moteSprite.width=moteSprite.height=18;
(function(){const m=moteSprite.getContext('2d');
  const g=m.createRadialGradient(9,9,0,9,9,9);
  g.addColorStop(0,'rgba(74,66,58,0.95)'); g.addColorStop(0.45,'rgba(74,66,58,0.55)'); g.addColorStop(1,'rgba(74,66,58,0)');
  m.fillStyle=g; m.beginPath(); m.arc(9,9,9,0,6.2832); m.fill();})();
function drawDust(){
  for(const bucket of dustB){
    ctx.globalAlpha=bucket.a;
    for(const d of bucket.motes){
      const s=d.r*3.0;
      ctx.drawImage(moteSprite, d.x-s/2, d.y-s/2, s, s);
    }
  }
  ctx.globalAlpha=1;
}

// ---------- lens state ----------
const bub={x:0,y:0,tx:0,ty:0,R:0};
let mouseActive=false,lastMove=-9999;
let specIndex=0;
let mode='auto';
let autoIdx=0, autoState='glide', autoT0=0, autoStart={x:0,y:0};

function targetR(){
  const mobile = W<720;
  if(mobile) return W*0.64*0.5;
  return Math.min(W,H)*0.42*0.5;
}

function setSpec(i){
  specIndex=((i%SPECS.length)+SPECS.length)%SPECS.length;
  SPECS.forEach((s,k)=>{
    if(!s.vid) return;
    if(k===specIndex){ s.vid.play().catch(()=>{}); try{s.vid.playbackRate=s.rate;}catch(e){} }
    else { try{s.vid.pause();}catch(e){} }
  });
  tName.textContent=SPECS[specIndex].name;
}

function findNearestSpec(x,y){
  let best=0,bd=1e9;
  for(let i=0;i<POSITIONS.length;i++){
    const p=pollutantPoint(i);
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<bd){bd=d;best=i;}
  }
  return best;
}

function easeInOut(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

addEventListener('mousemove',e=>{
  bub.tx=e.clientX; bub.ty=e.clientY;
  mouseActive=true; lastMove=performance.now();
  mode='mouse';
});
addEventListener('mouseleave',()=>{mouseActive=false;});
addEventListener('touchmove',e=>{
  if(e.touches[0]){bub.tx=e.touches[0].clientX;bub.ty=e.touches[0].clientY;mouseActive=true;lastMove=performance.now();mode='mouse';}
},{passive:true});
addEventListener('touchend',()=>{mouseActive=false;});
addEventListener('resize',resize);

function resetClock(){ lastT=performance.now(); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') resetClock(); });
window.addEventListener('focus',resetClock);

resize();
bub.x=W*0.5; bub.y=H*0.5; bub.tx=bub.x; bub.ty=bub.y;
setSpec(PROBE!==null?(+PROBE||0):0);
if(PROBE!==null){ bub.x=pollutantPoint(+PROBE||0).x; bub.y=pollutantPoint(+PROBE||0).y; }

// ---------- main loop ----------
function tick(t){
  const dt=Math.min(40, t-lastT);
  lastT=t;

  updateDust(dt);

  if(PROBE!==null){
    const p=pollutantPoint(+PROBE||0);
    bub.x+=(p.x-bub.x)*0.2; bub.y+=(p.y-bub.y)*0.2;
    bub.R+=(targetR()-bub.R)*0.15;
    if(specIndex!==(+PROBE||0)) setSpec(+PROBE||0);
  } else if(mode==='mouse' && t-lastMove<2600){
    bub.x+=(bub.tx-bub.x)*0.16;
    bub.y+=(bub.ty-bub.y)*0.16;
    const near=findNearestSpec(bub.x,bub.y);
    if(near!==specIndex) setSpec(near);
  } else {
    mode='auto';
    const target=pollutantPoint(autoIdx);
    if(autoState==='glide'){
      const GLIDE=REDUCED?100:2400;
      const el=t-autoT0;
      if(el>=GLIDE){
        bub.x=target.x; bub.y=target.y;
        autoState='dwell'; autoT0=t;
        if(specIndex!==autoIdx) setSpec(autoIdx);
      } else {
        const e=easeInOut(el/GLIDE);
        bub.x=autoStart.x+(target.x-autoStart.x)*e;
        bub.y=autoStart.y+(target.y-autoStart.y)*e;
        if(el>GLIDE-30){bub.x=target.x;bub.y=target.y;}
        if(el>GLIDE*0.55 && specIndex!==autoIdx) setSpec(autoIdx);
      }
    } else {
      const DWELL=2500;
      const el=t-autoT0;
      bub.x=target.x; bub.y=target.y;
      if(el>=DWELL){
        autoIdx=(autoIdx+1)%SPECS.length;
        autoState='glide'; autoT0=t;
        autoStart={x:bub.x,y:bub.y};
      }
    }
  }

  bub.R+=(targetR()-bub.R)*0.12;
  draw(t);
  requestAnimationFrame(tick);
}

autoStart={x:bub.x,y:bub.y};
autoT0=performance.now();

function draw(t){
  ctx.clearRect(0,0,W,H);
  drawDust();
  drawLens(t);
  positionTag();
}

function drawLens(t){
  const R=bub.R, x=bub.x, y=bub.y, s=SPECS[specIndex];

  // 1. small soft contact shadow under the lens (offset ~8px, blurred, opacity ~0.18)
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y+8, R*0.94, 0, Math.PI*2);
  ctx.fillStyle='rgba(40,34,28,0.18)';
  ctx.filter='blur(14px)';
  ctx.fill();
  ctx.restore();

  // 2. clip to circle and draw the specimen VIDEO covering the whole circle
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, R, 0, Math.PI*2);
  ctx.clip();
  const vw=(s.vReady && s.vid.videoWidth)?s.vid.videoWidth:(s.ready?s.img.naturalWidth:2);
  const vh=(s.vReady && s.vid.videoHeight)?s.vid.videoHeight:(s.ready?s.img.naturalHeight:2);
  const d=R*2;
  let dw=d, dh=d;
  if(vw&&vh){
    const scale=Math.max(d/vw, d/vh);
    dw=vw*scale; dh=vh*scale;
  }
  if(s.vReady && s.vid.readyState>=2){
    ctx.drawImage(s.vid, x-dw/2, y-dh/2, dw, dh);
  } else if(s.ready){
    ctx.drawImage(s.img, x-dw/2, y-dh/2, dw, dh);
  } else {
    ctx.fillStyle='#e8e0d4';
    ctx.fillRect(x-R,y-R,2*R,2*R);
  }

  // 2b. subtle inner-edge vignette (soft darkening only in last ~12% toward rim)
  const vg=ctx.createRadialGradient(x,y,R*0.74, x,y,R);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(0.7,'rgba(20,16,12,0.04)');
  vg.addColorStop(1,'rgba(20,16,12,0.22)');
  ctx.fillStyle=vg;
  ctx.fillRect(x-R,y-R,2*R,2*R);

  // 2c. soft specular gloss in upper-left quadrant (light on a glass dome)
  const gloss=ctx.createRadialGradient(x-R*0.42, y-R*0.42, R*0.02, x-R*0.42, y-R*0.42, R*0.95);
  gloss.addColorStop(0,'rgba(255,255,255,0.42)');
  gloss.addColorStop(0.35,'rgba(255,255,255,0.14)');
  gloss.addColorStop(0.7,'rgba(255,255,255,0.0)');
  gloss.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=gloss;
  ctx.fillRect(x-R,y-R,2*R,2*R);
  ctx.restore();

  // 3. PREMIUM GLASS RIM
  // 3a. thin bezel band just inside rim — subtle light→dark→light sheen
  ctx.save();
  ctx.lineWidth=6;
  const bezel=ctx.createLinearGradient(x-R, y-R, x+R, y+R);
  bezel.addColorStop(0,'rgba(255,255,255,0.55)');
  bezel.addColorStop(0.5,'rgba(180,170,158,0.28)');
  bezel.addColorStop(1,'rgba(255,255,255,0.42)');
  ctx.strokeStyle=bezel;
  ctx.beginPath(); ctx.arc(x,y,R-3,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  // 3b. crisp bright rim highlight — full thin ring
  ctx.save();
  ctx.lineWidth=1.8;
  ctx.strokeStyle='rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.arc(x,y,R-0.9,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  // bright upper-left arc (light source)
  ctx.save();
  ctx.lineWidth=2.2;
  ctx.lineCap='round';
  const rimGrad=ctx.createLinearGradient(x-R*0.7, y-R*0.7, x+R*0.7, y+R*0.7);
  rimGrad.addColorStop(0,'rgba(255,255,255,0.98)');
  rimGrad.addColorStop(0.45,'rgba(255,255,255,0.75)');
  rimGrad.addColorStop(1,'rgba(255,255,255,0.25)');
  ctx.strokeStyle=rimGrad;
  ctx.beginPath(); ctx.arc(x,y,R-0.9, Math.PI*0.95, Math.PI*1.7); ctx.stroke();
  ctx.restore();

  // 3c. soft specular crescent on the upper-left rim edge
  ctx.save();
  ctx.lineWidth=3.2;
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(x,y,R-1.6, Math.PI*1.08, Math.PI*1.5); ctx.stroke();
  ctx.restore();

  // 3d. faint outer halo — glass melting into room (no hard border)
  ctx.save();
  ctx.lineWidth=2;
  ctx.strokeStyle='rgba(255,255,255,0.18)';
  ctx.beginPath(); ctx.arc(x,y,R+1.2,0,Math.PI*2); ctx.stroke();
  ctx.restore();

  // 3e. inner hairline for glass depth
  ctx.save();
  ctx.lineWidth=1;
  ctx.strokeStyle='rgba(255,255,255,0.30)';
  ctx.beginPath(); ctx.arc(x,y,R-6.5,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

// ---------- tag chip ----------
function positionTag(){
  const R=bub.R, x=bub.x, y=bub.y;
  const chipW=tagEl.offsetWidth||220, chipH=tagEl.offsetHeight||96;
  const sideRight = (x + R + 28 + chipW/2 < W - 8);
  const side = sideRight ? 1 : -1;
  const placeAbove = (y - R*0.5 - chipH/2 - 12 > 8);
  const ang = side===1 ? (placeAbove? -Math.PI*0.28 : Math.PI*0.28)
                       : (placeAbove? -Math.PI*0.72 : Math.PI*0.72);
  const ax = x + Math.cos(ang)*R;
  const ay = y + Math.sin(ang)*R;
  const ex = x + Math.cos(ang)*(R+22);
  const ey = y + Math.sin(ang)*(R+22);
  const cx = ex + side*(chipW/2 + 6);
  const cy = ey;

  ctx.save();
  // short thin connector from pin on rim to card
  ctx.strokeStyle='rgba(60,54,46,0.45)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(ax,ay);
  ctx.lineTo(ex,ey);
  ctx.stroke();
  // hotspot pin sitting ON the lens rim
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(ax,ay,3.2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(226,59,59,0.9)';
  ctx.lineWidth=1.4; ctx.beginPath(); ctx.arc(ax,ay,3.2,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#e23b3b';
  ctx.beginPath(); ctx.arc(ax,ay,1.4,0,Math.PI*2); ctx.fill();
  ctx.restore();

  const left = Math.max(8, Math.min(W-chipW-8, cx-chipW/2));
  const top  = Math.max(8, Math.min(H-chipH-8, cy-chipH/2));
  tagEl.style.transform=`translate(${left}px, ${top}px)`;
  tagEl.classList.add('show');
}

requestAnimationFrame(tick);
</script>
</body>
</html>

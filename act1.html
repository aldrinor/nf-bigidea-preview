<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoFlashing — Act 01: The Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#eef2f5; --bg2:#e7ecf1;
    --ink:#11181f; --muted:#5d6b78;
    --red:#ef5364; --cyan:#1B7BFF;
    --line:rgba(17,24,31,0.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; overflow-x:hidden;}
  body{
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    min-height: 100vh;
  }
  #dust{position:fixed; inset:0; z-index:0; pointer-events:none; display:block;}
  .stage{position:relative; z-index:2; min-height:100vh; padding: 56px 64px; display:flex; flex-direction:column;}
  .top{max-width: 920px;}
  .eyebrow{
    font-family:'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 32px;
    display:flex; align-items:center; gap:12px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--red); box-shadow:0 0 10px rgba(239,83,100,0.7);}
  h1{
    font-family:'Instrument Serif', serif;
    font-weight:400;
    font-size: clamp(40px, 6.6vw, 88px);
    line-height: 1.04;
    letter-spacing: -0.012em;
    color: var(--ink);
    margin-bottom: 26px;
    max-width: 14ch;
  }
  h1 em{font-style:italic; color: var(--red);}
  .sub{
    font-family:'Space Grotesk', sans-serif;
    font-weight:300;
    font-size: clamp(15px, 1.35vw, 18px);
    line-height:1.55;
    color: var(--muted);
    max-width: 520px;
  }
  .rule{
    margin-top: 28px;
    width: 56px; height:1px; background: var(--line);
  }
  /* bubble label */
  .bubble-label{
    position:fixed; z-index:3;
    pointer-events:none;
    transform: translate(0, -50%);
    opacity:0;
    transition: opacity 0.4s ease;
    width: 240px;
  }
  .bubble-label.show{opacity:1;}
  .bubble-label .scan-line{
    font-family:'Space Mono', monospace;
    font-size:10px; letter-spacing:0.2em; text-transform:uppercase;
    color: var(--cyan);
    margin-bottom:10px;
    display:flex; align-items:center; gap:8px;
  }
  .bubble-label .scan-line::before{
    content:''; width:16px; height:1px; background:var(--cyan); flex-shrink:0;
  }
  .bubble-label .label{
    font-family:'Instrument Serif', serif;
    font-size: 28px; line-height:1.08; color: var(--ink);
    margin-bottom: 10px;
    letter-spacing:-0.01em;
  }
  .bubble-label .badge{
    font-family:'Space Mono', monospace;
    font-size: 10px; letter-spacing:0.06em;
    color: var(--red);
    background: rgba(239,83,100,0.07);
    border: 1px solid rgba(239,83,100,0.28);
    padding: 5px 9px; border-radius: 3px;
    display:inline-block;
    line-height:1.3;
  }
  .bubble-label .tag{
    font-family:'Space Mono', monospace;
    font-size: 9px; letter-spacing:0.16em; text-transform:uppercase;
    color: var(--muted);
    margin-top:12px;
    display:flex; align-items:center; gap:6px;
  }
  .bubble-label .tag::before{
    content:''; width:5px; height:5px; border-radius:50%;
    background: var(--red); box-shadow:0 0 6px rgba(239,83,100,0.6);
  }
  /* corners */
  .corner{
    position:fixed; bottom: 32px; left: 64px; z-index:3;
    font-family:'Space Mono', monospace;
    font-size: 10px; letter-spacing:0.2em; text-transform:uppercase;
    color: var(--muted);
    display:flex; align-items:center; gap:10px;
  }
  .corner .pulse{width:6px;height:6px;border-radius:50%;background:var(--cyan); box-shadow:0 0 8px rgba(27,123,255,0.6); animation: pulse 2.4s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:0.35; transform:scale(0.85);}50%{opacity:1; transform:scale(1);}}
  .corner-r{
    position:fixed; bottom: 32px; right: 64px; z-index:3;
    font-family:'Space Mono', monospace;
    font-size: 10px; letter-spacing:0.2em; text-transform:uppercase;
    color: var(--muted);
    text-align:right;
  }
  .corner-r span{color: var(--ink);}
  .counter{
    position:fixed; top: 56px; right: 64px; z-index:3;
    font-family:'Space Mono', monospace;
    font-size: 10px; letter-spacing:0.18em; text-transform:uppercase;
    color: var(--muted);
    text-align:right;
    line-height:1.6;
  }
  .counter .num{color: var(--ink); font-size: 13px; letter-spacing:0.1em;}
  .counter .of{opacity:0.5;}
  .legend{
    position:fixed; top: 56px; right: 64px; z-index:3;
    display:none;
  }
  @media (max-width: 720px){
    .stage{padding: 36px 26px;}
    .corner{left:26px; bottom:22px; font-size:9px;}
    .corner-r{right:26px; bottom:22px; font-size:9px;}
    .counter{top:36px; right:26px; font-size:9px;}
    .counter .num{font-size:11px;}
    .bubble-label{width: 180px;}
    .bubble-label .label{font-size:22px;}
    h1{max-width:none;}
  }
</style>
</head>

const canvas = document.getElementById('dust');
const ctx = canvas.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W*DPR);
  canvas.height = Math.floor(H*DPR);
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  bubR = W<720 ? 112 : (W<1100 ? 140 : 168);
  buildDust();
  updateHeadlineRect();
}

const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- Dust ----
let dust = [];
function buildDust(){
  const count = W<600 ? 520 : (W<1100 ? 950 : 1340);
  dust = [];
  for(let i=0;i<count;i++){
    dust.push({
      x: Math.random()*W,
      y: Math.random()*H,
      vx: (Math.random()-0.5)*0.10,
      vy: (Math.random()-0.5)*0.10,
      r: 1.1 + Math.random()*1.9,
      a: 0.42 + Math.random()*0.48,
      ph: Math.random()*Math.PI*2,
      sp: 0.0006 + Math.random()*0.0014
    });
  }
}

let hRect = {x:0,y:0,w:0,h:0};
function updateHeadlineRect(){
  const top = document.querySelector('.top');
  if(!top){ hRect={x:0,y:0,w:0,h:0}; return; }
  const r = top.getBoundingClientRect();
  hRect = {x:r.left-20, y:r.top-20, w:r.width+40, h:r.height+40};
}

// ---- Bubble tour ----
let bubIdx = 0;
let bubState = 'dwell'; // 'travel' | 'dwell'
let bubT = 0;
const TRAVEL = 0.9;
const DWELL = 2.2;
let bubFrom = {x:0,y:0};
let bubTo = {x:0,y:0};
let bubX = 0, bubY = 0;
let bubR = 168;

function featureScreenPos(f){
  const s = Math.min(W,H) * (W<720 ? 0.026 : 0.032);
  return {
    x: W*0.5 + f.position[0]*s,
    y: H*0.5 - f.position[1]*s
  };
}
function easeInOutCubic(t){return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

function initBubble(){
  const p = featureScreenPos(FEATURES[0]);
  bubFrom = {x:p.x, y:p.y};
  bubTo = {x:p.x, y:p.y};
  bubX = p.x; bubY = p.y;
  bubState = 'dwell'; bubT = 0;
}

function updateBubble(dt){
  bubT += dt;
  if(bubState==='travel'){
    const t = Math.min(1, bubT/TRAVEL);
    const e = easeInOutCubic(t);
    bubX = bubFrom.x + (bubTo.x-bubFrom.x)*e;
    bubY = bubFrom.y + (bubTo.y-bubFrom.y)*e;
    if(t>=1){ bubState='dwell'; bubT=0; }
  } else {
    bubX = bubTo.x; bubY = bubTo.y;
    if(bubT >= DWELL){
      bubIdx = (bubIdx+1) % FEATURES.length;
      bubFrom = {x:bubX, y:bubY};
      bubTo = featureScreenPos(FEATURES[bubIdx]);
      bubState='travel'; bubT=0;
    }
  }
}

// ---- Inner dust (calmer, inside bubble) ----
const innerDust = [];
for(let i=0;i<26;i++){
  innerDust.push({
    a: Math.random()*Math.PI*2,
    r: Math.random(),
    sp: (Math.random()-0.5)*0.0006,
    rr: 0.5 + Math.random()*1.0,
    al: 0.15 + Math.random()*0.25
  });
}
function drawInnerDust(cx,cy,R){
  ctx.fillStyle = '#ef5364';
  for(const d of innerDust){
    d.a += d.sp;
    const px = cx + Math.cos(d.a)*d.r*R*0.92;
    const py = cy + Math.sin(d.a)*d.r*R*0.92;
    ctx.globalAlpha = d.al;
    ctx.beginPath();
    ctx.arc(px,py,d.rr,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ---- Molecule drawing ----
function drawMolecule(f, cx, cy, R){
  const atoms = f.atoms;
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const a of atoms){
    if(a.x<minX)minX=a.x; if(a.x>maxX)maxX=a.x;
    if(a.y<minY)minY=a.y; if(a.y>maxY)maxY=a.y;
  }
  const ext = Math.max(maxX-minX, maxY-minY, 0.8);
  const scale = (R*0.58)/ext;
  const proj = atoms.map(a=>({
    x: cx + a.x*scale,
    y: cy - a.y*scale,
    el: a.el
  }));
  // bonds
  ctx.strokeStyle='rgba(80,92,104,0.42)';
  ctx.lineWidth=1.1;
  for(let i=0;i<atoms.length;i++){
    for(let j=i+1;j<atoms.length;j++){
      const dx=atoms[i].x-atoms[j].x, dy=atoms[i].y-atoms[j].y, dz=(atoms[i].z||0)-(atoms[j].z||0);
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d<1.85){
        ctx.beginPath();
        ctx.moveTo(proj[i].x,proj[i].y);
        ctx.lineTo(proj[j].x,proj[j].y);
        ctx.stroke();
      }
    }
  }
  // charge halos (behind atoms)
  for(const ci of f.chargeAtoms){
    const p=proj[ci]; if(!p) continue;
    const hr = R*0.30;
    const grd=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,hr);
    grd.addColorStop(0,'rgba(239,83,100,0.55)');
    grd.addColorStop(0.5,'rgba(239,83,100,0.22)');
    grd.addColorStop(1,'rgba(239,83,100,0)');
    ctx.fillStyle=grd;
    ctx.beginPath(); ctx.arc(p.x,p.y,hr,0,Math.PI*2); ctx.fill();
  }
  // atoms
  for(let i=0;i<proj.length;i++){
    const p=proj[i];
    const col = CPK[p.el] || '#888';
    const ar = (p.el==='S'||p.el==='P')?4.6 : (p.el==='Cl')?4.2 : 3.3;
    ctx.fillStyle=col;
    ctx.beginPath(); ctx.arc(p.x,p.y,ar,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.32)';
    ctx.beginPath(); ctx.arc(p.x-ar*0.3,p.y-ar*0.3,ar*0.42,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(17,24,31,0.22)';
    ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.arc(p.x,p.y,ar,0,Math.PI*2); ctx.stroke();
  }
  // mono tag inside bubble
  ctx.fillStyle='rgba(239,83,100,0.85)';
  ctx.font='9px "Space Mono", monospace';
  ctx.textAlign='center';
  ctx.fillText('— CHARGE ZONE', cx, cy+R*0.80);
}

// ---- Specimen drawing ----
function drawSpecimen(f, cx, cy, R){
  const sp = f.specimen;
  const s = R*0.46;
  // red surface glow
  const grd = ctx.createRadialGradient(cx,cy,R*0.15, cx,cy,R*0.82);
  grd.addColorStop(0,'rgba(239,83,100,0.04)');
  grd.addColorStop(0.65,'rgba(239,83,100,0.14)');
  grd.addColorStop(1,'rgba(239,83,100,0)');
  ctx.fillStyle=grd;
  ctx.beginPath(); ctx.arc(cx,cy,R*0.82,0,Math.PI*2); ctx.fill();

  ctx.save();
  ctx.translate(cx,cy);
  ctx.lineCap='round';

  if(sp==='soot'){
    for(let i=0;i<7;i++){
      const a=i*0.9, r=s*0.32;
      const x=Math.cos(a)*r, y=Math.sin(a)*r;
      ctx.beginPath(); ctx.arc(x,y,s*0.2,0,Math.PI*2);
      ctx.fillStyle='rgba(38,44,52,0.88)'; ctx.fill();
      ctx.strokeStyle='rgba(239,83,100,0.45)'; ctx.lineWidth=1; ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0,0,s*0.24,0,Math.PI*2);
    ctx.fillStyle='rgba(38,44,52,0.92)'; ctx.fill();
    ctx.strokeStyle='rgba(239,83,100,0.55)'; ctx.stroke();
  } else if(sp==='virus'){
    ctx.strokeStyle='rgba(239,83,100,0.6)'; ctx.lineWidth=1.1;
    for(let i=0;i<12;i++){
      const a=i*Math.PI*2/12;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*s*0.45, Math.sin(a)*s*0.45);
      ctx.lineTo(Math.cos(a)*s*0.72, Math.sin(a)*s*0.72);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(Math.cos(a)*s*0.74, Math.sin(a)*s*0.74, s*0.07,0,Math.PI*2);
      ctx.fillStyle='rgba(239,83,100,0.7)'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0,0,s*0.45,0,Math.PI*2);
    ctx.fillStyle='rgba(82,92,104,0.85)'; ctx.fill();
    ctx.strokeStyle='rgba(239,83,100,0.55)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,s*0.18,0,Math.PI*2);
    ctx.fillStyle='rgba(60,70,82,0.7)'; ctx.fill();
  } else if(sp==='spore'){
    ctx.beginPath();
    for(let i=0;i<=28;i++){
      const a=i/28*Math.PI*2;
      const r=s*0.5 + Math.sin(a*5)*s*0.07;
      const x=Math.cos(a)*r, y=Math.sin(a)*r*0.78;
      if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(92,102,114,0.82)'; ctx.fill();
    ctx.strokeStyle='rgba(239,83,100,0.6)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,0,s*0.18,s*0.12,0,0,Math.PI*2);
    ctx.fillStyle='rgba(60,70,82,0.6)'; ctx.fill();
  } else if(sp==='rod'){
    const w=s*1.2, h=s*0.46;
    ctx.beginPath();
    if(ctx.roundRect){ ctx.roundRect(-w/2,-h/2,w,h,h/2); }
    else { ctx.rect(-w/2,-h/2,w,h); }
    ctx.fillStyle='rgba(82,92,104,0.85)'; ctx.fill();
    ctx.strokeStyle='rgba(239,83,100,0.6)'; ctx.lineWidth=1; ctx.stroke();
    ctx.strokeStyle='rgba(239,83,100,0.32)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.moveTo(-w*0.35,0); ctx.lineTo(w*0.35,0); ctx.stroke();
    ctx.fillStyle='rgba(239,83,100,0.5)';
    for(let i=0;i<4;i++){
      const x=-w*0.3 + i*w*0.2;
      ctx.beginPath(); ctx.arc(x,0,s*0.04,0,Math.PI*2); ctx.fill();
    }
  } else if(sp==='pm'){
    ctx.beginPath();
    for(let i=0;i<=18;i++){
      const a=i/18*Math.PI*2;
      const r=s*0.42 + Math.sin(a*3+1.2)*s*0.13 + Math.cos(a*5)*s*0.06;
      const x=Math.cos(a)*r, y=Math.sin(a)*r;
      if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(48,56,64,0.9)'; ctx.fill();
    ctx.strokeStyle='rgba(239,83,100,0.55)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='rgba(239,83,100,0.4)';
    ctx.beginPath(); ctx.arc(s*0.1,-s*0.1,s*0.05,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(-s*0.15,s*0.08,s*0.04,0,Math.PI*2); ctx.fill();
  } else if(sp==='pollen'){
    ctx.strokeStyle='rgba(180,158,86,0.75)'; ctx.lineWidth=1.1;
    for(let i=0;i<16;i++){
      const a=i*Math.PI*2/16;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a)*s*0.4, Math.sin(a)*s*0.4);
      ctx.lineTo(Math.cos(a)*s*0.62, Math.sin(a)*s*0.62);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(Math.cos(a)*s*0.64, Math.sin(a)*s*0.64, s*0.055,0,Math.PI*2);
      ctx.fillStyle='rgba(239,83,100,0.6)'; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0,0,s*0.4,0,Math.PI*2);
    ctx.fillStyle='rgba(184,162,90,0.85)'; ctx.fill();
    ctx.strokeStyle='rgba(239,83,100,0.5)'; ctx.lineWidth=1; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,s*0.16,0,Math.PI*2);
    ctx.fillStyle='rgba(140,120,60,0.7)'; ctx.fill();
  } else if(sp==='dust'){
    ctx.beginPath();
    for(let i=0;i<=22;i++){
      const a=i/22*Math.PI*2;
      const r=s*0.46 + Math.sin(a*4+0.5)*s*0.16 + Math.cos(a*7)*s*0.05;
      const x=Math.cos(a)*r, y=Math.sin(a)*r*0.85;
      if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fillStyle='rgba(118,98,78,0.82)'; ctx.fill();
    ctx.strokeStyle='rgba(239,83,100,0.5)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='rgba(60,50,40,0.7)';
    for(let i=0;i<5;i++){
      const a=i*1.3, r=s*0.22;
      ctx.beginPath();
      ctx.arc(Math.cos(a)*r,Math.sin(a)*r,s*0.06,0,Math.PI*2); ctx.fill();
    }
  } else if(sp==='dander'){
    ctx.beginPath();
    ctx.moveTo(-s*0.5,-s*0.1);
    ctx.quadraticCurveTo(-s*0.3,-s*0.42, s*0.1,-s*0.32);
    ctx.quadraticCurveTo(s*0.52,-s*0.2, s*0.46,s*0.16);
    ctx.quadraticCurveTo(s*0.2,s*0.42, -s*0.1,s*0.36);
    ctx.quadraticCurveTo(-s*0.5,s*0.3, -s*0.5,-s*0.1);
    ctx.closePath();
    ctx.fillStyle='rgba(222,212,196,0.88)'; ctx.fill();
    ctx.strokeStyle='rgba(239,83,100,0.6)'; ctx.lineWidth=1; ctx.stroke();
    ctx.strokeStyle='rgba(180,168,150,0.5)'; ctx.lineWidth=0.6;
    ctx.beginPath(); ctx.moveTo(-s*0.3,-s*0.05); ctx.quadraticCurveTo(0,s*0.05, s*0.3,-s*0.02); ctx.stroke();
  } else if(sp==='microplastic'){
    ctx.beginPath();
    ctx.moveTo(-s*0.5,-s*0.3);
    ctx.lineTo(s*0.2,-s*0.46);
    ctx.lineTo(s*0.56,s*0.1);
    ctx.lineTo(s*0.1,s*0.42);
    ctx.lineTo(-s*0.4,s*0.26);
    ctx.closePath();
    ctx.fillStyle='rgba(138,150,162,0.82)'; ctx.fill();
    ctx.strokeStyle='rgba(239,83,100,0.6)'; ctx.lineWidth=1; ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.32)'; ctx.lineWidth=0.7;
    ctx.beginPath(); ctx.moveTo(-s*0.2,-s*0.1); ctx.lineTo(s*0.3,s*0.15); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s*0.05,-s*0.3); ctx.lineTo(-s*0.1,s*0.2); ctx.stroke();
  }
  ctx.restore();

  // mono tag
  ctx.fillStyle='rgba(239,83,100,0.85)';
  ctx.font='9px "Space Mono", monospace';
  ctx.textAlign='center';
  ctx.fillText('— SURFACE CHARGE', cx, cy+R*0.80);
}

// ---- Bubble composite ----
function drawBubble(){
  const cx=bubX, cy=bubY, R=bubR;
  // outer soft glow
  const og = ctx.createRadialGradient(cx,cy,R*0.85, cx,cy,R*1.45);
  og.addColorStop(0,'rgba(27,123,255,0.10)');
  og.addColorStop(1,'rgba(27,123,255,0)');
  ctx.fillStyle=og;
  ctx.beginPath(); ctx.arc(cx,cy,R*1.45,0,Math.PI*2); ctx.fill();

  // clip + content
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
  // clarify background
  ctx.fillStyle='rgba(238,242,245,0.80)';
  ctx.fillRect(cx-R,cy-R,R*2,R*2);
  // calmer inner dust
  drawInnerDust(cx,cy,R);
  // structure
  const f = FEATURES[bubIdx];
  if(f.atoms) drawMolecule(f, cx, cy, R);
  else drawSpecimen(f, cx, cy, R);
  ctx.restore();

  // ring
  ctx.strokeStyle='rgba(27,123,255,0.92)';
  ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
  // inner hairline
  ctx.strokeStyle='rgba(255,255,255,0.55)';
  ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.arc(cx,cy,R-2.5,0,Math.PI*2); ctx.stroke();
  // tick marks
  ctx.strokeStyle='rgba(27,123,255,0.55)';
  ctx.lineWidth=1;
  for(let i=0;i<4;i++){
    const a = i*Math.PI/2 + Math.PI/4;
    const x1=cx+Math.cos(a)*(R+4), y1=cy+Math.sin(a)*(R+4);
    const x2=cx+Math.cos(a)*(R+11), y2=cy+Math.sin(a)*(R+11);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  // crosshair center (subtle)
  ctx.strokeStyle='rgba(27,123,255,0.18)';
  ctx.lineWidth=0.6;
  ctx.beginPath();
  ctx.moveTo(cx-6,cy); ctx.lineTo(cx+6,cy);
  ctx.moveTo(cx,cy-6); ctx.lineTo(cx,cy+6);
  ctx.stroke();
}

// ---- Label (DOM) ----
const blabel = document.getElementById('blabel');
const blLabel = document.getElementById('bl-label');
const blBadge = document.getElementById('bl-badge');
const blTag = document.getElementById('bl-tag');
const blScan = document.getElementById('bl-scan');
const idxEl = document.getElementById('idx');

function computeLabelPos(){
  const margin = 24;
  const lw = W<720 ? 180 : 240;
  let lx = bubX + bubR + 22;
  let ly = bubY;
  // flip to left if no room on right
  if(lx + lw > W - 16){
    lx = bubX - bubR - 22 - lw;
  }
  // clamp vertical
  if(ly < 110) ly = 110;
  if(ly > H - 110) ly = H - 110;
  // clamp horizontal
  if(lx < 16) lx = 16;
  if(lx + lw > W - 16) lx = W - 16 - lw;
  return {x:lx, y:ly};
}

function updateLabel(){
  const f = FEATURES[bubIdx];
  blLabel.textContent = f.label;
  if(f.badge){
    blBadge.textContent = f.badge;
    blBadge.style.display = 'inline-block';
  } else {
    blBadge.style.display = 'none';
  }
  blTag.textContent = f.atoms ? '— charge zone' : '— surface charge';
  blScan.textContent = 'Scanning the air —';
  idxEl.textContent = String(bubIdx+1).padStart(2,'0');
  const p = computeLabelPos();
  blabel.style.left = p.x+'px';
  blabel.style.top = p.y+'px';
  blabel.classList.add('show');
}

// ---- Connector line from bubble to label ----
function drawConnector(){
  const p = computeLabelPos();
  const ang = Math.atan2(p.y-bubY, p.x-bubX);
  const sx = bubX + Math.cos(ang)*(bubR+2);
  const sy = bubY + Math.sin(ang)*(bubR+2);
  ctx.strokeStyle='rgba(27,123,255,0.35)';
  ctx.lineWidth=0.8;
  ctx.setLineDash([2,3]);
  ctx.beginPath();
  ctx.moveTo(sx,sy);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='rgba(27,123,255,0.7)';
  ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fill();
}

// ---- Main loop ----
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;

  ctx.clearRect(0,0,W,H);

  // dust
  ctx.fillStyle = '#ef5364';
  for(const d of dust){
    if(!REDUCED){
      d.vx += (Math.random()-0.5)*0.009;
      d.vy += (Math.random()-0.5)*0.009;
      d.vx *= 0.955; d.vy *= 0.955;
      d.x += d.vx; d.y += d.vy;
      d.ph += d.sp*16;
    }
    if(d.x<-2)d.x+=W; if(d.x>W+2)d.x-=W;
    if(d.y<-2)d.y+=H; if(d.y>H+2)d.y-=H;

    let a = d.a;
    if(d.x>hRect.x && d.x<hRect.x+hRect.w && d.y>hRect.y && d.y<hRect.y+hRect.h){
      a *= 0.16;
    }
    const flick = 0.82 + Math.sin(d.ph)*0.18;
    ctx.globalAlpha = a*flick;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  updateBubble(dt);
  updateLabel();
  drawConnector();
  drawBubble();

  requestAnimationFrame(frame);
}

// ---- Boot ----
resize();
initBubble();
window.addEventListener('resize', ()=>{
  resize();
  initBubble();
});
requestAnimationFrame((t)=>{ last = t; frame(t); });
</script>

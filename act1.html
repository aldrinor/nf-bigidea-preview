<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoFlashing — ACT 01 — The Field</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg1:#eef2f5; --bg2:#e7ecf1;
    --ink:#11181f; --muted:#5d6b78;
    --dust:#8893a0;
    --blue:#1B7BFF;
    --red:#ef5364;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%; width:100%;
    overflow:hidden;
    background:linear-gradient(180deg,var(--bg1),var(--bg2));
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  canvas{position:fixed;inset:0;display:block}
  #dust{z-index:0}
  #bubble-layer{z-index:1;pointer-events:none}

  .slogan{
    position:fixed; inset:0; z-index:2;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center; pointer-events:none;
    padding:24px;
  }
  .eyebrow{
    font-family:'Space Mono',monospace;
    font-size:12px; letter-spacing:0.28em;
    text-transform:uppercase; color:var(--muted);
    margin-bottom:30px; display:flex; align-items:center; gap:10px;
  }
  .eyebrow .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--blue);
    box-shadow:0 0 0 0 rgba(27,123,255,0.5);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(27,123,255,0.5)}
    70%{box-shadow:0 0 0 8px rgba(27,123,255,0)}
    100%{box-shadow:0 0 0 0 rgba(27,123,255,0)}
  }
  .headline{
    font-family:'Instrument Serif',serif;
    font-weight:400;
    font-size:clamp(40px, 7.4vw, 112px);
    line-height:1.0;
    letter-spacing:-0.012em;
    max-width:14ch;
  }
  .headline em{
    font-style:italic;
    color:var(--red);
    position:relative;
  }
  .sub{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(15px, 1.4vw, 19px);
    color:var(--muted);
    margin-top:26px;
    max-width:48ch;
    line-height:1.55;
    font-weight:400;
  }
  .hint{
    font-family:'Space Mono',monospace;
    font-size:11px; letter-spacing:0.22em;
    text-transform:uppercase; color:var(--muted);
    margin-top:52px; opacity:0.72;
    display:flex; align-items:center; gap:10px;
  }
  .hint::before, .hint::after{
    content:""; display:inline-block;
    width:28px; height:1px; background:var(--muted); opacity:0.4;
  }

  .corner{
    position:fixed; z-index:2;
    font-family:'Space Mono',monospace;
    font-size:10px; letter-spacing:0.22em;
    text-transform:uppercase; color:var(--muted);
    pointer-events:none;
  }
  .corner.tl{top:22px; left:28px}
  .corner.tr{top:22px; right:28px; text-align:right}
  .corner.bl{bottom:22px; left:28px}
  .corner.br{bottom:22px; right:28px; text-align:right}
  .corner b{color:var(--ink); font-weight:700; letter-spacing:0.18em}
  .corner .bar{display:inline-block; width:18px; height:1px; background:var(--muted); vertical-align:middle; margin:0 8px; opacity:0.5}

  .callout{
    position:fixed; z-index:4;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.28s ease;
    transform:translateY(-50%);
    max-width:230px;
  }
  .callout.visible{opacity:1}
  .callout .stick{
    width:18px; height:1px; background:var(--blue); margin-bottom:10px; opacity:0.7;
  }
  .callout .label{
    font-family:'Instrument Serif',serif;
    font-size:28px; line-height:1.05;
    color:var(--ink);
  }
  .callout .badge{
    font-family:'Space Mono',monospace;
    font-size:11px; letter-spacing:0.04em;
    color:var(--red); margin-top:8px;
  }
  .callout .tag{
    font-family:'Space Mono',monospace;
    font-size:10px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--muted);
    margin-top:6px;
  }

  @media (max-width:600px){
    .corner.tr,.corner.br{display:none}
    .slogan{padding:18px}
    .eyebrow{margin-bottom:20px; font-size:10px}
    .hint{margin-top:36px}
    .hint::before,.hint::after{width:18px}
  }
</style>

/* ---------- setup ---------- */
const dustCanvas = document.getElementById('dust');
const bubbleCanvas = document.getElementById('bubble-layer');
const dctx = dustCanvas.getContext('2d');
const bctx = bubbleCanvas.getContext('2d');

let W = 0, H = 0;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const isTouch = window.matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  for(const c of [dustCanvas, bubbleCanvas]){
    c.width = Math.floor(W * DPR);
    c.height = Math.floor(H * DPR);
    c.style.width = W + 'px';
    c.style.height = H + 'px';
  }
  dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();

/* ---------- dust field ---------- */
const dust = [];
function makeDust(){
  dust.length = 0;
  const area = W * H;
  const count = Math.round(Math.min(1300, Math.max(440, area / 1350)));
  for(let i = 0; i < count; i++){
    dust.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.18,
      vy: (Math.random() - 0.5) * 0.18,
      r: 0.6 + Math.random() * 1.9,
      a: 0.45 + Math.random() * 0.45,
      phase: Math.random() * Math.PI * 2,
      ps: 0.008 + Math.random() * 0.02
    });
  }
}
makeDust();

/* ---------- embedded pollutants ---------- */
const pollutants = [];
function placePollutants(){
  pollutants.length = 0;
  if(!FEATURES || !Array.isArray(FEATURES) || !FEATURES.length) return;

  const n = FEATURES.length;
  const cx = W / 2, cy = H / 2;
  const avoidR = Math.min(W, H) * 0.26; // keep clear of slogan
  const margin = 70;
  const minSep = Math.min(140, Math.max(90, Math.sqrt(W * H / n) * 0.6));

  const placed = [];
  let attempts = 0;
  const maxAttempts = n * 80;
  while(placed.length < n && attempts < maxAttempts){
    attempts++;
    const x = margin + Math.random() * (W - margin * 2);
    const y = margin + Math.random() * (H - margin * 2);
    if(Math.hypot(x - cx, y - cy) < avoidR) continue;
    let ok = true;
    for(const q of placed){
      if(Math.hypot(x - q.x, y - q.y) < minSep){ ok = false; break; }
    }
    if(!ok) continue;
    placed.push({ x, y });
  }
  // backfill if needed (ignore avoid zone)
  while(placed.length < n){
    placed.push({
      x: margin + Math.random() * (W - margin * 2),
      y: margin + Math.random() * (H - margin * 2)
    });
  }

  for(let i = 0; i < n; i++){
    const f = FEATURES[i];
    const pos = placed[i];
    pollutants.push({
      f,
      x: pos.x,
      y: pos.y,
      r: 2.4 + Math.random() * 1.1,
      a: 0.7 + Math.random() * 0.25
    });
  }
}
placePollutants();

/* ---------- bubble ---------- */
const bubble = {
  x: W * 0.5, y: H * 0.65,
  tx: W * 0.5, ty: H * 0.65,
  R: 150,
  mag: 2.2,
  mode: 'tour',
  lastMove: performance.now() - 5000,
  tourIdx: 0,
  tourState: 'moving',
  tourTimer: 0,
  active: null,
  activeStrength: 0
};
function setBubbleSize(){
  bubble.R = Math.round(Math.min(170, Math.max(118, Math.min(W, H) * 0.19)));
  bubble.mag = W < 600 ? 2.0 : 2.25;
}
setBubbleSize();

/* ---------- pointer ---------- */
let mouseX = W * 0.5, mouseY = H * 0.65;
let hasMoved = false;
window.addEventListener('mousemove', e => {
  if(reduced || isTouch) return;
  mouseX = e.clientX;
  mouseY = e.clientY;
  hasMoved = true;
  bubble.mode = 'cursor';
  bubble.lastMove = performance.now();
}, { passive: true });

window.addEventListener('mouseleave', () => {
  bubble.lastMove = performance.now() - 4000;
});

/* ---------- colors ---------- */
const CPK = {
  C: '#7c858e', O: '#d6595a', N: '#4f78c8', S: '#d4a93a',
  F: '#5fb878', Cl: '#5fb878', P: '#d88a3e', H: '#cfd6dd'
};
function lighten(hex, amt){
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const nr = Math.min(255, Math.round(r + (255 - r) * amt));
  const ng = Math.min(255, Math.round(g + (255 - g) * amt));
  const nb = Math.min(255, Math.round(b + (255 - b) * amt));
  return `rgb(${nr},${ng},${nb})`;
}

/* ---------- drawing: dust canvas ---------- */
function drawDustLayer(){
  // background gradient
  const bg = dctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#eef2f5');
  bg.addColorStop(1, '#e7ecf1');
  dctx.fillStyle = bg;
  dctx.fillRect(0, 0, W, H);

  // dust motes
  for(const d of dust){
    const flick = 0.82 + 0.18 * Math.sin(d.phase);
    dctx.fillStyle = `rgba(136,147,160,${(d.a * flick).toFixed(3)})`;
    dctx.beginPath();
    dctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    dctx.fill();
  }

  // pollutant markers (look like slightly larger dust until scanned)
  for(const p of pollutants){
    if(p === bubble.active && bubble.activeStrength > 0.5) continue;
    const fade = (p === bubble.active) ? (1 - bubble.activeStrength) : 1;
    dctx.fillStyle = `rgba(120,131,145,${(p.a * fade).toFixed(3)})`;
    dctx.beginPath();
    dctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    dctx.fill();
  }
}

/* ---------- drawing: bubble canvas ---------- */
function drawBubble(){
  bctx.clearRect(0, 0, W, H);
  const bx = bubble.x, by = bubble.y, R = bubble.R;
  const t = performance.now() / 1000;
  const pulse = 0.5 + 0.5 * Math.sin(t * 3.0);

  bctx.save();
  // clip to circle
  bctx.beginPath();
  bctx.arc(bx, by, R, 0, Math.PI * 2);
  bctx.closePath();
  bctx.clip();

  // lens background — slightly lifted, cool
  const lg = bctx.createRadialGradient(bx, by - R * 0.2, R * 0.05, bx, by, R);
  lg.addColorStop(0, 'rgba(255,255,255,0.92)');
  lg.addColorStop(0.7, 'rgba(241,245,249,0.78)');
  lg.addColorStop(1, 'rgba(214,223,231,0.7)');
  bctx.fillStyle = lg;
  bctx.fillRect(bx - R, by - R, R * 2, R * 2);

  // magnified dust
  const mag = bubble.mag;
  for(const d of dust){
    const dx = (d.x - bx) * mag + bx;
    const dy = (d.y - by) * mag + by;
    const ddx = dx - bx, ddy = dy - by;
    if(ddx * ddx + ddy * ddy > R * R) continue;
    const r = Math.max(0.4, d.r * mag * 0.92);
    const flick = 0.82 + 0.18 * Math.sin(d.phase);
    bctx.fillStyle = `rgba(120,131,145,${(d.a * flick * 0.95).toFixed(3)})`;
    bctx.beginPath();
    bctx.arc(dx, dy, r, 0, Math.PI * 2);
    bctx.fill();
  }

  // magnified non-active pollutant markers that happen to be in view
  for(const p of pollutants){
    if(p === bubble.active) continue;
    const dx = (p.x - bx) * mag + bx;
    const dy = (p.y - by) * mag + by;
    const ddx = dx - bx, ddy = dy - by;
    if(ddx * ddx + ddy * ddy > R * R) continue;
    const r = p.r * mag;
    bctx.fillStyle = `rgba(110,121,135,0.85)`;
    bctx.beginPath();
    bctx.arc(dx, dy, r, 0, Math.PI * 2);
    bctx.fill();
  }

  // active pollutant structure
  if(bubble.active && bubble.activeStrength > 0.02){
    bctx.globalAlpha = Math.min(1, bubble.activeStrength);
    const p = bubble.active;
    if(p.f && p.f.treatment === 'cloud' && p.f.atoms){
      drawMolecule(p, bx, by, R);
    } else if(p.f && p.f.treatment === 'halo' && p.f.specimen){
      drawSpecimen(p, bx, by, R);
    }
    bctx.globalAlpha = 1;
  }

  // lens highlight (top-left)
  const hg = bctx.createRadialGradient(bx - R * 0.35, by - R * 0.4, 0, bx - R * 0.2, by - R * 0.2, R * 0.95);
  hg.addColorStop(0, 'rgba(255,255,255,0.32)');
  hg.addColorStop(0.4, 'rgba(255,255,255,0.05)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  bctx.fillStyle = hg;
  bctx.fillRect(bx - R, by - R, R * 2, R * 2);

  // bottom-right subtle vignette inside lens
  const vg = bctx.createRadialGradient(bx + R * 0.3, by + R * 0.3, R * 0.2, bx + R * 0.3, by + R * 0.3, R);
  vg.addColorStop(0, 'rgba(20,30,45,0)');
  vg.addColorStop(1, 'rgba(20,30,45,0.08)');
  bctx.fillStyle = vg;
  bctx.fillRect(bx - R, by - R, R * 2, R * 2);

  bctx.restore();

  // outer soft halo
  bctx.beginPath();
  bctx.arc(bx, by, R + 1, 0, Math.PI * 2);
  bctx.strokeStyle = `rgba(27,123,255,${(0.1 + 0.07 * pulse).toFixed(3)})`;
  bctx.lineWidth = 9;
  bctx.stroke();

  // main flashing ring
  bctx.beginPath();
  bctx.arc(bx, by, R, 0, Math.PI * 2);
  bctx.strokeStyle = `rgba(27,123,255,${(0.55 + 0.35 * pulse).toFixed(3)})`;
  bctx.lineWidth = 1.7;
  bctx.stroke();

  // inner faint ring
  bctx.beginPath();
  bctx.arc(bx, by, R - 3.5, 0, Math.PI * 2);
  bctx.strokeStyle = `rgba(27,123,255,${(0.16 + 0.12 * pulse).toFixed(3)})`;
  bctx.lineWidth = 0.8;
  bctx.stroke();

  // crosshair
  bctx.strokeStyle = `rgba(27,123,255,0.55)`;
  bctx.lineWidth = 1;
  bctx.beginPath();
  bctx.moveTo(bx - R * 0.07, by); bctx.lineTo(bx + R * 0.07, by);
  bctx.moveTo(bx, by - R * 0.07); bctx.lineTo(bx, by + R * 0.07);
  bctx.stroke();

  // tiny tick marks at cardinal points
  bctx.strokeStyle = `rgba(27,123,255,${(0.4 + 0.2 * pulse).toFixed(3)})`;
  bctx.lineWidth = 1.2;
  const tickLen = 5;
  for(let i = 0; i < 4; i++){
    const a = i * Math.PI / 2;
    const x1 = bx + Math.cos(a) * (R - tickLen);
    const y1 = by + Math.sin(a) * (R - tickLen);
    const x2 = bx + Math.cos(a) * R;
    const y2 = by + Math.sin(a) * R;
    bctx.beginPath();
    bctx.moveTo(x1, y1); bctx.lineTo(x2, y2);
    bctx.stroke();
  }
}

/* ---------- molecule rendering ---------- */
function drawMolecule(p, cx, cy, R){
  const atoms = p.f.atoms;
  if(!atoms || !atoms.length) return;

  // bounds (skip H for sizing)
  let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for(const a of atoms){
    if(a.el === 'H') continue;
    if(a.x < minx) minx = a.x;
    if(a.x > maxx) maxx = a.x;
    if(a.y < miny) miny = a.y;
    if(a.y > maxy) maxy = a.y;
  }
  if(!isFinite(minx)){ minx = 0; maxx = 1; miny = 0; maxy = 1; }
  const span = Math.max(maxx - minx, maxy - miny, 0.5);
  const target = R * 0.58;
  const scale = target / span;
  const ccx = (minx + maxx) / 2;
  const ccy = (miny + maxy) / 2;

  const proj = (a) => ({ x: cx + (a.x - ccx) * scale, y: cy + (a.y - ccy) * scale });

  // bonds by distance
  const bondThresh = span * 0.6;
  bctx.lineWidth = 1.5;
  bctx.strokeStyle = 'rgba(90,100,115,0.6)';
  for(let i = 0; i < atoms.length; i++){
    for(let j = i + 1; j < atoms.length; j++){
      const dx = atoms[i].x - atoms[j].x;
      const dy = atoms[i].y - atoms[j].y;
      const d = Math.hypot(dx, dy);
      if(d < bondThresh){
        const p1 = proj(atoms[i]);
        const p2 = proj(atoms[j]);
        bctx.beginPath();
        bctx.moveTo(p1.x, p1.y);
        bctx.lineTo(p2.x, p2.y);
        bctx.stroke();
      }
    }
  }

  // charge zone halos
  const chargeSet = new Set(Array.isArray(p.f.chargeAtoms) ? p.f.chargeAtoms : []);
  for(let i = 0; i < atoms.length; i++){
    if(!chargeSet.has(i)) continue;
    const pp = proj(atoms[i]);
    const haloR = 24;
    const rg = bctx.createRadialGradient(pp.x, pp.y, 0, pp.x, pp.y, haloR);
    rg.addColorStop(0, 'rgba(239,83,100,0.6)');
    rg.addColorStop(0.45, 'rgba(239,83,100,0.28)');
    rg.addColorStop(1, 'rgba(239,83,100,0)');
    bctx.fillStyle = rg;
    bctx.beginPath();
    bctx.arc(pp.x, pp.y, haloR, 0, Math.PI * 2);
    bctx.fill();
  }

  // atoms
  for(let i = 0; i < atoms.length; i++){
    const a = atoms[i];
    if(a.el === 'H') continue;
    const pp = proj(a);
    const col = CPK[a.el] || '#7c858e';
    const rad = (a.el === 'C') ? 7 : 8.5;
    const gg = bctx.createRadialGradient(pp.x - 2.2, pp.y - 2.4, 0, pp.x, pp.y, rad);
    gg.addColorStop(0, lighten(col, 0.4));
    gg.addColorStop(1, col);
    bctx.fillStyle = gg;
    bctx.beginPath();
    bctx.arc(pp.x, pp.y, rad, 0, Math.PI * 2);
    bctx.fill();
    bctx.strokeStyle = 'rgba(20,28,35,0.28)';
    bctx.lineWidth = 0.8;
    bctx.stroke();

    // element label for non-C
    if(a.el !== 'C'){
      bctx.fillStyle = 'rgba(255,255,255,0.92)';
      bctx.font = "600 9px 'Space Mono', monospace";
      bctx.textAlign = 'center';
      bctx.textBaseline = 'middle';
      bctx.fillText(a.el, pp.x, pp.y + 0.5);
    }
  }

  // tag
  bctx.font = "10px 'Space Mono', monospace";
  bctx.fillStyle = 'rgba(239,83,100,0.95)';
  bctx.textAlign = 'center';
  bctx.textBaseline = 'alphabetic';
  bctx.fillText('− charge zone', cx, cy + R * 0.8);
}

/* ---------- specimen rendering ---------- */
function drawSpecimen(p, cx, cy, R){
  const sp = p.f.specimen;
  const rad = R * 0.5;

  bctx.save();
  bctx.translate(cx, cy);

  // red surface-charge rim glow
  const rg = bctx.createRadialGradient(0, 0, rad * 0.55, 0, 0, rad * 1.18);
  rg.addColorStop(0, 'rgba(239,83,100,0)');
  rg.addColorStop(0.65, 'rgba(239,83,100,0.16)');
  rg.addColorStop(1, 'rgba(239,83,100,0.42)');
  bctx.fillStyle = rg;
  bctx.beginPath();
  bctx.arc(0, 0, rad * 1.18, 0, Math.PI * 2);
  bctx.fill();

  bctx.fillStyle = '#5d6b78';
  bctx.strokeStyle = '#3a4651';
  bctx.lineWidth = 1;

  if(sp === 'virus'){
    bctx.beginPath();
    bctx.arc(0, 0, rad * 0.52, 0, Math.PI * 2);
    bctx.fill();
    const spikes = 14;
    for(let i = 0; i < spikes; i++){
      const a = (i / spikes) * Math.PI * 2;
      const x1 = Math.cos(a) * rad * 0.52, y1 = Math.sin(a) * rad * 0.52;
      const x2 = Math.cos(a) * rad * 0.95, y2 = Math.sin(a) * rad * 0.95;
      bctx.beginPath();
      bctx.moveTo(x1, y1); bctx.lineTo(x2, y2);
      bctx.stroke();
      bctx.beginPath();
      bctx.arc(x2, y2, 2.4, 0, Math.PI * 2);
      bctx.fill();
    }
  } else if(sp === 'soot'){
    const blobs = 7;
    for(let i = 0; i < blobs; i++){
      const a = (i / blobs) * Math.PI * 2;
      const d = rad * 0.38;
      bctx.beginPath();
      bctx.arc(Math.cos(a) * d, Math.sin(a) * d, rad * 0.32, 0, Math.PI * 2);
      bctx.fill();
    }
    bctx.beginPath();
    bctx.arc(0, 0, rad * 0.42, 0, Math.PI * 2);
    bctx.fill();
  } else if(sp === 'spore'){
    bctx.beginPath();
    const bumps = 14;
    for(let i = 0; i <= bumps; i++){
      const a = (i / bumps) * Math.PI * 2;
      const rr = rad * 0.72 + Math.sin(a * 6) * rad * 0.07;
      const x = Math.cos(a) * rr * 0.92, y = Math.sin(a) * rr * 0.68;
      if(i === 0) bctx.moveTo(x, y); else bctx.lineTo(x, y);
    }
    bctx.closePath();
    bctx.fill();
  } else if(sp === 'rod'){
    const w = rad * 1.55, h = rad * 0.58;
    bctx.beginPath();
    bctx.moveTo(-w / 2 + h / 2, -h / 2);
    bctx.lineTo(w / 2 - h / 2, -h / 2);
    bctx.arc(w / 2 - h / 2, 0, h / 2, -Math.PI / 2, Math.PI / 2);
    bctx.lineTo(-w / 2 + h / 2, h / 2);
    bctx.arc(-w / 2 + h / 2, 0, h / 2, Math.PI / 2, -Math.PI / 2);
    bctx.closePath();
    bctx.fill();
  } else if(sp === 'pm' || sp === 'dust'){
    bctx.beginPath();
    const pts = 11;
    for(let i = 0; i <= pts; i++){
      const a = (i / pts) * Math.PI * 2;
      const rr = rad * 0.6 + Math.sin(a * 3 + 1) * rad * 0.18 + Math.cos(a * 2) * rad * 0.1;
      const x = Math.cos(a) * rr, y = Math.sin(a) * rr;
      if(i === 0) bctx.moveTo(x, y); else bctx.lineTo(x, y);
    }
    bctx.closePath();
    bctx.fill();
  } else if(sp === 'pollen'){
    bctx.beginPath();
    bctx.arc(0, 0, rad * 0.48, 0, Math.PI * 2);
    bctx.fill();
    const spikes = 16;
    for(let i = 0; i < spikes; i++){
      const a = (i / spikes) * Math.PI * 2;
      bctx.beginPath();
      bctx.moveTo(Math.cos(a) * rad * 0.48, Math.sin(a) * rad * 0.48);
      bctx.lineTo(Math.cos(a) * rad * 0.96, Math.sin(a) * rad * 0.96);
      bctx.stroke();
      bctx.beginPath();
      bctx.arc(Math.cos(a) * rad * 0.96, Math.sin(a) * rad * 0.96, 1.8, 0, Math.PI * 2);
      bctx.fill();
    }
  } else if(sp === 'dander'){
    bctx.beginPath();
    bctx.moveTo(-rad * 0.72, -rad * 0.18);
    bctx.quadraticCurveTo(-rad * 0.3, -rad * 0.72, rad * 0.32, -rad * 0.5);
    bctx.quadraticCurveTo(rad * 0.82, -rad * 0.08, rad * 0.5, rad * 0.42);
    bctx.quadraticCurveTo(0, rad * 0.72, -rad * 0.5, rad * 0.42);
    bctx.quadraticCurveTo(-rad * 0.92, rad * 0.1, -rad * 0.72, -rad * 0.18);
    bctx.closePath();
    bctx.fill();
  } else if(sp === 'microplastic'){
    bctx.beginPath();
    bctx.moveTo(-rad * 0.82, -rad * 0.3);
    bctx.lineTo(rad * 0.2, -rad * 0.72);
    bctx.lineTo(rad * 0.72, 0);
    bctx.lineTo(rad * 0.3, rad * 0.72);
    bctx.lineTo(-rad * 0.5, rad * 0.5);
    bctx.closePath();
    bctx.fill();
  } else {
    bctx.beginPath();
    bctx.arc(0, 0, rad * 0.6, 0, Math.PI * 2);
    bctx.fill();
  }

  bctx.restore();

  // tag
  bctx.font = "10px 'Space Mono', monospace";
  bctx.fillStyle = 'rgba(239,83,100,0.95)';
  bctx.textAlign = 'center';
  bctx.textBaseline = 'alphabetic';
  bctx.fillText('− surface charge', cx, cy + R * 0.8);
}

/* ---------- callout ---------- */
const callout = document.getElementById('callout');
const cLabel = document.getElementById('callout-label');
const cBadge = document.getElementById('callout-badge');
const cTag = document.getElementById('callout-tag');

function updateCallout(){
  if(bubble.active && bubble.activeStrength > 0.4){
    const p = bubble.active;
    cLabel.textContent = p.f.label || '';
    cBadge.textContent = p.f.badge || '';
    cBadge.style.display = p.f.badge ? 'block' : 'none';
    cTag.textContent = (p.f.treatment === 'cloud') ? '− charge zone' : '− surface charge';

    // position to the right of bubble, or left if near right edge
    let ox = bubble.x + bubble.R + 26;
    let oy = bubble.y;
    const cw = 230;
    if(ox + cw > W - 20){
      ox = bubble.x - bubble.R - 26 - cw;
    }
    if(ox < 20){
      ox = Math.min(W - cw - 20, Math.max(20, bubble.x + bubble.R + 26));
    }
    oy = Math.max(90, Math.min(H - 90, oy));
    callout.style.left = ox + 'px';
    callout.style.top = oy + 'px';
    callout.classList.add('visible');
  } else {
    callout.classList.remove('visible');
  }
}

/* ---------- main loop ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(40, now - last);
  last = now;

  // dust wander (Brownian)
  for(const d of dust){
    d.vx += (Math.random() - 0.5) * 0.05;
    d.vy += (Math.random() - 0.5) * 0.05;
    d.vx *= 0.955;
    d.vy *= 0.955;
    d.x += d.vx;
    d.y += d.vy;
    if(d.x < -6) d.x = W + 6;
    else if(d.x > W + 6) d.x = -6;
    if(d.y < -6) d.y = H + 6;
    else if(d.y > H + 6) d.y = -6;
    d.phase += d.ps;
  }

  // mode switching
  const idleTime = now - bubble.lastMove;
  if((isTouch || reduced) && pollutants.length){
    bubble.mode = 'tour';
  } else if(idleTime > 2500 && pollutants.length){
    bubble.mode = 'tour';
  }

  // tour logic
  if(bubble.mode === 'tour' && pollutants.length){
    const target = pollutants[bubble.tourIdx % pollutants.length];
    const dist = Math.hypot(target.x - bubble.x, target.y - bubble.y);
    if(bubble.tourState === 'moving'){
      bubble.tx = target.x;
      bubble.ty = target.y;
      if(dist < 8){
        bubble.tourState = 'dwelling';
        bubble.tourTimer = now;
      }
    } else {
      bubble.tx = target.x;
      bubble.ty = target.y;
      if(now - bubble.tourTimer > 2100){
        bubble.tourIdx = (bubble.tourIdx + 1) % pollutants.length;
        bubble.tourState = 'moving';
      }
    }
  } else if(bubble.mode === 'cursor' && hasMoved){
    bubble.tx = mouseX;
    bubble.ty = mouseY;
  }

  // lerp
  const k = 0.12;
  bubble.x += (bubble.tx - bubble.x) * k;
  bubble.y += (bubble.ty - bubble.y) * k;

  // detect active pollutant
  let active = null;
  let bestDist = bubble.R * 0.85;
  for(const p of pollutants){
    const d = Math.hypot(p.x - bubble.x, p.y - bubble.y);
    if(d < bestDist){
      bestDist = d;
      active = p;
    }
  }
  bubble.active = active;
  // strength: 0 at edge, 1 at center
  const targetStrength = active
    ? Math.max(0, Math.min(1, 1 - bestDist / (bubble.R * 0.85)))
    : 0;
  bubble.activeStrength += (targetStrength - bubble.activeStrength) * 0.18;

  // render
  drawDustLayer();
  drawBubble();
  updateCallout();

  requestAnimationFrame(frame);
}

/* ---------- init ---------- */
mouseX = W * 0.5;
mouseY = H * 0.65;
bubble.x = W * 0.5;
bubble.y = H * 0.65;
bubble.tx = bubble.x;
bubble.ty = bubble.y;
bubble.lastMove = performance.now() - 5000; // begin auto-tour immediately

requestAnimationFrame(frame);

/* ---------- resize ---------- */
let resizeTimer = null;
window.addEventListener('resize', () => {
  if(resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    resize();
    setBubbleSize();
    makeDust();
    placePollutants();
    // keep bubble in bounds
    bubble.x = Math.min(W - 20, Math.max(20, bubble.x));
    bubble.y = Math.min(H - 20, Math.max(20, bubble.y));
    bubble.tx = bubble.x;
    bubble.ty = bubble.y;
  }, 120);
});
</script>
</body>

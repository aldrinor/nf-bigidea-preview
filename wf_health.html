<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wildfire Smoke — Health Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#1f2327;
    --headline-ink:#1a1a1a;
    --muted:#8a9095;
    --faint:#aab2b8;
    --accent:#1b7bff;
    --red:#e23b3b;
    --hair:rgba(20,24,28,0.08);
    --stack:-apple-system, system-ui, 'Inter', 'Space Grotesk', sans-serif;
    --mono:'Space Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--stack);-webkit-font-smoothing:antialiased}
  body{min-height:100vh}

  .health{
    min-height:100vh;
    background:var(--bg);
    padding:clamp(28px,5vh,64px) 0 clamp(20px,3vh,40px);
    display:flex;
    flex-direction:column;
  }

  .grid{
    flex:1;
    display:grid;
    grid-template-columns:44% 56%;
    gap:clamp(20px,3vw,48px);
    padding:0 clamp(24px,6vw,96px);
    align-items:center;
    width:100%;
  }

  /* LEFT */
  .left{display:flex;flex-direction:column;justify-content:center;min-width:0}
  h1.headline{
    font-family:var(--stack);
    font-weight:600;
    font-size:clamp(24px,2.7vw,34px);
    line-height:1.32;
    letter-spacing:-0.022em;
    color:var(--headline-ink);
    margin:0 0 clamp(22px,3vh,34px);
    max-width:18ch;
  }
  h1.headline em{font-style:normal;color:var(--red)}

  .card{
    min-height:230px;
    position:relative;
  }
  .card-inner{
    opacity:1;
    transform:none;
    transition:opacity .35s ease, transform .35s cubic-bezier(.16,1,.3,1);
  }
  .card-inner.leaving{opacity:0;transform:translateY(8px)}
  .card-name{
    font-family:var(--stack);
    font-weight:600;
    font-size:clamp(22px,2vw,28px);
    line-height:1.15;
    letter-spacing:-0.018em;
    color:var(--headline-ink);
    margin:0 0 14px;
  }
  .card-intro{
    font-family:var(--stack);
    font-size:19px;
    line-height:1.55;
    color:#1a1a1a;
    font-weight:400;
    margin:0 0 14px;
    max-width:42ch;
  }
  .card-impacts p{
    font-family:var(--stack);
    font-size:19px;
    line-height:1.55;
    color:#1a1a1a;
    font-weight:400;
    margin:0 0 12px;
    max-width:46ch;
  }
  .card-impacts p:last-child{margin-bottom:0}
  .card-impacts a{
    color:#1a1a1a;
    text-decoration:none;
    border-bottom:1px solid rgba(20,24,28,0.22);
    transition:color .15s ease, border-color .15s ease;
  }
  .card-impacts a:hover{color:var(--red);border-color:var(--red)}

  /* CHIPS — equal width */
  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:clamp(24px,3vh,34px);
  }
  .chip{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    background:transparent;
    border:1px solid var(--hair);
    border-radius:999px;
    width:132px;
    text-align:center;
    padding:8px 10px;
    cursor:pointer;
    transition:all .18s ease;
    line-height:1;
    white-space:nowrap;
  }
  .chip:hover{color:var(--ink);border-color:rgba(20,24,28,0.22)}
  .chip[aria-pressed="true"]{
    color:#fff;
    background:var(--red);
    border-color:var(--red);
  }
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* RIGHT */
  .right{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-width:0;
    width:100%;
  }
  .back-row{
    width:100%;
    display:flex;
    justify-content:flex-start;
    padding-left:4px;
    min-height:56px;
    align-items:center;
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:48px;
    height:48px;
    border-radius:50%;
    border:1px solid var(--hair);
    background:rgba(237,240,242,0.9);
    color:var(--ink);
    font-family:var(--stack);
    font-size:22px;
    font-weight:600;
    line-height:1;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transform:translateY(-4px);
    transition:opacity .3s ease, transform .3s ease, border-color .18s ease, color .18s ease;
    backdrop-filter:blur(4px);
  }
  .back-btn.show{opacity:1;pointer-events:auto;transform:none}
  .back-btn:hover{border-color:var(--red);color:var(--red)}
  .back-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .frame{
    position:relative;
    aspect-ratio:688/1024;
    height:clamp(400px, 78vh, 820px);
    max-width:100%;
    overflow:hidden;
    border-radius:6px;
    cursor:pointer;
  }
  .body-zoom{
    position:absolute;
    inset:0;
    transform-origin:0 0;
    transform:translate(0,0) scale(1);
    transition:transform .95s cubic-bezier(.16,1,.3,1);
    will-change:transform;
  }
  .body-zoom.zoomed{
    -webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 50%, #000 46%, rgba(0,0,0,0.6) 62%, transparent 90%);
    mask-image:radial-gradient(ellipse 72% 72% at 50% 50%, #000 46%, rgba(0,0,0,0.6) 62%, transparent 90%);
  }
  .body-img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    animation:breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.012)}
  }

  /* HOTSPOTS */
  .hotspots{position:absolute;inset:0;pointer-events:none;transition:opacity .4s ease}
  .hotspot{
    position:absolute;
    transform:translate(-50%,-50%);
    width:18px;height:18px;
    border:0;background:transparent;
    padding:0;cursor:pointer;
    pointer-events:auto;
    transition:left .55s cubic-bezier(.16,1,.3,1), top .55s cubic-bezier(.16,1,.3,1), opacity .4s ease, width .3s ease, height .3s ease;
  }
  .hotspot::before{
    content:"";
    position:absolute;inset:0;
    border-radius:50%;
    background:var(--red);
    transform:scale(0.38);
    box-shadow:0 0 0 1px rgba(255,255,255,0.6);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .hotspot::after{
    content:"";
    position:absolute;inset:0;
    border-radius:50%;
    border:1.5px solid var(--red);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(0.5);opacity:0.9}
    100%{transform:scale(1.9);opacity:0}
  }
  .hotspot:hover::before{transform:scale(0.5)}
  .hotspot .label{
    position:absolute;
    left:50%;top:100%;
    transform:translate(-50%,8px);
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink);
    background:var(--bg);
    padding:3px 7px;
    border:1px solid var(--hair);
    border-radius:4px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .hotspot:hover .label,.hotspot:focus-visible .label{opacity:1}
  .hotspot:focus-visible{outline:none}
  .hotspot:focus-visible::after{border-color:var(--accent);animation:none;transform:scale(1.4);opacity:1}

  .hotspot.dimmed{opacity:0.16}
  .hotspot.dimmed::after{animation:none;opacity:0}
  .hotspot.active{
    width:28px;height:28px;
  }
  .hotspot.active::before{
    transform:scale(0.62);
    box-shadow:0 0 0 2px rgba(255,255,255,0.85), 0 0 14px 3px rgba(226,59,59,0.55);
  }
  .hotspot.active::after{
    animation:none;
    border-width:2px;
    opacity:0.55;
    transform:scale(1.7);
  }

  /* GLOW when zoomed */
  .glow{
    position:absolute;
    left:50%;top:50%;
    width:40%;height:40%;
    transform:translate(-50%,-50%) scale(0.6);
    background:radial-gradient(circle, rgba(226,59,59,0.30) 0%, rgba(226,59,59,0.12) 35%, rgba(226,59,59,0) 70%);
    opacity:0;
    pointer-events:none;
    transition:opacity .5s ease, transform .9s cubic-bezier(.16,1,.3,1);
    mix-blend-mode:multiply;
  }
  .glow.on{opacity:1;transform:translate(-50%,-50%) scale(1);animation:glowPulse 2.8s ease-in-out infinite}
  @keyframes glowPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.12)}
  }

  /* MOBILE */
  @media (max-width:880px){
    .grid{
      grid-template-columns:1fr;
      gap:clamp(20px,4vh,40px);
      padding:0 clamp(20px,6vw,32px);
      align-items:start;
    }
    .left{order:1}
    .right{order:2}
    .frame{height:clamp(360px,52vh,560px)}
    .card{min-height:180px}
    h1.headline{max-width:none}
    .chip{width:116px}
  }

  @media (prefers-reduced-motion:reduce){
    .body-img{animation:none}
    .body-zoom{transition:transform .25s ease}
    .glow{transition:opacity .25s ease;animation:none}
    .hotspot::after{animation:none}
    .hotspot{transition:opacity .25s ease}
    .card-inner{transition:opacity .2s ease}
  }
</style>
</head>
<body>
<section class="health" aria-labelledby="health-headline">
  <div class="grid">
    <div class="left">
      <h1 class="headline" id="health-headline">What the smoke does <em>inside you</em></h1>

      <div class="card">
        <div class="card-inner" id="cardInner" aria-live="polite">
          <h2 class="card-name" id="cardName" style="display:none"></h2>
          <p class="card-intro" id="cardIntro"></p>
          <div class="card-impacts" id="cardImpacts"></div>
        </div>
      </div>

      <div class="chips" id="chips" role="group" aria-label="Select an organ"></div>
    </div>

    <div class="right">
      <div class="back-row">
        <button class="back-btn" id="backBtn" type="button" aria-label="Return to full body view">&lsaquo;</button>
      </div>
      <div class="frame" id="frame">
        <div class="body-zoom" id="bodyZoom">
          <img class="body-img" id="bodyImg" src="assets/body/body_premium.png" alt="Anatomical figure showing organs affected by wildfire smoke" draggable="false">
        </div>
        <div class="hotspots" id="hotspots"></div>
        <div class="glow" id="glow"></div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  const DATA = {
    overview: {
      name: "",
      intro: "The ultrafine particles cross from the lungs into the bloodstream and reach organs throughout the body.",
      impacts: [
        {text:"Wildfire smoke is projected to cause about [71,420 U.S. deaths a year by 2050] — up from around 41,000 today.", url:"https://pubmed.ncbi.nlm.nih.gov/40967551/"}
      ],
      ox:0.5, oy:0.5
    },
    brain: {
      name:"Brain & mind",
      impacts:[
        {text:"On smoky days, emergency visits for [depression rose about 15%], and for other mood disorders about 29%.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11971671/"},
        {text:"A smoky school year measurably [lowers children's test scores].", url:"https://web.stanford.edu/~mburke/papers/WenBurke2022_smokelearning.pdf"}
      ],
      ox:0.50, oy:0.07, label:"Brain"
    },
    lungs: {
      name:"Lungs",
      impacts:[
        {text:"These fine particles are up to [10 times more harmful] to the lungs than ordinary pollution.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC7935892/"},
        {text:"They are a [Group 1 carcinogen] — the WHO's highest evidence tier — and long-term exposure raises lung-cancer deaths about 8% per increment.", url:"https://www.iarc.who.int/news-events/iarc-outdoor-air-pollution-a-leading-environmental-cause-of-cancer-deaths/"},
        {text:"After lung-cancer surgery, a wildfire within three months raised the risk of death [43%].", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC10375383/"}
      ],
      ox:0.50, oy:0.26, label:"Lungs"
    },
    heart: {
      name:"Heart",
      impacts:[
        {text:"On dense-smoke days, cardiac emergencies in older adults rose [about 15%], and strokes about 22%.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC6015400/"},
        {text:"Heavy-smoke days carried up to a [70% higher risk] of cardiac arrest outside the hospital.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC7428528/"},
        {text:"Across 22 million people, each small rise in long-term exposure raised new [heart-failure risk 1.4%].", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12367337/"}
      ],
      ox:0.48, oy:0.29, label:"Heart"
    },
    kidneys: {
      name:"Kidneys",
      impacts:[
        {text:"Among dialysis patients, smoke particles were linked to [4% more deaths the same day] and 7% over the following month.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC7460895/"}
      ],
      ox:0.50, oy:0.40, label:"Kidneys"
    },
    pregnancy: {
      name:"The unborn",
      impacts:[
        {text:"Each small rise in exposure during pregnancy raised the odds of [preterm birth 1.3%] across 5.1 million births.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11410054/"},
        {text:"The first study of its kind tied third-trimester smoke to [higher odds of autism].", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12874521/"}
      ],
      ox:0.50, oy:0.50, label:"The unborn"
    },
    bloodstream: {
      name:"Blood & cells",
      impacts:[
        {text:"Exposure changed [DNA at 94 sites] across 133 disease-linked genes and left toxic metals in immune cells.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12696577/"},
        {text:"When buildings burn, the smoke carried carcinogenic [chromium-6 nanoparticles] up to 6–9 miles downwind.", url:"https://www.ucdavis.edu/news/researchers-find-carcinogenic-chromium-6-palisades-altadena-fire-cleanup-zones"}
      ],
      ox:0.53, oy:0.33, label:"Blood & cells"
    }
  };

  const ORDER = ["overview","brain","lungs","heart","kidneys","pregnancy","bloodstream"];
  const CHIP_LABELS = {
    overview:"Overview", brain:"Brain", lungs:"Lungs", heart:"Heart",
    kidneys:"Kidneys", pregnancy:"The unborn", bloodstream:"Blood & cells"
  };

  const ZOOM = 1.7;

  const bodyZoom = document.getElementById('bodyZoom');
  const bodyImg = document.getElementById('bodyImg');
  const hotspotsEl = document.getElementById('hotspots');
  const glow = document.getElementById('glow');
  const backBtn = document.getElementById('backBtn');
  const frame = document.getElementById('frame');
  const cardInner = document.getElementById('cardInner');
  const cardName = document.getElementById('cardName');
  const cardIntro = document.getElementById('cardIntro');
  const cardImpacts = document.getElementById('cardImpacts');
  const chipsEl = document.getElementById('chips');

  let current = "overview";

  function linkify(text, url){
    const m = text.match(/\[(.+?)\]/);
    if(!m) return text;
    const idx = text.indexOf(m[0]);
    const pre = text.slice(0, idx);
    const post = text.slice(idx + m[0].length);
    return pre + '<a href="'+url+'" target="_blank" rel="noopener">'+m[1]+'</a>' + post;
  }

  function renderCard(key){
    const d = DATA[key];
    if(key === "overview"){
      cardName.style.display = 'none';
      cardName.textContent = '';
    } else {
      cardName.style.display = '';
      cardName.textContent = d.name;
    }
    if(d.intro){
      cardIntro.style.display = '';
      cardIntro.textContent = d.intro;
    } else {
      cardIntro.style.display = 'none';
    }
    cardImpacts.innerHTML = d.impacts.map(im =>
      '<p>'+linkify(im.text, im.url)+'</p>'
    ).join('');
  }

  function setZoom(key){
    const d = DATA[key];
    if(key === "overview"){
      bodyZoom.classList.remove('zoomed');
      bodyZoom.style.transform = 'translate(0,0) scale(1)';
      bodyImg.style.animation = '';
      glow.classList.remove('on');
      backBtn.classList.remove('show');
      hotspotsEl.querySelectorAll('.hotspot').forEach(h=>{
        h.classList.remove('active','dimmed');
        h.style.left = h.dataset.ox+'%';
        h.style.top = h.dataset.oy+'%';
      });
    } else {
      const s = ZOOM;
      const tx = (0.5 - s*d.ox)*100;
      const ty = (0.5 - s*d.oy)*100;
      bodyZoom.style.transform = 'translate('+tx+'%, '+ty+'%) scale('+s+')';
      bodyZoom.classList.add('zoomed');
      bodyImg.style.animation = 'none';
      glow.classList.add('on');
      backBtn.classList.add('show');
      hotspotsEl.querySelectorAll('.hotspot').forEach(h=>{
        if(h.dataset.key === key){
          h.classList.add('active');
          h.classList.remove('dimmed');
          h.style.left = '50%';
          h.style.top = '50%';
        } else {
          h.classList.add('dimmed');
          h.classList.remove('active');
          h.style.left = h.dataset.ox+'%';
          h.style.top = h.dataset.oy+'%';
        }
      });
    }
  }

  function select(key, force){
    if(current === key && !force){
      current = "overview";
    } else {
      current = key;
    }
    cardInner.classList.add('leaving');
    setTimeout(()=>{
      renderCard(current);
      setZoom(current);
      cardInner.classList.remove('leaving');
    }, 200);
    chipsEl.querySelectorAll('.chip').forEach(c=>{
      c.setAttribute('aria-pressed', c.dataset.key === current ? 'true' : 'false');
    });
  }

  // Build hotspots
  ORDER.forEach(key=>{
    if(key === "overview") return;
    const d = DATA[key];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'hotspot';
    b.style.left = (d.ox*100)+'%';
    b.style.top = (d.oy*100)+'%';
    b.dataset.key = key;
    b.dataset.ox = (d.ox*100)+'%';
    b.dataset.oy = (d.oy*100)+'%';
    b.setAttribute('aria-label', 'Show impact on '+d.label);
    const lab = document.createElement('span');
    lab.className = 'label';
    lab.textContent = d.label;
    b.appendChild(lab);
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      select(key);
    });
    hotspotsEl.appendChild(b);
  });

  // Build chips
  ORDER.forEach(key=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.dataset.key = key;
    b.textContent = CHIP_LABELS[key];
    b.setAttribute('aria-pressed', key === 'overview' ? 'true' : 'false');
    b.addEventListener('click', ()=>select(key));
    chipsEl.appendChild(b);
  });

  backBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    select('overview', true);
  });

  // Clicking the body/frame returns to overview
  frame.addEventListener('click', (e)=>{
    if(e.target.closest('.hotspot') || e.target.closest('.back-btn')) return;
    if(current !== 'overview') select('overview', true);
  });

  // Init
  renderCard('overview');
  setZoom('overview');
})();
</script>
</body>
</html>

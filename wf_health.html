<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wildfire Smoke — Health Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#1f2327;
    --headline-ink:#1a1a1a;
    --muted:#8a9095;
    --faint:#aab2b8;
    --accent:#1b7bff;
    --red:#e23b3b;
    --hair:rgba(20,24,28,0.08);
    --stack:-apple-system, system-ui, 'Inter', 'Space Grotesk', sans-serif;
    --mono:'Space Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--stack);-webkit-font-smoothing:antialiased}
  body{min-height:100vh}

  .health{
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .grid{
    flex:1;
    display:grid;
    grid-template-columns:44% 56%;
    align-items:center;
    width:100%;
    min-height:0;
  }

  /* LEFT */
  .left{
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:0;
    max-height:100vh;
    padding:0 clamp(24px,6vw,96px);
    z-index:10;
    position:relative;
  }
  h1.headline{
    font-family:var(--stack);
    font-weight:600;
    font-size:clamp(24px,2.7vw,34px);
    line-height:1.12;
    letter-spacing:-0.022em;
    color:var(--headline-ink);
    margin:0 0 clamp(22px,3vh,34px);
    max-width:18ch;
  }
  h1.headline em{font-style:normal;color:var(--red)}

  .card{
    min-height:230px;
    position:relative;
  }
  .card-inner{
    opacity:1;
    transform:none;
    transition:opacity .35s ease, transform .35s cubic-bezier(.16,1,.3,1);
  }
  .card-inner.leaving{opacity:0;transform:translateY(8px)}
  .card-name{
    font-family:var(--stack);
    font-weight:600;
    font-size:clamp(22px,2vw,28px);
    line-height:1.15;
    letter-spacing:-0.018em;
    color:var(--headline-ink);
    margin:0 0 14px;
  }
  .card-intro{
    font-family:var(--stack);
    font-size:19px;
    line-height:1.55;
    color:#1a1a1a;
    font-weight:400;
    margin:0 0 14px;
    max-width:42ch;
  }
  .card-impacts p{
    font-family:var(--stack);
    font-size:19px;
    line-height:1.55;
    color:#1a1a1a;
    font-weight:400;
    margin:0 0 12px;
    max-width:46ch;
  }
  .card-impacts p:last-child{margin-bottom:0}
  .card-impacts a{
    color:#1a1a1a;
    text-decoration:none;
    border-bottom:1px solid rgba(20,24,28,0.22);
    transition:color .15s ease, border-color .15s ease;
  }
  .card-impacts a:hover{color:var(--red);border-color:var(--red)}

  /* ANATOMY INDEX — vertical selector */
  .index{
    margin-top:clamp(26px,3.5vh,38px);
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--hair);
  }
  .index-row{
    display:flex;
    align-items:center;
    gap:18px;
    width:100%;
    padding:13px 6px 13px 14px;
    background:transparent;
    border:0;
    border-bottom:1px solid var(--hair);
    cursor:pointer;
    text-align:left;
    position:relative;
    transition:background .18s ease, color .18s ease;
    font-family:var(--stack);
  }
  .index-row::before{
    content:"";
    position:absolute;
    left:0; top:50%;
    transform:translateY(-50%) scaleY(0);
    width:3px;
    height:60%;
    background:var(--red);
    border-radius:2px;
    transition:transform .22s cubic-bezier(.16,1,.3,1);
  }
  .index-row .idx{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    width:26px;
    flex:0 0 26px;
    letter-spacing:0.02em;
    transition:color .18s ease;
  }
  .index-row .nm{
    font-family:var(--stack);
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    letter-spacing:-0.005em;
    transition:color .18s ease;
  }
  .index-row:hover{background:rgba(20,24,28,0.035)}
  .index-row:hover .nm{color:var(--red)}
  .index-row[aria-pressed="true"] .nm{color:var(--red)}
  .index-row[aria-pressed="true"] .idx{color:var(--red)}
  .index-row[aria-pressed="true"]::before{transform:translateY(-50%) scaleY(1)}
  .index-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  /* RIGHT — WIDE AREA spanning full width */
  .right{
    position:absolute;
    top:0; right:0;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    z-index:1;
  }
  
  .back-btn{
    position:absolute;
    top:16px;
    right:16px;
    z-index:20;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--hair);
    background:rgba(237,240,242,0.9);
    color:var(--ink);
    font-family:var(--stack);
    font-size:22px;
    font-weight:600;
    line-height:1;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transform:translateY(-4px);
    transition:opacity .3s ease, transform .3s ease, border-color .18s ease, color .18s ease;
    backdrop-filter:blur(4px);
  }
  .back-btn.show{opacity:1;pointer-events:auto;transform:none}
  .back-btn:hover{border-color:var(--red);color:var(--red)}
  .back-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* FIGURE WRAPPER — pins dots to the figure precisely */
  .figure{
    position:relative;
    height:100%;
    aspect-ratio:688/1024;
    max-width:100%;
    transform-origin:center center;
    transition:transform .7s cubic-bezier(.16,1,.3,1);
    will-change:transform;
    animation:breathe 4.5s ease-in-out infinite;
  }
  .figure.zoomed{
    animation:none;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.012)}
  }

  /* BODY IMG — fills the wrapper exactly */
  .body-img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
    user-select:none;
  }

  /* GLOW HALO — blooms over the selected organ */
  .glow{
    position:absolute;
    transform:translate(-50%,-50%);
    width:120px; height:120px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(226,59,59,0.28) 0%, rgba(226,59,59,0.08) 45%, transparent 70%);
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
    z-index:1;
  }
  .glow.show{
    opacity:1;
    animation:glowPulse 2.4s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.85}
    50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
  }

  /* HOTSPOTS */
  .hotspots{position:absolute;inset:0;pointer-events:none;z-index:2}
  .hotspot{
    position:absolute;
    transform:translate(-50%,-50%);
    width:18px;height:18px;
    border:0;background:transparent;
    padding:0;cursor:pointer;
    pointer-events:auto;
    transition:opacity .4s ease, width .3s ease, height .3s ease;
  }
  .hotspot::before{
    content:"";
    position:absolute;inset:0;
    border-radius:50%;
    background:var(--red);
    transform:scale(0.38);
    box-shadow:0 0 0 1px rgba(255,255,255,0.6);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .hotspot::after{
    content:"";
    position:absolute;inset:0;
    border-radius:50%;
    border:1.5px solid var(--red);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(0.5);opacity:0.9}
    100%{transform:scale(1.9);opacity:0}
  }
  .hotspot:hover::before{transform:scale(0.5)}
  .hotspot .label{
    position:absolute;
    left:50%;top:100%;
    transform:translate(-50%,8px);
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink);
    background:var(--bg);
    padding:3px 7px;
    border:1px solid var(--hair);
    border-radius:4px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .hotspot:hover .label,.hotspot:focus-visible .label{opacity:1}
  .hotspot:focus-visible{outline:none}
  .hotspot:focus-visible::after{border-color:var(--accent);animation:none;transform:scale(1.4);opacity:1}

  /* ACTIVE STATE — solid red dot + white ring */
  .hotspot.active{
    width:26px; height:26px;
    z-index:3;
  }
  .hotspot.active::before{
    transform:scale(1);
    box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--red), 0 0 12px 2px rgba(226,59,59,0.4);
  }
  .hotspot.active::after{
    animation:pulse 1.8s ease-out infinite;
    border-width:2px;
  }
  .hotspot.dimmed{
    opacity:0.35;
  }

  /* MOBILE */
  @media (max-width:880px){
    .grid{
      grid-template-columns:1fr;
      align-items:start;
      min-height:auto;
    }
    .left{
      order:1;
      max-height:none;
      padding:0 clamp(20px,6vw,32px);
      z-index:10;
      background:var(--bg);
      padding-bottom:20px;
    }
    .right{
      position:relative;
      order:2;
      height:clamp(400px, 68vh, 680px);
      max-height:none;
    }
    .card{min-height:180px}
    h1.headline{max-width:none}
    .index-row{padding:11px 6px 11px 14px}
    .index-row .nm{font-size:16px}
  }

  @media (prefers-reduced-motion:reduce){
    .figure{animation:none;transition:transform .2s ease}
    .glow{animation:none;transition:opacity .2s ease}
    .hotspot::after{animation:none}
    .card-inner{transition:opacity .2s ease}
  }
</style>
</head>
<body>
<section class="health" aria-labelledby="health-headline">
  <div class="grid">
    <div class="left">
      <h1 class="headline" id="health-headline">What the smoke does <em>inside you</em></h1>

      <div class="card">
        <div class="card-inner" id="cardInner" aria-live="polite">
          <h2 class="card-name" id="cardName" style="display:none"></h2>
          <p class="card-intro" id="cardIntro"></p>
          <div class="card-impacts" id="cardImpacts"></div>
        </div>
      </div>

      <div class="index" id="index" role="group" aria-label="Select an organ"></div>
    </div>

    <div class="right" id="right">
      <button class="back-btn" id="backBtn" type="button" aria-label="Return to full body view">&lsaquo;</button>
      <div class="figure" id="figure">
        <img class="body-img" id="bodyImg" src="assets/body/body_premium.png" alt="Anatomical figure showing organs affected by wildfire smoke" draggable="false">
        <div class="glow" id="glow"></div>
        <div class="hotspots" id="hotspots"></div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  const DATA = {
    overview: {
      name: "",
      intro: "The ultrafine particles cross from the lungs into the bloodstream and reach organs throughout the body.",
      impacts: [
        {text:"Wildfire smoke is projected to cause about [71,420 U.S. deaths a year by 2050] — up from around 41,000 today.", url:"https://pubmed.ncbi.nlm.nih.gov/40967551/"}
      ],
      ox:0.5, oy:0.5
    },
    brain: {
      name:"Brain & Mind",
      impacts:[
        {text:"On smoky days, emergency visits for [depression rose about 15%], and for other mood disorders about 29%.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11971671/"},
        {text:"A smoky school year measurably [lowers children's test scores].", url:"https://web.stanford.edu/~mburke/papers/WenBurke2022_smokelearning.pdf"}
      ],
      ox:0.50, oy:0.07, label:"Brain & Mind"
    },
    lungs: {
      name:"Lungs",
      impacts:[
        {text:"These fine particles are up to [10 times more harmful] to the lungs than ordinary pollution.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC7935892/"},
        {text:"They are a [Group 1 carcinogen] — the WHO's highest evidence tier — and long-term exposure raises lung-cancer deaths about 8% per increment.", url:"https://www.iarc.who.int/news-events/iarc-outdoor-air-pollution-a-leading-environmental-cause-of-cancer-deaths/"},
        {text:"After lung-cancer surgery, a wildfire within three months raised the risk of death [43%].", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC10375383/"}
      ],
      ox:0.50, oy:0.26, label:"Lungs"
    },
    heart: {
      name:"Heart",
      impacts:[
        {text:"On dense-smoke days, cardiac emergencies in older adults rose [about 15%], and strokes about 22%.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC6015400/"},
        {text:"Heavy-smoke days carried up to a [70% higher risk] of cardiac arrest outside the hospital.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC7428528/"},
        {text:"Across 22 million people, each small rise in long-term exposure raised new [heart-failure risk 1.4%].", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12367337/"}
      ],
      ox:0.50, oy:0.29, label:"Heart"
    },
    kidneys: {
      name:"Kidneys",
      impacts:[
        {text:"Among dialysis patients, smoke particles were linked to [4% more deaths the same day] and 7% over the following month.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC7460895/"}
      ],
      ox:0.50, oy:0.40, label:"Kidneys"
    },
    pregnancy: {
      name:"Reproduction",
      impacts:[
        {text:"Each small rise in exposure during pregnancy raised the odds of [preterm birth 1.3%] across 5.1 million births.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11410054/"},
        {text:"The first study of its kind tied third-trimester smoke to [higher odds of autism].", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12874521/"}
      ],
      ox:0.50, oy:0.50, label:"Reproduction"
    },
    bloodstream: {
      name:"Blood & Cells",
      impacts:[
        {text:"Exposure changed [DNA at 94 sites] across 133 disease-linked genes and left toxic metals in immune cells.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12696577/"},
        {text:"When buildings burn, the smoke carried carcinogenic [chromium-6 nanoparticles] up to 6–9 miles downwind.", url:"https://www.ucdavis.edu/news/researchers-find-carcinogenic-chromium-6-palisades-altadena-fire-cleanup-zones"}
      ],
      ox:0.50, oy:0.33, label:"Blood & Cells"
    }
  };

  const ORDER = ["overview","brain","lungs","heart","kidneys","pregnancy","bloodstream"];
  const INDEX_LABELS = {
    overview:"Overview", brain:"Brain & Mind", lungs:"Lungs", heart:"Heart",
    kidneys:"Kidneys", pregnancy:"Reproduction", bloodstream:"Blood & Cells"
  };

  const hotspotsEl = document.getElementById('hotspots');
  const backBtn = document.getElementById('backBtn');
  const rightEl = document.getElementById('right');
  const figure = document.getElementById('figure');
  const glow = document.getElementById('glow');
  const cardInner = document.getElementById('cardInner');
  const cardName = document.getElementById('cardName');
  const cardIntro = document.getElementById('cardIntro');
  const cardImpacts = document.getElementById('cardImpacts');
  const indexEl = document.getElementById('index');

  let current = "overview";
  let targetScale = 1;
  let targetX = 0;
  let targetY = 0;

  function linkify(text, url){
    const m = text.match(/\[(.+?)\]/);
    if(!m) return text;
    const idx = text.indexOf(m[0]);
    const pre = text.slice(0, idx);
    const post = text.slice(idx + m[0].length);
    return pre + '<a href="'+url+'" target="_blank" rel="noopener">'+m[1]+'</a>' + post;
  }

  function renderCard(key){
    const d = DATA[key];
    if(key === "overview"){
      cardName.style.display = 'none';
      cardName.textContent = '';
    } else {
      cardName.style.display = '';
      cardName.textContent = d.name;
    }
    if(d.intro){
      cardIntro.style.display = '';
      cardIntro.textContent = d.intro;
    } else {
      cardIntro.style.display = 'none';
    }
    cardImpacts.innerHTML = d.impacts.map(im =>
      '<p>'+linkify(im.text, im.url)+'</p>'
    ).join('');
  }

  function applyTransform() {
    figure.style.transform = `translate(${targetX}px, ${targetY}px) scale(${targetScale})`;
  }

  function setHighlight(key){
    if(key === "overview"){
      backBtn.classList.remove('show');
      glow.classList.remove('show');
      figure.classList.remove('zoomed');
      targetScale = 1;
      targetX = 0;
      targetY = 0;
      applyTransform();
      hotspotsEl.querySelectorAll('.hotspot').forEach(h=>{
        h.classList.remove('active','dimmed');
      });
    } else {
      const d = DATA[key];
      backBtn.classList.add('show');
      glow.style.left = (d.ox*100)+'%';
      glow.style.top = (d.oy*100)+'%';
      glow.classList.add('show');
      figure.classList.add('zoomed');
      
      // Compute zoom: scale up to 2.5, but clamp so figure width never exceeds area width
      const areaW = rightEl.clientWidth;
      const areaH = rightEl.clientHeight;
      const figW = figure.offsetWidth || (areaH * 688 / 1024);
      
      let scale = 2.5;
      const maxScale = areaW / figW;
      if (scale > maxScale) scale = maxScale;
      if (scale < 1) scale = 1; // never shrink
      
      targetScale = scale;
      
      // Translate to keep organ horizontally centered, vertically centered
      const figRect = figure.getBoundingClientRect();
      const fW = figRect.width;
      const fH = figRect.height;
      
      // Center of organ in figure coordinates
      const cx = d.ox * fW;
      const cy = d.oy * fH;
      
      // Current center of figure in area
      const figCenterX = fW / 2;
      const figCenterY = fH / 2;
      
      // We want to move the organ point to the area center
      targetX = (areaW / 2 - fW / 2) - (cx - figCenterX) * scale;
      targetY = (areaH / 2 - fH / 2) - (cy - figCenterY) * scale;
      
      applyTransform();
      
      hotspotsEl.querySelectorAll('.hotspot').forEach(h=>{
        if(h.dataset.key === key){
          h.classList.add('active');
          h.classList.remove('dimmed');
        } else {
          h.classList.add('dimmed');
          h.classList.remove('active');
        }
      });
    }
  }

  function select(key, force){
    if(current === key && !force){
      current = "overview";
    } else {
      current = key;
    }
    cardInner.classList.add('leaving');
    setTimeout(()=>{
      renderCard(current);
      setHighlight(current);
      cardInner.classList.remove('leaving');
    }, 200);
    indexEl.querySelectorAll('.index-row').forEach(c=>{
      c.setAttribute('aria-pressed', c.dataset.key === current ? 'true' : 'false');
    });
  }

  // Build hotspots
  ORDER.forEach(key=>{
    if(key === "overview") return;
    const d = DATA[key];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'hotspot';
    b.style.left = (d.ox*100)+'%';
    b.style.top = (d.oy*100)+'%';
    b.dataset.key = key;
    b.setAttribute('aria-label', 'Show impact on '+d.label);
    const lab = document.createElement('span');
    lab.className = 'label';
    lab.textContent = d.label;
    b.appendChild(lab);
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      select(key);
    });
    hotspotsEl.appendChild(b);
  });

  // Build anatomy index
  ORDER.forEach((key, i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'index-row';
    b.dataset.key = key;
    b.setAttribute('aria-pressed', key === 'overview' ? 'true' : 'false');
    const idx = document.createElement('span');
    idx.className = 'idx';
    idx.textContent = String(i+1).padStart(2,'0');
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = INDEX_LABELS[key];
    b.appendChild(idx);
    b.appendChild(nm);
    b.addEventListener('click', ()=>select(key));
    indexEl.appendChild(b);
  });

  backBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    select('overview', true);
  });

  // Clicking the background returns to overview
  rightEl.addEventListener('click', (e)=>{
    if(e.target.closest('.hotspot') || e.target.closest('.back-btn')) return;
    if(current !== 'overview') select('overview', true);
  });

  // Recalculate zoom on resize
  window.addEventListener('resize', () => {
    if (current !== 'overview') {
      setHighlight(current);
    }
  });

  // Init
  renderCard('overview');
  setHighlight('overview');
})();
</script>
</body>
</html>

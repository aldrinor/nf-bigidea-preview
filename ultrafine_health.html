<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultrafine Particles — Health Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#1f2327;
    --headline-ink:#1a1a1a;
    --muted:#8a9095;
    --faint:#aab2b8;
    --accent:#1b7bff;
    --red:#e23b3b;
    --hair:rgba(20,24,28,0.08);
    --stack:-apple-system, system-ui, 'Inter', 'Space Grotesk', sans-serif;
    --mono:'Space Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--stack);-webkit-font-smoothing:antialiased}
  body{min-height:100vh}

  .health{
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .grid{
    flex:1;
    display:grid;
    grid-template-columns:48% 52%;
    align-items:start;
    width:100%;
    min-height:0;
  }

  /* LEFT */
  .left{
    display:flex;
    flex-direction:column;
    justify-content:flex-start;                 /* top-anchored so the passage never shifts vertically */
    min-width:0;
    max-height:100vh;
    padding:150px clamp(24px,5vw,80px) clamp(16px,2vh,28px);
    z-index:10;
    position:relative;
  }
  h1.headline{
    font-family:var(--stack);
    font-weight:600;
    font-size:clamp(20px, 1.95vw, 28px);
    line-height:1.32;
    letter-spacing:-0.022em;
    color:var(--headline-ink);
    margin:0 0 clamp(14px,2vh,22px);
    max-width:none;
  }
  h1.headline em{font-style:normal;color:var(--red)}

  .card{
    min-height:170px;
    position:relative;
    flex-shrink:0;
  }
  .card-inner{
    opacity:1;
    transform:none;
    transition:opacity .35s ease, transform .35s cubic-bezier(.16,1,.3,1);
  }
  .card-inner.leaving{opacity:0;transform:translateY(8px)}
  .card-name{
    font-family:var(--stack);
    font-weight:600;
    font-size:clamp(22px,2vw,28px);
    line-height:1.15;
    letter-spacing:-0.018em;
    color:var(--headline-ink);
    margin:0 0 14px;
  }
  .card-intro{
    font-family:var(--stack);
    font-size:17.5px;
    line-height:1.5;
    color:#1a1a1a;
    font-weight:400;
    margin:0 0 14px;
    max-width:540px;
  }
  .card-impacts p{
    font-family:var(--stack);
    font-size:17.5px;
    line-height:1.5;
    color:#1a1a1a;
    font-weight:400;
    margin:0 0 12px;
    max-width:540px;
  }
  .card-impacts p:last-child{margin-bottom:0}
  .card-impacts a{
    color:#1a1a1a;
    text-decoration:none;
    border-bottom:1px solid rgba(20,24,28,0.22);
    transition:color .15s ease, border-color .15s ease;
  }
  .card-impacts a:hover{color:var(--red);border-color:var(--red)}

  /* ANATOMY INDEX — vertical selector */
  .index{
    margin-top:clamp(10px,1.4vh,18px);
    display:flex;
    flex-direction:column;
    border-top:1px solid var(--hair);
    flex-shrink:0;
  }
  .index-row{
    display:flex;
    align-items:center;
    gap:18px;
    width:100%;
    padding:8px 6px 8px 14px;
    background:transparent;
    border:0;
    border-bottom:1px solid var(--hair);
    cursor:pointer;
    text-align:left;
    position:relative;
    transition:background .18s ease, color .18s ease;
    font-family:var(--stack);
  }
  .index-row::before{
    content:"";
    position:absolute;
    left:0; top:50%;
    transform:translateY(-50%) scaleY(0);
    width:3px;
    height:60%;
    background:var(--red);
    border-radius:2px;
    transition:transform .22s cubic-bezier(.16,1,.3,1);
  }
  .index-row .idx{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    width:26px;
    flex:0 0 26px;
    letter-spacing:0.02em;
    transition:color .18s ease;
  }
  .index-row .nm{
    font-family:var(--stack);
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    letter-spacing:-0.005em;
    transition:color .18s ease;
  }
  .index-row:hover{background:rgba(20,24,28,0.035)}
  .index-row:hover .nm{color:var(--red)}
  .index-row[aria-pressed="true"] .nm{color:var(--red)}
  .index-row[aria-pressed="true"] .idx{color:var(--red)}
  .index-row[aria-pressed="true"]::before{transform:translateY(-50%) scaleY(1)}
  .index-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  /* RIGHT — WIDE AREA spanning full width */
  .right{
    position:absolute;
    top:0; right:0;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    z-index:1;
  }
  
  .back-btn{
    position:absolute;
    top:16px;
    right:16px;
    z-index:20;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--hair);
    background:rgba(237,240,242,0.9);
    color:var(--ink);
    font-family:var(--stack);
    font-size:22px;
    font-weight:600;
    line-height:1;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transform:translateY(-4px);
    transition:opacity .3s ease, transform .3s ease, border-color .18s ease, color .18s ease;
    backdrop-filter:blur(4px);
  }
  .back-btn.show{opacity:1;pointer-events:auto;transform:none}
  .back-btn:hover{border-color:var(--red);color:var(--red)}
  .back-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* FIGURE WRAPPER — pins dots to the figure precisely */
  .figure{
    position:relative;
    height:100%;
    aspect-ratio:688/962;
    max-width:100%;
    transform-origin:center center;
    transition:transform .7s cubic-bezier(.16,1,.3,1);
    will-change:transform;
  }
  .figure.zoomed .body-img{
    animation:none;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.012)}
  }

  /* BODY IMG — fills the wrapper exactly */
  .body-img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
    user-select:none;
    animation:breathe 4.5s ease-in-out infinite;
  }

  /* GLOW HALO — blooms over the selected organ */
  .glow{
    position:absolute;
    transform:translate(-50%,-50%);
    width:120px; height:120px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(226,59,59,0.28) 0%, rgba(226,59,59,0.08) 45%, transparent 70%);
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
    z-index:1;
  }
  .glow.show{
    opacity:1;
    animation:glowPulse 2.4s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{transform:translate(-50%,-50%) scale(var(--inv,1));opacity:0.85}
    50%{transform:translate(-50%,-50%) scale(calc(var(--inv,1) * 1.15));opacity:1}
  }

  /* HOTSPOTS */
  .hotspots{position:absolute;inset:0;pointer-events:none;z-index:2}
  .hotspot{
    position:absolute;
    transform-origin:center center;
    transform:translate(-50%,-50%) scale(var(--inv,1));
    width:18px;height:18px;
    border:0;background:transparent;
    padding:0;cursor:pointer;
    pointer-events:auto;
    transition:opacity .4s ease, width .3s ease, height .3s ease, transform .7s cubic-bezier(.16,1,.3,1);
  }
  .hotspot::before{
    content:"";
    position:absolute;inset:0;
    border-radius:50%;
    background:var(--red);
    transform:scale(0.38);
    box-shadow:0 0 0 1px rgba(255,255,255,0.6);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .hotspot::after{
    content:"";
    position:absolute;inset:0;
    border-radius:50%;
    border:1.5px solid var(--red);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(0.5);opacity:0.9}
    100%{transform:scale(1.9);opacity:0}
  }
  .hotspot:hover::before{transform:scale(0.5)}
  .hotspot .label{
    position:absolute;
    left:50%;top:100%;
    transform:translate(-50%,8px);
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink);
    background:var(--bg);
    padding:3px 7px;
    border:1px solid var(--hair);
    border-radius:4px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .hotspot:hover .label,.hotspot:focus-visible .label{opacity:1}
  .hotspot:focus-visible{outline:none}
  .hotspot:focus-visible::after{border-color:var(--accent);animation:none;transform:scale(1.4);opacity:1}

  /* ACTIVE STATE — solid red dot + white ring */
  .hotspot.active{
    width:26px; height:26px;
    z-index:3;
  }
  .hotspot.active::before{
    transform:scale(1);
    box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--red), 0 0 12px 2px rgba(226,59,59,0.4);
  }
  .hotspot.active::after{
    animation:pulse 1.8s ease-out infinite;
    border-width:2px;
  }
  .hotspot.dimmed{
    opacity:0.35;
  }

  /* MOBILE */
  @media (max-width:880px){
    .grid{
      grid-template-columns:1fr;
      align-items:start;
      min-height:auto;
    }
    .left{
      order:1;
      max-height:none;
      padding:0 clamp(20px,6vw,32px);
      z-index:10;
      background:var(--bg);
      padding-bottom:20px;
    }
    .right{
      position:relative;
      order:2;
      height:clamp(400px, 68vh, 680px);
      max-height:none;
    }
    .card{min-height:180px}
    h1.headline{max-width:none}
    .index-row{padding:8px 6px 8px 14px}
    .index-row .nm{font-size:16px}
  }

  @media (prefers-reduced-motion:reduce){
    .figure{animation:none;transition:transform .2s ease}
    .glow{animation:none;transition:opacity .2s ease}
    .hotspot::after{animation:none}
    .card-inner{transition:opacity .2s ease}
  }

/* wfhealth_landscape_v2 — landscape-phone 2-col */
@media (max-width: 900px) and (orientation: landscape) and (max-height: 560px) {
   .grid{ grid-template-columns:46% 54%; align-items:center; }
   .left{ order:1; display:block; max-height:100vh; overflow-y:auto; padding:10px clamp(16px,4vw,30px); }
   .right{ order:2; position:relative; height:100vh; max-height:100vh; }
   .figure{ height:100%; }
   h1.headline{ font-size:clamp(16px,2.8vw,21px); line-height:1.15; margin:8px 0 8px; max-width:none; }
   .card{ min-height:0; }
   .card-name{ font-size:clamp(16px,2vw,20px); margin-bottom:6px; }
   .card-intro{ font-size:13px; line-height:1.45; margin-bottom:8px; }
   .card-impacts p{ font-size:13px; line-height:1.45; margin-bottom:7px; }
   .index{ margin-top:10px; }
   .index-row{ padding:7px 6px 7px 12px; }
   .index-row .nm{ font-size:14px; }
}

/* wfhealth_phone_v2 — co-locate diagram + chips on phone */
@media (max-width: 880px) and (orientation: portrait) {
  .grid {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .left,
  .right {
    display: contents;
  }
  h1.headline {
    order: 1;
    font-size: clamp(20px, 5.2vw, 26px);
    margin: 0;
  }
  .figure {
    order: 2;
    height: 42vh;
    max-height: 42vh;
    width: auto;
    margin: 0 auto;
    position: relative;
  }
  .index {
    order: 3;
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    gap: 8px;
    border-top: none;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
    width: 100%;
  }
  .card {
    order: 4;
  }
  .index-row {
    flex: 0 0 auto;
    width: auto;
    border: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
    border-radius: 999px;
    padding: 8px 14px;
    white-space: nowrap;
  }
  .index-row .nm {
    font-size: 14px;
  }
  .back-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 10;
  }
  .body-img,
  .glow,
  .hotspots {
    max-width: 100%;
  }
  .left,
  .right,
  .grid {
    overflow-x: hidden;
  }
}
</style>
</head>
<body>
<section class="health" aria-labelledby="health-headline">
  <div class="grid">
    <div class="left">
      <h1 class="headline" id="health-headline">What ultrafine particles do <em>inside you</em></h1>

      <div class="card">
        <div class="card-inner" id="cardInner" aria-live="polite">
          <h2 class="card-name" id="cardName" style="display:none"></h2>
          <p class="card-intro" id="cardIntro"></p>
          <div class="card-impacts" id="cardImpacts"></div>
        </div>
      </div>

      <div class="index" id="index" role="group" aria-label="Select an organ"></div>
    </div>

    <div class="right" id="right">
      <button class="back-btn" id="backBtn" type="button" aria-label="Return to full body view">&lsaquo;</button>
      <div class="figure" id="figure">
        <img class="body-img" id="bodyImg" src="assets/body/body_premium.png" alt="Anatomical figure showing where ultrafine particles affect the body" draggable="false">
        <div class="glow" id="glow"></div>
        <div class="hotspots" id="hotspots"></div>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  const DATA = {
    overview: {
      name: "",
      intro: "Ultrafine particles are the smallest and most numerous part of fine-particle pollution, known as PM2.5. They are small enough to pass from the lungs into the bloodstream and reach organs far beyond the airway, even the brain. Some findings below measured ultrafine particles directly; others measured PM2.5, the wider family they belong to.",
      impacts: [
        {text:"The World Health Organization ties outdoor fine-particle pollution to about [4.2 million early deaths a year].", url:"https://www.who.int/news-room/fact-sheets/detail/ambient-(outdoor)-air-quality-and-health"}
      ],
      ox:0.5, oy:0.5
    },
    lungs: {
      name:"Lungs",
      impacts:[
        {text:"The USC Children's Health Study found that as PM2.5 fell over 13 years, [clinically low lung function dropped to 3.6%] of children, from 7.9%.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC4430551/"},
        {text:"Cincinnati Children's Hospital researchers found a 10-fold rise in ultrafine particle exposure [cut a teenager's lung function by 0.04 litres] about 90 minutes later.", url:"https://academic.oup.com/annalsats/article-abstract/19/9/1516/8417871"},
        {text:"The WHO cancer agency IARC ranks outdoor particle pollution a [Group 1 cause of lung cancer] - its top proven category.", url:"https://www.iarc.who.int/news-events/iarc-outdoor-air-pollution-a-leading-environmental-cause-of-cancer-deaths/"}
      ],
      ox:0.44, oy:0.25, label:"Lungs"
    },
    heart: {
      name:"Heart",
      impacts:[
        {text:"Harvard researchers in Circulation found a rise of 25 micrograms of PM2.5 per cubic metre raised [the odds of a heart attack about 48%] within hours.", url:"https://pubmed.ncbi.nlm.nih.gov/11401937/"},
        {text:"An American Cancer Society study in Circulation found each 10 micrograms of long-term PM2.5 per cubic metre raised [ischemic heart disease deaths about 18%].", url:"https://www.ahajournals.org/doi/10.1161/01.cir.0000108927.80044.7f"},
        {text:"A University of Toronto study of 1.1 million adults found each step up in long-term ultrafine particle exposure was tied to [about 5% more heart attacks].", url:"https://academic.oup.com/aje/article/188/1/151/5085353"}
      ],
      ox:0.53, oy:0.29, label:"Heart"
    },
    brain: {
      name:"Brain & Mind",
      impacts:[
        {text:"Lancaster University researchers found combustion particles smaller than 200 nm can reach the brain through the nerve behind the nose, with [millions per gram of brain].", url:"https://pubmed.ncbi.nlm.nih.gov/27601646/"},
        {text:"An Emory University study of about 21 million older Americans found each rise of roughly 3,700 ultrafine particles per cubic centimetre raised [Alzheimer's risk 2.6%].", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC11948469/"},
        {text:"A Harvard-led review in The BMJ found every extra 2 micrograms of PM2.5 per cubic metre raised [dementia risk 17%] in studies that screened everyone.", url:"https://hsph.harvard.edu/news/air-pollution-may-increase-risk-for-dementia/"}
      ],
      ox:0.50, oy:0.075, label:"Brain & Mind"
    },
    metabolic: {
      name:"Metabolism",
      impacts:[
        {text:"Washington University and VA researchers tied PM2.5 to [about 3.2 million new diabetes cases worldwide] in one year, roughly 14% of all new cases.", url:"https://medicine.washu.edu/news/air-pollution-contributes-significantly-to-diabetes-globally/"},
        {text:"A Helmholtz Munich study of 2,944 adults found a rise in particle pollution went with [15.6% higher insulin resistance].", url:"https://pubmed.ncbi.nlm.nih.gov/27605624/"},
        {text:"Helmholtz Munich and LMU Munich researchers found each 1,000 extra ultrafine particles per cubic centimetre went with [3% higher odds of high blood pressure] and higher blood sugar.", url:"https://pubmed.ncbi.nlm.nih.gov/40992322/"}
      ],
      ox:0.50, oy:0.40, label:"Metabolism"
    },
    reproduction: {
      name:"Reproduction",
      impacts:[
        {text:"UCLA researchers found mothers most exposed to ultrafine particles near Los Angeles airport had [14% higher odds of a preterm birth] than those least exposed.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC7228090/"},
        {text:"A University of York study tied PM2.5 to [2.7 million early births worldwide] in one year, about 18% of all preterm births.", url:"https://pubmed.ncbi.nlm.nih.gov/28196630/"},
        {text:"Kaiser Permanente and USC researchers found aircraft ultrafine particles during pregnancy raised [the child's odds of autism about 1.6%] for each step up in exposure.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC10472925/"}
      ],
      ox:0.50, oy:0.50, label:"Reproduction"
    },
    blood: {
      name:"Blood & Cells",
      impacts:[
        {text:"A study in the American Heart Association journal Circulation found inhaled ultrafine particles [crossed into the blood within 1 minute].", url:"https://pubmed.ncbi.nlm.nih.gov/11815420/"},
        {text:"Chinese Academy of Sciences researchers found [combustion soot particles in the blood of all 37 people tested], measuring 50 to 200 nm.", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC7244483"},
        {text:"The Harvard VA Normative Aging Study found soot and PM2.5 altered an inflammation gene, with each small rise in soot tied to [a 0.9% drop in methylation].", url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC3491965/"}
      ],
      ox:0.28, oy:0.49, label:"Blood & Cells"
    }
  };

  const ORDER = ["overview","brain","heart","lungs","metabolic","reproduction","blood"];
  const INDEX_LABELS = {
    overview:"Overview", brain:"Brain & Mind", heart:"Heart", lungs:"Lungs", metabolic:"Metabolism", reproduction:"Reproduction", blood:"Blood & Cells"
  };

  const hotspotsEl = document.getElementById('hotspots');
  const backBtn = document.getElementById('backBtn');
  const rightEl = document.getElementById('right');
  const figure = document.getElementById('figure');
  const glow = document.getElementById('glow');
  const cardInner = document.getElementById('cardInner');
  const cardName = document.getElementById('cardName');
  const cardIntro = document.getElementById('cardIntro');
  const cardImpacts = document.getElementById('cardImpacts');
  const indexEl = document.getElementById('index');

  let current = "overview";
  let targetScale = 1;
  let targetX = 0;
  let targetY = 0;

  function linkify(text, url){
    const m = text.match(/\[(.+?)\]/);
    if(!m) return text;
    const idx = text.indexOf(m[0]);
    const pre = text.slice(0, idx);
    const post = text.slice(idx + m[0].length);
    return pre + '<a href="'+url+'" target="_blank" rel="noopener">'+m[1]+'</a>' + post;
  }

  function renderCard(key){
    const d = DATA[key];
    if(key === "overview"){
      cardName.style.display = 'none';
      cardName.textContent = '';
    } else {
      cardName.style.display = '';
      cardName.textContent = d.name;
    }
    if(d.intro){
      cardIntro.style.display = '';
      cardIntro.textContent = d.intro;
    } else {
      cardIntro.style.display = 'none';
    }
    cardImpacts.innerHTML = d.impacts.map(im =>
      '<p>'+linkify(im.text, im.url)+'</p>'
    ).join('');
  }

  function applyTransform() {
    figure.style.transform = `translate(${targetX}px, ${targetY}px) scale(${targetScale})`;
  }

  // Horizontal offset so the resting figure lines up with the particle on the
  // sibling hero page (centered in the right 54% column of a 46/54 grid with
  // clamp(24px,6vw,96px) padding + clamp(32px,5vw,80px) gap). 0 when stacked.
  function restOffsetX(){
    const aw = rightEl.clientWidth;
    const vw = window.innerWidth;
    if (vw <= 880) return 0;
    const padX = Math.min(96, Math.max(24, 0.06*vw));
    const gap  = Math.min(80, Math.max(32, 0.05*vw));
    const innerW = vw - 2*padX - gap;
    const anchorX = padX + innerW*0.46 + gap + innerW*0.54/2;
    return anchorX - aw/2;
  }

  function setHighlight(key){
    if(key === "overview"){
      backBtn.classList.remove('show');
      glow.classList.remove('show');
      figure.classList.remove('zoomed');
      targetScale = 1;
      targetX = restOffsetX();
      targetY = 0;
      figure.style.setProperty('--inv', '1');
      applyTransform();
      hotspotsEl.querySelectorAll('.hotspot').forEach(h=>{
        h.classList.remove('active','dimmed');
      });
    } else {
      const d = DATA[key];
      backBtn.classList.add('show');
      glow.style.left = (d.ox*100)+'%';
      glow.style.top = (d.oy*100)+'%';
      glow.classList.add('show');
      figure.classList.add('zoomed');
      
      // Compute zoom: scale up to 2.5, but clamp so figure width never exceeds area width
      const areaW = rightEl.clientWidth;
      const areaH = rightEl.clientHeight;
      const figW = figure.offsetWidth || (areaH * 688 / 962);

      let scale = 0.86 / Math.max(d.oy, 0.40); scale = Math.min(2.5, Math.max(1.5, scale));
      const maxScale = areaW / figW;
      if (scale > maxScale) scale = maxScale;
      if (scale < 1) scale = 1; // never shrink

      targetScale = scale;
      // Counter-scale the dots + labels so they keep a constant size when zoomed
      figure.style.setProperty('--inv', (1/scale).toFixed(4));
      
      // The organ is a fraction (ox,oy) of the figure box; the figure is flex-
      // centered in the area. Use the UNSCALED box size (offset*, transform-free)
      // so this is correct even when going organ -> organ. Place every organ on
      // the SAME aligned column as the resting figure (and the hero particle),
      // vertically centered, so the figure never jumps sideways between clicks.
      const fW = figure.offsetWidth;
      const fH = figure.offsetHeight;
      targetX = restOffsetX() - (d.ox - 0.5) * fW * scale;
      targetY = fH * (0.06 - 0.5 + 0.5 * scale);
      
      applyTransform();
      
      hotspotsEl.querySelectorAll('.hotspot').forEach(h=>{
        if(h.dataset.key === key){
          h.classList.add('active');
          h.classList.remove('dimmed');
        } else {
          h.classList.add('dimmed');
          h.classList.remove('active');
        }
      });
    }
  }

  function select(key, force){
    if(current === key && !force){
      current = "overview";
    } else {
      current = key;
    }
    cardInner.classList.add('leaving');
    setTimeout(()=>{
      renderCard(current);
      setHighlight(current);
      cardInner.classList.remove('leaving');
    }, 200);
    indexEl.querySelectorAll('.index-row').forEach(c=>{
      c.setAttribute('aria-pressed', c.dataset.key === current ? 'true' : 'false');
    });
  }

  // Build hotspots
  ORDER.forEach(key=>{
    if(key === "overview") return;
    const d = DATA[key];
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'hotspot';
    b.style.left = (d.ox*100)+'%';
    b.style.top = (d.oy*100)+'%';
    b.dataset.key = key;
    b.setAttribute('aria-label', 'Show impact on '+d.label);
    const lab = document.createElement('span');
    lab.className = 'label';
    lab.textContent = d.label;
    b.appendChild(lab);
    b.addEventListener('click', (e)=>{
      e.stopPropagation();
      select(key);
    });
    hotspotsEl.appendChild(b);
  });

  // Build anatomy index
  ORDER.forEach((key, i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'index-row';
    b.dataset.key = key;
    b.setAttribute('aria-pressed', key === 'overview' ? 'true' : 'false');
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = INDEX_LABELS[key];
    b.appendChild(nm);
    b.addEventListener('click', ()=>select(key));
    indexEl.appendChild(b);
  });

  backBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    select('overview', true);
  });

  // Clicking the background returns to overview
  rightEl.addEventListener('click', (e)=>{
    if(e.target.closest('.hotspot') || e.target.closest('.back-btn')) return;
    if(current !== 'overview') select('overview', true);
  });

  // Recalculate position/zoom on resize (rest offset is width-dependent)
  window.addEventListener('resize', () => {
    setHighlight(current);
  });

  // Init (UAT: ?organ=KEY preselects an organ for verification)
  const _uat = new URLSearchParams(location.search).get('organ');
  const _init = (_uat && DATA[_uat]) ? _uat : 'overview';
  current = _init;
  renderCard(_init);
  setHighlight(_init);
})();
</script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<title>Wildfire Smoke — Editorial Charts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf0f2;
    --ink:#1f2327;
    --muted:#828a90;
    --faint:#aab2b8;
    --hair:rgba(20,24,28,0.12);
    --red:#e23b3b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Space Grotesk',sans-serif;}
  body{padding:36px 40px 48px;display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .cell{
    width:100%;max-width:620px;padding:0 12px;
  }
  .cell .label{
    font-family:'Space Mono',monospace;font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--hair);padding-bottom:8px;
  }
  .cell .label .tag{color:var(--red);font-weight:700;}
  .cell h2{
    font-family:'Space Grotesk',sans-serif;font-weight:600;
    font-size:18px;margin:0 0 16px;letter-spacing:-0.005em;
    line-height:1.25;
  }
  .cell svg{display:block;width:100%;height:auto;}
  .cell .source{
    font-family:'Space Mono',monospace;font-size:9.5px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
    margin:10px 0 0;
  }
</style>
</head>
<body><div class="cell">
    <div class="label"><span>FIG. 03 · FILTER COLLAPSE</span><span class="tag">▲ FAILURE</span></div>
    <h2>Charged-filter CADR collapses as smoke deposits accumulate</h2>
    <svg viewBox="0 0 600 360" role="img" aria-label="Filter CADR collapse curve">
      <style>
        .mono{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.10em;text-transform:uppercase;fill:#828a90;}
        .mono-ink{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.10em;text-transform:uppercase;fill:#1f2327;}
        .mono-faint{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;fill:#aab2b8;}
        .mono-red{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.10em;text-transform:uppercase;fill:#e23b3b;font-weight:700;}
        .grotesk-bold{font-family:'Space Grotesk',sans-serif;font-weight:700;}
      </style>

      <!-- gridlines (faint) -->
      <g stroke="rgba(20,24,28,0.08)" stroke-width="1">
        <line x1="66" y1="54"    x2="556" y2="54"/>
        <line x1="66" y1="115.5" x2="556" y2="115.5"/>
        <line x1="66" y1="177"   x2="556" y2="177"/>
        <line x1="66" y1="238.5" x2="556" y2="238.5"/>
      </g>

      <!-- y axis labels -->
      <g class="mono" text-anchor="end">
        <text x="58" y="304">0</text>
        <text x="58" y="242.5">25</text>
        <text x="58" y="181">50</text>
        <text x="58" y="119.5">75</text>
        <text x="58" y="58">100%</text>
      </g>

      <!-- baseline -->
      <line x1="66" y1="300" x2="556" y2="300" stroke="#1f2327" stroke-width="1"/>

      <!-- x ticks -->
      <g stroke="#1f2327" stroke-width="1">
        <line x1="66"  y1="300" x2="66"  y2="304"/>
        <line x1="148" y1="300" x2="148" y2="304"/>
        <line x1="229" y1="300" x2="229" y2="304"/>
        <line x1="311" y1="300" x2="311" y2="304"/>
        <line x1="393" y1="300" x2="393" y2="304"/>
        <line x1="474" y1="300" x2="474" y2="304"/>
        <line x1="556" y1="300" x2="556" y2="304"/>
      </g>
      <g class="mono" text-anchor="middle">
        <text x="66"  y="318">0</text>
        <text x="148" y="318">2</text>
        <text x="229" y="318">4</text>
        <text x="311" y="318">6</text>
        <text x="393" y="318">8</text>
        <text x="474" y="318">10</text>
        <text x="556" y="318">12</text>
      </g>
      <text class="mono-ink" x="311" y="336" text-anchor="middle" style="font-weight:700;">MG DEPOSITED</text>
      <text class="mono-faint" x="311" y="350" text-anchor="middle">a few hours of a moderate smoke event</text>

      <!-- light-red shaded danger area under collapsed tail (10mg → 12mg) -->
      <path d="M 474,287.5 L 556,292.5 L 556,300 L 474,300 Z"
            fill="rgba(226,59,59,0.10)"/>

      <!-- CADR curve area fill (very faint, recedes) -->
      <path d="M 66,54 L 210,55 C 250,57 285,72 311,103 C 345,138 375,180 393,214 C 420,250 450,275 474,287.5 L 556,292.5 L 556,300 L 66,300 Z"
            fill="rgba(20,24,28,0.035)"/>

      <!-- secondary: airflow resistance reference line (clearly light grey, clearly secondary) -->
      <line x1="66" y1="282.5" x2="556" y2="282.5"
            stroke="#c5ccd1" stroke-width="1" stroke-dasharray="2 4"/>

      <!-- CADR collapse curve -->
      <path d="M 66,54 L 210,55 C 250,57 285,72 311,103 C 345,138 375,180 393,214 C 420,250 450,275 474,287.5 L 556,292.5"
            fill="none" stroke="#1f2327" stroke-width="2"/>

      <!-- threshold drop-line at 10 mg (clean dashed, to axis) -->
      <line x1="474" y1="54" x2="474" y2="300"
            stroke="rgba(20,24,28,0.40)" stroke-width="1" stroke-dasharray="3 4"/>

      <!-- start dot: 100% · initial -->
      <circle cx="66" cy="54" r="3.5" fill="#1f2327"/>
      <text class="mono-ink" x="74" y="50" style="font-weight:700;">100%</text>
      <text class="mono" x="74" y="62">INITIAL</text>

      <!-- collapse point: ONE red accent -->
      <circle cx="474" cy="287.5" r="4.5" fill="#e23b3b"/>
      <!-- leader from dot up the drop-line to label -->
      <line x1="474" y1="283" x2="474" y2="92" stroke="rgba(20,24,28,0.40)" stroke-width="1"/>
      <text class="mono-red" x="474" y="80" text-anchor="middle">−95% at ~10 mg</text>
      <text class="mono" x="474" y="94" text-anchor="middle">CADR collapses</text>

      <!-- NOTE block: upper-right negative space -->
      <text class="mono-faint" x="556" y="120" text-anchor="end" style="letter-spacing:.16em;">AIRFLOW RESISTANCE</text>
      <line x1="494" y1="126" x2="556" y2="126" stroke="rgba(20,24,28,0.12)" stroke-width="1"/>
      <text class="mono" x="556" y="140" text-anchor="end">rises only ~7% —</text>
      <text class="mono" x="556" y="153" text-anchor="end">no clog signal.</text>
      <!-- tiny connector from note to the faint reference line -->
      <line x1="556" y1="158" x2="556" y2="282.5" stroke="rgba(20,24,28,0.12)" stroke-width="1" stroke-dasharray="1 5"/>
    </svg>
    <p class="source">Source: Holder et al., EPA, Indoor Air, 2022</p>
  </div></body></html>

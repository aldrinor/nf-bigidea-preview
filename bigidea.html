<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<meta name="robots" content="noindex,nofollow">
<title>The Big Idea — Scroll Story</title>
<meta name="description" content="An interactive, scroll-driven particle-and-molecule data visualization.">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#05070d;color:#fff;font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  html.lenis,html.lenis body{height:auto;}
  .lenis.lenis-smooth{scroll-behavior:auto!important;}

  #poster{position:fixed;inset:0;z-index:0;}
  #poster svg{width:100%;height:100%;display:block;}
  #c{position:fixed;inset:0;z-index:1;display:block;width:100%;height:100%;opacity:0;transition:opacity .9s ease;}
  #c.ready{opacity:1;}
  #spacer{height:700vh;position:relative;pointer-events:none;}

  #ui{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;}
  #scrim{position:absolute;inset:0;background:radial-gradient(120% 100% at 50% 50%,rgba(4,6,11,.88) 0%,rgba(3,4,8,.96) 100%);opacity:0;}

  /* Typography discipline: every act headline sits on a shared baseline (bottom band
     for acts 1/2/4, a top safe-band for act 5) with a consistent headline→subhead
     contrast step and a soft shadow so type never melts into glow. Acts 4-5 carry the
     LARGEST type of the ramp (act2 34px → act3 42px → act4 52px → act5 46px multi-line)
     and each is composed against the hero panel framing so copy never touches the scene:
     act-4 copy lives below the panel's bottom edge, act-5 copy in the clear top band,
     sized to hold a long two-sentence caption at full scale. */
  .cap{position:absolute;text-align:left;left:7%;right:auto;max-width:38%;padding:0;opacity:0;will-change:opacity;}
  .cap h1,.cap h2{font-family: 'Instrument Serif', serif;font-weight: 400;font-style: normal;font-size: clamp(2.5rem, 4.5vw, 4.5rem);line-height: 1.02;letter-spacing: -0.015em;text-align: center;color: #eef6fb;text-shadow: 0 4px 24px rgba(5,7,13,0.9), 0 0 60px rgba(52,225,255,0.12);margin: 0;padding: 0 1rem;text-wrap:balance;}
  .cap p{font-family: 'JetBrains Mono', monospace;font-weight: 400;font-size: clamp(0.85rem, 1.2vw, 1.05rem);line-height: 1.65;letter-spacing: 0.02em;text-align: center;color: #8ba2b3;max-width: 620px;margin: 2rem auto 0;text-shadow: 0 2px 12px rgba(5,7,13,0.9);text-wrap:balance;}
  #cap-act1{bottom:12%;}
  #cap-act2{bottom:14%;}
  #cap-act2 h2{font-size:clamp(20px,3vw,34px);}
  #cap-act4{bottom:6.5%;}
  #cap-act4 h2{font-size:clamp(26px,4.4vw,52px);}
  #cap-act4 p{font-size:clamp(15px,1.8vw,21px);max-width:760px;}
  #cap-act5{top:6.5%;}
  #cap-act5 h2{font-size:clamp(23px,3.4vw,46px);line-height:1.16;max-width:1100px;margin:0 auto;}

  #legend2{position:absolute;top:22px;left:24px;font-size:11px;letter-spacing:.14em;color:#7d8b9e;font-weight:600;opacity:0;text-transform:uppercase;}
  #illustrative{position:absolute;bottom:18px;right:22px;font-size:10px;letter-spacing:.22em;color:#55606e;opacity:0;text-transform:uppercase;}
  #badge{position:absolute;left:0;top:0;opacity:0;transform:translate(-50%,-50%);font-size:11px;letter-spacing:.16em;font-weight:700;color:#ffd7dc;background:rgba(255,85,102,.13);border:1px solid rgba(255,85,102,.45);border-radius:999px;padding:7px 14px;white-space:nowrap;backdrop-filter:blur(8px);}
  #badge-line{position:absolute;left:0;top:0;height:1px;opacity:0;transform-origin:0 50%;background:linear-gradient(90deg,rgba(255,85,102,.0),rgba(255,85,102,.55) 30%,rgba(255,85,102,.55));}

  /* Act-1 selection affordance: a snapping reticle ring with corner ticks + a small
     callout pill (CONFIG label/badge text only) tethered by a leader line. */
  /* premium pre-rendered specimen (Blender Cycles, real data) — billboarded over the WebGL scene during the act-1 scan */
  #specimg{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;transform:translate(-50%,-50%);transform-origin:center;pointer-events:none;will-change:transform,opacity;filter:drop-shadow(0 10px 30px rgba(0,0,0,.5));}
  #reticle{position:absolute;left:0;top:0;width:118px;height:118px;margin:-59px 0 0 -59px;opacity:0;border-radius:50%;border:1px solid rgba(130,225,255,.75);box-shadow:0 0 22px rgba(52,225,255,.22),inset 0 0 18px rgba(52,225,255,.10);will-change:transform,opacity;}
  #reticle i{position:absolute;width:13px;height:13px;border:0 solid rgba(170,240,255,.95);}
  #reticle i:nth-child(1){left:-2px;top:-2px;border-left-width:2px;border-top-width:2px;border-top-left-radius:6px;}
  #reticle i:nth-child(2){right:-2px;top:-2px;border-right-width:2px;border-top-width:2px;border-top-right-radius:6px;}
  #reticle i:nth-child(3){left:-2px;bottom:-2px;border-left-width:2px;border-bottom-width:2px;border-bottom-left-radius:6px;}
  #reticle i:nth-child(4){right:-2px;bottom:-2px;border-right-width:2px;border-bottom-width:2px;border-bottom-right-radius:6px;}
  #callout{position:absolute;left:96px;top:-26px;white-space:nowrap;font-size:10.5px;letter-spacing:.18em;font-weight:700;color:#cfeeff;text-transform:uppercase;background:rgba(8,14,24,.72);border:1px solid rgba(52,225,255,.4);border-radius:10px;padding:7px 12px;backdrop-filter:blur(8px);}
  #callout small{display:block;margin-top:3px;font-size:9px;letter-spacing:.22em;color:#7fa9c4;font-weight:600;}
  #callout::before{content:"";position:absolute;left:-38px;top:50%;width:38px;height:1px;background:linear-gradient(90deg,rgba(52,225,255,0),rgba(52,225,255,.6));}

  /* Act-5 capture counter (numeric only): a quiet fixed HUD readout docked at the
     lower-left corner — telemetry-weight, well clear of the headline and the panel. */
  #counter{position:absolute;left:26px;bottom:22px;opacity:0;font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.3em;font-weight:600;color:#8fb6d2;text-shadow:0 0 14px rgba(52,225,255,.22);}
  #counter::after{content:"";display:block;margin-top:6px;height:1px;background:linear-gradient(90deg,rgba(52,225,255,.45),rgba(52,225,255,0));}

  /* viewport tracer overlay (act-3 active card → red event) */
  #tracer{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}

  /* Act 3 — a designed three-band stack: held stop (header) · animating chart (middle) ·
     coda row (footer). Each stop holds in the SAME header slot so it reads as the narration
     for the chart drawing below it; the three coda cards land together as a finished row. */
  #act3-stops{position:absolute;left:6vw;top:9%;width:min(720px,74vw);height:18vh;pointer-events:none;}
  .stop{position:absolute;left:0;right:0;top:0;text-align:center;opacity:0;}
  .stop::before{content:"";display:block;width:46px;height:2px;margin:0 auto 18px;background:linear-gradient(90deg,transparent,rgba(120,150,180,.55),transparent);}
  .stop h2{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(36px,5.8vw,76px);line-height:1.0;letter-spacing:-.018em;color:#eaf4ff;max-width:900px;margin:0 auto;text-shadow:0 0 48px rgba(52,225,255,.22),0 0 12px rgba(52,225,255,.10),0 2px 0 rgba(0,0,0,.45);max-width:820px;margin:0 auto;}
  .stop h2{text-shadow:0 2px 22px rgba(0,0,0,.6);}
  #chartbox{position:absolute;left:50%;top:31%;transform:translateX(-50%);width:min(1100px,92vw);height:56vh;opacity:0;}
  #chartbox svg{width:100%;height:auto;display:block;overflow:visible;}
  #ev-pulse{transform-box:fill-box;transform-origin:center;animation:evpulse 1.6s ease-out infinite;}
  @keyframes evpulse{0%{transform:scale(.45);opacity:.9;}70%{transform:scale(1.55);opacity:0;}100%{transform:scale(1.55);opacity:0;}}
  #coda{position:absolute;left:50%;top:75%;transform:translate(-50%,-50%);display:flex;gap:20px;flex-wrap:nowrap;justify-content:center;align-items:stretch;width:min(960px,92vw);}
  /* scene-native frosted-glass panels: blur + saturate the field behind them, a thin
     luminous top edge, and an inner glow; the ACTIVE card lifts and warms. */
  .coda-card{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(18,26,40,.62),rgba(7,11,19,.46));border:1px solid rgba(120,180,230,.14);border-radius:12px;padding:24px 24px 22px;backdrop-filter:blur(14px) saturate(120%);-webkit-backdrop-filter:blur(14px) saturate(120%);font-family:'JetBrains Mono',monospace;font-size:clamp(12px,1.05vw,13.5px);font-weight:500;letter-spacing:.015em;color:#c4d2e4;box-shadow:inset 0 1px 0 rgba(180,220,255,.06),0 28px 60px -32px rgba(0,0,0,.75);}
  .coda-card::before{content:"";position:absolute;left:14%;right:14%;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(190,228,255,.65),transparent);opacity:.7;}
  .coda-card.active{border-color:rgba(255,110,128,.55);color:#fff;transform:translateY(-4px);box-shadow:inset 0 0 30px rgba(255,85,102,.13),inset 0 1px 0 rgba(255,210,218,.22),0 18px 40px rgba(0,0,0,.5),0 0 26px rgba(255,85,102,.12);}
  @media (max-width:680px){
    #coda{flex-wrap:wrap;top:72%;}
    .coda-card{flex:1 1 44%;min-height:74px;}
  }

  /* group labels: a legend row in the clear negative space BELOW the panel's bottom
     edge (positions projected from the panel's bottom corners each frame) — they never
     sit on the orbs, the face, or any body copy. Both leader ticks point up at the panel. */
  .grouplabel{position:absolute;left:0;top:0;opacity:0;transform:translate(-50%,-50%);font-size:clamp(11px,1.2vw,14px);font-weight:700;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;padding:8px 16px;border-radius:999px;border:1px solid rgba(120,150,180,.3);background:rgba(8,12,20,.62);backdrop-filter:blur(8px);}
  .grouplabel::after{content:"";position:absolute;left:50%;bottom:100%;width:1px;height:16px;background:linear-gradient(0deg,rgba(140,180,215,.55),rgba(140,180,215,0));}
  #group-a{color:#bff0ff;border-color:rgba(52,225,255,.4);}
  #group-b{color:#c6cfdb;}

  #hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-size:11px;color:#5d6b7d;letter-spacing:.26em;animation:bob 1.8s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,5px);}}

  /* ---- narrow portrait phones: fluid type, safe-area padding, no edge clipping ----
     Pure overrides — desktop (>700px) is untouched. Headlines/body drop to a vw-fluid
     scale sized so 1-2 sentence captions fit a 390px width without dominating; HUD
     furniture (legend, counter, badge, pills) gets safe-area insets and is allowed to
     wrap instead of running off the right edge. */
  @media (max-width:700px){
    .cap{padding:0;left:6%;right:6%;max-width:88%;}
    .cap h1,.cap h2{font-size:clamp(20px,5.9vw,27px);line-height:1.18;}
    .cap p{font-size:clamp(13px,3.8vw,16px);margin-top:9px;max-width:88vw;}
    #cap-act1{bottom:calc(11% + env(safe-area-inset-bottom,0px));}
    #cap-act2{bottom:calc(12% + env(safe-area-inset-bottom,0px));}
    #cap-act2 h2{font-size:clamp(15px,4.6vw,20px);}
    #cap-act4{bottom:calc(5.5% + env(safe-area-inset-bottom,0px));}
    #cap-act4 h2{font-size:clamp(20px,6vw,27px);}
    #cap-act4 p{font-size:clamp(13px,3.8vw,16px);}
    #cap-act5{top:calc(20px + env(safe-area-inset-top,0px));}
    #cap-act5 h2{font-size:clamp(16px,4.9vw,21px);line-height:1.3;}
    #legend2{top:calc(16px + env(safe-area-inset-top,0px));left:16px;right:16px;font-size:10px;letter-spacing:.10em;white-space:normal;line-height:1.6;}
    #illustrative{bottom:calc(12px + env(safe-area-inset-bottom,0px));right:14px;font-size:9px;letter-spacing:.16em;}
    #counter{left:18px;bottom:calc(14px + env(safe-area-inset-bottom,0px));font-size:11px;letter-spacing:.22em;}
    #badge{font-size:10px;max-width:64vw;white-space:normal;text-align:center;padding:6px 11px;line-height:1.5;}
    #callout{font-size:9.5px;padding:6px 9px;}
    .grouplabel{font-size:10px;letter-spacing:.13em;white-space:normal;max-width:min(84vw,330px);text-align:center;line-height:1.5;padding:7px 12px;}
    .grouplabel::after{height:10px;}
    .stop h2{font-size:clamp(16px,5vw,21px);}
    #act3-stops{top:13%;height:16vh;}
    #chartbox{top:33%;}
    #hint{bottom:calc(18px + env(safe-area-inset-bottom,0px));}
  }

  @media (prefers-reduced-motion: reduce){
    #spacer{height:100vh;}
    #hint{display:none;}
    #c{transition:none;}
  }
  /* full-viewport backdrop scrim: dims the scene behind the #detail panel so it reads as a focused overlay, not a card overlapping the headline. Sits below #detail (z:40) and above the canvas/headline. */
  #detail-scrim{position:absolute;inset:0;background:rgba(4,6,11,.58);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .42s ease;z-index:39;}
  #detail-scrim.open{opacity:1;pointer-events:auto;}
  /* per-pollutant deep-story panel */
  #detail{position:absolute;right:34px;top:50%;transform:translate(28px,-50%);width:360px;max-height:74vh;overflow:auto;
    background:rgba(8,14,24,.82);border:1px solid rgba(52,225,255,.32);border-radius:16px;padding:22px 22px 20px;
    backdrop-filter:blur(14px);box-shadow:0 24px 70px rgba(0,0,0,.55);opacity:0;pointer-events:none;
    transition:opacity .42s ease,transform .42s cubic-bezier(.22,1,.36,1);z-index:40;}
  #detail.open{opacity:1;pointer-events:auto;transform:translate(0,-50%);}
  #detail-close{position:absolute;top:12px;right:14px;width:28px;height:28px;border:0;background:transparent;color:#7fa9c4;
    font-size:22px;line-height:1;cursor:pointer;border-radius:8px;transition:color .2s,background .2s;}
  #detail-close:hover{color:#cfeeff;background:rgba(52,225,255,.10);}
  #detail-title{display:block;font-size:19px;font-weight:700;letter-spacing:.01em;color:#eaf6ff;padding-right:26px;}
  #detail-sub{display:block;margin-top:5px;font-size:11px;letter-spacing:.12em;color:#34e1ff;font-weight:600;text-transform:uppercase;}
  #detail-body{margin-top:16px;}
  #detail-body .row{padding:11px 0;border-top:1px solid rgba(120,160,200,.14);}
  #detail-body .row:first-child{border-top:0;}
  #detail-body .k{font-size:9.5px;letter-spacing:.2em;font-weight:700;text-transform:uppercase;color:#6f93b0;}
  #detail-body .v{margin-top:5px;font-size:13.5px;line-height:1.5;color:#d4e3f2;}
  #detail-body .row.fate .k{color:#ff8090;}
  #detail-body .row.fate .v{color:#ffdfe4;}
  @media (max-width:700px){
    #detail{right:0;left:0;top:auto;bottom:0;width:auto;transform:translateY(30px);max-height:62vh;border-radius:18px 18px 0 0;
      padding:20px 20px calc(18px + env(safe-area-inset-bottom,0px));}
    #detail.open{transform:translateY(0);}
    #detail-title{font-size:18px;}
    #detail-body .v{font-size:13px;}
  }
.cap .eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: #34e1ff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin-bottom: 2rem;
  text-shadow: 0 0 12px rgba(52,225,255,0.4);
}
.cap .eyebrow::before, .cap .eyebrow::after {
  content: '';
  display: block;
  width: 48px;
  height: 1px;
  background: linear-gradient(90deg, transparent, #34e1ff);
}
.cap .eyebrow::after {
  background: linear-gradient(90deg, #34e1ff, transparent);
}
.cap::before{content:'';position:absolute;left:-10%;bottom:-20%;width:120%;height:140%;background:linear-gradient(to top, rgba(5,15,25,0.9) 0%, rgba(5,15,25,0) 100%);z-index:-1;pointer-events:none;}
#cap-act4,#cap-act5{text-align:center;left:0;right:0;max-width:none;padding:0 7%;}
/* act3 */ .stop{padding-top:6vh;}.stop::before{width:28px;height:1px;margin:0 auto 22px;background:linear-gradient(90deg,transparent,#34e1ff,transparent);opacity:.7;}.stop .eyebrow{display:block;font-family:'JetBrains Mono',monospace;font-size:clamp(10px,.8vw,11px);font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:#34e1ff;opacity:.78;margin:0 auto 26px;}.stop h2 em{font-style:italic;color:#34e1ff;text-shadow:0 0 30px rgba(52,225,255,.45),0 0 8px rgba(52,225,255,.25);}.coda-card::before{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(52,225,255,.55),transparent);}.coda-card .coda-tag{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.34em;text-transform:uppercase;color:#34e1ff;opacity:.72;margin-bottom:10px;}.coda-card .coda-name{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(20px,1.9vw,26px);line-height:1.05;color:#eaf4ff;letter-spacing:-.01em;margin-bottom:8px;text-shadow:0 0 24px rgba(52,225,255,.12);}.coda-card .coda-fail{position:absolute;right:18px;top:18px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.22em;color:#ff5566;opacity:.85;}
/* a3comp */ #chartbox svg,#chartbox canvas{width:100%;height:100%;display:block;} @media (max-aspect-ratio:3/4){#act3-stops{left:50%;transform:translateX(-50%);width:min(820px,88vw);top:7%;}#chartbox{top:30%;height:58vh;}}
</style>
</head>
<body>

<div id="poster" aria-hidden="true"></div>
<canvas id="c" aria-hidden="true"></canvas>

<div id="ui">
  <div id="scrim"></div>

  <div class="cap" id="cap-act1"><h1></h1><p></p></div>

  <div id="legend2"></div>
  <div class="cap" id="cap-act2"><h2></h2></div>
  <div id="badge"></div>
  <div id="badge-line"></div>
  <div id="illustrative">Illustrative render</div>
  <img id="specimg" alt="" aria-hidden="true">
  <div id="reticle"><i></i><i></i><i></i><i></i><div id="callout"><span></span><small></small></div></div>

  <div id="act3-stops"></div>
  <div id="chartbox">
    <svg viewBox="0 0 640 250" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(150,205,250,.50)"/><stop offset="38%" stop-color="rgba(110,170,225,.20)"/><stop offset="100%" stop-color="rgba(120,185,235,0)"/>
        </linearGradient>
        <linearGradient id="cliff-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,110,128,.50)"/><stop offset="45%" stop-color="rgba(255,85,102,.16)"/><stop offset="100%" stop-color="rgba(255,85,102,.02)"/>
        </linearGradient>
        <linearGradient id="scan-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(190,230,255,0)"/><stop offset="55%" stop-color="rgba(190,230,255,.30)"/><stop offset="100%" stop-color="rgba(190,230,255,.06)"/>
        </linearGradient>
        <radialGradient id="comet-grad"><stop offset="0%" stop-color="rgba(255,255,255,.95)"/><stop offset="28%" stop-color="rgba(190,230,255,.5)"/><stop offset="100%" stop-color="rgba(190,230,255,0)"/></radialGradient>
        <radialGradient id="comet-grad-red"><stop offset="0%" stop-color="rgba(255,235,238,.95)"/><stop offset="28%" stop-color="rgba(255,110,128,.55)"/><stop offset="100%" stop-color="rgba(255,110,128,0)"/></radialGradient>
        <filter id="trace-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.1"/></filter>
        <clipPath id="draw-clip"><rect id="chart-clip" x="0" y="0" width="0" height="250"/></clipPath>
      </defs>
      <g id="chart-grid"></g>
      <rect id="threshold-band" x="0" y="178" width="640" height="54" fill="rgba(255,85,102,.045)"/>
      <line id="threshold-line" x1="0" y1="178" x2="640" y2="178" stroke="rgba(255,110,128,.22)" stroke-width="1" stroke-dasharray="6 7"/>
      <line x1="0" y1="232" x2="640" y2="232" stroke="rgba(130,155,190,.35)" stroke-width="1"/>
      <g clip-path="url(#draw-clip)">
        <path id="area-base" fill="url(#area-grad)"/>
        <path id="area-cliff" fill="url(#cliff-grad)"/>
        <path id="chart-ghost" fill="none" stroke="rgba(150,185,220,.30)" stroke-width="1.5" stroke-dasharray="4 6" stroke-linecap="round"/>
      </g>
      <path id="chart-base-glow" fill="none" stroke="#86b9e8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".32" filter="url(#trace-glow)"/>
      <path id="chart-cliff-glow" fill="none" stroke="#ff5566" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity=".42" filter="url(#trace-glow)"/>
      <path id="chart-base" fill="none" stroke="#b8cde6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

    '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A dark field of drifting motes">'+

})();

  addEventListener('error', function(e){ show('ERR: ' + e.message + ' @ ' + (e.filename||'') + ':' + (e.lineno||'')); });
  addEventListener('unhandledrejection', function(e){ show('REJ: ' + (e.reason && e.reason.message || e.reason)); });
  var ce = console.error.bind(console);
  console.error = function(){ show('CONSOLE.ERROR: ' + Array.prototype.map.call(arguments, String).join(' ')); ce.apply(null, arguments); };
  window.__dbg = show;
})();
</script>

<script type="module">
import * as THREE from 'three';
import {
  EffectComposer, RenderPass, EffectPass, Effect,
  BloomEffect, DepthOfFieldEffect, GodRaysEffect, VignetteEffect, NoiseEffect,
  ChromaticAberrationEffect, ToneMappingEffect, ToneMappingMode, BlendFunction, KernelSize

const CONFIG = window.CONFIG;
const N_FEAT = CONFIG.FEATURES.length;

/* ============================== shared utilities ============================== */

const clamp01 = v => Math.min(1, Math.max(0, v));
const clampR  = (a, b, p) => clamp01((p - a) / (b - a));       // 0→1 across [a,b]
const easeIO  = t => t * t * (3 - 2 * t);                       // smoothstep ease
const easeQ   = t => t * t * t * (t * (t * 6 - 15) + 10);       // quintic ease (camera moves)
const lerp    = (a, b, t) => a + (b - a) * t;

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* Classic 3D gradient noise (baked permutation) — basis for the curl flow field. */
const PERM = new Uint8Array(512);
{
  const r = mulberry32(1337);
  const p = Array.from({ length: 256 }, (_, i) => i);
  for (let i = 255; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) PERM[i] = p[i & 255];
}
function fade(t){ return t * t * t * (t * (t * 6 - 15) + 10); }
function grad(h, x, y, z){
  h &= 15;
  const u = h < 8 ? x : y;
  const v = h < 4 ? y : (h === 12 || h === 14 ? x : z);
  return ((h & 1) ? -u : u) + ((h & 2) ? -v : v);
}
function noise3(x, y, z){
  const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
  x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
  const u = fade(x), v = fade(y), w = fade(z);
  const A = PERM[X] + Y, AA = PERM[A] + Z, AB = PERM[A + 1] + Z;
  const B = PERM[X + 1] + Y, BA = PERM[B] + Z, BB = PERM[B + 1] + Z;
  return lerp(
    lerp(lerp(grad(PERM[AA], x, y, z),     grad(PERM[BA], x - 1, y, z), u),
         lerp(grad(PERM[AB], x, y - 1, z), grad(PERM[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(PERM[AA + 1], x, y, z - 1),     grad(PERM[BA + 1], x - 1, y, z - 1), u),
         lerp(grad(PERM[AB + 1], x, y - 1, z - 1), grad(PERM[BB + 1], x - 1, y - 1, z - 1), u), v), w);
}

/* Divergence-free curl of a 3-component noise potential, via finite differences. */
const _n1 = (x, y, z) => noise3(x + 31.4, y + 15.9, z + 26.5);
const _n2 = (x, y, z) => noise3(x + 12.3, y + 58.1, z + 92.6);
const _n3 = (x, y, z) => noise3(x + 78.2, y + 44.7, z + 11.8);
function curl(x, y, z, out){
  const e = 0.35, i2e = 1 / (2 * e);
  out[0] = (_n3(x, y + e, z) - _n3(x, y - e, z)) * i2e - (_n2(x, y, z + e) - _n2(x, y, z - e)) * i2e;
  out[1] = (_n1(x, y, z + e) - _n1(x, y, z - e)) * i2e - (_n3(x + e, y, z) - _n3(x - e, y, z)) * i2e;
  out[2] = (_n2(x + e, y, z) - _n2(x - e, y, z)) * i2e - (_n1(x, y + e, z) - _n1(x, y - e, z)) * i2e;
}

/* ============================== environment flags ============================== */

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const finePointer  = matchMedia('(pointer: fine)').matches;
const urlP = new URLSearchParams(location.search).get('p');
const pinnedP = urlP !== null ? clamp01(parseFloat(urlP) || 0) : null;
// QA hook: ?focus=N pins the Act-1 lens onto feature index N (deterministic hero of one specimen)
const _focusRaw = new URLSearchParams(location.search).get('focus');
const focusPin = _focusRaw !== null ? Math.max(0, Math.min(N_FEAT - 1, parseInt(_focusRaw, 10) || 0)) : null;
// QA hook: ?scan=N pins the auto-scan on SWEEP beat N (deterministic render of one pollutant in-scene)
const _scanRaw = new URLSearchParams(location.search).get('scan');
const scanPin = _scanRaw !== null ? Math.max(0, parseInt(_scanRaw, 10) || 0) : null;

/* ============================== DOM from CONFIG ============================== */

const $ = id => document.getElementById(id);
const ui = {
  scrim: $('scrim'), act1: $('cap-act1'), act2: $('cap-act2'), legend2: $('legend2'),
  badge: $('badge'), badgeLine: $('badge-line'), illus: $('illustrative'), chartbox: $('chartbox'),
  act4: $('cap-act4'), act5: $('cap-act5'), ga: $('group-a'), gb: $('group-b'),
  hint: $('hint'), coda: $('coda'), canvas: $('c'),
  reticle: $('reticle'), callout: $('callout'), counter: $('counter'), specimg: $('specimg'),
  tracerLine: $('tracer-line'), tracerDot: $('tracer-dot'),
};
ui.legend2.textContent = CONFIG.CAPTIONS.act2_legend;
ui.act2.querySelector('h2').textContent = CONFIG.CAPTIONS.act2_narration;
ui.act4.querySelector('h2').textContent = CONFIG.CAPTIONS.act4_headline;
ui.act4.querySelector('p').textContent  = CONFIG.CAPTIONS.act4_sub;
ui.act5.querySelector('h2').textContent = CONFIG.CAPTIONS.act5_headline;
ui.ga.textContent = CONFIG.CAPTIONS.group_a;
ui.gb.textContent = CONFIG.CAPTIONS.group_b;

/* per-pollutant deep-story panel (Option A: click a pollutant -> its story). */
const detailEl = $('detail'), detailTitle = $('detail-title'), detailSub = $('detail-sub'), detailBody = $('detail-body'), detailScrim = $('detail-scrim');
let detailIdx = -1;
function showDetail(i){
  const f = CONFIG.FEATURES[i]; if (!f) return;
  const rows = CONFIG.STORIES && CONFIG.STORIES[f.id]; if (!rows) return;
  detailIdx = i;
  detailTitle.textContent = f.label;
  detailSub.textContent = f.badge || (f.outcome === 'fade' ? 'CAPTURED & DESTROYED — BY PHYSICAL ACTION' : 'CAPTURED & HELD');
  detailBody.innerHTML = '';
  for (const pair of rows){
    const row = document.createElement('div');
    row.className = 'row' + (pair[0] === 'THE DIFFERENCE' ? ' fate' : '');
    const k = document.createElement('div'); k.className = 'k'; k.textContent = pair[0];
    const v = document.createElement('div'); v.className = 'v'; v.textContent = pair[1];
    row.appendChild(k); row.appendChild(v); detailBody.appendChild(row);
  }
  detailEl.scrollTop = 0;
  detailEl.classList.add('open');
  detailEl.setAttribute('aria-hidden', 'false');
  detailScrim.classList.add('open');
  detailScrim.setAttribute('aria-hidden', 'false');
}
function hideDetail(){
  if (detailIdx < 0) return;
  detailIdx = -1;
  detailEl.classList.remove('open');
  detailEl.setAttribute('aria-hidden', 'true');
  detailScrim.classList.remove('open');
  detailScrim.setAttribute('aria-hidden', 'true');
}
detailEl.addEventListener('click', e => e.stopPropagation());          // clicks inside the panel never reach the world picker
$('detail-close').addEventListener('click', e => { e.stopPropagation(); hideDetail(); });
detailScrim.addEventListener('click', e => { e.stopPropagation(); hideDetail(); });  // clicking the dimmed backdrop closes the panel
// QA hook: ?open=N renders feature N's story panel at load (deterministic screenshot of the panel)
{ const _o = new URLSearchParams(location.search).get('open');
  if (_o !== null) showDetail(Math.max(0, Math.min(N_FEAT - 1, parseInt(_o, 10) || 0))); }

const stopEls = CONFIG.ACT3_STOPS.map(txt => {
  const d = document.createElement('div');
  d.className = 'stop';
  d.innerHTML = '<h2></h2>';
  d.querySelector('h2').textContent = txt;
  $('act3-stops').appendChild(d);
  return d;
});
const codaEls = CONFIG.ACT3_CODA.map(txt => {
  const d = document.createElement('div');
  d.className = 'coda-card';
  d.textContent = txt;
  ui.coda.appendChild(d);
  return d;
});

/* Act-3 line chart: value drifts down, then a sharp cliff — rendered as a LUMINOUS
   data trace: a blurred under-glow stroke + crisp core, a comet head with a hot
   trailing window, plotted node dots that light as the head passes, a soft area
   fill clipped to the head, and a pulsing red event marker at the collapse. */
const CHART = (() => {
  const pts = [];
  const rng = mulberry32(77);
  for (let i = 0; i <= 44; i++){
    const x = (i / 44) * 430;
    const y = 40 + (i / 44) * 84 + Math.sin(i * 0.9) * 7.5 + (rng() - 0.5) * 8;
    pts.push([x, y]);
  }
  const last = pts[pts.length - 1];
  const cliff = [[458, last[1] + 18],[472, last[1] + 48],[486, last[1] + 78],[508, 222],[560, 228],[636, 230]];
  const d = a => a.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
  const base = $('chart-base'), cl = $('chart-cliff');
  const baseGlow = $('chart-base-glow'), clGlow = $('chart-cliff-glow');
  const trailB = $('chart-trail-base'), trailC = $('chart-trail-cliff');
  const dBase = d(pts), dCliff = d([last].concat(cliff));
  base.setAttribute('d', dBase);      baseGlow.setAttribute('d', dBase);   trailB.setAttribute('d', dBase);
  cl.setAttribute('d', dCliff);       clGlow.setAttribute('d', dCliff);    trailC.setAttribute('d', dCliff);
  const bl = base.getTotalLength(), cll = cl.getTotalLength();
  for (const el of [base, baseGlow]){ el.style.strokeDasharray = bl;  el.style.strokeDashoffset = bl; }
  for (const el of [cl, clGlow])    { el.style.strokeDasharray = cll; el.style.strokeDashoffset = cll; }
  const TRAIL = 52;
  trailB.style.strokeDasharray = `${TRAIL} ${bl + TRAIL}`;
  trailC.style.strokeDasharray = `${TRAIL} ${cll + TRAIL}`;
  // area fills under decline + cliff, down to the y=232 baseline (revealed by #chart-clip)
  const first = pts[0];
  $('area-base').setAttribute('d', dBase + `L${last[0].toFixed(1)} 232L${first[0].toFixed(1)} 232Z`);
  const cliffEnd = cliff[cliff.length - 1];
  $('area-cliff').setAttribute('d', dCliff + `L${cliffEnd[0]} 232L${last[0].toFixed(1)} 232Z`);
  // plotted node dots along the decline (every 6th sample), each knowing its arc length;
  // every dot carries a soft under-glow disc that flares as the comet head passes it
  const nodes = [];
  {
    const g = $('chart-nodes'), gg = $('chart-node-glow');
    const NS = 'http://www.w3.org/2000/svg';
    let acc = 0;
    for (let i = 1; i < pts.length; i++){
      acc += Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
      if (i % 6 === 0){
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('cx', pts[i][0].toFixed(1)); c.setAttribute('cy', pts[i][1].toFixed(1));
        c.setAttribute('r', 2.9); c.setAttribute('fill', '#eaf4ff'); c.setAttribute('opacity', 0);
        g.appendChild(c);
        const gl = document.createElementNS(NS, 'circle');
        gl.setAttribute('cx', pts[i][0].toFixed(1)); gl.setAttribute('cy', pts[i][1].toFixed(1));
        gl.setAttribute('r', 6); gl.setAttribute('fill', '#9fd8ff'); gl.setAttribute('opacity', 0);
        gl.setAttribute('filter', 'url(#trace-glow)');
        gg.appendChild(gl);
        nodes.push({ el: c, glow: gl, len: acc });
      }
    }
  }
  // red event marker at the cliff's first floor contact
  const evt = cliff[3];
  $('chart-event').setAttribute('cx', evt[0]); $('chart-event').setAttribute('cy', evt[1]);
  const pw = $('ev-pulse-wrap');
  pw.setAttribute('transform', `translate(${evt[0]} ${evt[1]})`);
  // chart furniture: gridlines + axis ticks (under the data) so the trace reads as a
  // plotted instrument. Horizontal rules carry a dash so a left→right scan can REVEAL
  // them just before the data draws; verticals fade in staggered (driven in applyFrame).
  const hLines = [], vLines = [];
  {
    const NS = 'http://www.w3.org/2000/svg';
    const grid = $('chart-grid');
    const mk = (x1, y1, x2, y2, stroke, w) => {
      const l = document.createElementNS(NS, 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1);
      l.setAttribute('x2', x2); l.setAttribute('y2', y2);
      l.setAttribute('stroke', stroke); l.setAttribute('stroke-width', w);
      grid.appendChild(l);
      return l;
    };
    for (let gy = 24; gy < 232; gy += 52){
      const l = mk(0, gy, 640, gy, 'rgba(120,150,190,.13)', 1);
      l.style.strokeDasharray = 640; l.style.strokeDashoffset = 640;
      hLines.push(l);
    }
    for (let gx = 64; gx < 640; gx += 64){
      const l = mk(gx, 20, gx, 232, 'rgba(120,150,190,.07)', 1);
      l.setAttribute('opacity', 0);
      vLines.push(l);
    }
    for (let gx = 0; gx <= 640; gx += 64) mk(gx, 232, gx, 238, 'rgba(140,170,205,.42)', 1);
    for (let gx = 32; gx < 640; gx += 64) mk(gx, 232, gx, 235.5, 'rgba(140,170,205,.22)', 1);   // minor ticks
    mk(0.5, 18, 0.5, 232, 'rgba(140,170,205,.30)', 1);
    for (let gy = 24; gy < 232; gy += 52) mk(0, gy, 6, gy, 'rgba(140,170,205,.42)', 1);
    for (let gy = 50; gy < 232; gy += 52) mk(0, gy, 3.5, gy, 'rgba(140,170,205,.22)', 1);       // minor y ticks
  }
  // ghost series: a second cohort that declines less and never collapses —
  // ambient context revealed by the same draw clip as the area fills
  {
    const gp = [];
    const rg = mulberry32(88);
    for (let i = 0; i <= 52; i++){
      const x = (i / 52) * 612;
      const y = 50 + (i / 52) * 38 + Math.sin(i * 0.7 + 1.6) * 6 + (rg() - 0.5) * 6;
      gp.push([x, y]);
    }
    $('chart-ghost').setAttribute('d', d(gp));
  }
  // collapse debris: particles shed off the cliff edge as the red segment draws
  const shed = [];
  {
    const sg = $('chart-shed');
    const rs = mulberry32(303);
    for (let k = 0; k < 14; k++){
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('r', (1.0 + rs() * 1.3).toFixed(2));
      c.setAttribute('fill', k % 3 ? '#ff8090' : '#ffd9de');
      c.setAttribute('opacity', 0);
      sg.appendChild(c);
      const t0 = 0.10 + 0.72 * (k / 13);
      const sp = cl.getPointAtLength(cll * t0);
      shed.push({ el: c, t0, sx: sp.x, sy: sp.y, dx: (rs() - 0.5) * 30, fall: 34 + rs() * 44, spin: rs() * 6.28 });
    }
  }
  return { base, cl, baseGlow, clGlow, trailB, trailC, bl, cll, TRAIL, nodes,
           dot: $('chart-dot'), comet: $('chart-comet'), clip: $('chart-clip'),
           event: $('chart-event'), pulseWrap: pw, evt,
           shed, headRing: $('chart-head-ring'),
           hLines, vLines, scan: $('chart-scan') };
})();

/* ============================== scroll-progress state ============================== */

const S = { p: pinnedP !== null ? pinnedP : 0 };
// act-1 auto-scan state (the scanner cycles through pollutants on its own, even without scrolling)
let scannedTotal = 6;   // running "pollutants found" count for the climbing counter (read in applyFrame)

/* Per-feature act-5 choreography (derived from CONFIG order, not hardcoded).
   Landings are staggered across the whole act so the climax stays ALIVE from
   0.80 all the way to ~0.95 — clear before / mid / after states. */
const TRAVEL = CONFIG.FEATURES.map((f, i) => {
  const s0 = 0.802 + i * 0.0095;
  return { s0, e0: s0 + 0.048 };
});

/* applyFrame(p): everything that depends on scroll progress alone (DOM layer). */
function applyFrame(p){
  S.p = p;

  ui.hint.style.opacity  = 1 - clampR(0.015, 0.05, p);
  // dead-zone fix: hold the act-1 headline until the lens has performed its sweep, then
  // hand off to act 2 with a deliberate overlap (no textless screensaver gap).
  ui.act1.style.opacity  = 1 - clampR(0.155, 0.215, p);

  const a2 = clampR(0.225, 0.27, p) * (1 - clampR(0.415, 0.45, p));
  ui.legend2.style.opacity = a2;
  ui.act2.style.opacity = clampR(0.205, 0.25, p) * (1 - clampR(0.40, 0.435, p));
  ui.illus.style.opacity = a2 * 0.9;

  // Act 3 — scrim, five held stops (header), chart (middle), coda row (footer).
  // The act runs ~0.425→0.685: scrim holds the whole act; the five stops cycle one-at-a-time
  // in the header slot while the chart draws its decline+cliff; then the three coda cards
  // land together as a finished row and hold to the end of the act.
  ui.scrim.style.opacity = 0.62 * clampR(0.425, 0.455, p) * (1 - clampR(0.672, 0.694, p));
  // Five stops: each fades in, holds a legible plateau, fades out — sequenced across the
  // chart-drawing region so exactly one reads at a time and it sits still while it's up.
  const SREG0 = 0.432, SW = 0.0336;
  stopEls.forEach((el, i) => {
    const s = SREG0 + i * SW;
    const inA = s + 0.004, inB = s + 0.012;
    const outA = s + SW - 0.013, outB = s + SW - 0.004;
    el.style.opacity = clampR(inA, inB, p) * (1 - clampR(outA, outB, p));
  });
  // Chart: hold visible across the whole stop sequence AND the coda (the active card
  // traces back to the red event); draw decline then cliff as a luminous trace.
  const chartVis = clampR(0.428, 0.445, p) * (1 - clampR(0.660, 0.678, p));
  ui.chartbox.style.opacity = chartVis;
  // instrument power-up: horizontal rules scan in left→right (staggered), verticals
  // fade up in sequence — the plot frame assembles just ahead of the data trace
  const gridT = easeIO(clampR(0.429, 0.475, p));
  CHART.hLines.forEach((l, i) => {
    l.style.strokeDashoffset = 640 * (1 - clamp01(gridT * 1.45 - i * 0.11));
  });
  CHART.vLines.forEach((l, i) => l.setAttribute('opacity', clampR(0.30 + i * 0.07, 0.55 + i * 0.07, gridT)));
  const cp = easeIO(clampR(0.432, 0.600, p));
  const baseT = clamp01(cp / 0.72), cliffT = clamp01((cp - 0.72) / 0.28);
  CHART.base.style.strokeDashoffset     = CHART.bl * (1 - baseT);
  CHART.baseGlow.style.strokeDashoffset = CHART.bl * (1 - baseT);
  CHART.cl.style.strokeDashoffset       = CHART.cll * (1 - cliffT);
  CHART.clGlow.style.strokeDashoffset   = CHART.cll * (1 - cliffT);
  const onCliff = cliffT > 0;
  const headLen = onCliff ? CHART.cll * cliffT : CHART.bl * baseT;
  const head = onCliff
    ? CHART.cl.getPointAtLength(headLen)
    : CHART.base.getPointAtLength(headLen);
  // hot trailing window behind the comet head (one per segment)
  const drawing = cp > 0.01 && cp < 0.999;
  CHART.trailB.style.strokeDashoffset = CHART.TRAIL - CHART.bl * baseT;
  CHART.trailC.style.strokeDashoffset = CHART.TRAIL - CHART.cll * cliffT;
  CHART.trailB.setAttribute('opacity', drawing && !onCliff ? 0.55 : 0);
  CHART.trailC.setAttribute('opacity', drawing && onCliff ? 0.6 : 0);
  // comet head + core dot
  CHART.comet.setAttribute('cx', head.x); CHART.comet.setAttribute('cy', head.y);
  CHART.comet.setAttribute('fill', onCliff ? 'url(#comet-grad-red)' : 'url(#comet-grad)');
  CHART.comet.setAttribute('opacity', drawing ? 0.95 : 0);
  CHART.dot.setAttribute('cx', head.x); CHART.dot.setAttribute('cy', head.y);
  CHART.dot.setAttribute('fill', onCliff ? '#ffe9ec' : '#ffffff');
  CHART.dot.setAttribute('opacity', cp > 0.01 ? 0.95 : 0);
  // glowing leading-edge node: a breathing reticle ring rides the comet head
  CHART.headRing.setAttribute('cx', head.x); CHART.headRing.setAttribute('cy', head.y);
  CHART.headRing.setAttribute('r', (6.4 + 1.4 * Math.sin(cp * 34)).toFixed(2));
  CHART.headRing.setAttribute('stroke', onCliff ? 'rgba(255,190,200,.9)' : 'rgba(235,245,255,.85)');
  CHART.headRing.setAttribute('opacity', drawing ? 0.85 : 0);
  // debris sheds off the cliff edge while the collapse draws, then falls and fades
  for (const sd of CHART.shed){
    if (cliffT <= sd.t0){ sd.el.setAttribute('opacity', 0); continue; }
    const ft = Math.min(1, (cliffT - sd.t0) / 0.30);
    sd.el.setAttribute('cx', (sd.sx + sd.dx * ft).toFixed(1));
    sd.el.setAttribute('cy', (sd.sy + sd.fall * ft * ft + 3 * Math.sin(sd.spin + ft * 9)).toFixed(1));
    sd.el.setAttribute('opacity', (0.75 * (1 - ft) * (0.6 + 0.4 * Math.sin(sd.spin * 3 + ft * 14))).toFixed(2));
  }
  // a vertical scan line rides the comet head while the trace draws — instrument sweep
  CHART.scan.setAttribute('x1', head.x.toFixed(1)); CHART.scan.setAttribute('x2', head.x.toFixed(1));
  CHART.scan.setAttribute('opacity', drawing ? 0.8 : 0);
  // area fill reveals with the head; plotted nodes light as the head passes them,
  // each flaring hot (dot swells, under-glow blooms) at the moment of the pass
  CHART.clip.setAttribute('width', Math.max(0, head.x).toFixed(1));
  const headArc = CHART.bl * baseT;
  for (const nd of CHART.nodes){
    const lit = clampR(nd.len - 12, nd.len, headArc);
    const pop = (drawing && !onCliff) ? Math.exp(-Math.abs(headArc - nd.len) / 26) : 0;
    nd.el.setAttribute('opacity', lit);
    nd.el.setAttribute('r', (2.9 + 1.6 * pop).toFixed(2));
    nd.glow.setAttribute('opacity', (lit * (0.30 + 0.60 * pop)).toFixed(2));
    nd.glow.setAttribute('r', (6 + 3.5 * pop).toFixed(2));
  }
  // red event marker ignites as the collapse lands, then keeps pulsing through the coda
  const evK = clampR(0.9, 1, cliffT);
  CHART.event.setAttribute('opacity', evK);
  CHART.pulseWrap.setAttribute('opacity', evK * 0.8);
  // Coda: the three frosted panels land TOGETHER (tight stagger) just after the cliff,
  // then HOLD as a finished row; the spotlight cycles through them (active card) while
  // a thin tracer ties the active card back to the red event on the chart.
  const codaOut = 1 - clampR(0.672, 0.690, p);
  let codaIn = 0;
  codaEls.forEach((el, i) => {
    const o = clampR(0.600 + i * 0.006, 0.622 + i * 0.006, p) * codaOut;
    el.style.opacity = o;
    codaIn = Math.max(codaIn, o);
  });
  const actI = p > 0.618 && p < 0.672 ? Math.min(2, Math.floor(clampR(0.618, 0.672, p) * 3)) : -1;
  codaEls.forEach((el, i) => el.classList.toggle('active', i === actI && codaIn > 0.5));
  // shared colour logic: while a failure card is spotlit the red collapse segment and
  // its event marker burn hotter — chart and cards read as one wired system
  const tieK = (actI >= 0 && codaIn > 0.5) ? 1 : 0;
  CHART.clGlow.setAttribute('opacity', (0.42 + 0.26 * tieK).toFixed(2));
  CHART.event.setAttribute('r', (4 + 1.6 * tieK).toFixed(1));
  if (actI >= 0 && codaIn > 0.5 && chartVis > 0.05){
    const svgR = ui.chartbox.querySelector('svg').getBoundingClientRect();
    const ex = svgR.left + CHART.evt[0] * (svgR.width / 640);
    const ey = svgR.top  + CHART.evt[1] * (svgR.height / 250);
    const cr = codaEls[actI].getBoundingClientRect();
    const cx = cr.left + cr.width / 2, cy = cr.top - 6;
    ui.tracerLine.setAttribute('x1', ex); ui.tracerLine.setAttribute('y1', ey);
    ui.tracerLine.setAttribute('x2', cx); ui.tracerLine.setAttribute('y2', cy);
    ui.tracerDot.setAttribute('cx', cx);  ui.tracerDot.setAttribute('cy', cy);
    const to = Math.min(codaIn, chartVis) * 0.9;
    ui.tracerLine.setAttribute('opacity', to);
    ui.tracerDot.setAttribute('opacity', to);
  } else {
    ui.tracerLine.setAttribute('opacity', 0);
    ui.tracerDot.setAttribute('opacity', 0);
  }

  // ONE z-ordered text system per act: the act-4 paragraph is FULLY out (by 0.79)
  // before the act-5 headline enters (0.83) and well before the group pills (0.85+),
  // so no label or pill can ever sit on still-opaque body copy.
  const act4Op = clampR(0.69, 0.72, p) * (1 - clampR(0.772, 0.79, p));
  ui.act4.style.opacity = act4Op;
  ui.act5.style.opacity = clampR(0.83, 0.87, p);
  // counter: act-1 climbs as you scan the pollutants ("and there are hundreds more"); act-5 = capture count
  const scanVis = clampR(0.01, 0.05, p) * (1 - clampR(0.205, 0.235, p));
  if (scanVis > 0.001){
    ui.counter.textContent = scannedTotal + ' +';     // climbs as the auto-scan finds each pollutant
    ui.counter.style.opacity = scanVis;
    ui.counter.style.fontSize = '17px';               // the "hundreds more" punchline — make it read
  } else {
    ui.counter.style.opacity = 0.9 * clampR(0.835, 0.87, p);
    ui.counter.style.fontSize = '';
  }
  const gOp = clampR(0.85, 0.89, p) * (act4Op > 0.001 ? 0 : 1);
  ui.ga.style.opacity = gOp;
  ui.gb.style.opacity = gOp * (1 - 0.45 * clampR(0.96, 1.0, p));   // group B dims as its items fade out
}
applyFrame(S.p);

/* ============================== WebGL world ============================== */

const WORLD_SCALE = 2.2;                 // CONFIG positions → world units
let GL = null;                           // populated by initGL

function initGL(){
  /* small/touch device tier: cap devicePixelRatio and thin the particle field so
     phones render smoothly (decided once at init — orientation flips keep the tier) */
  const SMALL_DEVICE = matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 720;
  const MAX_DPR = SMALL_DEVICE ? 1.75 : 2;

  const BASE_COLOR = new THREE.Color(CONFIG.COLORS.base);
  const renderer = new THREE.WebGLRenderer({ canvas: ui.canvas, antialias: false, alpha: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, MAX_DPR));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(BASE_COLOR, 1);

  const scene = new THREE.Scene();
  // Atmospheric depth: replace the flat-black void with a soft radial field (a faint cool
  // lift at center falling to deep black at the edges) so subjects read against cinematic
  // depth, not a dead void. Identity-preserving (cool blue, very subtle).
  scene.background = (() => {
    const s = 512, cv = document.createElement('canvas'); cv.width = cv.height = s;
    const g = cv.getContext('2d');
    const rg = g.createRadialGradient(s*0.5, s*0.46, s*0.04, s*0.5, s*0.5, s*0.66);
    rg.addColorStop(0.0, '#08131f');   // crushed cool core — the shaft provides the light (GLM-5V)
    rg.addColorStop(0.45, '#04080f');
    rg.addColorStop(1.0, '#01040a');   // near-black edges
    g.fillStyle = rg; g.fillRect(0, 0, s, s);
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  })();
  scene.fog = new THREE.FogExp2(new THREE.Color(CONFIG.COLORS.base), 0.0058);
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 600);
  camera.position.set(0, 0, 60);

  /* ---------- responsive 3D reframing (recomputed on every resize) ----------
     The composition was authored for a ~1.6 landscape frame. On narrow/portrait
     frames every act reframes so its hero subject stays CENTERED and FULLY
     visible with margin:
     · fieldX  — lateral compression of the act-1/2 feature field so lens subjects
                 stay inside the narrow frame (1 on desktop);
     · lensR   — magnifier radius (fraction of viewport height) shrinks so the
                 lens disc itself fits a narrow frame;
     · dist2K  — act-2 dolly distance multiplier (molecule fully in frame);
     · dist4/5 — act-4/5 camera pull-back so the WHOLE charged panel (46 wide)
                 reads as a sheet inside the narrow horizontal FOV;
     · fog relaxes on portrait so the farther panel framing stays unwashed. */
  const VIEW = { aspect: 1.6, portrait: false, fieldX: 1, lensR: 0.19, dist2K: 1, dist4: 50, dist5: 49 };
  const HALF_VFOV_TAN = Math.tan(THREE.MathUtils.degToRad(50 / 2));
  function computeView(){
    const a = innerWidth / Math.max(1, innerHeight);
    VIEW.aspect = a;
    VIEW.portrait = a < 1.05 || innerWidth < 700;
    VIEW.fieldX = Math.min(1, Math.max(0.25, 0.27 + (a - 0.46) * 0.986));
    VIEW.lensR = 0.19 * Math.min(1, a * 1.45);
    VIEW.dist2K = Math.max(1, 0.82 / a);
    VIEW.dist4 = Math.max(50, 26.5 / (HALF_VFOV_TAN * a));   // half-width needed: panel 46/2 × 1.15 margin
    VIEW.dist5 = Math.max(49, 25.9 / (HALF_VFOV_TAN * a));
    scene.fog.density = VIEW.portrait ? 0.0030 : 0.0058;
  }
  computeView();

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 1.2);
  key.position.set(6, 9, 14);
  scene.add(key);
  // GLM-5.2: a cool BACK/RIM light carves the glass-crystal atoms out of the dark scene
  // (transmission alone vanishes against black) — sits behind the specimen plane, toward camera.
  const rimLight = new THREE.DirectionalLight(0xaad2ff, 2.2);
  rimLight.position.set(-3, 7, -26);
  scene.add(rimLight);

  /* GLM-5.2 look-dev Phase 1: a DARK, COOL image-based-lighting environment so PBR specimens
     actually reflect something (a MeshStandardMaterial with no env map is just Lambertian → the
     "flat plastic" the audit flagged). Tiny custom env scene = a dim cool key + a cyan accent +
     a deep fill, baked to a PMREM cubemap. Background stays the dark radial gradient. */
  {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x05070d);
    const mkGlow = (hex, r, x, y, z) => {
      const m = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 18), new THREE.MeshBasicMaterial({ color: hex }));
      m.position.set(x, y, z); envScene.add(m);
    };
    mkGlow(0x9fbfe2, 11, -7, 22, 6);    // cool key (upper-left)
    mkGlow(0x34e1ff, 6,  17, 5, -11);   // cyan accent (palette)
    mkGlow(0x1a2636, 8,  9, -13, 9);    // deep cool fill (lower)
    scene.environment = pmrem.fromScene(envScene, 0.05).texture;
    pmrem.dispose();
  }

  /* ---------- soft round sprite texture (shared) ---------- */
  const spriteTex = (() => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const g = cv.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.4, 'rgba(255,255,255,.55)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    const t = new THREE.CanvasTexture(cv);
    t.colorSpace = THREE.SRGBColorSpace;
    return t;
  })();

  /* ---------- tier A: ambient dust on the curl flow field ---------- */
  const DUST_N = SMALL_DEVICE ? 1200 : 2200;
  const DUST_BOX = { cx: 10, cy: 0, cz: 0, hx: 85, hy: 45, hz: 55 };
  const dustPos = new Float32Array(DUST_N * 3);
  const dustVel = new Float32Array(DUST_N * 3);
  {
    const r = mulberry32(9001);
    for (let i = 0; i < DUST_N; i++){
      dustPos[i * 3]     = DUST_BOX.cx + (r() - 0.5) * 2 * DUST_BOX.hx;
      dustPos[i * 3 + 1] = DUST_BOX.cy + (r() - 0.5) * 2 * DUST_BOX.hy;
      dustPos[i * 3 + 2] = DUST_BOX.cz + (r() - 0.5) * 2 * DUST_BOX.hz;
    }
  }
  /* depth-graded tiers: far dim motes / mid field / near sparks / rare defocused
     bokeh discs — colour-temperature variation, depth fade, twinkle, and a
     per-tier drift speed so the layers parallax against each other */
  const dustSize = new Float32Array(DUST_N);
  const dustTint = new Float32Array(DUST_N * 3);
  const dustSeed = new Float32Array(DUST_N);
  const dustKind = new Float32Array(DUST_N);
  const dustSpd  = new Float32Array(DUST_N);
  {
    const r = mulberry32(4242);
    const cool = new THREE.Color(0x6e87ab), neutral = new THREE.Color(0x8a94a3), warm = new THREE.Color(0xb39a80);
    const tc = new THREE.Color();
    for (let i = 0; i < DUST_N; i++){
      const u = r();
      let s, b, spd;
      if (u < 0.60)      { s = 0.30 + r() * 0.26; b = 0.26 + r() * 0.26; spd = 0.55; }
      else if (u < 0.91) { s = 0.60 + r() * 0.46; b = 0.50 + r() * 0.34; spd = 0.85; }
      else if (u < 0.975){ s = 1.20 + r() * 0.85; b = 0.85 + r() * 0.35; spd = 1.25; }
      else               { s = 3.40 + r() * 2.80; b = 0.16 + r() * 0.10; spd = 0.70; dustKind[i] = 1; }
      dustSize[i] = s; dustSpd[i] = spd;
      tc.copy(cool).lerp(r() < 0.80 ? neutral : warm, 0.25 + r() * 0.75).multiplyScalar(b);
      tc.toArray(dustTint, i * 3);
      dustSeed[i] = r() * 100;
    }
  }
  const dustGeo = new THREE.BufferGeometry();
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  dustGeo.setAttribute('aSize', new THREE.BufferAttribute(dustSize, 1));
  dustGeo.setAttribute('aTint', new THREE.BufferAttribute(dustTint, 3));
  dustGeo.setAttribute('aSeed', new THREE.BufferAttribute(dustSeed, 1));
  dustGeo.setAttribute('aKind', new THREE.BufferAttribute(dustKind, 1));
  /* GLM-5V/5.2 photo-real pass: dust is matter in a light medium, not LEDs in a void.
     - a cool key light casts a soft cone; dust BRIGHTNESS depends on proximity to that
       beam, so the lit dust itself forms a Tyndall shaft (you see light because it scatters)
     - per-particle JAGGED silhouette (procedural noise) kills the perfect-circle "CG tell";
       the rare big motes stay smooth bokeh discs with a bright rim
     - a soft wrap-scatter term so motes catch the key light on one side                     */
  const dustMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uGlobal: { value: 0.60 },
      uLightPos:   { value: new THREE.Vector3(-26, 22, -4) },
      uLightDir:   { value: new THREE.Vector3(36, -24, -6).normalize() }, // toward field centre
      uBeamRadius: { value: 22.0 }, uBeamFalloff: { value: 0.7 }, uBeamBoost: { value: 1.25 },
    },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute float aSize; attribute vec3 aTint; attribute float aSeed; attribute float aKind;
      uniform float uTime;
      uniform vec3 uLightPos; uniform vec3 uLightDir; uniform float uBeamRadius; uniform float uBeamFalloff;
      varying vec3 vT; varying float vKind; varying float vA; varying float vBeam; varying float vScatter; varying float vSeed;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        float dist = max(1.0, -mv.z);
        gl_PointSize = min(aSize * (330.0 / dist), 80.0);
        gl_Position = projectionMatrix * mv;
        vT = aTint; vKind = aKind; vSeed = aSeed;
        float tw = 0.74 + 0.26 * sin(uTime * (0.5 + fract(aSeed * 0.13) * 1.3) + aSeed);
        vA = tw * (0.30 + 0.70 * smoothstep(150.0, 35.0, dist)) * smoothstep(6.0, 16.0, dist);
        // proximity to the key-light cone → the lit dust forms the visible shaft
        vec3 toP = position - uLightPos;
        float along = dot(toP, uLightDir);
        vec3 perp = toP - along * uLightDir;
        float coneR = uBeamRadius * (1.0 + 0.04 * max(along, 0.0));
        vBeam = exp(-pow(length(perp) / coneR, 2.0) * uBeamFalloff) * smoothstep(-6.0, 8.0, along);
        // soft wrap-around scatter: motes catch the light on the side facing it
        vec3 L = normalize(uLightPos - position);
        vScatter = pow(max(dot(normalize(-mv.xyz), L), 0.0), 1.5) * 0.55 + 0.45;
      }`,
    fragmentShader: `
      uniform float uGlobal; uniform float uBeamBoost;
      varying vec3 vT; varying float vKind; varying float vA; varying float vBeam; varying float vScatter; varying float vSeed;
      void main(){
        // GLM-5V: dust is SOFT and SOLID — soft circles, but ~1/3 squashed into organic ellipses
        // (real dust is fibres/flakes, rarely flawless spheres) so they don't all read as vector dots.
        vec2 q = gl_PointCoord - 0.5;
        if (vKind < 0.5 && fract(vSeed * 0.371) > 0.68){
          float a = vSeed * 2.399;
          vec2 rq = vec2(q.x * cos(a) - q.y * sin(a), q.x * sin(a) + q.y * cos(a));
          rq.x *= 1.55; rq.y *= 0.72;
          q = rq;
        }
        float r2 = dot(q, q);
        float core = exp(-r2 * 14.0) * smoothstep(0.25, 0.08, r2);
        // big rare tier = soft out-of-focus bokeh blob (still solid, no ring)
        float blob = smoothstep(0.25, 0.02, r2);
        float shape = mix(core, blob, vKind);
        // gentle directional shading only (no harsh beam / no visible source)
        float lit = mix(0.55, 1.0, vBeam) * vScatter;
        // GLM-5V: real motes in a beam flash a blinding specular pin-prick (the particle reflecting the bulb)
        float spec = vBeam * (1.0 - vKind) * exp(-r2 * 110.0);
        float a = (shape + spec * 0.9) * vA * lit * uGlobal;
        if (a < 0.005) discard;
        vec3 col = vT * (1.0 + vBeam * uBeamBoost) + spec * vec3(1.1, 1.15, 1.2);
        gl_FragColor = vec4(col, a);
      }`,
  });
  const dust = new THREE.Points(dustGeo, dustMat);
  dust.frustumCulled = false;
  scene.add(dust);

  /* GLM-5V: a few BIG, soft, dim out-of-focus bokeh discs near the camera — instant macro-lens
     depth so the motes no longer read as one flat focal plane. Drift slowly; act 1 only. */
  const fgBokeh = new THREE.Group();
  {
    const r = mulberry32(7777);
    const c = new THREE.Color();
    for (let i = 0; i < 6; i++){
      c.setHSL(0.55, 0.22, 0.72);
      const m = new THREE.SpriteMaterial({ map: spriteTex, color: c.clone(), transparent: true, opacity: 0,
        depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, fog: false });
      const sp = new THREE.Sprite(m);
      sp.scale.setScalar(15 + r() * 17);
      sp.position.set((r() - 0.5) * 72, (r() - 0.5) * 44, 38 + r() * 13);   // in front of the field (cam z=60)
      sp.userData = { baseO: 0.05 + r() * 0.06, dx: (r() - 0.5) * 0.5, dy: (r() - 0.5) * 0.35 };
      fgBokeh.add(sp);
    }
  }
  fgBokeh.renderOrder = 3;
  scene.add(fgBokeh);

  const _c = [0, 0, 0];
  let dustCursor = 0;
  function updateDust(dt){
    // refresh curl velocities round-robin (1/3 per frame), advect all, recycle toroidally
    const third = Math.ceil(DUST_N / 3);
    for (let k = 0; k < third; k++){
      const i = (dustCursor + k) % DUST_N, j = i * 3;
      curl(dustPos[j] * 0.045, dustPos[j + 1] * 0.045, dustPos[j + 2] * 0.045, _c);
      dustVel[j] = _c[0]; dustVel[j + 1] = _c[1]; dustVel[j + 2] = _c[2];
    }
    dustCursor = (dustCursor + third) % DUST_N;
    const sp = 1.35 * dt;
    for (let i = 0; i < DUST_N; i++){
      const j = i * 3, sk = sp * dustSpd[i];
      dustPos[j]     += dustVel[j] * sk;
      dustPos[j + 1] += dustVel[j + 1] * sk;
      dustPos[j + 2] += dustVel[j + 2] * sk;
      // toroidal recycle
      if (dustPos[j]     >  DUST_BOX.cx + DUST_BOX.hx) dustPos[j]     -= DUST_BOX.hx * 2;
      else if (dustPos[j] < DUST_BOX.cx - DUST_BOX.hx) dustPos[j]     += DUST_BOX.hx * 2;
      if (dustPos[j + 1] >  DUST_BOX.cy + DUST_BOX.hy) dustPos[j + 1] -= DUST_BOX.hy * 2;
      else if (dustPos[j + 1] < DUST_BOX.cy - DUST_BOX.hy) dustPos[j + 1] += DUST_BOX.hy * 2;
      if (dustPos[j + 2] >  DUST_BOX.cz + DUST_BOX.hz) dustPos[j + 2] -= DUST_BOX.hz * 2;
      else if (dustPos[j + 2] < DUST_BOX.cz - DUST_BOX.hz) dustPos[j + 2] += DUST_BOX.hz * 2;
    }
    dustGeo.attributes.position.needsUpdate = true;
  }

  /* ---------- tier B: CONFIG.FEATURES as sprite points (CPU-mirrored) ---------- */
  const feat = CONFIG.FEATURES.map((f, i) => ({
    cfg: f, idx: i,
    baseRaw: new THREE.Vector3().fromArray(f.position).multiplyScalar(WORLD_SCALE),
    base: new THREE.Vector3().fromArray(f.position).multiplyScalar(WORLD_SCALE),
    drift: new THREE.Vector3(),
    live: new THREE.Vector3().fromArray(f.position).multiplyScalar(WORLD_SCALE),
    promote: 0, promoteT: 0,
    haloT: -10,
    screen: { x: -1e4, y: -1e4, behind: true },
    landing: null,          // filled below
  }));
  /* narrow frames: compress the field laterally so act-1 lens subjects and the
     act-2 hero molecule never sit off-screen (fieldX = 1 → desktop unchanged) */
  function refreshField(){
    for (const f of feat) f.base.set(f.baseRaw.x * VIEW.fieldX, f.baseRaw.y, f.baseRaw.z);
  }
  refreshField();

  /* ---------- the positive element: a thin FLAT CHARGED SURFACE (panel) ----------
     A rectangular sheet of material facing the camera with a slight tilt. Its face
     carries a faint, even field of small "+" charge marks in COLORS.positive — a
     surface that was always charged; it never powers on. Items are captured ONTO
     its face. */
  const PANEL = { w: 46, h: 30, t: 0.8, center: new THREE.Vector3(62, 0, 8) };
  const HOLD_MAX = 16;  // capacity for hold-outcome landing sites fed to the face shader
  const panelFaceMat = new THREE.ShaderMaterial({
    uniforms: {
      uColor:  { value: new THREE.Color(CONFIG.COLORS.positive) },
      uCam:    { value: camera.position },
      uTime:   { value: 0 },
      uIgnite: { value: 0 },   // act-4: the field powers on (left→right sweep)
      uWave:   { value: 0 },   // act-4/5: traveling energy wave over the '+' marks
      uLand:   { value: Array.from({ length: HOLD_MAX }, () => new THREE.Vector4()) },  // xy=face uv, z=captured, w=anticipation
      uLandN:  { value: 0 },
    },
    vertexShader: `
      varying vec2 vUv; varying vec3 vWp; varying vec3 vN;
      void main(){
        vUv = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWp = wp.xyz;
        vN = normalize(mat3(modelMatrix) * normal);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      varying vec2 vUv; varying vec3 vWp; varying vec3 vN;
      uniform vec3 uColor; uniform vec3 uCam;
      uniform float uTime, uIgnite, uWave;
      uniform vec4 uLand[${HOLD_MAX}]; uniform int uLandN;
      void main(){
        vec2 q = vUv - 0.5;
        /* finished edge: soft border vignette + a thin luminous frame band */
        float face = smoothstep(0.5, 0.455, abs(q.x)) * smoothstep(0.5, 0.455, abs(q.y));
        float mq = max(abs(q.x), abs(q.y));
        float frame = smoothstep(0.435, 0.468, mq) * smoothstep(0.5, 0.482, mq);
        /* regular field of small "+" charge marks */
        vec2 cell = fract(vUv * vec2(28.0, 18.0)) - 0.5;
        float armX = smoothstep(0.22, 0.16, abs(cell.x)) * smoothstep(0.06, 0.028, abs(cell.y));
        float armY = smoothstep(0.22, 0.16, abs(cell.y)) * smoothstep(0.06, 0.028, abs(cell.x));
        float plus = max(armX, armY);
        /* act-4 ignition sweep: a hot leading edge powers the field on left→right */
        float sweep = uIgnite * 1.30;
        float lit = smoothstep(vUv.x, vUv.x + 0.14, sweep);
        float edgeGlow = exp(-pow((sweep - 0.06 - vUv.x) / 0.045, 2.0)) * (1.0 - smoothstep(1.08, 1.28, sweep)) * step(0.01, uIgnite);
        /* moving energy wave: '+' brightness undulates across the lit field */
        float wv = sin((vUv.x * 1.7 + vUv.y * 0.55) * 13.0 - uTime * 1.7);
        float bf = 1.0 + uWave * 0.42 * wv;
        /* capture glow: cells light where items have landed; faint anticipation
           glow where items are still incoming */
        float litCell = 0.0, antic = 0.0, relief = 0.0;
        for (int i = 0; i < ${HOLD_MAX}; i++){
          if (i >= uLandN) break;
          vec2 dl = vUv - uLand[i].xy; dl.x *= 1.5333;

  for (const f of feat){

  /* GLM-5.2 Phase 2: the particle specimens were emissive "neon plastic". Kill the emissive so the

  for (const f of feat){

  /* ---------- post-processing: DoF + bloom + custom optical lens ----------
     The loupe is REAL GLASS: interior magnification with chromatic fringing,
     an outer bevel that refracts the starfield outward, a crisp bezel, specular
     glints + a caustic crescent, and two orbiting tracer dots (charge indicators)
     that only appear while a subject is locked in the lens. */
  const LENS_FRAG = `
    uniform vec2 uCenter; uniform float uRadius; uniform float uStrength; uniform float uLensAspect; uniform float uProbe; uniform float uTime; uniform float uDots;
    uniform sampler2D uZoomTex; uniform float uMag;

    /* final grade: gentle contrast lift + soft vignette — applied to every pixel */
    vec3 grade(vec3 c, vec2 guv){
      c = pow(max(c * 1.07, 0.0), vec3(1.05));
      vec2 v = guv - 0.5;
      c *= 1.0 - 0.30 * smoothstep(0.30, 0.72, dot(v, v));
      return c;
    }

    void mainImage(const in vec4 inputColor, const in vec2 uv, out vec4 outputColor){
      float S = uStrength;
      vec2 d = uv - uCenter;
      d.x *= uLensAspect;
      float t = length(d) / uRadius;
      vec3 col;
      if (S < 0.003 || t > 1.12){
        col = inputColor.rgb;
      } else if (t > 1.0){
        /* glass BEVEL: the rim refracts the field outward with a faint chromatic fringe */
        float b = smoothstep(1.12, 1.0, t) * S;
        float ca = 0.014 * b;
        vec2 q;
        q = d * (1.0 + 0.085 * b + ca); q.x /= uLensAspect; col.r = texture2D(inputBuffer, uCenter + q).r;
        q = d * (1.0 + 0.085 * b);      q.x /= uLensAspect; col.g = texture2D(inputBuffer, uCenter + q).g;
        q = d * (1.0 + 0.085 * b - ca); q.x /= uLensAspect; col.b = texture2D(inputBuffer, uCenter + q).b;
        col = mix(inputColor.rgb, col, b);
      } else {
        /* interior: TRUE magnification — samples a dedicated zoomed render pass
           (no DoF, no bloom) so the lens content genuinely out-resolves the
           graded field outside. A mild barrel term compresses content toward the
           rim; the chromatic split grows with radius. */
        float magEff = mix(1.0, uMag, S);
        float barrel = 1.0 + 0.22 * t * t * S;
        vec2 dz = (uv - uCenter) * (uMag / magEff) * barrel;
        float ca = S * (0.004 + 0.020 * smoothstep(0.30, 1.0, t));
        vec3 zc;
        zc.r = texture2D(uZoomTex, vec2(0.5) + dz * (1.0 + ca)).r;
        zc.g = texture2D(uZoomTex, vec2(0.5) + dz).g;
        zc.b = texture2D(uZoomTex, vec2(0.5) + dz * (1.0 - ca)).b;
        col = mix(inputColor.rgb, zc * 1.55, smoothstep(0.0, 0.16, S));   // brighter so the specimen reads
      }
      if (S >= 0.003 && t <= 1.12){
        vec2 nd = d / uRadius;
        /* soft bezel — a magnified patch of air, not a heavy glass marble */
        float rim = exp(-pow((t - 1.0) / 0.050, 2.0));
        col *= 1.0 - 0.45 * S * rim;
        /* glass catching ambient light: accretion ring + a whisper of disc lift */
        float ring = exp(-pow((t - 0.885) / 0.026, 2.0));
        col += vec3(0.72, 0.79, 0.88) * ring * 0.15 * S;
        col += vec3(0.030, 0.038, 0.052) * S * (1.0 - smoothstep(0.55, 0.98, t));
        /* specular glints: a long soft highlight upper-left + a small counter-glint */
        vec2 g1 = nd - vec2(-0.40, 0.42);
        float spec = exp(-(g1.x * g1.x * 26.0 + g1.y * g1.y * 90.0 + g1.x * g1.y * 38.0));
        vec2 g2 = nd - vec2(0.33, -0.38);
        float spec2 = exp(-dot(g2, g2) * 160.0);
        col += vec3(0.85, 0.92, 1.0) * (spec * 0.16 + spec2 * 0.07) * S;   // calmer glint — less "shiny sphere"
        /* caustic crescent hugging the lower-right inner rim */
        float cres = exp(-pow((t - 0.78) / 0.085, 2.0)) * smoothstep(-0.2, 0.9, dot(normalize(nd + 1e-5), normalize(vec2(0.55, -0.6))));
        col += vec3(0.35, 0.85, 1.0) * cres * 0.07 * S;
        /* orbiting tracer dots — charge indicators, only while a subject is locked */
        float ang = uTime * 0.7;
        for (int i = 0; i < 2; i++){
          vec2 dp = 0.93 * vec2(cos(ang + float(i) * 3.14159), sin(ang + float(i) * 3.14159));
          float dd = exp(-dot(nd - dp, nd - dp) * 700.0);
          col += vec3(0.48, 0.92, 1.0) * dd * uDots * S * 0.9;
        }

      }

    }`;
  /* dedicated magnifier pass: the lens interior re-renders the scene through a
     cropped (zoomed) projection at full drawing-buffer resolution — true optical
     magnification, sharper than the DoF/bloom-graded base image it sits in */
  const LENS_MAG = 1.22;   // was 1.8 — 1.8x over-zoomed the (already lens-filling 3.55x) stand-ins into a mush ball of atoms/sub-spheres; frame the WHOLE specimen instead
  const lensRT = new THREE.WebGLRenderTarget(8, 8, {
    type: THREE.HalfFloatType,
    samples: Math.min(4, renderer.capabilities.maxSamples || 0),
  });
  function sizeLensRT(){

  }
  sizeLensRT();
  class LensEffect extends Effect {
    constructor(){
      super('LensEffect', LENS_FRAG, {
        blendFunction: BlendFunction.NORMAL,
        uniforms: new Map([
          ['uCenter', new THREE.Uniform(new THREE.Vector2(0.5, 0.5))],
          ['uRadius', new THREE.Uniform(VIEW.lensR)],
          ['uStrength', new THREE.Uniform(0)],
          ['uLensAspect', new THREE.Uniform(innerWidth / innerHeight)],
          ['uProbe', new THREE.Uniform(/[?&]debug=4/.test(location.search) ? 1 : 0)],
          ['uTime', new THREE.Uniform(0)],
          ['uDots', new THREE.Uniform(0)],
          ['uZoomTex', new THREE.Uniform(lensRT.texture)],
          ['uMag', new THREE.Uniform(LENS_MAG)],
        ]),
      });
    }
  }
  const lensFx = new LensEffect();
  const dofFx = new DepthOfFieldEffect(camera, {
    focusDistance: 0.02, focalLength: 0.06, bokehScale: 1.2, height: 480,
  });
  const bloomFx = new BloomEffect({
    intensity: 0.55, luminanceThreshold: 0.30, luminanceSmoothing: 0.22,
    mipmapBlur: true, kernelSize: KernelSize.MEDIUM,
  });
  /* GLM-5V realism: a visible cool light SOURCE (upper-left) that casts a volumetric
     god-ray shaft through the dust. The lit dust + the continuous ray glow together read
     as a real Tyndall light shaft. Gated to act 1 (opacity driven by scroll). */
  // Soft, FORMLESS glow (feathered edges + cloud streaks) — NOT a visible square/plate. Reads as
  // light spilling in from off the top-left corner, so the source has no hard geometry the eye snags on.
  const shaftTex = (() => {
    const s = 128, cv = document.createElement('canvas'); cv.width = cv.height = s;
    const g = cv.getContext('2d'); const rr = mulberry32(321);
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
    g.globalCompositeOperation = 'multiply';            // break the glow into organic cloud streaks
    for (let i = 0; i < 150; i++){
      const x = rr() * s, y = rr() * s, rad = 4 + rr() * 34, a = 0.05 + rr() * 0.16;
      const v = 40 + (rr() * 70 | 0);
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, 'rgba(' + v + ',' + v + ',' + (v + 18) + ',' + a + ')');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, s, s);

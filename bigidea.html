    g.fillStyle = fr; g.fillRect(0, 0, s, s);
    g.globalCompositeOperation = 'source-over';
    const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
  })();
  const lightSrcMat = new THREE.MeshBasicMaterial({
    color: new THREE.Color(0xcfeaff), map: shaftTex, transparent: true, opacity: 0.0,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false, fog: false,
  });
  const lightSrc = new THREE.Mesh(new THREE.PlaneGeometry(34, 30), lightSrcMat);
  lightSrc.position.set(-36, 30, -4);     // mostly off the top-left corner — only the spill shows
  lightSrc.renderOrder = -2;
  scene.add(lightSrc);
  const godRaysFx = new GodRaysEffect(camera, lightSrc, {
    density: 0.92, decay: 0.93, weight: 0.5, exposure: 0.5, samples: 60,
    blur: true, kernelSize: KernelSize.SMALL, blendFunction: BlendFunction.SCREEN,
  });
  godRaysFx.blendMode.opacity.value = 0.0;
  const composer = new EffectComposer(renderer, {
    frameBufferType: THREE.HalfFloatType,
    multisampling: Math.min(4, renderer.capabilities.maxSamples || 0),   // clean geometry edges (panel)
  });
  /* GLM-5V "grain test": real volumetrics/optics are gritty, not silky digital gradients.
     A restrained film-stock finish — fine grain + edge chromatic aberration + vignette — kills
     the Photoshop-smooth feel across the whole piece. Values deliberately subtle. */
  const grainFx = new NoiseEffect({ blendFunction: BlendFunction.OVERLAY, premultiply: true });
  grainFx.blendMode.opacity.value = 0.06;
  const caFx = new ChromaticAberrationEffect({
    offset: new THREE.Vector2(0.0007, 0.0009), radialModulation: true, modulationOffset: 0.20,
  });
  const vignetteFx = new VignetteEffect({ offset: 0.30, darkness: 0.55 });
  // ACES filmic tone mapping so the PBR specimens + env reflections read correctly in the dark scene
  const toneFx = new ToneMappingEffect({ mode: ToneMappingMode.ACES_FILMIC });
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new EffectPass(camera, godRaysFx));  // volumetric light shaft (act 1)
  composer.addPass(new EffectPass(camera, dofFx));      // blur by depth (molecule is the focus target)
  composer.addPass(new EffectPass(camera, bloomFx));    // charge glow + finale bloom
  composer.addPass(new EffectPass(camera, lensFx));     // lens magnifies the final image
  composer.addPass(new EffectPass(camera, toneFx, caFx, vignetteFx, grainFx));   // ACES + film-stock finish

  /* ---------- focus system: lens / DoF / dolly all follow one damped target ---------- */
  const focusTarget = new THREE.Vector3(0, 0, 0);   // critically-damped (lerp ~0.1)
  const focusGoal = new THREE.Vector3(0, 0, 0);
  let lensStrength = 0, lensGoal = 0, focusGlow = 0;
  // act-1 "ride" mode: the focused specimen is rendered AT focusTarget (a smooth controlled
  // path), centred, and is revealed by a ZOOM-IN (grow + focus pull) rather than a glass lens —
  // a drifting speck flies toward the camera and resolves into a recognisable pollutant.
  let rideActive = false, rideFrac = 0;
  let lastScanIdx = -1, scanLockT = -10;   // scan reticle: detect target change → re-snap + relabel
  // premium pre-rendered specimens (Blender Cycles, real PubChem/RCSB/SEM data) keyed by feature id.
  // When present, the WebGL stand-in is hidden and this image is billboarded over the scene during the scan.
  const SPEC_IMG = { f1:'soot', f2:'virus', f3:'spore', f4:'bacteria', f5:'PFOS', f6:'nitrate',
    f8:'sulfate', f9:'sulfamethoxazole', f10:'24D', f11:'hormone', f12:'pm', f13:'pollen',
    f14:'dust', f15:'dander', f16:'microplastic', f17:'phosphate', f18:'fluoride' };
  const specImgCache = {};
  for (const k in SPEC_IMG){ const im = new Image(); im.src = 'specimens/' + SPEC_IMG[k] + '.png'; specImgCache[SPEC_IMG[k]] = im; }
  let specImgShownIdx = -1;
  let scanPos = 0;                          // auto-scan position (advances on a timer, loops)
  const SCAN_DWELL = 2.3;                   // seconds the scanner holds on each pollutant

  const pointer = { x: 0, y: 0, has: false, dirty: false };
  const FOCUS = { mode: finePointer ? 'DRIFT' : 'AUTO_TOUR', idx: -1, lastInput: performance.now(), tourIdx: 0, tourUntil: 0 };
  const SELECT = { idx: -1, t: -10 };   // explicit click-lock, distinct from hover-magnified
  // the idle tour showcases the structured molecules (cloud items) before the halo motes
  const TOUR_ORDER = [...feat.keys()].sort((a, b) =>
    (feat[a].cfg.treatment === 'cloud' ? 0 : 1) - (feat[b].cfg.treatment === 'cloud' ? 0 : 1) || a - b);

  addEventListener('pointermove', e => {
    pointer.x = e.clientX; pointer.y = e.clientY;
    pointer.has = true; pointer.dirty = true;        // consumed in the rAF tick only
  }, { passive: true });

  addEventListener('click', e => {
    FOCUS.lastInput = performance.now();
    const i = pickNearest(e.clientX, e.clientY, 150);
    if (i < 0){ SELECT.idx = -1; hideDetail(); return; }   // click on empty space releases the lock + closes the story
    const f = feat[i];
    FOCUS.idx = i;
    SELECT.idx = i; SELECT.t = clock; f.popT = clock; // lock + scale-pop + ripple start
    ui.callout.querySelector('span').textContent = f.cfg.label;
    ui.callout.querySelector('small').textContent = f.cfg.badge || f.cfg.id.toUpperCase();
    if (f.cfg.treatment === 'cloud'){
      cloudIdx = i;
    } else {
      f.haloT = clock;                               // soft halo, never the cloud
    }
    showDetail(i);                                   // open the pollutant's deep story
  });

  function pickNearest(px, py, maxPx){
    let best = -1, bd = maxPx * maxPx;
    for (const f of feat){
      if (f.screen.behind) continue;
      const dx = f.screen.x - px, dy = f.screen.y - py;
      const d2 = dx * dx + dy * dy;
      if (d2 < bd){ bd = d2; best = f.idx; }
    }
    return best;
  }

  /* selected cloud feature: defaults to the first treatment:'cloud' entry */
  let cloudIdx = Math.max(0, CONFIG.FEATURES.findIndex(f => f.treatment === 'cloud'));
  let act2Adopted = false;

  /* Act-1 SCROLL sweep: the magnifier is the PROTAGONIST of act 1, examining one specimen
     after another as you scroll (not an idle timer). Five vivid pollutant specimens; the
     molecule is act 2's reveal, so the lens fades out before the PFOS hero grows in. */
  const SWEEP = (() => {
    // ALL 18 pollutants in ONE sequence — particle/molecule interleaved so it stays visually varied
    // (never 9 samey molecules in a row), opening on the virus. Indices into CONFIG.FEATURES.
    const order = [1, 4, 3, 5, 0, 7, 2, 9, 12, 6, 11, 8, 13, 10, 15, 16, 14, 17];
    const valid = order.filter(i => i < feat.length);
    return valid.length >= 6 ? valid : [...feat.keys()];
  })();

  const _v = new THREE.Vector3();
  function projectAll(w, h){
    for (const f of feat){
      _v.copy(f.live).project(camera);
      f.screen.behind = _v.z > 1 || _v.z < -1;
      f.screen.x = (_v.x * 0.5 + 0.5) * w;
      f.screen.y = (-_v.y * 0.5 + 0.5) * h;
    }
  }
  function projectPoint(v3, out){
    _v.copy(v3).project(camera);
    out.x = (_v.x * 0.5 + 0.5) * innerWidth;
    out.y = (-_v.y * 0.5 + 0.5) * innerHeight;
    out.behind = _v.z > 1;
    return out;
  }

  /* cursor → world point on the z=0 plane (lens "searching" position) */
  const _ray = new THREE.Vector3();
  function cursorWorld(out){
    _ray.set((pointer.x / innerWidth) * 2 - 1, -(pointer.y / innerHeight) * 2 + 1, 0.5).unproject(camera);
    _ray.sub(camera.position).normalize();
    const t = -camera.position.z / (_ray.z || -1e-6);
    out.copy(camera.position).addScaledVector(_ray, Math.max(t, 1));
    return out;
  }
  /* arbitrary screen point (px) → world point on the z=0 plane (controlled lens path) */
  function screenToWorld(sx, sy, out){
    _ray.set((sx / innerWidth) * 2 - 1, -(sy / innerHeight) * 2 + 1, 0.5).unproject(camera);
    _ray.sub(camera.position).normalize();
    const t = -camera.position.z / (_ray.z || -1e-6);
    out.copy(camera.position).addScaledVector(_ray, Math.max(t, 1));
    return out;
  }

  function updateFocus(dt, now){
    const inAct1 = S.p < 0.235 && !reduceMotion;
    let focusedIdx = -1;
    let searching = false;
    rideActive = false;

    if (!inAct1){
      lensGoal = 0;
    } else if (focusPin !== null){
      // QA: hold one feature promoted under the lens (deterministic specimen hero)
      focusedIdx = focusPin;
      focusGoal.copy(feat[focusPin].live);
      lensGoal = 1;
    } else {
      // ALWAYS auto-scan in act 1 — NO glass lens, ever (not even on desktop mouse-move; the old
      // hover-loupe is gone for good). The scanner cycles through the pollutants on its own; each is
      // centred at focusTarget, grows + rotates into focus, then it advances to the next.
      FOCUS.mode = 'AUTO_TOUR';
      scanPos += dt / SCAN_DWELL;                        // ~1 pollutant every SCAN_DWELL seconds, loops
      if (scanPin !== null) scanPos = scanPin + 0.6;     // QA: hold on one pollutant (grown, mid-dwell)
      const beat = Math.floor(scanPos) % SWEEP.length;
      rideFrac = clamp01(scanPos - Math.floor(scanPos)); // 0→1 within the current pollutant
      focusedIdx = SWEEP[beat];
      // centre the subject with a slow drift so the frame isn't dead-static
      const tt = scanPos * 0.5;
      const sx = (0.50 + 0.06 * Math.sin(tt)) * innerWidth;
      const sy = (0.43 + 0.05 * Math.cos(tt * 0.8)) * innerHeight;
      screenToWorld(sx, sy, focusGoal);
      rideActive = true;
      lensGoal = 0;
    }
    pointer.dirty = false;
    FOCUS.idx = focusedIdx;

    // critically-damped follow (~0.1 lerp at 60fps), frame-rate independent
    const kf = 1 - Math.pow(1 - 0.1, dt * 60);
    focusTarget.lerp(focusGoal, kf);
    lensStrength += (lensGoal - lensStrength) * Math.min(1, dt * 5);
    focusGlow += ((focusedIdx >= 0 && inAct1 ? 1 : 0) - focusGlow) * Math.min(1, dt * 6);

    // feature promotion: hide the cheap point, fade in the stand-in (~200 ms).
    // A click-locked selection stays promoted even when the cursor wanders.
    for (const f of feat){
      const want = (inAct1 && ((f.idx === focusedIdx && !searching) || f.idx === SELECT.idx)) ? 1 : 0;
      f.promote += Math.sign(want - f.promote) * Math.min(dt / 0.2, Math.abs(want - f.promote));
    }
  }

  /* ---------- camera choreography ---------- */
  const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
  const ORIGIN = new THREE.Vector3(0, 0, 0);
  const P1 = new THREE.Vector3(0, 0, 60);
  const P3 = new THREE.Vector3(0, 3, 64);
  /* Acts 4-5 HERO framing, derived from the panel's own world transform so the charged
     surface fills the frame center-weighted (the optical scale of the act-2 molecule):
     · act 4 — oblique arrival, panel ≈62% of frame height riding high, so the
       headline + subhead own the clear band under its bottom edge;
     · act 5 — near-frontal and CLOSER (the biggest beat, ≈66% of frame height),
       seated low so a long two-sentence headline owns the clear top band and the
       group pills land in the negative space below the bottom edge. */
  const panelN = new THREE.Vector3(0, 0, 1).applyQuaternion(panel.quaternion).normalize();
  const panelR = new THREE.Vector3(1, 0, 0).applyQuaternion(panel.quaternion).normalize();
  const panelU = new THREE.Vector3(0, 1, 0).applyQuaternion(panel.quaternion).normalize();
  /* aspect-aware: on narrow frames the camera dollies back (VIEW.dist4/5) so the
     WHOLE panel fits the horizontal FOV, and the look targets recenter so the
     sheet sits centered (desktop values reproduce build7 exactly). */
  const P4 = new THREE.Vector3(), L4 = new THREE.Vector3();
  const P5 = new THREE.Vector3(), L5 = new THREE.Vector3();
  function refreshCamAnchors(){
    P4.copy(PANEL.center).addScaledVector(panelN, VIEW.dist4).addScaledVector(panelR, 10).addScaledVector(panelU, 4);
    P5.copy(PANEL.center).addScaledVector(panelN, VIEW.dist5).addScaledVector(panelR, 4.5).addScaledVector(panelU, 1.5);
    if (VIEW.portrait){
      L4.copy(PANEL.center).addScaledVector(panelU, -1.5);
      L5.copy(PANEL.center).addScaledVector(panelU, 0.5);
    } else {
      L4.copy(PANEL.center).addScaledVector(panelU, -2.9).addScaledVector(panelR, -2.2);
      L5.copy(PANEL.center).addScaledVector(panelU, 3.2);
    }
  }
  refreshCamAnchors();
  const _p2 = new THREE.Vector3(), _dir = new THREE.Vector3(), _par = new THREE.Vector3();
  let parX = 0, parY = 0;

  function updateCamera(dt){
    const p = S.p;
    const cloudC = feat[cloudIdx].live;

    camPos.copy(P1);
    camLook.set(0, 0, 0);
    // act-1 gentle dolly toward the focus target
    camPos.addScaledVector(_dir.copy(focusTarget).sub(camLook), 0.05 * focusGlow);
    camLook.lerp(focusTarget, 0.12 * focusGlow);

    // act 2: dolly into the selected cloud item
    const k2 = easeQ(clampR(0.22, 0.345, p));
    if (k2 > 0){
      _dir.copy(cloudC).sub(P1).normalize();
      _p2.copy(cloudC).addScaledVector(_dir, -13.5 * VIEW.dist2K);
      camPos.lerp(_p2, k2);
      camLook.lerp(cloudC, k2);
    }
    // act 3: ease back out behind the scrim
    const k3 = easeQ(clampR(0.42, 0.50, p));
    if (k3 > 0){ camPos.lerp(P3, k3); camLook.lerp(ORIGIN, k3); }
    // act 4: arrive at the charged surface with its OWN move — a slow rising crane
    // that drifts laterally along the panel while the field ignites (act 5 then settles)
    const k4 = easeQ(clampR(0.66, 0.755, p));
    if (k4 > 0){ camPos.lerp(P4, k4); camLook.lerp(L4, k4); }
    const crane = Math.sin(clampR(0.685, 0.80, p) * Math.PI);
    if (crane > 0){
      camPos.x -= crane * 2.6;
      camPos.y += crane * 2.1;
      camPos.z += crane * 1.4;
    }
    // act 5: settle closer while the outcomes play out
    const k5 = easeQ(clampR(0.80, 0.92, p));
    if (k5 > 0){ camPos.lerp(P5, k5); camLook.lerp(L5, k5); }

    // slight cursor parallax (never drives p)
    if (finePointer && !reduceMotion && pointer.has){
      const tx = (pointer.x / innerWidth - 0.5) * 2, ty = (pointer.y / innerHeight - 0.5) * 2;
      parX += (tx - parX) * Math.min(1, dt * 3);
      parY += (ty - parY) * Math.min(1, dt * 3);
    }
    // parallax fades out through act 2–3, then returns gently so the flat
    // charged surface reads as a real plane in space
    const parAmt = Math.max(1 - clampR(0.20, 0.30, S.p), 0.55 * clampR(0.66, 0.74, S.p));
    _par.set(parX * 1.5, -parY * 1.0, 0).multiplyScalar(parAmt);
    camPos.add(_par);

    camera.position.copy(camPos);
    camera.lookAt(camLook);
  }

  /* ---------- per-frame feature update (drift, acts 4–5 outcomes) ---------- */
  const _cv = [0, 0, 0];
  let capturedCount = 0;                                  // act-5 on-surface counter source
  function updateFeatures(dt, now){
    const p = S.p;
    const cloudVis = clampR(0.235, 0.27, p) * (1 - clampR(0.415, 0.45, p));
    const bias4 = 0.22 * easeIO(clampR(0.66, 0.80, p));   // drift biases toward the surface
    capturedCount = 0;

    for (const f of feat){
      const i = f.idx, j = i * 3;
      if (!reduceMotion){
        curl(f.base.x * 0.05 + 7.3, f.base.y * 0.05 + now * 0.00009, f.base.z * 0.05, _cv);
        f.drift.x += (_cv[0] * 1.15 - f.drift.x * 0.35) * dt;
        f.drift.y += (_cv[1] * 1.15 - f.drift.y * 0.35) * dt;
        f.drift.z += (_cv[2] * 1.15 - f.drift.z * 0.35) * dt;
        f.drift.clampLength(0, 2.6);
      }
      const tr = TRAVEL[i];
      // act-5 travel: fast launch, decisive deceleration — the node SNAPS onto the grid
      const travel = 1 - Math.pow(1 - clampR(tr.s0, tr.e0, p), 3);
      const k = Math.max(travel, bias4);
      f.live.copy(f.base).add(f.drift).lerp(f.landing, k);

      f.live.toArray(featPosArr, j);

      // point alpha/size: hide under promotion, under the act-2 molecule, and on act-5 fade-out
      let alpha = 1 - f.promote;
      let size = 3.4;
      if (i === cloudIdx) alpha *= 1 - cloudVis;
      const arrived = travel >= 1;
      if (f.cfg.outcome === 'fade'){
        const shrink = easeIO(clampR(0.93, 0.985, p));
        size *= 1 - shrink;
        alpha *= 1 - shrink * 0.97;
        // contact shimmer: small, static, local to the contact point (0.90–1.00 beat)
        const win = clampR(0.90, 0.925, p) * (1 - clampR(0.955, 0.985, p));
        f.shimmer.material.opacity = arrived ? win * (0.5 + 0.5 * Math.sin(now * 0.018 + i * 2.1)) * 0.85 : 0;
      } else {
        // captured: on contact the glow point snaps into a mark on the panel face,
        // fires a landing pulse ring, lights its grid cell, and gently breathes there
        const approach = travel * clampR(0.80, 0.90, p);
        const adhere = easeIO(clampR(tr.e0 - 0.02, tr.e0 + 0.015, p));
        NEUTRAL.toArray(featTintArr, j);
        if (approach > 0){
          featTintArr[j]     = lerp(featTintArr[j],     POSC.r * 0.85 + 0.15, approach * 0.8);
          featTintArr[j + 1] = lerp(featTintArr[j + 1], POSC.g * 0.85 + 0.15, approach * 0.8);
          featTintArr[j + 2] = lerp(featTintArr[j + 2], POSC.b * 0.85 + 0.15, approach * 0.8);
        }
        const inAct5 = clampR(0.80, 0.82, p);
        const pk = clampR(tr.e0 - 0.006, tr.e0 + 0.042, p);          // landing-pulse window
        if (f.decalMat){
          f.decalMat.opacity = adhere * (0.80 + 0.16 * Math.sin(now * 0.0021 + i * 1.9));
          alpha *= 1 - adhere * 0.75;
          size *= (1 - adhere * 0.45) * (1 + 0.55 * Math.sin(Math.min(1, pk) * Math.PI) * inAct5);
        }
        if (f.pulseMat){
          f.pulseMat.opacity = Math.sin(Math.min(1, pk) * Math.PI) * 0.85 * inAct5;
          f.pulseRing.scale.setScalar(0.7 + 3.1 * pk);
        }
        if (f.holdSlot !== undefined){
          // feed the face shader: lit cell once captured, faint anticipation while incoming
          const antic = 0.45 * clampR(0.695, 0.78, p) * (1 - travel);
          panelFaceMat.uniforms.uLand.value[f.holdSlot].set(f.landUv.x, f.landUv.y, adhere, antic);
          if (adhere > 0.6) capturedCount++;
        }
      }
      // persistent click-selection read (act 1): cyan-tinted, slightly larger point
      if (S.p < 0.235){
        const selK = i === SELECT.idx ? 0.7 : 0;
        featTintArr[j]     = lerp(NEUTRAL.r, POSC.r, selK);
        featTintArr[j + 1] = lerp(NEUTRAL.g, POSC.g, selK);
        featTintArr[j + 2] = lerp(NEUTRAL.b, POSC.b, selK);
        if (selK > 0) size *= 1.22;
      }
      featAlphaArr[i] = alpha;
      featSizeArr[i] = size;

      // promoted stand-in (lens focus) — for cloud items this is the discrete molecule;
      // a click-pop briefly swells it, and a locked selection runs a hotter charge read
      // hide the fake WebGL stand-in for the focused specimen ONLY when its premium render has loaded
      const _pk = SPEC_IMG[f.cfg.id], _pim = _pk && specImgCache[_pk];
      const hasPremium = rideActive && i === FOCUS.idx && _pim && _pim.complete && _pim.naturalWidth > 0;
      const vis = f.promote > 0.01 && !hasPremium;
      f.standIn.visible = vis;
      if (vis){
        const pop = 1 + 0.22 * Math.max(0, Math.exp(-(now / 1000 - f.popT) * 5)) * (now / 1000 > f.popT ? 1 : 0);
        // act-1 ride: the focused specimen is centred at focusTarget and GROWS from a small speck
        // into a large, sharp pollutant over its beat (zoom reveal); others keep their drift spot.
        if (rideActive && i === FOCUS.idx){
          f.standIn.position.copy(focusTarget);
          f.standIn.scale.setScalar(3.55 * lerp(1.7, 2.6, easeIO(rideFrac)) * pop);   // larger so the craft reads
          f.standIn.rotation.y += dt * 0.55;         // rotate so you see the 3D form
          f.standIn.rotation.x = 0.18 + 0.05 * Math.sin(clock * 0.5);
        } else {
          f.standIn.position.copy(f.live);
          f.standIn.scale.setScalar(3.55 * (0.8 + 0.2 * f.promote) * pop);
        }
        if (f.standMol){
          setMolecule(f.standMol, f.promote, i === SELECT.idx ? 0.6 : 0.32, now / 1000);
        } else {
          for (const m of f.standMats) m.opacity = f.promote * (m.userData.maxOpacity == null ? 1 : m.userData.maxOpacity);
          if (f.standMat) f.standMat.emissiveIntensity = 1.0 + (i === SELECT.idx ? 0.5 : 0);
        }
        f.standIn.rotateOnAxis(f.spinAxis, dt * 0.5);
      }

      // halo tap feedback
      const ht = (now / 1000) - f.haloT;
      if (ht > 0 && ht < 1.4){
        const e = Math.exp(-ht * 2.6);
        f.halo.material.opacity = 0.4 * e;
        f.halo.scale.setScalar(6 + ht * 5);
        f.halo.position.copy(f.live);
      } else f.halo.material.opacity = 0;
    }
    featGeo.attributes.position.needsUpdate = true;
    featGeo.attributes.aAlpha.needsUpdate = true;
    featGeo.attributes.aSize.needsUpdate = true;
    featGeo.attributes.aTint.needsUpdate = true;
  }

  /* ---------- group labels + badge + reticle + counter (HTML over canvas, projected) ---------- */
  const _scr = { x: 0, y: 0, behind: false };
  // the pills form a legend row in the clear negative space BELOW the panel: their row
  // sits a fixed offset under the LOWEST projected bottom corner (the edge is tilted),
  // so no label can ever sit on the face, the orbs, or any body copy. The counter is a
  // fixed corner HUD (styled in CSS) — no projection at all.
  const pillAnchorA = panel.localToWorld(new THREE.Vector3(-PANEL.w * 0.24, -PANEL.h / 2, 1.2));
  const pillAnchorB = panel.localToWorld(new THREE.Vector3( PANEL.w * 0.24, -PANEL.h / 2, 1.2));
  const panelBL = panel.localToWorld(new THREE.Vector3(-PANEL.w / 2, -PANEL.h / 2, 1.2));
  const panelBR = panel.localToWorld(new THREE.Vector3( PANEL.w / 2, -PANEL.h / 2, 1.2));
  let counterShown = -1;
  function updateOverlays(){
    const p = S.p;
    if (p > 0.80){
      projectPoint(panelBL, _scr); let edgeY = _scr.behind ? -1e4 : _scr.y;
      projectPoint(panelBR, _scr); edgeY = Math.max(edgeY, _scr.behind ? -1e4 : _scr.y);
      if (VIEW.portrait){
        /* narrow frames: the side-by-side legend row can't fit — STACK the pills
           centered under the panel, shifted up if they'd crowd the bottom safe
           band (the counter HUD owns the last ~56px of the lower-left corner) */
        const cx = innerWidth / 2;
        const hA = ui.ga.offsetHeight || 30, hB = ui.gb.offsetHeight || 30;
        let yA = edgeY + 28 + hA / 2;
        let yB = yA + hA / 2 + 10 + hB / 2;
        const over = yB + hB / 2 - (innerHeight - 58);
        if (over > 0){ yA -= over; yB -= over; }
        ui.ga.style.transform = `translate(-50%,-50%) translate(${cx}px,${yA}px)`;
        ui.gb.style.transform = `translate(-50%,-50%) translate(${cx}px,${yB}px)`;
      } else {
        const rowY = Math.min(innerHeight - 30, edgeY + 38);
        projectPoint(pillAnchorA, _scr);
        if (!_scr.behind){
          const x = Math.min(innerWidth - 110, Math.max(110, _scr.x));
          ui.ga.style.transform = `translate(-50%,-50%) translate(${x}px,${rowY}px)`;
        }
        projectPoint(pillAnchorB, _scr);
        if (!_scr.behind){
          const x = Math.min(innerWidth - 110, Math.max(110, _scr.x));
          ui.gb.style.transform = `translate(-50%,-50%) translate(${x}px,${rowY}px)`;
        }
      }
      if (capturedCount !== counterShown){
        counterShown = capturedCount;
        ui.counter.textContent = `${String(capturedCount).padStart(2, '0')} / ${String(totalHolds).padStart(2, '0')}`;
      }
    }
    const a2 = clampR(0.25, 0.285, p) * (1 - clampR(0.40, 0.435, p));
    if (a2 > 0.01){
      const f = feat[cloudIdx];
      projectPoint(f.live, _scr);
      // badge annotates from outside the molecule, tied back by a leader line
      // (margin tracks the rendered pill width so it can never clip a narrow frame)
      const bm = Math.max(VIEW.portrait ? 60 : 100, (ui.badge.offsetWidth || 0) / 2 + 12);
      const bx = Math.min(innerWidth - bm, Math.max(bm, _scr.x + innerWidth * 0.21));
      const by = Math.min(innerHeight - 70, Math.max(70, _scr.y - innerHeight * 0.23));
      ui.badge.style.transform = `translate(-50%,-50%) translate(${bx}px,${by}px)`;
      ui.badge.textContent = f.cfg.badge || f.cfg.label;
      ui.badge.style.opacity = a2;
      const ldx = bx - _scr.x, ldy = by - _scr.y;
      const llen = Math.hypot(ldx, ldy);
      ui.badgeLine.style.width = Math.max(0, llen - 52) + 'px';
      ui.badgeLine.style.transform = `translate(${_scr.x}px,${_scr.y}px) rotate(${Math.atan2(ldy, ldx)}rad)`;
      ui.badgeLine.style.opacity = a2 * 0.85;
    } else { ui.badge.style.opacity = 0; ui.badgeLine.style.opacity = 0; }
    // act-1 SCAN reticle: locks onto each scanned pollutant in turn and snaps in its name + charge.
    if (rideActive && FOCUS.idx >= 0 && p < 0.232){
      if (FOCUS.idx !== lastScanIdx){                 // new target → re-snap, relabel, climb the count
        lastScanIdx = FOCUS.idx;
        scanLockT = clock;
        scannedTotal = Math.min(scannedTotal + 11 + (FOCUS.idx % 7) * 2, 287);   // settles near "287 +"
        const fc = feat[FOCUS.idx].cfg;
        ui.callout.querySelector('span').textContent = fc.label;
        ui.callout.querySelector('small').textContent = (fc.badge && fc.badge.length) ? fc.badge : 'net charge −';
      }
      projectPoint(focusTarget, _scr);
      if (!_scr.behind){
        const since = clock - scanLockT;
        const snap = 1.55 * (1 + 0.30 * Math.exp(-since * 7));   // lock-on pop, sized to the larger specimen
        const appear = Math.min(1, since * 5);
        const fade = appear * (1 - clampR(0.205, 0.232, p));
        ui.reticle.style.transform = `translate(${_scr.x}px,${_scr.y}px) scale(${snap.toFixed(3)})`;
        ui.reticle.style.opacity = fade;
        // PREMIUM specimen render billboarded at the lock point, sized just inside the reticle
        const key = SPEC_IMG[feat[FOCUS.idx].cfg.id];
        const kimg = key && specImgCache[key];
        if (key && kimg && kimg.complete && kimg.naturalWidth > 0){
          if (specImgShownIdx !== FOCUS.idx){ ui.specimg.src = 'specimens/' + key + '.png'; specImgShownIdx = FOCUS.idx; }
          const reticlePx = 118 * snap;                              // reticle element is 118px, scaled by snap
          const sz = Math.max(150, reticlePx * 2.3);                 // specimen fills the frame, beyond the ring
          const grow = lerp(0.92, 1.0, easeIO(rideFrac));            // subtle settle-in zoom
          ui.specimg.style.width = (sz * grow) + 'px';
          ui.specimg.style.height = (sz * grow) + 'px';
          ui.specimg.style.transform = `translate(${_scr.x}px,${_scr.y}px) translate(-50%,-50%) rotate(${Math.sin(clock*0.25)*1.5}deg)`;
          ui.specimg.style.opacity = fade;
        } else { ui.specimg.style.opacity = 0; specImgShownIdx = -1; }
      } else { ui.reticle.style.opacity = 0; ui.specimg.style.opacity = 0; }
    } else {
      lastScanIdx = -1;
      ui.reticle.style.opacity = 0;
      ui.specimg.style.opacity = 0; specImgShownIdx = -1;
    }
  }

  /* ---------- master per-tick update ---------- */
  let clock = 0;
  let firstFrame = true;
  function update(dt, now){
    clock = now / 1000;
    const p = pinnedP !== null ? pinnedP : S.p;
    if (pinnedP !== null && Math.abs(S.p - pinnedP) > 1e-6) applyFrame(pinnedP);

    // adopt the toured/clicked item for the act-2 cloud at the act boundary
    if (p > 0.21 && !act2Adopted){
      act2Adopted = true;
      if (FOCUS.idx >= 0 && feat[FOCUS.idx].cfg.treatment === 'cloud'){
        cloudIdx = FOCUS.idx;
      }
    } else if (p < 0.19) act2Adopted = false;
    if (p > 0.24 && SELECT.idx >= 0) SELECT.idx = -1;   // act-1 lock releases past the act
    if (p > 0.44) hideDetail();                          // story panel persists through Act 2, then closes

    updateFocus(dt, now);
    updateFeatures(dt, now);
    if (!reduceMotion) updateDust(dt);
    updateCamera(dt);
    camera.updateMatrixWorld();
    projectAll(innerWidth, innerHeight);
    updateOverlays();

    /* act-2 hero molecule: condense from the field, slow-rotate, breathe; the charge
       region brightens through the red beat. Discrete geometry — never fog. */
    const cloudVis = clampR(0.235, 0.27, p) * (1 - clampR(0.415, 0.45, p));
    const redBoost = clampR(0.335, 0.395, p);
    const tMol = reduceMotion ? 3.0 : clock;
    /* particle-field life: twinkle clock + act-graded density (recede behind the
       act-2 hero and the act-3 scrim, re-densify for the finale) */
    dustMat.uniforms.uTime.value = tMol;
    dustMat.uniforms.uGlobal.value = 0.62 * (1 - 0.45 * cloudVis
      - 0.40 * clampR(0.45, 0.48, p) * (1 - clampR(0.655, 0.69, p))
      + 0.30 * clampR(0.80, 0.88, p));
    // Light SOURCE + god-rays removed (user: the bright corner read as weird). The dust keeps a
    // gentle directional shading for dimension, but there is no visible source/beam.
    lightSrcMat.opacity = 0;
    lightSrc.visible = false;
    godRaysFx.blendMode.opacity.value = 0;
    // keep the soft foreground bokeh (depth) through act 1
    const act1vis = 1 - clampR(0.20, 0.30, S.p);
    fgBokeh.visible = act1vis > 0.001;
    if (fgBokeh.visible){
      for (const sp of fgBokeh.children){
        sp.material.opacity = sp.userData.baseO * act1vis;
        sp.position.x += sp.userData.dx * dt; sp.position.y += sp.userData.dy * dt;
      }
    }
    // the act-4/5 charged surface must NOT peek into act 1 (the teal bar on the right edge)
    panel.visible = S.p > 0.58;
    const hero = heroMolecule(cloudIdx);
    for (const [hi, HM] of heroMols) HM.group.visible = hi === cloudIdx && cloudVis > 0.004;
    if (cloudVis > 0.004){
      hero.group.position.copy(feat[cloudIdx].live);
      setAssembly(hero, easeIO(clampR(0.243, 0.345, p)));
      setMolecule(hero, cloudVis, redBoost, tMol);
      hero.group.scale.setScalar(HERO_SCALE * (1 + (reduceMotion ? 0 : 0.016 * Math.sin(tMol * 0.8))));
      if (!reduceMotion){
        hero.group.rotation.y += dt * 0.17;
        hero.group.rotation.x = 0.12 + 0.16 * Math.sin(tMol * 0.10);
      }
    }

    /* act-1 selection ripple */
    const sinceSel = clock - SELECT.t;
    if (SELECT.idx >= 0 && sinceSel > 0 && sinceSel < 0.9 && p < 0.235){
      rippleMat.opacity = 0.6 * (1 - sinceSel / 0.9);
      ripple.scale.setScalar(5 + 30 * (1 - Math.pow(1 - sinceSel / 0.9, 2.5)));
      ripple.position.copy(feat[SELECT.idx].live);
    } else rippleMat.opacity = 0;

    /* act-4/5 charged-surface life: ignition sweep, energy wave, time */
    const PU = panelFaceMat.uniforms;
    PU.uTime.value = tMol;
    PU.uIgnite.value = easeIO(clampR(0.675, 0.77, p));
    PU.uWave.value = clampR(0.74, 0.80, p) * (1 - 0.4 * clampR(0.95, 1.0, p));

    /* lens + DoF + bloom */
    const lensFade = 1 - clampR(0.195, 0.225, p);
    // The disc rides focusTarget. In act-1 scroll mode focusTarget follows a smooth CONTROLLED
    // path (set in updateFocus) and the focused specimen is rendered AT focusTarget — so the
    // subject is always centred in the loupe and the lens stays on the right, clear of the headline.
    projectPoint(focusTarget, _scr);
    /* portrait: clamp the lens center so the full disc (plus bevel) stays inside
       the narrow frame — the zoom crop samples the SAME clamped point, so the
       glass keeps showing exactly what sits behind it */
    let lcx = _scr.x, lcy = _scr.y;
    if (VIEW.portrait){
      const rPx = VIEW.lensR * innerHeight * 1.14;
      lcx = Math.min(innerWidth - rPx, Math.max(rPx, lcx));
      lcy = Math.min(innerHeight - rPx, Math.max(rPx, lcy));
    }
    lensFx.uniforms.get('uCenter').value.set(lcx / innerWidth, 1 - lcy / innerHeight);
    lensFx.uniforms.get('uStrength').value = lensStrength * lensFade * (_scr.behind ? 0 : 1);
    lensFx.uniforms.get('uTime').value = tMol;
    lensFx.uniforms.get('uDots').value = focusGlow * lensFade;
    /* the magnifier's zoom pass: render a LENS_MAG× crop around the lens center
       into the dedicated target (sharp — no DoF, no bloom) */
    if (lensStrength * lensFade > 0.004 && !_scr.behind && p < 0.235){
      camera.setViewOffset(innerWidth, innerHeight,
        lcx - innerWidth / (2 * LENS_MAG), lcy - innerHeight / (2 * LENS_MAG),
        innerWidth / LENS_MAG, innerHeight / LENS_MAG);
      // The lens REVEALS one clean specimen — not a magnified slice of the busy
      // field. Hide the ambient dust motes + the cheap point-markers for this pass
      // (the focused item is shown by its hi-fi stand-in), so they don't pile up
      // and bury the subject inside the loupe. Base frame keeps its field intact.
      const _dustVis = dust.visible, _featVis = featPoints.visible;
      dust.visible = false; featPoints.visible = false;
      // Isolate ONE subject in the loupe: render only the focused item's stand-in.
      // During an auto-tour hand-off the outgoing + incoming stand-ins both linger
      // (~0.2s) and would overlap into a sphere-pile; show only the focused one.
      const _svis = [];
      for (let k = 0; k < feat.length; k++){ _svis.push(feat[k].standIn.visible); if (k !== FOCUS.idx) feat[k].standIn.visible = false; }
      renderer.setRenderTarget(lensRT);
      renderer.render(scene, camera);
      for (let k = 0; k < feat.length; k++) feat[k].standIn.visible = _svis[k];
      dust.visible = _dustVis; featPoints.visible = _featVis;
      camera.clearViewOffset();
      renderer.setRenderTarget(null);
    }
    if (/[?&]debug=4/.test(location.search)){
      lensFx.uniforms.get('uCenter').value.set(0.5, 0.5);
      lensFx.uniforms.get('uStrength').value = 1;
    }
    // acts 4-5 focus the hero surface itself so the climax renders pin-sharp
    dofFx.target = (p > 0.22 && p < 0.45) ? feat[cloudIdx].live : (p > 0.62 ? PANEL.center : focusTarget);
    dofFx.bokehScale = lerp(0.8, 3.6, Math.max(focusGlow * lensFade, easeIO(clampR(0.24, 0.32, p)) * (1 - clampR(0.40, 0.45, p))));
    // GLM-5.2 per-act bloom: dip+raise-threshold for act3 chart legibility, surge for act4/5 drama
    bloomFx.intensity = 0.35 + 0.10 * clampR(0.22, 0.38, p) - 0.15 * clampR(0.38, 0.45, p) + 0.55 * clampR(0.66, 0.78, p) + 0.20 * clampR(0.80, 0.95, p) + 0.28 * redBoost * cloudVis;
    bloomFx.luminanceThreshold = 0.30 + 0.30 * clampR(0.38, 0.45, p) - 0.30 * clampR(0.64, 0.72, p);

    composer.render(dt);
    if (firstFrame){
      firstFrame = false;
      ui.canvas.classList.add('ready');
    }
    if (window.__dbg && ++__dbgFrames === 40){
      window.__dbg('p=' + p.toFixed(3) + ' cloudVis=' + cloudVis.toFixed(2) +
        ' cam=' + camera.position.toArray().map(n => n.toFixed(1)).join(',') +
        ' mol[' + cloudIdx + ']=' + hero.atoms.length + 'a/' + hero.bonds.length + 'b asm=' + hero.assembled.toFixed(2) +
        ' reduce=' + reduceMotion + ' fine=' + finePointer +
        ' mode=' + FOCUS.mode + ' idx=' + FOCUS.idx + ' lens=' + lensStrength.toFixed(2) +
        ' uS=' + lensFx.uniforms.get('uStrength').value.toFixed(2) +
        ' uC=' + lensFx.uniforms.get('uCenter').value.toArray().map(n => n.toFixed(2)).join(','));
    }
  }
  let __dbgFrames = 0;

  function resize(){
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    computeView();                   // re-derive portrait reframing (field, lens, dollies)
    refreshField();
    refreshCamAnchors();
    renderer.setPixelRatio(Math.min(devicePixelRatio, MAX_DPR));
    composer.setSize(innerWidth, innerHeight);
    sizeLensRT();
    lensFx.uniforms.get('uLensAspect').value = innerWidth / innerHeight;
    lensFx.uniforms.get('uRadius').value = VIEW.lensR;
    applyFrame(S.p);                 // re-anchor DOM-projected layers (tracer, chart)
    if (reduceMotion) renderStatic();
  }
  addEventListener('resize', resize);

  /* reduced-motion + pinned QA: settle the simulation into one composed frame */
  function renderStatic(){
    const pp = pinnedP !== null ? pinnedP : 0;
    applyFrame(pp);
    FOCUS.lastInput = -1e9;          // pinned QA: auto tour engages immediately (no-op under reduced motion)
    for (let i = 0; i < 100; i++) update(1 / 60, 16.7 * i);
  }

  /* scroll cancels the auto tour and hands control back (re-armed by the idle timer) */
  function notifyScroll(){
    FOCUS.lastInput = performance.now();
    if (finePointer && FOCUS.mode === 'AUTO_TOUR') FOCUS.mode = 'DRIFT';
  }

  return { update, renderStatic, notifyScroll };
}

/* ============================== boot ============================== */

const ric = window.requestIdleCallback
  ? (fn => requestIdleCallback(fn, { timeout: 800 }))   // timeout: guarantee init even on busy main threads
  : (fn => setTimeout(fn, 250));
const dbg = window.__dbg || (() => {});

function boot(){
  dbg('boot() entered');
  try {
    GL = initGL();
    dbg('initGL ok');
  } catch (err) {
    console.error('WebGL init failed — keeping static poster.', err);
    // captions still follow native scroll over the poster
    gsap.registerPlugin(ScrollTrigger);
    ScrollTrigger.create({
      trigger: '#spacer', start: 'top top', end: 'bottom bottom',
      onUpdate: self => applyFrame(self.progress),
    });
    return;
  }

  if (reduceMotion){
    GL.renderStatic();
    ui.canvas.classList.add('ready');
    return;
  }

  gsap.registerPlugin(ScrollTrigger);
  gsap.ticker.lagSmoothing(0);

  let lenis = null;
  if (pinnedP === null){
    lenis = new Lenis({ duration: 1.25, smoothWheel: true });
    lenis.on('scroll', e => {
      ScrollTrigger.update();
      if (Math.abs(e.velocity) > 0.05) GL.notifyScroll();
    });
    ScrollTrigger.create({
      trigger: '#spacer', start: 'top top', end: 'bottom bottom',
      onUpdate: self => applyFrame(self.progress),
    });
  } else {
    // pinned QA mode: paint a settled, fully composed frame immediately
    applyFrame(pinnedP);
    ui.canvas.style.transition = 'none';
    GL.renderStatic();
  }

  // one loop: Lenis + simulation + composer all inside the GSAP ticker
  gsap.ticker.add(t => {
    if (lenis) lenis.raf(t * 1000);
    const now = performance.now();
    const dt = Math.min(0.05, gsap.ticker.deltaRatio(60) / 60);
    GL.update(dt, now);
  });
}

ric(boot);
</script>
</body>
</html>

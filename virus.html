html.deck-mode,body.deck-mode{height:100%;overflow:hidden;overscroll-behavior:none}
body.deck-mode .deck{position:relative;width:100%;transform:translateY(0);will-change:transform}
body.deck-mode .deck.smooth{transition:transform 720ms cubic-bezier(.7,0,.2,1)}

/* FLOW MODE (Phones / Short screens) */
html.flow-mode,body.flow-mode{height:auto;overflow-y:auto;overflow-x:hidden;overscroll-behavior:auto}
body.flow-mode .deck{transform:none;position:relative;width:100%}
body.flow-mode .screen{height:auto;min-height:100vh;min-height:100dvh;overflow:visible}

body.flow-mode #dots{display:none}
/* phone (flow) — the logo scrolls away at the top instead of a fixed bar smearing over every section */
body.flow-mode header{position:absolute;background:none}

@media(max-width:700px){header img{height:72px}header{padding:12px 16px}#dots{right:10px}}
@media(prefers-reduced-motion:reduce){.deck.smooth{transition:none}}

    &lt;/div&gt;

  &lt;div class=&quot;chrome chrome-legend&quot;&gt;
    &lt;div class=&quot;legend-title&quot;&gt;Share of ER Visits · Flu, COVID, RSV&lt;/div&gt;
    &lt;div class=&quot;legend-gradient&quot;&gt;&lt;/div&gt;

        &lt;svg viewBox=&quot;0 0 24 24&quot; id=&quot;playIcon&quot;&gt;&lt;path d=&quot;M8 5v14l11-7z&quot;/&gt;&lt;/svg&gt;
      &lt;/button&gt;
      &lt;div class=&quot;tc-date&quot; id=&quot;dateLabel&quot;&gt;2024&lt;/div&gt;

    &lt;div class=&quot;tc-slider-wrap&quot;&gt;
      &lt;input type=&quot;range&quot; class=&quot;tc-slider&quot; id=&quot;frameSlider&quot; min=&quot;0&quot; max=&quot;11&quot; value=&quot;11&quot; step=&quot;1&quot;&gt;

&lt;script src=&quot;https://unpkg.com/leaflet@1.9.4/dist/leaflet.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;

const isEmbedded = window.self !== window.top;
const map = L.map(&#39;map&#39;, {
  zoomControl: false, scrollWheelZoom: !isEmbedded,
  minZoom: 3, maxZoom: 12,
  maxBounds: [[8, -140], [62, -52]], maxBoundsViscosity: 0.85
});
L.control.zoom({ position: &#39;topright&#39; }).addTo(map);
L.tileLayer(&#39;https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png&#39;, {
  subdomains: &#39;abcd&#39;, maxZoom: 19, attribution: &#39;© OpenStreetMap © CARTO&#39;, detectRetina: true
}).addTo(map);

const US_BOUNDS = L.latLngBounds([[24.4, -124.8], [49.4, -66.9]]);
function fitUS(){
  const w = window.innerWidth;
  if (w &gt; 820){ map.fitBounds(US_BOUNDS, { paddingTopLeft: [Math.min(520, w*0.40), 40], paddingBottomRight: [40, 160] }); }
  else { map.fitBounds(US_BOUNDS, { paddingTopLeft: [16, 210], paddingBottomRight: [16, 150] }); }
}

const PLAY_INTERVAL = 120;
const NO_DATA_COLOR = &#39;#d7dbde&#39;;
// combined % of ER Visits (flu+COVID+RSV): summer &lt;1%, winter peaks 5-12%+
const RAMP_STOPS = [[0,&#39;#f3cdc6&#39;],[2.5,&#39;#eea799&#39;],[5,&#39;#e87f6d&#39;],[7.5,&#39;#e4554a&#39;],[10,&#39;#e23b3b&#39;]];
const RAMP_MAX = 10;

let weeks = [];
let states = {};
let currentIdx = 0;
let playing = false;
let playTimer = null;
let stateLayer = null;
let openTooltipLayer = null;

function hexToRgb(h){ h = h.replace(&#39;#&#39;,&#39;&#39;); return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
function rgbToHex(r,g,b){ return &#39;#&#39; + [r,g,b].map(function(x){ const s = Math.max(0, Math.min(255, Math.round(x))).toString(16); return s.length &lt; 2 ? &#39;0&#39;+s : s; }).join(&#39;&#39;); }
function scoreColor(v){
  if (v == null || isNaN(v)) return NO_DATA_COLOR;
  if (v &lt;= 0) return RAMP_STOPS[0][1];
  if (v &gt;= RAMP_MAX) return RAMP_STOPS[RAMP_STOPS.length-1][1];
  let a = RAMP_STOPS[0], b = RAMP_STOPS[RAMP_STOPS.length-1];
  for (let i=0;i&lt;RAMP_STOPS.length-1;i++){ if (v &gt;= RAMP_STOPS[i][0] &amp;&amp; v &lt;= RAMP_STOPS[i+1][0]){ a = RAMP_STOPS[i]; b = RAMP_STOPS[i+1]; break; } }
  const span = (b[0]-a[0]) || 1; const k = (v-a[0])/span;
  const ca = hexToRgb(a[1]), cb = hexToRgb(b[1]);
  return rgbToHex(ca[0]+(cb[0]-ca[0])*k, ca[1]+(cb[1]-ca[1])*k, ca[2]+(cb[2]-ca[2])*k);
}
function combinedFor(name, idx){
  const d = states[name]; if (!d) return null;
  const c = d.covid[idx], f = d.flu[idx], r = d.rsv[idx];
  if (c == null &amp;&amp; f == null &amp;&amp; r == null) return null;
  return (c||0) + (f||0) + (r||0);
}
const MON = [&#39;Jan&#39;,&#39;Feb&#39;,&#39;Mar&#39;,&#39;Apr&#39;,&#39;May&#39;,&#39;Jun&#39;,&#39;Jul&#39;,&#39;Aug&#39;,&#39;Sep&#39;,&#39;Oct&#39;,&#39;Nov&#39;,&#39;Dec&#39;];
function fmtWeek(w){ if(!w) return &#39;&#39;; const p=w.split(&#39;-&#39;); if(p.length&lt;3) return w; return &#39;Week of &#39; + MON[parseInt(p[1],10)-1] + &#39; &#39; + parseInt(p[2],10) + &#39;, &#39; + p[0]; }
function fmtShort(w){ const p=(w||&#39;&#39;).split(&#39;-&#39;); if(p.length&lt;3) return w; return MON[parseInt(p[1],10)-1]+&#39; &#39;+parseInt(p[2],10)+&#39;, &#39;+p[0]; }
function usAvg(idx){ let sum=0,n=0; for(const name in states){ const v=combinedFor(name,idx); if(v!=null){ sum+=v; n++; } } return n? sum/n : null; }
function tooltipText(name, idx){ const v=combinedFor(name,idx); if(v==null) return name; return name + &#39; — &#39; + v.toFixed(1) + &#39;% of ER Visits (&#39; + fmtShort(weeks[idx]) + &#39;)&#39;; }

function recolor(idx){
  if (!weeks.length) return;
  idx = Math.max(0, Math.min(weeks.length-1, idx|0));
  currentIdx = idx;
  document.getElementById(&#39;dateLabel&#39;).textContent = fmtWeek(weeks[idx]);
  document.getElementById(&#39;frameSlider&#39;).value = idx;
  const a = usAvg(idx);
  document.getElementById(&#39;tcCounter&#39;).textContent = (a==null? &#39;—&#39; : &#39;U.S. avg &#39; + a.toFixed(1) + &#39;%&#39;);
  if (!stateLayer) return;
  stateLayer.eachLayer(function(layer){
    const name = layer.feature &amp;&amp; layer.feature.properties &amp;&amp; layer.feature.properties.name;
    const v = combinedFor(name, idx);
    const fill = (v == null) ? NO_DATA_COLOR : scoreColor(v);
    const op  = (v == null) ? 0.35 : 0.82;
    layer.setStyle({ fillColor: fill, fillOpacity: op });
    if (layer === openTooltipLayer){ try { layer.setTooltipContent(tooltipText(name, idx)); } catch(e){} }
  });
}
function play(){
  playing = true;
  document.getElementById(&#39;playIcon&#39;).innerHTML = &#39;&lt;path d=&quot;M6 4h4v16H6zM14 4h4v16h-4z&quot;/&gt;&#39;;
  document.getElementById(&#39;playBtn&#39;).setAttribute(&#39;aria-label&#39;,&#39;Pause&#39;);
  if (currentIdx &gt;= weeks.length - 1) recolor(0);
  playTimer = setTimeout(playLoop, PLAY_INTERVAL);
}
function pause(){
  playing = false;
  document.getElementById(&#39;playIcon&#39;).innerHTML = &#39;&lt;path d=&quot;M8 5v14l11-7z&quot;/&gt;&#39;;
  document.getElementById(&#39;playBtn&#39;).setAttribute(&#39;aria-label&#39;,&#39;Play&#39;);
  if (playTimer){ clearTimeout(playTimer); playTimer = null; }
}
function togglePlay(){ if (playing) pause(); else play(); }
function playLoop(){
  if (!playing) return;
  const next = currentIdx + 1;
  if (next &gt;= weeks.length - 1){ recolor(weeks.length - 1); pause(); return; }
  recolor(next);
  playTimer = setTimeout(playLoop, PLAY_INTERVAL);
}
function setupTicks(){
  const container = document.getElementById(&#39;yearTicks&#39;);
  container.innerHTML = &#39;&#39;;
  if (weeks.length &lt; 2) return;
  const lastIdx = weeks.length - 1; const placed = {};
  for (let i=0;i&lt;weeks.length;i++){
    const parts = weeks[i].split(&#39;-&#39;); const y = parts[0];
    if (parts[1] !== &#39;01&#39;) continue;          // tick only at January weeks -&gt; clean, evenly-spaced years (drops the partial 2023)
    if (placed[y]) continue; placed[y] = true;
    const pct = i / lastIdx * 100;
    const tick = document.createElement(&#39;span&#39;); tick.className = &#39;tc-tick&#39;;
    if (pct &gt;= 98){ tick.style.left=&#39;100%&#39;; tick.style.transform=&#39;translateX(-100%)&#39;; }
    else { tick.style.left = pct + &#39;%&#39;; }
    tick.textContent = y; container.appendChild(tick);
  }
}
async function loadData(){
  try {
    const [geoResp, tsResp] = await Promise.all([
      fetch(&#39;data/virusmap/us_states.geojson&#39;),
      fetch(&#39;data/virusmap/activity.json&#39;)
    ]);
    const geo = await geoResp.json();
    const ts = await tsResp.json();
    weeks = ts.weeks || [];
    states = ts.states || {};
    if (weeks.length){
      currentIdx = weeks.length - 1;
      document.getElementById(&#39;frameSlider&#39;).min = 0;
      document.getElementById(&#39;frameSlider&#39;).max = weeks.length - 1;
      document.getElementById(&#39;frameSlider&#39;).value = currentIdx;
      setupTicks();
    }
    stateLayer = L.geoJSON(geo, {
      filter: function(feature){ const name = feature.properties.name; return name !== &#39;Alaska&#39; &amp;&amp; name !== &#39;Hawaii&#39; &amp;&amp; name !== &#39;Puerto Rico&#39;; },
      style: function(feature){ const v = combinedFor(feature.properties.name, currentIdx); return { fillColor: (v==null?NO_DATA_COLOR:scoreColor(v)), fillOpacity: (v==null?0.35:0.82), weight: 1, color: &#39;#ffffff&#39; }; },
      onEachFeature: function(feature, layer){
        const name = feature.properties.name;
        layer.bindTooltip(tooltipText(name, currentIdx), { sticky: true, direction: &#39;top&#39;, opacity: 1 });
        layer.on(&#39;mouseover&#39;, function(){ try { layer.bringToFront(); } catch(e){} layer.setStyle({ weight: 2, color: &#39;#1f2327&#39; }); openTooltipLayer = layer; });
        layer.on(&#39;mouseout&#39;, function(){ layer.setStyle({ weight: 1, color: &#39;#ffffff&#39; }); if (layer === openTooltipLayer) openTooltipLayer = null; });
      }
    }).addTo(map);
    recolor(currentIdx);
    fitUS();
    if (weeks.length &amp;&amp; !window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;).matches) play();
  } catch (e) { fitUS(); }
}
(function buildSource(){ document.getElementById(&#39;chromeSource&#39;).innerHTML = &#39;CDC — National Syndromic Surveillance Program, ER Visits (updated weekly) · not endorsed by CDC&#39;; })();
loadData();
document.getElementById(&#39;playBtn&#39;).addEventListener(&#39;click&#39;, togglePlay);
document.getElementById(&#39;frameSlider&#39;).addEventListener(&#39;input&#39;, function(e){ if (playing) pause(); recolor(parseInt(e.target.value, 10)); });
document.addEventListener(&#39;keydown&#39;, function(e){
  if (e.target &amp;&amp; e.target.tagName === &#39;INPUT&#39;) return;
  if (!weeks.length) return;
  if (e.code === &#39;Space&#39;){ e.preventDefault(); togglePlay(); }
  if (e.code === &#39;ArrowLeft&#39;){ pause(); recolor(Math.max(0, currentIdx - 1)); }
  if (e.code === &#39;ArrowRight&#39;){ pause(); recolor(Math.min(weeks.length - 1, currentIdx + 1)); }
});
let resizeTimer = null;
window.addEventListener(&#39;resize&#39;, function(){ if (resizeTimer) clearTimeout(resizeTimer); resizeTimer = setTimeout(function(){ map.invalidateSize(); fitUS(); }, 100); });
if (isEmbedded) {
  window.addEventListener(&#39;message&#39;, function(ev){
    const d = ev.data || {};
    if (d.type === &#39;nf-inactive&#39;) { pause(); }
    else if (d.type === &#39;nf-active&#39;) { if (!playing &amp;&amp; !window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;).matches) { recolor(0); play(); } }
  });
}

    background:var(--red);

    transition:transform .22s cubic-bezier(.16,1,.3,1);
  }
  .index-row .idx{
    font-family:var(--mono);
    font-size:12px;
    color:var(--muted);
    width:26px;
    flex:0 0 26px;
    letter-spacing:0.02em;
    transition:color .18s ease;
  }
  .index-row .nm{
    font-family:var(--stack);
    font-size:17px;
    font-weight:500;
    color:var(--ink);
    letter-spacing:-0.005em;
    transition:color .18s ease;
  }
  .index-row:hover{background:rgba(20,24,28,0.035)}
  .index-row:hover .nm{color:var(--red)}
  .index-row[aria-pressed=&quot;true&quot;] .nm{color:var(--red)}
  .index-row[aria-pressed=&quot;true&quot;] .idx{color:var(--red)}
  .index-row[aria-pressed=&quot;true&quot;]::before{transform:translateY(-50%) scaleY(1)}
  .index-row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

  /* RIGHT — WIDE AREA spanning full width */
  .right{
    position:absolute;
    top:0; right:0;
    width:100%;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    z-index:1;
  }
  
  .back-btn{
    position:absolute;
    top:16px;
    right:16px;
    z-index:20;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--hair);
    background:rgba(237,240,242,0.9);
    color:var(--ink);
    font-family:var(--stack);
    font-size:22px;
    font-weight:600;
    line-height:1;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transform:translateY(-4px);
    transition:opacity .3s ease, transform .3s ease, border-color .18s ease, color .18s ease;
    backdrop-filter:blur(4px);
  }
  .back-btn.show{opacity:1;pointer-events:auto;transform:none}
  .back-btn:hover{border-color:var(--red);color:var(--red)}
  .back-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* FIGURE WRAPPER — pins dots to the figure precisely */
  .figure{
    position:relative;
    height:100%;
    aspect-ratio:688/962;
    max-width:100%;
    transform-origin:center center;
    transition:transform .7s cubic-bezier(.16,1,.3,1);
    will-change:transform;
  }
  .figure.zoomed .body-img{
    animation:none;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.012)}
  }

  /* BODY IMG — fills the wrapper exactly */
  .body-img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    pointer-events:none;
    -webkit-user-drag:none;
    user-select:none;
    animation:breathe 4.5s ease-in-out infinite;
  }

  /* GLOW HALO — blooms over the selected organ */
  .glow{
    position:absolute;
    transform:translate(-50%,-50%);
    width:120px; height:120px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(226,59,59,0.28) 0%, rgba(226,59,59,0.08) 45%, transparent 70%);
    opacity:0;
    pointer-events:none;
    transition:opacity .4s ease;
    z-index:1;
  }
  .glow.show{
    opacity:1;
    animation:glowPulse 2.4s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{transform:translate(-50%,-50%) scale(var(--inv,1));opacity:0.85}
    50%{transform:translate(-50%,-50%) scale(calc(var(--inv,1) * 1.15));opacity:1}
  }

  /* HOTSPOTS */
  .hotspots{position:absolute;inset:0;pointer-events:none;z-index:2}
  .hotspot{
    position:absolute;
    transform-origin:center center;
    transform:translate(-50%,-50%) scale(var(--inv,1));
    width:18px;height:18px;
    border:0;background:transparent;
    padding:0;cursor:pointer;
    pointer-events:auto;
    transition:opacity .4s ease, width .3s ease, height .3s ease, transform .7s cubic-bezier(.16,1,.3,1);
  }
  .hotspot::before{
    content:&quot;&quot;;
    position:absolute;inset:0;
    border-radius:50%;
    background:var(--red);
    transform:scale(0.38);
    box-shadow:0 0 0 1px rgba(255,255,255,0.6);
    transition:transform .3s ease, box-shadow .3s ease;
  }
  .hotspot::after{
    content:&quot;&quot;;
    position:absolute;inset:0;
    border-radius:50%;
    border:1.5px solid var(--red);
    animation:pulse 2.4s ease-out infinite;
  }
  @keyframes pulse{
    0%{transform:scale(0.5);opacity:0.9}
    100%{transform:scale(1.9);opacity:0}
  }
  .hotspot:hover::before{transform:scale(0.5)}
  .hotspot .label{
    position:absolute;
    left:50%;top:100%;
    transform:translate(-50%,8px);
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink);
    background:var(--bg);
    padding:3px 7px;
    border:1px solid var(--hair);
    border-radius:4px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .hotspot:hover .label,.hotspot:focus-visible .label{opacity:1}
  .hotspot:focus-visible{outline:none}
  .hotspot:focus-visible::after{border-color:var(--accent);animation:none;transform:scale(1.4);opacity:1}

  /* ACTIVE STATE — solid red dot + white ring */
  .hotspot.active{
    width:26px; height:26px;
    z-index:3;
  }
  .hotspot.active::before{
    transform:scale(1);
    box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--red), 0 0 12px 2px rgba(226,59,59,0.4);
  }
  .hotspot.active::after{
    animation:pulse 1.8s ease-out infinite;
    border-width:2px;
  }
  .hotspot.dimmed{
    opacity:0.35;
  }

  /* MOBILE */
  @media (max-width:880px){
    .grid{
      grid-template-columns:1fr;
      align-items:start;
      min-height:auto;
    }
    .left{
      order:1;
      max-height:none;
      padding:0 clamp(20px,6vw,32px);
      z-index:10;
      background:var(--bg);
      padding-bottom:20px;
    }
    .right{
      position:relative;
      order:2;
      height:clamp(400px, 68vh, 680px);
      max-height:none;
    }
    .card{min-height:180px}
    h1.headline{max-width:none}
    .index-row{padding:11px 6px 11px 14px}
    .index-row .nm{font-size:16px}
  }

  @media (prefers-reduced-motion:reduce){
    .figure{animation:none;transition:transform .2s ease}
    .glow{animation:none;transition:opacity .2s ease}
    .hotspot::after{animation:none}
    .card-inner{transition:opacity .2s ease}
  }

/* wfhealth_landscape_v2 — landscape-phone 2-col */
@media (max-width: 900px) and (orientation: landscape) and (max-height: 560px) {
   .grid{ grid-template-columns:46% 54%; align-items:center; }
   .left{ order:1; display:block; max-height:100vh; overflow-y:auto; padding:10px clamp(16px,4vw,30px); }
   .right{ order:2; position:relative; height:100vh; max-height:100vh; }
   .figure{ height:100%; }
   h1.headline{ font-size:clamp(16px,2.8vw,21px); line-height:1.15; margin:8px 0 8px; max-width:none; }
   .card{ min-height:0; }
   .card-name{ font-size:clamp(16px,2vw,20px); margin-bottom:6px; }
   .card-intro{ font-size:13px; line-height:1.45; margin-bottom:8px; }
   .card-impacts p{ font-size:13px; line-height:1.45; margin-bottom:7px; }
   .index{ margin-top:10px; }
   .index-row{ padding:7px 6px 7px 12px; }
   .index-row .nm{ font-size:14px; }
}

/* wfhealth_phone_v2 — co-locate diagram + chips on phone */
@media (max-width: 880px) and (orientation: portrait) {
  .grid {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
  }
  .left,
  .right {
    display: contents;
  }
  h1.headline {
    order: 1;
    font-size: clamp(20px, 5.2vw, 26px);
    margin: 0;
  }
  .figure {
    order: 2;
    height: 42vh;
    max-height: 42vh;
    width: auto;
    margin: 0 auto;
    position: relative;
  }
  .index {
    order: 3;
    display: flex;
    flex-direction: row;
    overflow-x: auto;
    gap: 8px;
    border-top: none;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 4px;
    width: 100%;
  }
  .card {
    order: 4;
  }
  .index-row {
    flex: 0 0 auto;
    width: auto;
    border: 1px solid var(--hair);
    border-bottom: 1px solid var(--hair);
    border-radius: 999px;
    padding: 8px 14px;
    white-space: nowrap;
  }
  .index-row .nm {
    font-size: 14px;
  }
  .back-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 10;
  }
  .body-img,
  .glow,
  .hotspots {
    max-width: 100%;
  }
  .left,
  .right,
  .grid {
    overflow-x: hidden;
  }
}

&lt;section class=&quot;health&quot; aria-labelledby=&quot;health-headline&quot;&gt;

      &lt;div class=&quot;card&quot;&gt;

          &lt;h2 class=&quot;card-name&quot; id=&quot;cardName&quot; style=&quot;display:none&quot;&gt;&lt;/h2&gt;
          &lt;p class=&quot;card-intro&quot; id=&quot;cardIntro&quot;&gt;&lt;/p&gt;

&lt;script&gt;
(function(){
  const DATA = {
    overview: {
      name: &quot;&quot;,
      intro: &quot;Viruses ride the air we share into the lungs — and the harm does not always stop there. Most infections pass, but some leave lasting marks on the heart, brain, blood, and kidneys.&quot;,
      impacts: [
        {text:&quot;The World Health Organization counts [about a billion flu infections a year] — and that is before colds, RSV, and COVID are added in.&quot;, url:&quot;https://www.who.int/news-room/fact-sheets/detail/influenza-(seasonal)&quot;},
        {text:&quot;The University of Michigan counted [about 500 million colds and other viral infections a year] in the United States alone.&quot;, url:&quot;https://doi.org/10.1001/archinte.163.4.487&quot;}
      ],
      ox:0.5, oy:0.5
    },
    lungs: {
      name:&quot;Lungs&quot;,
      impacts:[
        {text:&quot;A Vanderbilt University study of 251,000 children found that avoiding RSV in the first year [cut the risk of asthma by age 5 by about a quarter] — the virus leaving a lasting mark on the airway.&quot;, url:&quot;https://pubmed.ncbi.nlm.nih.gov/37086744/&quot;},
        {text:&quot;An Italian study of 1,591 of the sickest COVID patients found [88% needed a ventilator] — viral pneumonia flooding the lungs until they cannot take in air.&quot;, url:&quot;https://jamanetwork.com/journals/jama/fullarticle/2764365&quot;},
        {text:&quot;The CDC found that among children who died of the 2009 flu, [about 3 in 10 also had a bacterial pneumonia] — the flu opening the door to a second infection.&quot;, url:&quot;https://www.cdc.gov/mmwr/preview/mmwrhtml/mm5838a4.htm&quot;}
      ],
      ox:0.45, oy:0.25, label:&quot;Lungs&quot;
    },
    heart: {
      name:&quot;Heart&quot;,
      impacts:[
        {text:&quot;A University of Toronto study found the risk of a heart attack [jumps about sixfold in the week after flu] — and stays raised for weeks.&quot;, url:&quot;https://pubmed.ncbi.nlm.nih.gov/29365305/&quot;},
        {text:&quot;A Washington University study of 153,760 people found that a year after COVID, [heart-failure risk rose about 72% and irregular-heartbeat risk about 71%] — long after the infection cleared.&quot;, url:&quot;https://www.nature.com/articles/s41591-022-01689-3&quot;},
        {text:&quot;The London School of Hygiene found a heart attack runs [3 to 8 times more likely in the two weeks after flu] in older adults.&quot;, url:&quot;https://pubmed.ncbi.nlm.nih.gov/15602560/&quot;}
      ],
      ox:0.53, oy:0.29, label:&quot;Heart&quot;
    },
    blood: {
      name:&quot;Blood &amp; Cells&quot;,
      impacts:[
        {text:&quot;A Swedish study of more than a million people found the risk of a dangerous lung clot [rose 33-fold in the month after COVID] — the blood turning thick and sticky.&quot;, url:&quot;https://www.bmj.com/content/377/bmj-2021-069590&quot;},
        {text:&quot;The same Swedish study found a deep-vein clot [nearly five times more likely] in that first month.&quot;, url:&quot;https://www.bmj.com/content/377/bmj-2021-069590&quot;},
        {text:&quot;A Washington University study of 153,760 people found the risk of a [serious blood clot stayed more than doubled] across the year after COVID.&quot;, url:&quot;https://www.nature.com/articles/s41591-022-01689-3&quot;}
      ],
      ox:0.52, oy:0.15, label:&quot;Blood &amp; Cells&quot;
    },
    brain: {
      name:&quot;Brain &amp; Mind&quot;,
      impacts:[
        {text:&quot;An Oxford University study of 1.28 million patients found raised rates of [brain fog, dementia, and psychosis] in the year after COVID.&quot;, url:&quot;https://pubmed.ncbi.nlm.nih.gov/35987197/&quot;},
        {text:&quot;A US Veterans study of over 150,000 people found COVID raised the risk of [depression by about 39% and anxiety by about 35%].&quot;, url:&quot;https://www.bmj.com/content/376/bmj-2021-068993&quot;},
        {text:&quot;The CDC reports that measles inflames the brain in [about 1 in 1,000 children] it infects — and a rarer, delayed form is almost always fatal.&quot;, url:&quot;https://www.cdc.gov/measles/signs-symptoms/index.html&quot;}
      ],
      ox:0.50, oy:0.07, label:&quot;Brain &amp; Mind&quot;
    },
    kidneys: {
      name:&quot;Kidneys&quot;,
      impacts:[
        {text:&quot;A New York study of 5,449 hospitalized COVID patients found [more than a third suffered kidney damage].&quot;, url:&quot;https://pmc.ncbi.nlm.nih.gov/articles/PMC7229463/&quot;},
        {text:&quot;A study across 67 US hospitals found [about 1 in 5 of the sickest COVID patients needed dialysis].&quot;, url:&quot;https://journals.lww.com/jasn/fulltext/2021/01000/aki_treated_with_kidney_replacement_therapy_in.18.aspx&quot;},
        {text:&quot;A Washington University study found COVID survivors carried [about three times the risk of kidney failure] in the year that followed.&quot;, url:&quot;https://journals.lww.com/jasn/fulltext/2021/11000/kidney_outcomes_in_long_covid.15.aspx&quot;}
      ],
      ox:0.43, oy:0.375, label:&quot;Kidneys&quot;
    },
    reproduction: {
      name:&quot;Reproduction&quot;,
      impacts:[
        {text:&quot;A McGill University review of 42 studies found mothers who caught COVID in pregnancy faced [about 82% higher odds of premature birth] — and higher odds of stillbirth.&quot;, url:&quot;https://www.cmaj.ca/content/193/16/E540&quot;},
        {text:&quot;The CDC reports that rubella caught early in pregnancy causes [birth defects in up to 90% of infected infants] — deafness, cataracts, and heart defects.&quot;, url:&quot;https://www.cdc.gov/rubella/pregnancy/index.html&quot;},
        {text:&quot;The CDC finds chickenpox in early pregnancy can [scar the developing baby] — limb, eye, and skin defects in a small share of cases.&quot;, url:&quot;https://www.cdc.gov/chickenpox/hcp/clinical-guidance/index.html&quot;}
      ],
      ox:0.50, oy:0.49, label:&quot;Reproduction&quot;
    },
    immune: {
      name:&quot;Immune System&quot;,
      impacts:[
        {text:&quot;A University of New South Wales review of 122 studies found children who caught an enterovirus had [about ten times the risk of type 1 diabetes] — the virus turning the immune system against the body.&quot;, url:&quot;https://doi.org/10.1136/bmj.d35&quot;},
        {text:&quot;A Harvard study found measles erases [11 to 73% of a child&#39;s existing antibodies] — wiping out immunity the body had already built.&quot;, url:&quot;https://www.science.org/doi/10.1126/science.aay6485&quot;},
        {text:&quot;The CDC found a dangerous whole-body inflammation, MIS-C, struck [about 316 of every million children infected with COVID].&quot;, url:&quot;https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2780861&quot;}
      ],
      ox:0.56, oy:0.17, label:&quot;Immune System&quot;
    }
  };

  const ORDER = [&quot;overview&quot;,&quot;lungs&quot;,&quot;heart&quot;,&quot;blood&quot;,&quot;brain&quot;,&quot;kidneys&quot;,&quot;reproduction&quot;,&quot;immune&quot;];
  const INDEX_LABELS = {
    overview:&quot;Overview&quot;, lungs:&quot;Lungs&quot;, heart:&quot;Heart&quot;, blood:&quot;Blood &amp; Cells&quot;, brain:&quot;Brain &amp; Mind&quot;, kidneys:&quot;Kidneys&quot;, reproduction:&quot;Reproduction&quot;, immune:&quot;Immune System&quot;
  };

  const hotspotsEl = document.getElementById(&#39;hotspots&#39;);
  const backBtn = document.getElementById(&#39;backBtn&#39;);
  const rightEl = document.getElementById(&#39;right&#39;);
  const figure = document.getElementById(&#39;figure&#39;);
  const glow = document.getElementById(&#39;glow&#39;);
  const cardInner = document.getElementById(&#39;cardInner&#39;);
  const cardName = document.getElementById(&#39;cardName&#39;);
  const cardIntro = document.getElementById(&#39;cardIntro&#39;);
  const cardImpacts = document.getElementById(&#39;cardImpacts&#39;);
  const indexEl = document.getElementById(&#39;index&#39;);

  let current = &quot;overview&quot;;
  let targetScale = 1;
  let targetX = 0;
  let targetY = 0;

  function linkify(text, url){
    const m = text.match(/\[(.+?)\]/);
    if(!m) return text;
    const idx = text.indexOf(m[0]);
    const pre = text.slice(0, idx);
    const post = text.slice(idx + m[0].length);
    return pre + &#39;&lt;a href=&quot;&#39;+url+&#39;&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;&#39;+m[1]+&#39;&lt;/a&gt;&#39; + post;
  }

  function renderCard(key){
    const d = DATA[key];
    if(key === &quot;overview&quot;){
      cardName.style.display = &#39;none&#39;;
      cardName.textContent = &#39;&#39;;
    } else {
      cardName.style.display = &#39;&#39;;
      cardName.textContent = d.name;
    }
    if(d.intro){
      cardIntro.style.display = &#39;&#39;;
      cardIntro.textContent = d.intro;
    } else {
      cardIntro.style.display = &#39;none&#39;;
    }
    cardImpacts.innerHTML = d.impacts.map(im =&gt;
      &#39;&lt;p&gt;&#39;+linkify(im.text, im.url)+&#39;&lt;/p&gt;&#39;
    ).join(&#39;&#39;);
  }

  function applyTransform() {
    figure.style.transform = `translate(${targetX}px, ${targetY}px) scale(${targetScale})`;
  }

  // Horizontal offset so the resting figure lines up with the particle on the
  // sibling hero page (centered in the right 54% column of a 46/54 grid with
  // clamp(24px,6vw,96px) padding + clamp(32px,5vw,80px) gap). 0 when stacked.
  function restOffsetX(){
    const aw = rightEl.clientWidth;
    const vw = window.innerWidth;
    if (vw &lt;= 880) return 0;
    const padX = Math.min(96, Math.max(24, 0.06*vw));
    const gap  = Math.min(80, Math.max(32, 0.05*vw));
    const innerW = vw - 2*padX - gap;
    const anchorX = padX + innerW*0.46 + gap + innerW*0.54/2;
    return anchorX - aw/2;
  }

  function setHighlight(key){
    if(key === &quot;overview&quot;){
      backBtn.classList.remove(&#39;show&#39;);
      glow.classList.remove(&#39;show&#39;);
      figure.classList.remove(&#39;zoomed&#39;);
      targetScale = 1;
      targetX = restOffsetX();
      targetY = 0;
      figure.style.setProperty(&#39;--inv&#39;, &#39;1&#39;);
      applyTransform();
      hotspotsEl.querySelectorAll(&#39;.hotspot&#39;).forEach(h=&gt;{
        h.classList.remove(&#39;active&#39;,&#39;dimmed&#39;);
      });
    } else {
      const d = DATA[key];
      backBtn.classList.add(&#39;show&#39;);
      glow.style.left = (d.ox*100)+&#39;%&#39;;
      glow.style.top = (d.oy*100)+&#39;%&#39;;
      glow.classList.add(&#39;show&#39;);
      figure.classList.add(&#39;zoomed&#39;);
      
      // Compute zoom: scale up to 2.5, but clamp so figure width never exceeds area width
      const areaW = rightEl.clientWidth;
      const areaH = rightEl.clientHeight;
      const figW = figure.offsetWidth || (areaH * 688 / 962);

      let scale = 0.86 / Math.max(d.oy, 0.40); scale = Math.min(2.5, Math.max(1.5, scale));
      const maxScale = areaW / figW;
      if (scale &gt; maxScale) scale = maxScale;
      if (scale &lt; 1) scale = 1; // never shrink

      targetScale = scale;
      // Counter-scale the dots + labels so they keep a constant size when zoomed
      figure.style.setProperty(&#39;--inv&#39;, (1/scale).toFixed(4));
      
      // The organ is a fraction (ox,oy) of the figure box; the figure is flex-
      // centered in the area. Use the UNSCALED box size (offset*, transform-free)
      // so this is correct even when going organ -&gt; organ. Place every organ on
      // the SAME aligned column as the resting figure (and the hero particle),
      // vertically centered, so the figure never jumps sideways between clicks.
      const fW = figure.offsetWidth;
      const fH = figure.offsetHeight;
      targetX = restOffsetX() - (d.ox - 0.5) * fW * scale;
      targetY = Math.max(-Math.max(0,(fH*scale-areaH)/2), Math.min(Math.max(0,(fH*scale-areaH)/2), (0.5 - d.oy) * fH * scale));
      
      applyTransform();
      
      hotspotsEl.querySelectorAll(&#39;.hotspot&#39;).forEach(h=&gt;{

    &lt;p class=&quot;body-text&quot;&gt;French researchers pushed an airborne virus through a real air-handling filter — it trapped most of it, but &lt;a href=&quot;https://pmc.ncbi.nlm.nih.gov/articles/PMC7087798/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;about 500 infectious particles still passed through&lt;/a&gt;.&lt;/p&gt;
    &lt;p class=&quot;body-text&quot;&gt;In another test, virus on an air-handling filter was &lt;a href=&quot;https://pubmed.ncbi.nlm.nih.gov/28660425/&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot;&gt;still infectious after ten hours of running air&lt;/a&gt; — the airstream does not clear it out.&lt;/p&gt;

(function(){
  const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
  const videoStack = document.getElementById(&#x27;videoStack&#x27;);
  const videoA = document.getElementById(&#x27;videoA&#x27;);
  const bigNumber = document.getElementById(&#x27;big-number&#x27;);
  const TARGET = 21;

  if (reducedMotion) { videoStack.classList.add(&#x27;reduced&#x27;); }

  const isEmbedded = window.self !== window.top;

  function startFilter(){
    if (reducedMotion) return;
    try { videoA.currentTime = 0; videoA.play(); } catch(e){}
    bigNumber.textContent = &#x27;0 days&#x27;;
    animateNumber();
  }
  function stopFilter(){ try { videoA.pause(); } catch(e){} }

  function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }

  function animateNumber(){
    const DURATION = 1600;
    const DELAY = 300;
    const start = performance.now() + DELAY;
    function step(now){
      if (now &lt; start){
        bigNumber.textContent = &#x27;0 days&#x27;;
        requestAnimationFrame(step);
        return;
      }
      const p = Math.min(1, (now - start) / DURATION);
      const e = easeOutCubic(p);
      const n = Math.round(e * TARGET);
      bigNumber.textContent = n + &#x27; days&#x27;;
      if (p &lt; 1) requestAnimationFrame(step);
      else bigNumber.textContent = TARGET + &#x27; days&#x27;;
    }
    requestAnimationFrame(step);
  }

  if (reducedMotion) {
    bigNumber.textContent = TARGET + &#x27; days&#x27;;

    bigNumber.textContent = &#x27;0 days&#x27;;

        if (e.data.type === &#x27;nf-active&#x27;) startFilter();

      const io = new IntersectionObserver((entries, observer) =&gt; {
        entries.forEach(entry =&gt; {
          if (entry.isIntersecting) { startFilter(); observer.disconnect(); }
        });
      }, { threshold: 0.35 });
      io.observe(document.getElementById(&#x27;filter&#x27;));
    }
  }
})();

&lt;script&gt;
/* Virus particle system — window.nfVirus = { start(), stop(), stopSpawning() }.
   Each particle targets a random point inside the slab quad, split 50/50 into
   two equal-area halves, so virus lands evenly and none fall off. Captured (blue flash)
   on the NanoFlashing half, settle on the conventional half. */
window.nfVirus = (function () {
  let container = null, spores = [], running = false, spawning = false, draining = false, rafId = null;
  let lastTime = 0, spawnAccum = 0, nextSpawnInterval = 200, rect = { width: 0, height: 0 }, resizeHandler = null;
  const TL=[0.411,0.210], TR=[0.724,0.256], BR=[0.631,0.726], BL=[0.309,0.625];
  const BND_M=-0.203, BND_B=0.600;
  function boundaryFx(fy){ return BND_M*fy + BND_B; }
  function lerp2(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t]; }
  function splitOn(A,B){ const dx=B[0]-A[0], dy=B[1]-A[1]; const u=(BND_M*A[1]+BND_B-A[0])/(dx-BND_M*dy); return [A[0]+dx*u, A[1]+dy*u]; }
  const TS=splitOn(TL,TR), BS=splitOn(BL,BR);
  const BLUEQ=[TL,TS,BS,BL], WHITEQ=[TS,TR,BR,BS];
  function biln(q,u,v){ const top=lerp2(q[0],q[1],u), bot=lerp2(q[3],q[2],u); return lerp2(top,bot,v); }
  function readRect(){ if(!container) return; const r=container.getBoundingClientRect(); rect.width=r.width||window.innerWidth; rect.height=r.height||window.innerHeight; }
  function coverMap(){ const s=Math.max(rect.width/1280, rect.height/720); return { s:s, offX:(rect.width-1280*s)/2, offY:(rect.height-720*s)/2 }; }
  function createSpore(){
    if(rect.width===0||rect.height===0) return;
    const m=coverMap();
    const el=document.createElement(&#39;div&#39;); el.className=&#39;spore&#39;;
    const size=1.5+Math.random()*2; el.style.width=size+&#39;px&#39;; el.style.height=size+&#39;px&#39;;
    const onBlue=Math.random()&lt;0.5;
    const t=biln(onBlue?BLUEQ:WHITEQ, Math.random(), Math.random());
    const tx=m.offX+t[0]*1280*m.s;
    const fall=0.10+Math.random()*0.22;
    const sp={ el:el, tx:tx, x:tx, hs:size/2, blue:(t[0] &lt; boundaryFx(t[1]) - 0.010), targetY:m.offY+t[1]*720*m.s, y:m.offY+(t[1]-fall)*720*m.s,
      vy:40+Math.random()*50, wobbleAmp:4+Math.random()*6, wobbleFreq:0.4+Math.random()*0.7, wobblePhase:Math.random()*Math.PI*2, age:0, done:false };
    el.style.transform=&#39;translate(&#39;+(tx-sp.hs)+&#39;px,&#39;+(sp.y-sp.hs)+&#39;px)&#39;;
    container.appendChild(el); spores.push(sp);
  }
  function update(dt){
    if(spawning){ spawnAccum+=dt; if(spawnAccum&gt;=nextSpawnInterval){ spawnAccum=0; nextSpawnInterval=40+Math.random()*40; const cap=window.innerWidth&gt;880?600:220; const deficit=cap-spores.length; const count=deficit&gt;0?Math.min(deficit,18):6; for(let i=0;i&lt;count&amp;&amp;spores.length&lt;cap;i++) createSpore(); } }
    for(let i=spores.length-1;i&gt;=0;i--){
      const s=spores[i]; if(s.done) continue;
      s.age+=dt; const sec=dt/1000; s.y+=s.vy*sec;
      s.x=s.tx+Math.sin((s.age/1000)*Math.PI*2*s.wobbleFreq+s.wobblePhase)*s.wobbleAmp;
      if(s.y&gt;=s.targetY){ s.done=true; s.el.style.transform=&#39;translate(&#39;+(s.x-s.hs)+&#39;px,&#39;+(s.targetY-s.hs)+&#39;px)&#39;; s.el.classList.add(s.blue?&#39;captured&#39;:&#39;settled&#39;); const e=s.el; setTimeout(function(){ if(e&amp;&amp;e.parentNode) e.parentNode.removeChild(e); }, s.blue?640:2200); spores.splice(i,1); continue; }
      if(draining){ s.drainT=(s.drainT||0)+dt; if(s.drainT&gt;=520){ s.done=true; if(s.el&amp;&amp;s.el.parentNode) s.el.parentNode.removeChild(s.el); spores.splice(i,1); continue; } }
      s.el.style.transform=&#39;translate(&#39;+(s.x-s.hs)+&#39;px,&#39;+(s.y-s.hs)+&#39;px)&#39;;
      let op=s.age&lt;250?(s.age/250)*0.48:0.48; if(draining) op*=Math.max(0,1-s.drainT/520); s.el.style.opacity=op;
    }
  }
  function loop(time){ if(!running) return; if(!lastTime) lastTime=time; let dt=time-lastTime; lastTime=time; if(dt&gt;100) dt=100; update(dt); if(!spawning&amp;&amp;spores.length===0){ running=false; rafId=null; return; } rafId=requestAnimationFrame(loop); }
  function clearAll(){ spores.forEach(function(s){ if(s.el&amp;&amp;s.el.parentNode) s.el.parentNode.removeChild(s.el); }); spores=[]; }
  function begin(){ running=true; spawning=true; draining=false; lastTime=0; spawnAccum=0; nextSpawnInterval=200; resizeHandler=function(){ readRect(); }; window.addEventListener(&#39;resize&#39;,resizeHandler); rafId=requestAnimationFrame(loop); }
  function stopSpawning(){ spawning=false; draining=true; }
  function start(){ if(running) return; container=document.querySelector(&#39;.anno&#39;); if(!container) return; if(window.matchMedia&amp;&amp;window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;).matches) return; clearAll(); readRect(); if(rect.width===0||rect.height===0){ requestAnimationFrame(function(){ readRect(); if(rect.width===0||rect.height===0) return; begin(); }); return; } begin(); }
  function stop(){ running=false; spawning=false; if(rafId) cancelAnimationFrame(rafId); rafId=null; if(resizeHandler){ window.removeEventListener(&#39;resize&#39;,resizeHandler); resizeHandler=null; } clearAll(); }
  return { start:start, stop:stop, stopSpawning:stopSpawning, count:function(){ return spores.length; } };
})();

(function(){
  const reducedMotion = window.matchMedia(&#39;(prefers-reduced-motion: reduce)&#39;).matches;
  const videoStack = document.getElementById(&#39;videoStack&#39;);
  const videoA = document.getElementById(&#39;videoA&#39;);
  const bigNumber = document.getElementById(&#39;bigNumber&#39;);
  const isEmbedded = window.self !== window.top;
  if (reducedMotion) videoStack.classList.add(&#39;reduced&#39;);

  const ANCHOR_NF = 0.405, ANCHOR_CV = 0.597, ANCHOR_TOP = 0.524;
  function positionAnno(){
    const nf = document.querySelector(&#39;.anno-lbl-nf&#39;);
    const cv = document.querySelector(&#39;.anno-lbl-cv&#39;);
    const top = document.querySelector(&#39;.anno-top&#39;);
    if (window.innerWidth &lt;= 880){
      if (nf) nf.style.left = &#39;&#39;;
      if (cv) cv.style.left = &#39;&#39;;
      if (top) top.style.left = &#39;&#39;;
      return;
    }
    const W = videoStack.clientWidth, H = videoStack.clientHeight;
    if (!W || !H) return;
    const s = Math.max(W/1280, H/720);
    const offX = (W - 1280*s)/2;
    const pct = fx =&gt; ((offX + fx*1280*s)/W*100).toFixed(2) + &#39;%&#39;;
    if (nf) nf.style.left = pct(ANCHOR_NF);
    if (cv) cv.style.left = pct(ANCHOR_CV);
    if (top) top.style.left = pct(ANCHOR_TOP);
  }
  positionAnno();
  window.addEventListener(&#39;resize&#39;, positionAnno);
  window.addEventListener(&#39;load&#39;, positionAnno);

  const GROW_END = 5.0;
  function onGrow(){
    if (videoA.currentTime &gt;= GROW_END){
      videoA.removeEventListener(&#39;timeupdate&#39;, onGrow);
      if (window.nfVirus) window.nfVirus.stopSpawning();
    }
  }
  function startFilter(){
    if (reducedMotion) return;
    try { videoA.currentTime = 0; videoA.play(); } catch(e){}
    bigNumber.textContent = &#39;0%&#39;;
    animateNumber();
    positionAnno();
    videoA.removeEventListener(&#39;timeupdate&#39;, onGrow);
    videoA.addEventListener(&#39;timeupdate&#39;, onGrow);
    if (window.nfVirus) window.nfVirus.start();
  }
  function stopFilter(){ try { videoA.pause(); } catch(e){} videoA.removeEventListener(&#39;timeupdate&#39;, onGrow); if (window.nfVirus) window.nfVirus.stop(); }

  function easeOutCubic(x){ return 1 - Math.pow(1 - x, 3); }
  function animateNumber(){
    const DURATION = 1600, TARGET = 99.6, start = performance.now();
    function step(now){
      const p = Math.min(1, (now - start) / DURATION);
      const n = easeOutCubic(p) * TARGET;
      bigNumber.textContent = n.toFixed(1) + &#39;%&#39;;
      if (p &lt; 1) requestAnimationFrame(step); else bigNumber.textContent = &#39;99.6%&#39;;
    }
    requestAnimationFrame(step);
  }

  if (reducedMotion) {
    bigNumber.textContent = &#39;99.6%&#39;;
  } else {
    bigNumber.textContent = &#39;0%&#39;;
    if (isEmbedded) {
      window.addEventListener(&#39;message&#39;, function(e){
        if (!e.data) return;
        if (e.data.type === &#39;nf-active&#39;) startFilter();
        else if (e.data.type === &#39;nf-inactive&#39;) stopFilter();
      });
    } else {
      const io = new IntersectionObserver((entries, observer) =&gt; {
        entries.forEach(entry =&gt; { if (entry.isIntersecting) { startFilter(); observer.disconnect(); } });
      }, { threshold: 0.35 });
      io.observe(document.getElementById(&#39;section&#39;));
    }
  }
})();

(function(){
  var deck=document.getElementById('deck');
  var frames=[].slice.call(document.querySelectorAll('.screen iframe'));
  var dotsWrap=document.getElementById('dots'), dots=[];
  var N=frames.length, idx=0, locked=false;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DECK=matchMedia('(min-width:900px) and (min-height:600px) and (pointer:fine)');
  var isDeck=null;
  var observers=[], intervalTimers=[];

  // Tell each iframe whether its section is active, so per-section media
  // (e.g. the filter discharge video) plays FROM THE START only on arrival.
  var flowIO=null;
  function signalActive(a){
    for(var i=0;i<frames.length;i++){
      try{ if(frames[i].contentWindow) frames[i].contentWindow.postMessage({type: i===a?'nf-active':'nf-inactive'}, '*'); }catch(e){}
    }
  }

  // Cache-bust so refresh always shows the latest
  var __t=Date.now();
  frames.forEach(function(f,i){
    f.addEventListener('load', function(){
      try{ if(f.contentWindow && isDeck) f.contentWindow.postMessage({type: i===idx?'nf-active':'nf-inactive'}, '*'); }catch(e){}
    });
  });

  function setH(){
    document.documentElement.style.setProperty('--screenH', window.innerHeight+'px');
    if(isDeck){
      deck.classList.remove('smooth');
      deck.style.transform='translateY(calc(-1 * '+idx+' * var(--screenH)))';
      requestAnimationFrame(function(){ deck.classList.add('smooth'); });
    }
  }

  function measureFrame(f){
    try{
      var d=f.contentDocument;
      if(!d || !d.documentElement) return;
      var h=Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0);
      if(!h || h<1) return;
      var minH=window.innerHeight;
      if(h<minH) h=minH;
      f.style.height=h+'px';
    }catch(e){}
  }

  function setupObserver(f){
    try{
      var d=f.contentDocument;
      if(!d || !d.documentElement) return;
      var ro=new ResizeObserver(function(){ measureFrame(f); });
      ro.observe(d.documentElement);
      if(d.body) ro.observe(d.body);
      observers.push(ro);
    }catch(e){}
  }

  function setupInterval(f){
    var start=Date.now();
    var timer=setInterval(function(){
      measureFrame(f);
      if(Date.now()-start>10000 && intervalTimers.indexOf(timer)>-1){
        clearInterval(timer);
        intervalTimers.splice(intervalTimers.indexOf(timer), 1);
      }
    }, 800);
    intervalTimers.push(timer);
  }

  function apply(){
    if(!isDeck) return;
    deck.classList.add('smooth');
    deck.style.transform='translateY(calc(-1 * '+idx+' * var(--screenH)))';
    for(var i=0;i<N;i++) dots[i].className = i===idx?'on':'';
    document.body.classList.toggle('compact-logo', idx!==0);
    signalActive(idx);
  }

  function go(i){
    if(!isDeck) return;
    i=Math.max(0,Math.min(N-1,i));
    if(i===idx) return;
    idx=i; apply();
    locked=true; setTimeout(function(){locked=false;}, 780);
  }

  function wheel(e){
    if(!isDeck) return;
    if(locked){ e.preventDefault(); return; }
    if(e.deltaY>16){ e.preventDefault(); go(idx+1); }
    else if(e.deltaY<-16){ e.preventDefault(); go(idx-1); }
  }

  var ty=null;
  function ts(e){ if(!isDeck) return; ty=(e.touches?e.touches[0]:e).clientY; }
  function te(e){
    if(!isDeck) return;
    if(ty==null) return;
    var y=(e.changedTouches?e.changedTouches[0]:e).clientY, dy=ty-y; ty=null;
    if(locked) return;
    if(dy>44) go(idx+1);
    else if(dy<-44) go(idx-1);
  }

  function keydown(e){
    if(!isDeck) return;
    if(locked) return;
    if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(idx+1); }
    else if(e.key==='ArrowUp'||e.key==='PageUp'){ e.preventDefault(); go(idx-1); }
  }

  function attachFrameEvents(f){
    try{
      var w=f.contentWindow; if(!w) return;
      w.addEventListener('wheel',wheel,{passive:false});
      w.addEventListener('touchstart',ts,{passive:true});
      w.addEventListener('touchend',te,{passive:true});
    }catch(e){}
  }

  function clearFlow(){
    if(flowIO){ try{flowIO.disconnect();}catch(e){} flowIO=null; }
    observers.forEach(function(ro){ try{ro.disconnect();}catch(e){} });
    observers=[];
    intervalTimers.forEach(function(t){ clearInterval(t); });
    intervalTimers=[];
    frames.forEach(function(f){
      f.style.height='';
      try{
        var w=f.contentWindow;
        if(w){
          w.removeEventListener('wheel',wheel);
          w.removeEventListener('touchstart',ts);
          w.removeEventListener('touchend',te);
        }
      }catch(e){}
    });
  }

  function setupFlow(){
    frames.forEach(function(f){
      measureFrame(f);
      setupObserver(f);
      setupInterval(f);
    });
    // In flow mode, activate a section's media when it's centred in the viewport.
    if('IntersectionObserver' in window){
      flowIO = new IntersectionObserver(function(entries){
        entries.forEach(function(en){ if(en.isIntersecting){ var fi=frames.indexOf(en.target); if(fi>=0) signalActive(fi); } });
      }, {rootMargin:'-45% 0px -45% 0px', threshold:0});
      frames.forEach(function(f){ flowIO.observe(f); });
    }
  }

  function applyMode(){
    var newIsDeck = DECK.matches && !reduce;
    if(newIsDeck===isDeck && isDeck){
      setH(); return;
    }
    if(newIsDeck===isDeck && !isDeck){
      frames.forEach(function(f){ measureFrame(f); });
      return;
    }

    isDeck=newIsDeck;

    if(isDeck){
      document.documentElement.classList.remove('flow-mode');
      document.documentElement.classList.add('deck-mode');
      document.body.classList.remove('flow-mode');
      document.body.classList.add('deck-mode');
      clearFlow();
      window.scrollTo(0,0);
      deck.style.transform='';
      setH();
      apply();
      frames.forEach(attachFrameEvents);
    } else {
      document.documentElement.classList.remove('deck-mode');
      document.documentElement.classList.add('flow-mode');
      document.body.classList.remove('deck-mode');
      document.body.classList.add('flow-mode');
      deck.classList.remove('smooth');
      deck.style.transform='none';
      window.scrollTo(0,0);
      setupFlow();
    }
  }

  // Build progress dots
  for(var i=0;i<N;i++){
    (function(i){
      var b=document.createElement('button');
      b.setAttribute('aria-label','Go to section '+(i+1));
      b.addEventListener('click',function(){go(i);});
      dotsWrap.appendChild(b); dots.push(b);
    })(i);
  }

  // Global listeners
  window.addEventListener('wheel',wheel,{passive:false});
  window.addEventListener('touchstart',ts,{passive:true});
  window.addEventListener('touchend',te,{passive:true});
  window.addEventListener('keydown',keydown);
  window.addEventListener('resize', applyMode);
  window.addEventListener('orientationchange', applyMode);

  // Iframe load listeners
  frames.forEach(function(f){
    f.addEventListener('load', function(){
      if(isDeck){
        attachFrameEvents(f);
      } else {
        measureFrame(f);
        setupObserver(f);
        setupInterval(f);
      }

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NanoFlashing — Aperture Iris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#edf0f2;
  --ink:#1f2327;
  --headline-ink:#1a1a1a;
  --muted:#8a9095;
  --accent:#1466e6;
  --tip:#5aa0ff;
  --red:#e23b3b;
  --hair:rgba(20,24,28,0.08);
  --stack:-apple-system, system-ui, 'Inter', 'Space Grotesk', sans-serif;
  --mono:'Space Mono', ui-monospace, monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--stack);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  width:100%;
  height:100%;
  overflow:hidden;
}
#stage{
  position:fixed;
  inset:0;
  background:var(--bg);
  overflow:hidden;
}

/* ---- ROOM layer (back) ---- */
.room{
  position:absolute;
  inset:0;
  z-index:1;
  opacity:0;
  background-image:url('assets/Background_c2.png');
  background-size:cover;
  background-position:center;
  will-change:opacity;
  -webkit-mask-image:none;
  mask-image:none;
}
#dust-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  opacity:0;
  will-change:opacity;
}
.room-headline{
  position:absolute;
  left:clamp(28px, 4.5vw, 72px);
  bottom:clamp(40px, 7vh, 92px);
  max-width:62vw;
  font-family:var(--stack);
  font-size:clamp(22px, 3.4vw, 46px);
  line-height:1.18;
  font-weight:500;
  letter-spacing:-0.01em;
  color:var(--headline-ink);
  pointer-events:none;
  will-change:opacity;
  z-index:4;
}
.room-headline .charge{ color:var(--red); font-weight:600; }
.room-logo{
  position:absolute;
  left:clamp(22px, 3vw, 40px);
  top:clamp(20px, 3vh, 34px);
  height:34px;
  width:auto;
  pointer-events:none;
  will-change:opacity;
  z-index:4;
}
.room-logo img{ height:100%; width:auto; display:block; }

/* ---- Three.js canvas (middle) ---- */
#wave-canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  pointer-events:none;
  display:block;
  -webkit-mask-image:none;
  mask-image:none;
}

/* ---- HERO DOM layer (front) ---- */
.hero{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  will-change:opacity;
  -webkit-mask-image:none;
  mask-image:none;
}
.hero-logo{
  position:absolute;
  left:clamp(28px, 4.5vw, 72px);
  top:clamp(28px, 5vh, 56px);
  height:clamp(56px, 7vw, 96px);
  width:auto;
  overflow:hidden;
  display:flex;
  align-items:center;
}
.hero-logo img{ height:100%; width:auto; display:block; }
.hero-tag{
  position:absolute;
  left:clamp(28px, 4.5vw, 72px);
  top:calc(clamp(28px, 5vh, 56px) + clamp(56px, 7vw, 96px) + 18px);
  font-family:var(--stack);
  font-size:clamp(15px, 1.25vw, 19px);
  line-height:1.5;
  color:#3a4046;
  max-width:46ch;
  letter-spacing:0.002em;
}
.hero-tag .hl{ color:var(--accent); font-weight:600; }

/* ---- aperture lens outline (crisp shutter ring) ---- */
.lens-outline{
  position:absolute;
  z-index:4;
  border:2px solid #1466e6;
  border-radius:50%;
  pointer-events:none;
  box-shadow:0 0 14px rgba(20,102,230,0.35), 0 0 5px rgba(20,102,230,0.5);
  transform:translateZ(0);
  will-change:opacity,width,height,left,top;
  opacity:0;
}

/* ---- concept label ---- */
.concept-label{
  position:absolute;
  right:clamp(18px, 3vw, 36px);
  bottom:clamp(16px, 3vh, 28px);
  z-index:5;
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:0.06em;
  color:var(--muted);
  pointer-events:none;
  white-space:nowrap;
}
.concept-label .p-val{ color:var(--accent); }

@media (max-width: 720px){
  .room-headline{ font-size:clamp(20px, 6vw, 30px); max-width:84vw; }
  .hero-logo{ height:clamp(44px, 12vw, 64px); }
  .hero-tag{ font-size:14px; max-width:80vw; }
}
</style>
</head>
<body>

<div id="stage">

  <!-- 1. ROOM layer -->
  <div class="room" id="room">
    <canvas id="dust-canvas"></canvas>
    <div class="room-logo"><img src="assets/brand/nanoflashing_black.svg" alt="NanoFlashing"></div>
    <div class="room-headline">Most harmful pollutants carry an electric <span class="charge">charge</span></div>
  </div>

  <!-- 2. Three.js "+" wave surface -->
  <canvas id="wave-canvas"></canvas>

  <!-- 3. HERO DOM layer -->
  <div class="hero" id="hero">
    <div class="hero-logo"><img src="assets/brand/nanoflashing_black.svg" alt="NanoFlashing"></div>
    <div class="hero-tag">A <span class="hl">permanent positive charge</span>, engineered into the material.</div>
  </div>

  <!-- concept label -->
  <div class="concept-label">Aperture Iris · p=<span class="p-val" id="p-val">0.00</span></div>

</div>

<script type="module">
import * as THREE from 'three';

(function () {
  'use strict';

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('wave-canvas');
  const roomEl = document.getElementById('room');
  const dustCanvas = document.getElementById('dust-canvas');
  const heroEl = document.getElementById('hero');
  const pValEl = document.getElementById('p-val');

  const reduced = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) || false;

  function smoothstep(a, b, x) {
    x = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return x * x * (3 - 2 * x);
  }

  /* ===== Renderer ===== */
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setClearColor(0xedf0f2, 0);
  const dprCap = 2;

  /* ===== Scene & Camera ===== */
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 200);
  const CAM_BASE = new THREE.Vector3(0, 15, 26);
  const CAM_TARGET = new THREE.Vector3(0, -4, -8);
  camera.position.copy(CAM_BASE);
  camera.lookAt(CAM_TARGET);

  /* ===== Surface constants ===== */
  const GRID_X = 150;
  const GRID_Z = 55;
  const SURF_W = 150;
  const SURF_D = 36;
  const Z_FAR = -11;
  const SURF_COUNT = GRID_X * GRID_Z;

  function waveHeight(x, z, t) {
    var dome = -0.00044 * x * x;
    var zNorm = (z - Z_FAR) / SURF_D;
    var farRise = (1.0 - zNorm) * 3.0;
    var und1 = Math.sin(x * 0.06 + t * 0.393) * 0.8;
    var und2 = Math.sin(z * 0.04 + t * 0.314 + 1.5) * 0.8;
    return dome + farRise + und1 + und2;
  }

  /* ===== Surface geometry ===== */
  const surfaceGeo = new THREE.BufferGeometry();
  const sPositions = new Float32Array(SURF_COUNT * 3);
  const sBoosts = new Float32Array(SURF_COUNT);
  const sRows = new Float32Array(SURF_COUNT);
  const sAngles = new Float32Array(SURF_COUNT);

  for (let ix = 0; ix < GRID_X; ix++) {
    for (let iz = 0; iz < GRID_Z; iz++) {
      const i = ix * GRID_Z + iz;
      sPositions[i * 3] = (ix / (GRID_X - 1) - 0.5) * SURF_W;
      sPositions[i * 3 + 1] = 0;
      sPositions[i * 3 + 2] = Z_FAR + (iz / (GRID_Z - 1)) * SURF_D;
      sBoosts[i] = 0;
      sRows[i] = iz / (GRID_Z - 1);
      sAngles[i] = (i * 2.399963233) % (Math.PI * 2);
    }
  }

  const basePositions = new Float32Array(sPositions);

  surfaceGeo.setAttribute('position', new THREE.BufferAttribute(sPositions, 3));
  surfaceGeo.setAttribute('aBoost', new THREE.BufferAttribute(sBoosts, 1));
  surfaceGeo.setAttribute('aRow', new THREE.BufferAttribute(sRows, 1));
  surfaceGeo.setAttribute('aAngle', new THREE.BufferAttribute(sAngles, 1));

  /* ===== Surface material ===== */
  const surfaceMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPixelRatio: { value: renderer.getPixelRatio() },
      uResolution: { value: new THREE.Vector2(1, 1) },
      uSize: { value: 2.7 },
      uBaseColor: { value: new THREE.Color(0x96baf0) },
      uChargeColor: { value: new THREE.Color(0x1466e6) },
      uTipColor: { value: new THREE.Color(0x5aa0ff) },
      uFogColor: { value: new THREE.Color(0xedf0f2) },
      uFogNear: { value: 52 },
      uFogFar: { value: 128 },
      uMouse: { value: new THREE.Vector2(9999, 9999) },
      uMouseStr: { value: 0 },
      uFade: { value: 1.0 },
      uConverge: { value: 0.0 },
      uRingRadius: { value: 5.0 },
      uRingZ: { value: -39.0 },
      uRotPhase: { value: 0.0 },
    },
    vertexShader: `
      attribute float aBoost;
      attribute float aRow;
      attribute float aAngle;
      uniform float uTime;
      uniform float uPixelRatio;
      uniform vec2 uResolution;
      uniform float uSize;
      uniform vec2 uMouse;
      uniform float uMouseStr;
      uniform float uConverge;
      uniform float uRingRadius;
      uniform float uRingZ;
      uniform float uRotPhase;
      varying float vBoost;
      varying float vDist;
      varying float vHeight;
      varying float vMouse;
      varying float vRow;
      varying float vWorldX;
      varying vec2 vArmX;
      varying vec2 vArmZ;
      varying float vConverge;

      float waveHeight(float x, float z, float t) {
        float dome = -0.00044 * x * x;
        float zNorm = (z + 11.0) / 36.0;
        float farRise = (1.0 - zNorm) * 3.0;
        float und1 = sin(x * 0.06 + t * 0.393) * 0.8;
        float und2 = sin(z * 0.04 + t * 0.314 + 1.5) * 0.8;
        return dome + farRise + und1 + und2;
      }

      float cursorBump(vec2 xz) {
        vec2 d = xz - uMouse;
        return uMouseStr * 2.8 * exp(-dot(d, d) / 140.0);
      }

      void main() {
        vec3 pos = position;
        float cb = cursorBump(pos.xz);
        pos.y = waveHeight(pos.x, pos.z, uTime) + cb;

        vMouse = clamp(cb / 2.8, 0.0, 1.0);
        vHeight = pos.y;
        vRow = aRow;
        vWorldX = pos.x;
        vBoost = aBoost;
        vConverge = uConverge;

        vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
        vec4 clip0 = projectionMatrix * mvPos;

        float e = 0.7;
        vec3 pX = vec3(pos.x + e, waveHeight(pos.x + e, pos.z, uTime) + cursorBump(vec2(pos.x + e, pos.z)), pos.z);
        vec3 pZ = vec3(pos.x, waveHeight(pos.x, pos.z + e, uTime) + cursorBump(vec2(pos.x, pos.z + e)), pos.z + e);
        vec4 clipX = projectionMatrix * modelViewMatrix * vec4(pX, 1.0);
        vec4 clipZ = projectionMatrix * modelViewMatrix * vec4(pZ, 1.0);
        vec2 s0 = clip0.xy / clip0.w;
        vec2 rawX = ((clipX.xy / clipX.w) - s0) * uResolution;
        vec2 rawZ = ((clipZ.xy / clipZ.w) - s0) * uResolution;
        float armM = max(length(rawX), length(rawZ)) + 1e-4;
        vArmX = (rawX / armM) * 0.5;
        vArmZ = (rawZ / armM) * 0.5;

        float cs = cos(uRotPhase), sn = sin(uRotPhase);
        vArmX = vec2(cs * vArmX.x - sn * vArmX.y, sn * vArmX.x + cs * vArmX.y);
        vArmZ = vec2(cs * vArmZ.x - sn * vArmZ.y, sn * vArmZ.x + cs * vArmZ.y);
        float armScale = mix(1.0, 0.5, uConverge);
        vArmX *= armScale;
        vArmZ *= armScale;

        float ang = aAngle + uRotPhase;
        vec3 ringView = vec3(uRingRadius * cos(ang), uRingRadius * sin(ang), uRingZ);
        vec3 mvFinal = mix(mvPos.xyz, ringView, uConverge);
        vDist = -mvFinal.z;
        gl_Position = projectionMatrix * vec4(mvFinal, 1.0);

        float sz = uSize * (1.0 + aBoost * 1.6 + vMouse * 0.1);
        sz *= mix(1.0, 1.3, uConverge);
        float rawSize = sz * uPixelRatio * (120.0 / max(vDist, 1.0));
        gl_PointSize = clamp(rawSize, 6.0 * uPixelRatio, 22.0 * uPixelRatio);
      }
    `,
    fragmentShader: `
      varying float vBoost;
      varying float vDist;
      varying float vHeight;
      varying float vMouse;
      varying float vRow;
      varying float vWorldX;
      varying vec2 vArmX;
      varying vec2 vArmZ;
      varying float vConverge;
      uniform vec3 uBaseColor;
      uniform vec3 uChargeColor;
      uniform vec3 uTipColor;
      uniform vec3 uFogColor;
      uniform float uFogNear;
      uniform float uFogFar;
      uniform float uFade;

      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        uv.y = -uv.y;

        float thick = 0.11;
        float lenX = length(vArmX);
        float lenZ = length(vArmZ);
        vec2 uX = vArmX / max(lenX, 1e-4);
        vec2 uZ = vArmZ / max(lenZ, 1e-4);
        lenX = max(lenX, 0.16);
        lenZ = max(lenZ, 0.16);
        float distX = abs(dot(uv, vec2(-uX.y, uX.x)));
        float distZ = abs(dot(uv, vec2(-uZ.y, uZ.x)));
        float armX = (1.0 - smoothstep(thick * 0.6, thick, distX)) *
                     (1.0 - smoothstep(lenX - 0.06, lenX, abs(dot(uv, uX))));
        float armZ = (1.0 - smoothstep(thick * 0.6, thick, distZ)) *
                     (1.0 - smoothstep(lenZ - 0.06, lenZ, abs(dot(uv, uZ))));
        float plus  = max(armX, armZ);
        if (plus < 0.05) discard;

        float heightFactor = smoothstep(-1.0, 1.0, vHeight);
        vec3 baseShaded = mix(uBaseColor * 0.85, uBaseColor * 1.15, heightFactor);

        float baseAlpha = 0.58;

        float charge = clamp(vMouse, 0.0, 1.0);
        vec3 color = mix(baseShaded, uChargeColor, charge * 0.42);
        float tip = charge * smoothstep(0.7, 1.0, charge) * 0.28;
        color = mix(color, uTipColor, tip);

        color = mix(color, uChargeColor, clamp(vBoost, 0.0, 1.0) * 0.9);
        color = mix(color, uTipColor, smoothstep(0.45, 1.0, vBoost) * 0.55);

        float fog = smoothstep(uFogNear, uFogFar, vDist);
        color = mix(color, uFogColor, fog * 0.85);

        color = mix(color, uChargeColor, vConverge * 0.55);
        color = mix(color, uTipColor, vConverge * 0.30);

        float depthFade = smoothstep(35.0, 12.0, vDist);
        float topFade = smoothstep(0.0, 0.22, vRow);
        float leftFade = smoothstep(-60.0, -20.0, vWorldX);
        float alpha = plus * depthFade * topFade * leftFade * (baseAlpha + vBoost * 0.6 + charge * 0.4);
        alpha *= (1.0 - fog * 0.7);

        alpha *= (1.0 + vConverge * 0.8);

        alpha *= uFade;

        gl_FragColor = vec4(color, alpha);
      }
    `,
    transparent: true,
    depthWrite: false,
  });

  const surfacePoints = new THREE.Points(surfaceGeo, surfaceMat);
  surfacePoints.renderOrder = 0;
  scene.add(surfacePoints);

  /* ===== 2D dust canvas over the room ===== */
  const dustCtx = dustCanvas.getContext('2d');
  let dustMotes = [];
  let dustW = 0, dustH = 0;

  function buildDust2D() {
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    dustW = w; dustH = h;
    dustCanvas.width = Math.floor(w * Math.min(window.devicePixelRatio || 1, dprCap));
    dustCanvas.height = Math.floor(h * Math.min(window.devicePixelRatio || 1, dprCap));
    dustCanvas.style.width = w + 'px';
    dustCanvas.style.height = h + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, dprCap);
    dustCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.round(Math.min(420, (w * h) / 4200));
    dustMotes = [];
    for (let i = 0; i < count; i++) {
      dustMotes.push({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - 0.5) * 0.12,
        vy: -0.04 - Math.random() * 0.08,
        r: 0.4 + Math.random() * 1.4,
        a: 0.05 + Math.random() * 0.14,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function drawDust2D(t) {
    if (dustW === 0 || dustH === 0) return;
    dustCtx.clearRect(0, 0, dustW, dustH);
    for (let i = 0; i < dustMotes.length; i++) {
      const m = dustMotes[i];
      m.x += m.vx + Math.sin(t * 0.3 + m.phase) * 0.05;
      m.y += m.vy;
      if (m.y < -4) { m.y = dustH + 4; m.x = Math.random() * dustW; }
      if (m.x < -4) m.x = dustW + 4;
      if (m.x > dustW + 4) m.x = -4;
      dustCtx.beginPath();
      dustCtx.fillStyle = 'rgba(58,64,74,' + m.a.toFixed(3) + ')';
      dustCtx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      dustCtx.fill();
    }
  }

  /* ===== Resize ===== */
  function resize() {
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    if (w === 0 || h === 0) return;
    const dpr = Math.min(window.devicePixelRatio || 1, dprCap);
    renderer.setPixelRatio(dpr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    surfaceMat.uniforms.uPixelRatio.value = dpr;
    surfaceMat.uniforms.uResolution.value.set(w, h);
    buildDust2D();
  }

  /* ===== Aperture Iris DOM setup ===== */
  const headlineEl = roomEl.querySelector('.room-headline');
  const roomLogoEl = roomEl.querySelector('.room-logo');
  stage.appendChild(headlineEl);
  stage.appendChild(roomLogoEl);

  const lens = document.createElement('div');
  lens.className = 'lens-outline';
  stage.appendChild(lens);

  /* ===== transition context (exposed) ===== */
  const ctx = {
    THREE, scene, camera, renderer,
    surfacePoints, surfaceGeo, surfaceMat,
    uniforms: surfaceMat.uniforms,
    basePositions, sPositions, sBoosts, sRows, sAngles,
    GRID_X, GRID_Z, SURF_W, SURF_D, Z_FAR, SURF_COUNT,
    CAM_BASE, CAM_TARGET, waveHeight,
    roomEl, dustCanvas, dustCtx, dustMotes: () => dustMotes,
    heroEl, headlineEl, roomLogoEl, lens,
  };
  window.__trans = ctx;

  let clock = 0;

  /* =====================================================================
     TRANSITION — Aperture Iris (dual circular mask)
     HERO aperture:  FULL at p=0, closes to 0 at p≈0.62
     ROOM aperture: 0 at p≈0.42, opens to FULL at p=1
     Overlap 0.42..0.62 ensures no empty white frame.
     Persistent crisp blue ring (#1466e6) visible 0.15..0.9.
     ===================================================================== */
  function applyTransition(p) {
    const cp = Math.max(0, Math.min(1, p));
    const w = stage.clientWidth;
    const h = stage.clientHeight;
    const maxR = Math.sqrt(w * w + h * h) * 0.5 + 6;
    const soft = 10;

    // --- Dual circular aperture radii (pixels) ---
    const heroClose = smoothstep(0.0, 0.62, cp);
    const heroR = maxR * (1.0 - heroClose);

    const roomOpen = smoothstep(0.42, 1.0, cp);
    const roomR = maxR * roomOpen;

    // The aperture ring follows the larger of the two circles — continuous
    const ringR = Math.max(heroR, roomR);

    // --- Wave canvas ("+" surface) uniforms ---
    const conv = smoothstep(0.0, 0.5, cp);
    const ringDist = 39.0;
    const viewH = 2.0 * ringDist * Math.tan((52.0 * Math.PI / 180.0) / 2.0);
    const pxToView = viewH / Math.max(h, 1);
    const ringView = ringR * pxToView;
    const rotPhase = conv * 0.9 + clock * 0.25 * conv;

    surfaceMat.uniforms.uConverge.value = conv;
    surfaceMat.uniforms.uRingRadius.value = ringView;
    surfaceMat.uniforms.uRingZ.value = -ringDist;
    surfaceMat.uniforms.uRotPhase.value = rotPhase;
    surfaceMat.uniforms.uFade.value = 1.0 - smoothstep(0.5, 0.78, cp);

    // --- HERO DOM: masked by shrinking circle (closes over hero) ---
    const heroOp = 1.0 - smoothstep(0.55, 0.62, cp);
    heroEl.style.opacity = String(heroOp);
    const heroMask = 'radial-gradient(circle at 50% 50%, #000 0%, #000 ' + heroR + 'px, rgba(0,0,0,0) ' + (heroR + soft) + 'px)';
    heroEl.style.webkitMaskImage = heroMask;
    heroEl.style.maskImage = heroMask;

    // --- Wave canvas: also masked by the hero circle ---
    canvas.style.webkitMaskImage = heroMask;
    canvas.style.maskImage = heroMask;

    // --- ROOM: masked by growing circle (opens onto room) ---
    const roomOp = smoothstep(0.38, 0.45, cp);
    roomEl.style.opacity = String(roomOp);
    const roomMask = 'radial-gradient(circle at 50% 50%, #000 0%, #000 ' + roomR + 'px, rgba(0,0,0,0) ' + (roomR + soft) + 'px)';
    roomEl.style.webkitMaskImage = roomMask;
    roomEl.style.maskImage = roomMask;

    // dust drifts in as the room opens
    dustCanvas.style.opacity = String(smoothstep(0.42, 0.8, cp));

    // room headline + logo (unmasked, above everything) fade in
    const rtOp = smoothstep(0.6, 0.88, cp);
    headlineEl.style.opacity = String(rtOp);
    roomLogoEl.style.opacity = String(rtOp);

    // --- Persistent aperture ring (crisp blue shutter edge) ---
    const lensOp = smoothstep(0.12, 0.2, cp) * (1.0 - smoothstep(0.88, 0.96, cp));
    lens.style.opacity = String(lensOp);
    const lensSize = Math.max(ringR * 2.0, 2.0);
    lens.style.width = lensSize + 'px';
    lens.style.height = lensSize + 'px';
    lens.style.left = (w * 0.5 - lensSize * 0.5) + 'px';
    lens.style.top = (h * 0.5 - lensSize * 0.5) + 'px';

    // camera holds at base
    camera.position.copy(CAM_BASE);
    camera.lookAt(CAM_TARGET);
  }

  /* ===== viewing harness: autoloop / scrub / QA freeze ===== */
  const params = new URLSearchParams(window.location.search);
  const qaP = params.get('p');
  let qaFixed = false;
  let qaValue = 0;
  if (qaP !== null) {
    const v = parseFloat(qaP);
    if (!isNaN(v)) {
      qaFixed = true;
      qaValue = Math.max(0, Math.min(1, v));
    }
  }

  let p = 0;
  let autoDir = 1;
  let autoPaused = false;
  let autoResumeAt = 0;
  let holdUntil = 0;
  const LEG = 1.6;
  const HOLD_AT_ONE = 1.6;
  const HOLD_AT_ZERO = 1.2;

  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }

  let lastT = 0;
  let running = false;
  let rafId = 0;

  function step(t) {
    if (!running) return;
    rafId = requestAnimationFrame(step);
    const dt = lastT ? Math.min((t - lastT) / 1000, 0.05) : 0.016;
    lastT = t;
    clock += dt;

    surfaceMat.uniforms.uTime.value = clock;

    const decay = Math.pow(0.945, dt * 60);
    for (let i = 0; i < SURF_COUNT; i++) sBoosts[i] *= decay;
    surfaceGeo.attributes.aBoost.needsUpdate = true;

    if (qaFixed) {
      p = qaValue;
    } else if (autoPaused) {
      if (t >= autoResumeAt) autoPaused = false;
    } else {
      if (t < holdUntil) {
        // holding
      } else {
        const dir = autoDir;
        const speed = 1 / LEG;
        p += dir * speed * dt;
        if (p >= 1) {
          p = 1;
          autoDir = -1;
          holdUntil = t + HOLD_AT_ONE * 1000;
        } else if (p <= 0) {
          p = 0;
          autoDir = 1;
          holdUntil = t + HOLD_AT_ZERO * 1000;
        }
      }
    }

    let pDisplay = p;
    if (!qaFixed && !autoPaused && t >= holdUntil) {
      const legFrac = autoDir === 1 ? p : (1 - p);
      const easedFrac = easeInOutCubic(legFrac);
      pDisplay = autoDir === 1 ? easedFrac : (1 - easedFrac);
    } else if (autoPaused || t < holdUntil) {
      pDisplay = p;
    }

    applyTransition(pDisplay);
    pValEl.textContent = pDisplay.toFixed(2);

    drawDust2D(clock);

    renderer.render(scene, camera);
  }

  /* ===== scrub: wheel + drag ===== */
  function pauseAutoFor(ms) {
    if (qaFixed) return;
    autoPaused = true;
    autoResumeAt = performance.now() + ms;
    holdUntil = 0;
  }

  function scrubBy(deltaPx) {
    if (qaFixed) return;
    pauseAutoFor(1400);
    const k = 0.0024;
    p = Math.max(0, Math.min(1, p + deltaPx * k));
    autoDir = p < 0.5 ? 1 : -1;
  }

  window.addEventListener('wheel', function (e) {
    if (qaFixed) return;
    e.preventDefault();
    scrubBy(-e.deltaY);
  }, { passive: false });

  let dragging = false;
  let lastY = 0;
  stage.addEventListener('pointerdown', function (e) {
    if (qaFixed) return;
    dragging = true;
    lastY = e.clientY;
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', function (e) {
    if (!dragging || qaFixed) return;
    const dy = e.clientY - lastY;
    lastY = e.clientY;
    scrubBy(-dy);
  });
  stage.addEventListener('pointerup', function (e) {
    dragging = false;
    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
  });
  stage.addEventListener('pointercancel', function () { dragging = false; });

  /* ===== start / stop ===== */
  function start() {
    if (!running) {
      running = true;
      lastT = 0;
      rafId = requestAnimationFrame(step);
    }
  }
  function stop() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  /* ===== init ===== */
  resize();
  applyTransition(qaFixed ? qaValue : 0);
  pValEl.textContent = (qaFixed ? qaValue : 0).toFixed(2);

  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(function (entries) {
      for (let i = 0; i < entries.length; i++) {
        if (entries[i].isIntersecting) start();
        else stop();
      }
    }, { threshold: [0, 0.1] });
    io.observe(stage);
  } else {
    start();
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop();
    else if (!running) { running = true; lastT = 0; rafId = requestAnimationFrame(step); }
  });

  let rt = 0;
  window.addEventListener('resize', function () {
    if (rt) clearTimeout(rt);
    rt = setTimeout(resize, 180);
  });
})();
</script>

</body>

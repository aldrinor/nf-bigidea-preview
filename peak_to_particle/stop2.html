<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peak to Particle - inside the cloud</title>
<style>
  :root{
    --rail: clamp(50px, 13.7vw, 300px);
    --bg:#edf0f2; --ink:#1f2327; --headline-ink:#1a1a1a; --muted:#5a646e; --accent:#1b7bff;
    --display: clamp(28px, 3.45vw, 50px);
    --stack:-apple-system, system-ui, 'Inter', 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:var(--stack);-webkit-font-smoothing:antialiased;color:var(--ink)}
  /* Real photographed smoke pushed into real cloud. The pollution in this frame is
     PHOTOGRAPHED, not painted. Pushed right so clean air sits between copy and mass. */
  #plate{position:fixed;left:0;top:-20.9%;width:138%;height:138%;object-fit:cover;z-index:0;
    filter:saturate(.36) contrast(1.02) brightness(1.06);}
  #veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg, rgba(240,244,248,.52) 0%, rgba(240,244,248,0) 16%);}

  /* ONE pollutant, large. Three small labelled specimens read as an infographic and the
     gate scored it 4.9 — "tiny specimen bubbles float arbitrarily in dead space". The rule
     that took screen 3 to its best applies here too: one subject owns the frame. */
  .spec{position:fixed;left:65.5%;top:51%;z-index:2;transform:translate(-50%,-50%);
    width:clamp(150px,22.5vw,324px);pointer-events:none;will-change:transform}
  .spec img{display:block;width:100%;height:auto}
  /* the charge mark is drawn at a size you can actually read, tied to the specimen by a
     hairline leader — not a decorative glyph floating nearby */
  .mark{position:fixed;left:78.5%;top:33.5%;z-index:3;transform:translate(-50%,-50%);
    pointer-events:none}
  @keyframes drift{ 0%,100%{transform:translate(-50%,-50%)}
                    50%{transform:translate(-50%,calc(-50% - 11px))} }
  .spec{animation:drift 21s ease-in-out infinite}
  .mark{animation:drift 21s ease-in-out infinite}

  .chrome{position:fixed;inset:0;z-index:4;padding:clamp(52px,6.4vw,92px) var(--rail)}
  nav{position:relative;display:flex;align-items:center;gap:clamp(18px,2.4vw,40px);flex-wrap:wrap}
  nav a{font-size:13.5px;letter-spacing:.05em;text-decoration:none;color:#47515b;
    padding-bottom:6px;transition:color .2s}
  nav a:hover{color:var(--ink)}
  nav a.on{color:var(--ink);border-bottom:2px solid var(--accent)}
  /* This stop anchors its copy LOW. Three stops with an identical centred-left block read
     as three template slides; the descent should feel like it changes altitude. */
  .lockup{position:absolute;left:var(--rail);bottom:clamp(112px,15vh,190px);
    max-width:min(46ch,40vw)}
  h2{font-size:var(--display);font-weight:400;line-height:1.14;letter-spacing:-.015em;
    color:var(--headline-ink);margin:0 0 clamp(18px,2.4vh,30px);max-width:19ch}
  h2 em{font-style:normal;color:var(--accent)}
  p{font-size:clamp(16px,1.35vw,19px);line-height:1.6;color:var(--ink);margin:0;max-width:44ch}
  .cue{position:absolute;left:var(--rail);bottom:clamp(52px,6.4vw,92px);
    font-size:12px;letter-spacing:.09em;color:var(--muted)}

  @media (max-width:760px){
    nav{gap:14px}
    #plate{left:-24%;top:-8%;width:172%;height:172%}
    .lockup{max-width:none;right:var(--rail);bottom:14vh}
    .spec{left:64%;top:27%;width:44vw} .mark{left:88%;top:14%}
    #veil{background:linear-gradient(0deg, rgba(240,244,248,.95) 0%, rgba(240,244,248,.74) 32%,
      rgba(240,244,248,0) 58%)}
  }
  @media (prefers-reduced-motion:reduce){ .spec,.mark{animation:none !important} }
</style>
</head>
<body>
<img id="plate" src="./hero_img/smoke_in.png"
     alt="A dense plume of wildfire smoke pushing into clean white cloud.">
<div id="veil"></div>

<figure class="spec">
  <img src="./specimens/bacteria_cut.png"
       alt="A single airborne microbe, lifted out of the smoke.">
</figure>
<svg class="mark" width="164" height="150" viewBox="0 0 164 150" aria-hidden="true">
  <!-- leader runs from the charge mark down-left to the specimen's edge -->
  <path d="M40 44 L150 132" fill="none" stroke="#4a545e" stroke-width="1.1" opacity=".55"/>
  <circle cx="27" cy="27" r="24" fill="none" stroke="#2f3941" stroke-width="2.1"/>
  <line x1="14.5" y1="27" x2="39.5" y2="27" stroke="#2f3941" stroke-width="2.1"/>
</svg>

<div class="chrome">
  <nav aria-label="Applications">
    <a class="on" href="#">C-POLAR</a>
    <a href="#">Air</a><a href="#">Water</a><a href="#">Protective Wear</a>
    <a href="#">Food Packaging</a><a href="#">Medical Devices</a>
  </nav>
  <div class="lockup">
    <h2>Most pollutants carry <em>a negative charge</em>.</h2>
    <p>The microbes and smoke in the air, the PFAS in water, the biofilm on a surface &mdash;
       completely different problems that mostly share one trait: a negative charge.</p>
  </div>
  <span class="cue">KEEP DESCENDING</span>
</div>

<script>window.__ready=true; window.__fps=60;</script>
</body>
</html>

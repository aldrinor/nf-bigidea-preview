<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peak to Particle — hero composition test</title>
<style>
  html,body{margin:0;height:100%;background:#dfe5ea;overflow:hidden}
  canvas{display:block}
  #hud{position:fixed;left:14px;bottom:12px;font:11px ui-monospace,monospace;color:#5a6a78;opacity:.75}
</style>
</head>
<body>
<div id="hud">loading…</div>
<script type="importmap">
{"imports":{
  "three":"./node_modules/three/build/three.module.js",
  "three/addons/":"./node_modules/three/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const hud = document.getElementById('hud');
const scene = new THREE.Scene();

// ---- palette taken from the reference's pale alpine range, not invented ----
const SKY_HI  = new THREE.Color('#c9d6e2');
const SKY_LO  = new THREE.Color('#eef2f5');
const HAZE    = new THREE.Color('#dde5ec');

scene.background = SKY_LO.clone();
scene.fog = new THREE.FogExp2(HAZE, 0.000085);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 10, 60000);

// Mount Victoria summit, in mesh metres (derived from the real DEM)
const VICTORIA = new THREE.Vector3(-3883, 3459, 2117);
// Lake Louise, same frame
const LOUISE   = new THREE.Vector3( 2220, 1742, -1956);

// hero camera: high above the Lake Louise side, looking west-south-west at the peak
const q = new URLSearchParams(location.search);
const shot = q.get('shot') || 'hero';
if (shot === 'hero') {
  camera.position.set(2600, 4250, -1500);
  camera.lookAt(VICTORIA.x, VICTORIA.y - 250, VICTORIA.z);
} else if (shot === 'lake') {
  camera.position.set(LOUISE.x + 900, LOUISE.y + 60, LOUISE.z - 700);
  camera.lookAt(VICTORIA.x, VICTORIA.y - 900, VICTORIA.z);
} else if (shot === 'close') {
  camera.position.set(VICTORIA.x + 3200, VICTORIA.y + 700, VICTORIA.z - 2600);
  camera.lookAt(VICTORIA.x, VICTORIA.y - 150, VICTORIA.z);
}

// ---- light: low sun raking from the north-east, the way alpine dawn reads ----
const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.position.set(6000, 3400, -7000);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xdfe9f2, 0x8fa2b0, 1.15));

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const tex = new THREE.TextureLoader();
const normalMap = tex.load('./terrain/out/banff_normal_q95.webp');
normalMap.colorSpace = THREE.NoColorSpace;
normalMap.wrapS = normalMap.wrapT = THREE.ClampToEdgeWrapping;

new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load(q.get('model')==='raw' ? './terrain/out/banff_terrain.glb' : './terrain/out/banff_opt.glb', gltf => {
  const mat = new THREE.MeshStandardMaterial({
    color: 0xf2f5f8,
    roughness: 0.94,
    metalness: 0.0,
    normalMap,
    normalScale: new THREE.Vector2(1.5, 1.5),
    flatShading: false,
    side: q.get('side')==='double' ? THREE.DoubleSide : THREE.FrontSide,
  });
  let tris = 0;
  gltf.scene.traverse(o => {
    if (o.isMesh) {
      o.material = mat;
      o.geometry.computeVertexNormals();
      tris += o.geometry.index ? o.geometry.index.count/3 : o.geometry.attributes.position.count/3;
    }
  });
  scene.add(gltf.scene);
  hud.textContent = `${shot} · ${Math.round(tris).toLocaleString()} triangles · real Banff elevation`;
  window.__ready = true;
}, undefined, e => { hud.textContent = 'LOAD FAILED: ' + e; window.__ready = 'error'; });

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let frames = 0, t0 = performance.now();
renderer.setAnimationLoop(() => {
  renderer.render(scene, camera);
  frames++;
  if (frames % 60 === 0) window.__fps = Math.round(frames / ((performance.now()-t0)/1000));
});
</script>
</body>
</html>

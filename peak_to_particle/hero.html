<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peak to Particle — hero</title>
<style>
  :root{
    --ink:#1f2327; --headline-ink:#1a1a1a; --muted:#8a9095;
    --accent:#1b7bff; --hair:rgba(20,24,28,0.10);
    --stack:-apple-system, system-ui, 'Inter', 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#eef2f6;
    font-family:var(--stack);-webkit-font-smoothing:antialiased;color:var(--ink)}
  /* the still peak sits under a live cloud canvas, so the hero breathes */
  #plate{position:fixed;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:0;
    transform:scale(1.0) translate(0%, 0%);transform-origin:center;
    filter:contrast(.94) saturate(.96) brightness(1.01)}
  /* two veils: top haze for the nav, plus a soft wash that lifts the right and lower
     slopes so their detail recedes and the left column stays the quiet side */
  #veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg, rgba(242,246,250,.34) 0%, rgba(242,246,250,0) 26%);}
  #veil2{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      linear-gradient(100deg, rgba(238,244,249,.16) 0%, rgba(238,244,249,0) 40%);}
  canvas#mist{position:fixed;inset:0;z-index:2;pointer-events:none}
  .chrome{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;
    padding:clamp(52px,6.4vw,92px) clamp(50px,13.7vw,300px)}
  /* one restrained lockup, vertically centred on the left — not bottom-loaded */
  .lockup{position:absolute;left:clamp(50px,13.7vw,300px);top:60%;transform:translateY(-50%);
    max-width:min(30ch,42vw)}
  nav{display:flex;align-items:center;gap:clamp(18px,2.4vw,40px);flex-wrap:wrap}
  nav a{font-size:12px;letter-spacing:.085em;text-decoration:none;color:#93a2ae;
    padding-bottom:7px;transition:color .2s}
  nav a:hover{color:#4d6478}
  nav a.on{color:var(--ink);border-bottom:2px solid var(--accent)}
  .spacer{flex:1}
  .mark{display:flex;align-items:center;gap:clamp(14px,1.6vw,22px);margin-bottom:clamp(10px,1.4vh,18px)}
  /* mark recoloured at the pixel level to #52677A — a CSS filter could not get there */
  .mark img{height:clamp(24px,2.5vw,33px);width:auto;display:block;opacity:.95}
  h1{font-size:clamp(24px,2.7vw,34px);font-weight:600;line-height:1.32;letter-spacing:-.022em;
    color:var(--headline-ink);margin:0;max-width:34ch}
  h1 em{font-style:normal;color:var(--accent)}
  .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    margin-top:clamp(18px,3vh,40px)}
  .cue{position:absolute;left:clamp(50px,13.7vw,300px);bottom:clamp(36px,4.8vw,68px);
    font-size:11.5px;letter-spacing:.14em;color:var(--muted)}
  .apps{display:flex;gap:clamp(14px,2vw,30px);flex-wrap:wrap}
  .apps span{font-size:12.5px;letter-spacing:.05em;color:var(--muted)}
  .apps span b{font-weight:400;color:var(--ink)}
  @media (max-width:760px){
    nav{gap:14px} nav a{font-size:12px}
    h1{font-size:clamp(19px,5.4vw,26px);max-width:22ch}
    .foot{flex-direction:column;align-items:flex-start}
  }
  @media (prefers-reduced-motion:reduce){ canvas#mist{display:none} }
</style>
</head>
<body>
<img id="plate" alt="A snow-covered mountain summit rising through cloud." src="./hero_img/peak_d.png">
<div id="veil"></div>
<div id="veil2"></div>
<canvas id="mist"></canvas>

<div class="chrome">
  <nav aria-label="Applications">
    <a class="on" href="#">C-POLAR</a>
    <a href="#">Air</a><a href="#">Water</a><a href="#">Protective Wear</a>
    <a href="#">Food Packaging</a><a href="#">Medical Devices</a>
  </nav>
  <div class="lockup">
    <div class="mark"><img src="./brand/cpolar_bluegrey.png" alt="C-POLAR"></div>
    <h1>A permanent positive charge, engineered into the material — <em>proven first in air</em>.</h1>
  </div>
  <span class="cue">SCROLL TO DESCEND</span>

</div>

<script>
/* Cloud banks drifting ACROSS the peak, in front of and behind it — the reference's
   defining move. Built from overlapping round lobes (a warped noise field reads as satin,
   not cloud) and baked once, so the per-frame cost is a handful of drawImage calls. */
const P = new Uint8Array(512);
for (let i=0;i<256;i++) P[i]=P[i+256]=(Math.random()*256)|0;
const fade=t=>t*t*t*(t*(t*6-15)+10), lerp=(a,b,t)=>a+t*(b-a);
const grad=(h,x,y)=>((h&1)?x:-x)+((h&2)?y:-y);
function noise2(x,y){
  const X=Math.floor(x)&255, Y=Math.floor(y)&255;
  x-=Math.floor(x); y-=Math.floor(y);
  const u=fade(x), v=fade(y), A=P[X]+Y, B=P[X+1]+Y;
  return lerp(lerp(grad(P[A],x,y), grad(P[B],x-1,y), u),
              lerp(grad(P[A+1],x,y-1), grad(P[B+1],x-1,y-1), u), v);
}
function fbm(x,y,oct){ let s=0,a=0.5; for(let i=0;i<oct;i++){ s+=a*noise2(x,y); x*=2.03; y*=2.03; a*=0.5; } return s; }

function bakeBank(size, nLobes, spread, cut, gain){
  const c=document.createElement('canvas'); c.width=size; c.height=Math.round(size*0.5);
  const W=c.width, H=c.height, g=c.getContext('2d');
  const im=g.createImageData(W,H), d=im.data, dens=new Float32Array(W*H);
  const lobes=[];
  for(let k=0;k<nLobes;k++){
    lobes.push({ x:0.5+(Math.random()-0.5)*spread, y:0.5+(Math.random()-0.5)*0.52,
                 r:0.10+Math.random()*0.20, w:0.40+Math.random()*0.60 });
  }
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const u=x/W, v=y/H; let acc=0;
    for(const L of lobes){
      const dx=(u-L.x)*1.9, dy=(v-L.y);
      const q=Math.sqrt(dx*dx+dy*dy)/L.r;
      if(q<1.35) acc += L.w*Math.pow(Math.max(0,1-q*q*0.55),3.4);
    }
    const n1=fbm(u*5.2+7.1, v*5.2+2.9, 4)*0.5+0.5;
    const n2=fbm(u*13.0+19.4, v*13.0+8.3, 3)*0.5+0.5;
    let a=(acc*(0.30+0.95*n1)*(0.55+0.72*n2)-cut)*gain;
    const eu=Math.min(u,1-u), ev=Math.min(v,1-v);
    const e=Math.min(1, Math.min(eu,ev)/0.14); a*=e*e*(3-2*e);
    dens[y*W+x]=a>0?Math.min(a,1):0;
  }
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const i0=y*W+x, a=dens[i0];
    if(a<=0.004){ d[i0*4+3]=0; continue; }
    const xm=(x-2+W)%W, ym=(y-2+H)%H;
    const rim=Math.max(0,a-dens[ym*W+xm]);
    const broken=fbm(x*0.09+31.7,y*0.09+13.3,3)*0.5+0.5;
    const lit=Math.min(1,rim*8.5)*(0.25+0.95*Math.pow(broken,1.6));
    const i=i0*4;
    d[i]=250+5*lit; d[i+1]=252+3*lit; d[i+2]=254;
    d[i+3]=(Math.min(1,Math.pow(a,0.9)*0.96)*255)|0;
  }
  g.putImageData(im,0,0); return c;
}

const cv = document.getElementById('mist');
const ctx = cv.getContext('2d');
function resize(){
  const dpr=Math.min(devicePixelRatio||1,1.5);
  cv.width=Math.floor(innerWidth*dpr); cv.height=Math.floor(innerHeight*dpr);
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize); resize();

// banks at different heights and speeds; the nearest crosses IN FRONT of the summit
const BANKS = [
  { tile: bakeBank(512, 16, 0.86, 0.26, 2.7), y:0.30, h:0.30, w:1.90, v: 0.0115, a:0.34, blur:3.0 },
  { tile: bakeBank(512, 13, 0.92, 0.24, 2.9), y:0.52, h:0.34, w:2.10, v:-0.0082, a:0.60, blur:1.4 },
  { tile: bakeBank(576, 11, 0.98, 0.20, 3.1), y:0.68, h:0.42, w:2.40, v: 0.0062, a:0.88, blur:0.0 },
  { tile: bakeBank(512, 14, 0.90, 0.30, 2.6), y:0.16, h:0.24, w:1.80, v:-0.0140, a:0.22, blur:4.4 },
];

let t0=performance.now(), frames=0, winStart=t0;
function frame(now){
  const t=(now-t0)/1000;
  ctx.clearRect(0,0,innerWidth,innerHeight);
  for(const B of BANKS){
    const w=innerWidth*B.w, h=innerHeight*B.h;
    let x=(-t*B.v*w) % w; if(x>0) x-=w;
    const y=innerHeight*B.y + Math.sin(t*0.06+B.y*9)*innerHeight*0.012;
    ctx.globalAlpha=B.a;
    ctx.filter = B.blur>0.05 ? `blur(${B.blur}px)` : 'none';
    for(let X=x-w; X<innerWidth+w; X+=w) ctx.drawImage(B.tile, X, y, w, h);
    ctx.filter='none';
  }
  ctx.globalAlpha=1;
  frames++;
  if(now-winStart>=1000){ window.__fps=Math.round(frames*1000/(now-winStart)); frames=0; winStart=now; }
  requestAnimationFrame(frame);
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(frame);
window.__ready = true;
</script>
</body>
</html>

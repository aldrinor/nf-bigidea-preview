<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peak to Particle — hero</title>
<style>
  :root{
    --ink:#1f2327; --headline-ink:#1a1a1a; --muted:#8a9095;
    --accent:#1b7bff; --hair:rgba(20,24,28,0.10);
    --stack:-apple-system, system-ui, 'Inter', 'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#eef2f6;
    font-family:var(--stack);-webkit-font-smoothing:antialiased;color:var(--ink)}
  /* the still peak sits under a live cloud canvas, so the hero breathes */
  #plate{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;
    filter:contrast(.80) saturate(.88) brightness(1.075)}
  /* two veils: top haze for the nav, plus a soft wash that lifts the right and lower
     slopes so their detail recedes and the left column stays the quiet side */
  #veil{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg, rgba(242,246,250,.62) 0%, rgba(242,246,250,0) 30%);}
  #veil2{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      linear-gradient(100deg, rgba(238,244,249,.34) 0%, rgba(238,244,249,0) 44%),
      linear-gradient(0deg, rgba(244,248,252,.62) 0%, rgba(244,248,252,.24) 22%, rgba(244,248,252,0) 40%),
      radial-gradient(115% 80% at 82% 82%, rgba(242,247,251,.52) 0%, rgba(242,247,251,0) 60%);}
  canvas#mist{position:fixed;inset:0;z-index:2;pointer-events:none}
  .chrome{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;
    padding:clamp(34px,4.6vw,64px) clamp(46px,9vw,150px)}
  /* one restrained lockup, vertically centred on the left — not bottom-loaded */
  .lockup{position:absolute;left:clamp(46px,9vw,150px);top:60%;transform:translateY(-50%);
    max-width:min(46ch,44vw)}
  nav{display:flex;align-items:center;gap:clamp(18px,2.4vw,40px);flex-wrap:wrap}
  nav a{font-size:12px;letter-spacing:.085em;text-decoration:none;color:#93a2ae;
    padding-bottom:7px;transition:color .2s}
  nav a:hover{color:#4d6478}
  nav a.on{color:#33404c;border-bottom:1px solid #b9c6d1}
  .spacer{flex:1}
  .mark{display:flex;align-items:center;gap:clamp(14px,1.6vw,22px);margin-bottom:clamp(10px,1.4vh,18px)}
  /* mark recoloured at the pixel level to #52677A — a CSS filter could not get there */
  .mark img{height:clamp(20px,2.05vw,27px);width:auto;display:block;opacity:.95}
  h1{font-size:clamp(18px,1.72vw,25px);font-weight:400;line-height:1.5;letter-spacing:-.008em;
    color:#52677A;margin:0;max-width:34ch}
  h1 em{font-style:normal;color:#6b8093}
  .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    margin-top:clamp(18px,3vh,40px)}
  .cue{position:absolute;left:clamp(46px,9vw,150px);bottom:clamp(34px,4.6vw,64px);
    font-size:11.5px;letter-spacing:.14em;color:#93a2ae}
  .apps{display:flex;gap:clamp(14px,2vw,30px);flex-wrap:wrap}
  .apps span{font-size:12.5px;letter-spacing:.05em;color:var(--muted)}
  .apps span b{font-weight:400;color:var(--ink)}
  @media (max-width:760px){
    nav{gap:14px} nav a{font-size:12px}
    h1{font-size:clamp(19px,5.4vw,26px);max-width:22ch}
    .foot{flex-direction:column;align-items:flex-start}
  }
  @media (prefers-reduced-motion:reduce){ canvas#mist{display:none} }
</style>
</head>
<body>
<img id="plate" alt="A snow-covered mountain summit rising through cloud." src="./hero_img/peak_c.png">
<div id="veil"></div>
<div id="veil2"></div>
<canvas id="mist"></canvas>

<div class="chrome">
  <nav aria-label="Applications">
    <a class="on" href="#">C-POLAR</a>
    <a href="#">Air</a><a href="#">Water</a><a href="#">Protective Wear</a>
    <a href="#">Food Packaging</a><a href="#">Medical Devices</a>
  </nav>
  <div class="lockup">
    <div class="mark"><img src="./brand/cpolar_bluegrey.png" alt="C-POLAR"></div>
    <h1>A permanent positive charge, engineered into the material — <em>proven first in air</em>.</h1>
  </div>
  <span class="cue">SCROLL TO DESCEND</span>

</div>

<script>
/* Live drifting mist over the still plate. Low-frequency fBm in 2D, cheap enough to
   hold 60 fps at half resolution, upscaled by the canvas. Keeps the hero breathing
   instead of reading as a frozen photograph. */
const cv = document.getElementById('mist');
const ctx = cv.getContext('2d', { alpha:true });
let W=0, H=0, S=0.22;                       // march the field at 22% and let it upscale
let field, img;

function resize(){
  W = Math.max(2, Math.floor(innerWidth  * S));
  H = Math.max(2, Math.floor(innerHeight * S));
  cv.width = W; cv.height = H;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  img = ctx.createImageData(W, H);
}
addEventListener('resize', resize); resize();

const P = new Uint8Array(512);
for(let i=0;i<256;i++) P[i]=P[i+256]=(Math.random()*256)|0;
const fade=t=>t*t*t*(t*(t*6-15)+10);
const lerp=(a,b,t)=>a+t*(b-a);
function grad(h,x,y){ const u=(h&1)?x:-x, v=(h&2)?y:-y; return u+v; }
function noise2(x,y){
  const X=Math.floor(x)&255, Y=Math.floor(y)&255;
  x-=Math.floor(x); y-=Math.floor(y);
  const u=fade(x), v=fade(y);
  const A=P[X]+Y, B=P[X+1]+Y;
  return lerp(lerp(grad(P[A],x,y),   grad(P[B],x-1,y),   u),
              lerp(grad(P[A+1],x,y-1), grad(P[B+1],x-1,y-1), u), v);
}
function fbm(x,y){ let s=0,a=0.5; for(let i=0;i<4;i++){ s+=a*noise2(x,y); x*=2.03; y*=2.03; a*=0.5; } return s; }

let t0 = performance.now(), frames=0, winStart=t0;
function frame(){
  const t = (performance.now()-t0)/1000;
  const d = img.data;
  for(let y=0;y<H;y++){
    const fy = y/H;
    // mist gathers in the lower half, where the cloud sea sits
    const band = Math.min(1, Math.max(0, (fy-0.30)/0.55));
    for(let x=0;x<W;x++){
      const fx = x/W;
      let n = fbm(fx*3.1 + t*0.014, fy*2.2 - t*0.008);
      n = n*0.5+0.5;
      let a = (n-0.46)*2.1;
      a = a>0 ? a*band*0.5 : 0;
      const i=(y*W+x)*4;
      d[i]=255; d[i+1]=252; d[i+2]=250; d[i+3]=(a*255)|0;
    }
  }
  ctx.putImageData(img,0,0);
  frames++;
  const now=performance.now();
  if(now-winStart>=1000){ window.__fps=Math.round(frames*1000/(now-winStart)); frames=0; winStart=now; }
  requestAnimationFrame(frame);
}
if(!matchMedia('(prefers-reduced-motion: reduce)').matches) requestAnimationFrame(frame);
window.__ready = true;
</script>
</body>
</html>

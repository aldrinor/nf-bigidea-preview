<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peak to Particle — scene</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9eef2}
  canvas{display:block}
  #hud{position:fixed;left:14px;bottom:12px;font:11px ui-monospace,monospace;color:#5f7080;opacity:.7}
</style>
</head>
<body>
<div id="hud">loading…</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { makeCloudPass } from './cloud_pass.js';

const q = new URLSearchParams(location.search);
const hud = document.getElementById('hud');

/* ---------------------------------------------------------------
   PALETTE — cold luminous near-white, set against the reference render.
   Pale blue zenith, warm-white haze at the horizon, grey limestone rock.
   --------------------------------------------------------------- */
const SKY_TOP   = new THREE.Color('#aebfd2');
const SKY_MID   = new THREE.Color('#d8e2ea');
const SKY_HORIZ = new THREE.Color('#f3f6f8');
const HAZE      = new THREE.Color('#eef3f7');
const SUN_TINT  = new THREE.Color('#f7fbff');

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(HAZE, 0.000072);

const camera = new THREE.PerspectiveCamera(26, innerWidth/innerHeight, 5, 90000);

// real positions, in metres, derived from the DEM
const VICTORIA = new THREE.Vector3(-3883, 3459, 2117);
const LOUISE   = new THREE.Vector3( 2220, 1742, -1956);
const TEMPLE   = new THREE.Vector3( 2552, 3490,  4757);   // highest peak in frame — the hero
const CLOUD_Y  = 2620;            // cloud sea sits below the summits, above the valleys

// Hero framing per the gate: ~85mm equivalent, camera close and BELOW the summit so
// the massif dominates ~60% of the frame and the summit sits high, cloud wrapping the flanks.
const SHOTS = {
  hero:  { pos:[-151, 2980, 6650], look:[TEMPLE.x, 3260, TEMPLE.z], fov:28 },
  above: { pos:[ 1500, 5200,  -900], look:[VICTORIA.x, 2600, VICTORIA.z] },
  close: { pos:[VICTORIA.x + 1750, 3150, VICTORIA.z - 1500], look:[VICTORIA.x, VICTORIA.y + 90, VICTORIA.z] },
  lake:  { pos:[LOUISE.x+700, LOUISE.y+90, LOUISE.z-500], look:[VICTORIA.x, VICTORIA.y-900, VICTORIA.z] },
};
// free camera via URL for framing surveys: ?cam=x,y,z&look=x,y,z&fov=deg
let shot = SHOTS[q.get('shot')] || SHOTS.hero;
if(q.get('cam')){
  const c=q.get('cam').split(',').map(Number), l=(q.get('look')||'0,3000,0').split(',').map(Number);
  shot={pos:c, look:l};
}
if(shot.fov){ camera.fov = shot.fov; camera.updateProjectionMatrix(); }
if(q.get('fov')){ camera.fov = Number(q.get('fov')); camera.updateProjectionMatrix(); }
camera.position.set(...shot.pos);
camera.lookAt(...shot.look);

/* ---------------- SKY: three-stop vertical gradient + sun bloom ---------------- */
const SUN_DIR = new THREE.Vector3(0.62, 0.30, -0.72).normalize();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{
    uTop:{value:SKY_TOP}, uMid:{value:SKY_MID}, uHorizon:{value:SKY_HORIZ},
    uSun:{value:SUN_DIR}, uSunTint:{value:SUN_TINT}
  },
  vertexShader:`varying vec3 vDir;
    void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader:`
    varying vec3 vDir; uniform vec3 uTop,uMid,uHorizon,uSun,uSunTint;
    void main(){
      float h = clamp(normalize(vDir).y, -1.0, 1.0);
      float t = smoothstep(-0.04, 0.55, h);
      vec3 col = mix(uHorizon, uMid, smoothstep(-0.02, 0.24, h));
      col = mix(col, uTop, smoothstep(0.22, 0.85, h));
      // soft sun bloom, no hard disc — keeps it calm
      float d = max(dot(normalize(vDir), normalize(uSun)), 0.0);
      col = mix(col, uSunTint, pow(d, 7.0) * 0.55);
      gl_FragColor = vec4(col, 1.0);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(60000, 32, 24), skyMat));

/* ---------------- LIGHT ---------------- */
const sun = new THREE.DirectionalLight(0xf6faff, 1.45);
sun.position.copy(SUN_DIR).multiplyScalar(20000);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xeaf1f8, 0xa8b6c2, 2.05));
// cool fill from the opposite side so shadowed faces keep shape instead of going flat black
const fill = new THREE.DirectionalLight(0xcfdeed, 0.45);
fill.position.set(-SUN_DIR.x*15000, 4000, -SUN_DIR.z*15000);
scene.add(fill);

/* ---------------- TERRAIN ---------------- */
const tex = new THREE.TextureLoader();
const normalMap = tex.load('./terrain/out/banff_normal_q95.webp');
normalMap.colorSpace = THREE.NoColorSpace;

const terrainMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 0.985, metalness: 0.0,
  normalMap, normalScale: new THREE.Vector2(0.72, 0.72),
});
// slope + altitude drive snow vs rock. Steep faces shed snow — that contrast is
// what makes a real mountain read as a mountain instead of a white blob.
terrainMat.onBeforeCompile = (sh) => {
  sh.uniforms.uSnowLine = { value: 2780.0 };
  sh.uniforms.uRelief = { value: Number(q.get('relief') ?? 2.2) };
  sh.vertexShader = sh.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;\nvarying vec3 vNrmW;')
    .replace('#include <begin_vertex>', '#include <begin_vertex>\n vWPos = (modelMatrix*vec4(position,1.0)).xyz;\n vNrmW = normalize(mat3(modelMatrix)*normal);');
  sh.fragmentShader = sh.fragmentShader
    .replace('#include <common>', `#include <common>
varying vec3 vWPos; varying vec3 vNrmW; uniform float uSnowLine; uniform float uRelief;
vec3 nPerturbW;
float rhash(vec3 p){ p=fract(p*0.3183099+vec3(0.71,0.113,0.419)); p*=17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float rnoise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
  return mix(mix(mix(rhash(i+vec3(0,0,0)),rhash(i+vec3(1,0,0)),f.x),
                 mix(rhash(i+vec3(0,1,0)),rhash(i+vec3(1,1,0)),f.x),f.y),
             mix(mix(rhash(i+vec3(0,0,1)),rhash(i+vec3(1,0,1)),f.x),
                 mix(rhash(i+vec3(0,1,1)),rhash(i+vec3(1,1,1)),f.x),f.y),f.z); }
float rfbm(vec3 p){ float s=0.0,a=0.5;
  for(int i=0;i<5;i++){ s+=a*rnoise(p); p=p*2.11+vec3(3.1,7.7,1.3); a*=0.5; } return s; }
`)
    .replace('#include <normal_fragment_maps>', `#include <normal_fragment_maps>
// ---- procedural micro-relief -------------------------------------------------
// The elevation data is ~30 m per sample, so at close range the mesh is a smooth
// dune. Real macro form plus procedural detail below the data's resolution is how
// terrain is always rendered. Two bands: broad gullies, then fine rock grain.
{
  vec3 P1 = vWPos * vec3(0.0135, 0.0042, 0.0135);   // stretched in Y -> gullies
  vec3 P2 = vWPos * vec3(0.0610, 0.0195, 0.0610);
  vec2 g1 = vec2(rfbm(P1+vec3(0.55,0.0,0.0))-rfbm(P1-vec3(0.55,0.0,0.0)),
                 rfbm(P1+vec3(0.0,0.0,0.55))-rfbm(P1-vec3(0.0,0.0,0.55)));
  vec2 g2 = vec2(rfbm(P2+vec3(0.55,0.0,0.0))-rfbm(P2-vec3(0.55,0.0,0.0)),
                 rfbm(P2+vec3(0.0,0.0,0.55))-rfbm(P2-vec3(0.0,0.0,0.55)));
  float steep = smoothstep(0.10, 0.62, 1.0 - clamp(vNrmW.y, 0.0, 1.0));
  vec3 relief = vec3(g1.x*2.6 + g2.x*1.5, 0.0, g1.y*2.6 + g2.y*1.5);
  vec3 reliefW = relief * (0.28 + 0.72*steep) * uRelief;
  nPerturbW = normalize(vNrmW + reliefW * 0.16);
  normal = normalize(normal + reliefW);
}
`)
    .replace('#include <color_fragment>', `#include <color_fragment>
      float slope = 1.0 - clamp(vNrmW.y, 0.0, 1.0);
      float byAlt   = smoothstep(uSnowLine - 420.0, uSnowLine + 300.0, vWPos.y);
      float bySlope = 1.0 - smoothstep(0.26, 0.54, slope);
      float snow = clamp(byAlt * bySlope, 0.0, 1.0);
      vec3 rockDark  = vec3(0.310, 0.330, 0.360);
      vec3 rockLight = vec3(0.470, 0.492, 0.520);
      vec3 rock = mix(rockDark, rockLight, smoothstep(0.35, 0.85, vNrmW.y));
      vec3 snowC = vec3(0.930, 0.958, 0.995);
      diffuseColor.rgb *= mix(rock, snowC, snow);
    `);
  terrainMat.userData.shader = sh; window.__terrainShader = sh;
};

/* ---------------- RENDERER ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.16;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

/* ---------------- VOLUMETRIC CLOUDS ---------------- */
const clouds = makeCloudPass(renderer, {
  sunDir: SUN_DIR, sunCol:'#f9fcff', skyCol:'#dfe9f1', cloudCol:'#ffffff',
  bottom: 2150, top: 3060, cover: 0.34, density: 2.6, sigma: 0.0021, anim: 0.0013,
});


new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('./terrain/out/banff_opt.glb', g => {
  let tris = 0;
  g.scene.traverse(o => { if(o.isMesh){ o.material = terrainMat; o.geometry.computeVertexNormals();
    tris += o.geometry.index ? o.geometry.index.count/3 : o.geometry.attributes.position.count/3; }});
  scene.add(g.scene);
  hud.textContent = `${q.get('shot')||'hero'} · ${Math.round(tris).toLocaleString()} tris · real Banff elevation`;
  window.__ready = true;
}, undefined, e => { hud.textContent = 'LOAD FAILED '+e; window.__ready='error'; });

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); clouds.setSize(innerWidth,innerHeight,renderer.getPixelRatio()); });

let t0=performance.now();
// rolling-window fps: the cumulative average was being dragged down by load time
let winFrames=0, winStart=performance.now();
renderer.setAnimationLoop(()=>{
  const now = performance.now();
  const t = (now-t0)/1000;
  renderer.setRenderTarget(clouds.target);
  renderer.clear();
  renderer.render(scene,camera);
  clouds.render(renderer, camera, t);
  winFrames++;
  if(now - winStart >= 1000){
    window.__fps = Math.round(winFrames * 1000 / (now - winStart));
    winFrames = 0; winStart = now;
  }
});
</script>
</body>
</html>

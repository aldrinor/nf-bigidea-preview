<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Everest</title>
<style>
  :root{ --ink:#1f2327; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#c9d8e6;overflow:hidden;
    font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #c{display:block;position:fixed;inset:0}
  .plate{position:fixed;left:6vw;top:16vh;z-index:2;color:var(--ink)}
  .plate h1{font-size:clamp(28px,4.6vw,64px);font-weight:600;line-height:1.06;
    letter-spacing:-.015em}
  .plate p{margin-top:14px;font-size:clamp(15px,1.35vw,19px);font-weight:440;
    line-height:1.5;max-width:34ch;opacity:.82}
  .meta{position:fixed;left:6vw;bottom:9vh;z-index:2;text-align:left;
    font-family:"Space Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.06em;
    color:#fff;opacity:.9;line-height:1.9;text-shadow:0 1px 10px rgba(0,0,0,.45)}
  #load{position:fixed;inset:0;display:grid;place-items:center;z-index:5;
    background:#c9d8e6;font-family:"Space Mono",ui-monospace,monospace;
    font-size:11px;letter-spacing:.12em;color:#5a6570;transition:opacity .8s}
  #load.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="plate">
  <h1>It starts eight kilometres up.</h1>
  <p>Air moves. What it carries does not stop at the summit.</p>
</div>
<div class="meta">27&deg;59&prime;17&Prime;N&nbsp; 86&deg;55&prime;31&Prime;E<br>8 848 m<br>elevation and imagery, measured</div>
<div id="load">LOADING TERRAIN</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

/* --- sky: a real gradient, deep at altitude, pale at the horizon --------- */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(90000, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    uniforms:{ top:{value:new THREE.Color(0x5f8fc4)}, bot:{value:new THREE.Color(0xdfe8f0)} },
    vertexShader:`varying float h; void main(){ h = normalize(position).y;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying float h; uniform vec3 top; uniform vec3 bot;
      void main(){ float t = pow(clamp(h*1.05+0.05,0.0,1.0), 0.82);
        gl_FragColor = vec4(mix(bot, top, t), 1.0); }`
  })
);
scene.add(sky);
scene.fog = new THREE.FogExp2(0xcfdeea, 0.0000185);   // real Himalayan haze over tens of km

const camera = new THREE.PerspectiveCamera(26, innerWidth/innerHeight, 30, 400000);

/* --- sun: low from the east, the light Everest is actually photographed in */
const sun = new THREE.DirectionalLight(0xfff0dc, 3.6);
sun.position.set(7400, 5200, 6200);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const S = 9000;
Object.assign(sun.shadow.camera, {left:-S, right:S, top:S, bottom:-S, near:1000, far:40000});
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 12;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xa8c8e8, 0x6b7684, 1.25));   // lift the shadow side off black

const SUMMIT = new THREE.Vector3(152, 8750, 580);
const VIEWS = {
  hero:  [-3900, 7950, 4150],
  wide:  [-4900, 8150, 5000],
  low:   [-3200, 7700, 3500],
  north: [ 3600, 7950, 3900],
  far:   [-12000, 11500, 19000],
  seat:  [-8000, 8200, 14000],
};
const view = VIEWS[q.get('v')] || VIEWS.hero;
camera.position.set(...view);
camera.lookAt(SUMMIT);

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);

/* The hero tile is 11.8 x 8.9 km and its cut sides show from any angle that
   looks past them. Hiding them under cloud failed -- the cloud has gaps. So this
   is 118 km of the real Khumbu around it, at a resolution matched to how far
   away it is. Georeferenced to the same origin, so the two line up. */
loader.load('./terrain/out/khumbu_wide_opt.glb', g => {
  g.scene.traverse(o => {
    if (o.isMesh) {
      o.receiveShadow = true;
      o.material.roughness = 0.98; o.material.metalness = 0.0;
      if (o.material.map) o.material.map.colorSpace = THREE.SRGBColorSpace;
      o.material.needsUpdate = true;
      o.renderOrder = -1;
    }
  });
  scene.add(g.scene);
});

loader.load('./terrain/out/ring_mid_opt.glb', g => {
  g.scene.traverse(o => {
    if (o.isMesh) {
      o.receiveShadow = true;
      o.material.roughness = 0.97; o.material.metalness = 0.0;
      if (o.material.map) o.material.map.colorSpace = THREE.SRGBColorSpace;
      o.material.needsUpdate = true;
      o.renderOrder = -1;
    }
  });
  scene.add(g.scene);
});

loader.load('./terrain/out/everest_hero_opt.glb', gltf => {
  gltf.scene.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      const m = o.material;
      m.roughness = 0.97; m.metalness = 0.0;
      if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
      m.needsUpdate = true;
    }
  });
  scene.add(gltf.scene);
  document.getElementById('load').classList.add('gone');
  window.__ready = true;
}, undefined, e => { window.__err = String(e); document.getElementById('load').textContent = 'TERRAIN FAILED'; });

const HEIGHT_META = {hmin:5332.8, hmax:8750.2, spanX:11795.3, spanZ:8905.6};
const HEIGHT_TEX = new THREE.TextureLoader().load('./terrain/out/everest_hero_height.webp');
HEIGHT_TEX.wrapS = HEIGHT_TEX.wrapT = THREE.ClampToEdgeWrapping;
HEIGHT_TEX.minFilter = HEIGHT_TEX.magFilter = THREE.LinearFilter;
HEIGHT_TEX.colorSpace = THREE.NoColorSpace;

/* --- cloud sea ------------------------------------------------------------
   One plane, one baked texture. The lighting -- lit tops, shadowed bases -- is
   baked into the RGB, which is what makes it read as a body instead of a filter.
   The terrain height texture fades it out against rock, which is what killed the
   hard edge the first plane showed. */
const CLOUD_TEX = new THREE.TextureLoader().load('./terrain/out/cloudsea.webp');
CLOUD_TEX.wrapS = CLOUD_TEX.wrapT = THREE.RepeatWrapping;
CLOUD_TEX.colorSpace = THREE.SRGBColorSpace;
CLOUD_TEX.anisotropy = 8;

// The terrain is a 11.8 x 8.9 km tile and its boundary tops out at 7527 m.
// Putting the deck above that submerges the rectangular cut edge completely, so
// no camera angle can ever see it. Measured, not guessed.
// The terrain is a 11.8 x 8.9 km tile whose boundary tops out at 7527 m, so the
// cloud base sits just above that and the rectangular cut edge can never be seen.
/* --- cloud sea ------------------------------------------------------------
   Back to the version that actually looked like cloud: one plane, one baked
   texture, with the lighting -- lit tops, cool shadowed bases -- baked into the
   RGB rather than applied at runtime. That is what makes it a body and not a
   filter.

   It was ruined by being asked to hide the tile edge as well. Raising it to
   submerge the cut drowned the mountain; turning it into a displaced mesh made
   it a band on the horizon. Real terrain hides the edge now, so the cloud only
   has to be beautiful. */
const CLOUD_Y = 7150;
const cloudSea = new THREE.Mesh(
  new THREE.PlaneGeometry(300000, 300000, 1, 1),
  new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    uniforms: {
      uTex:{value:CLOUD_TEX}, uHeight:{value:HEIGHT_TEX},
      uTime:{value:0}, uY:{value:CLOUD_Y},
      uHmin:{value:HEIGHT_META.hmin}, uHmax:{value:HEIGHT_META.hmax},
      uSpanX:{value:HEIGHT_META.spanX}, uSpanZ:{value:HEIGHT_META.spanZ},
      uHorizon:{value:new THREE.Color(0xdbe6f0)},
    },
    vertexShader:`
      varying vec3 vW;
      void main(){
        vec4 wp = modelMatrix * vec4(position,1.0); vW = wp.xyz;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader:`
      varying vec3 vW;
      uniform sampler2D uTex, uHeight;
      uniform float uTime, uY, uHmin, uHmax, uSpanX, uSpanZ;
      uniform vec3 uHorizon;
      void main(){
        vec2 uv = vW.xz / 21000.0 + vec2(uTime * 0.0011, uTime * 0.0004);
        vec4 c  = texture2D(uTex, uv);
        // a second, larger, slower tap so the tiling never shows
        vec4 c2 = texture2D(uTex, vW.xz / 53000.0 - vec2(uTime * 0.0005, 0.0));
        c = mix(c, c2, 0.44);

        // thin out against rock so the peaks rise out of it, no hard waterline
        vec2 tuv = vec2(vW.x / uSpanX + 0.5, 0.5 - vW.z / uSpanZ);
        float terrain = uHmin;
        if (tuv.x > 0.0 && tuv.x < 1.0 && tuv.y > 0.0 && tuv.y < 1.0)
          terrain = uHmin + texture2D(uHeight, tuv).r * (uHmax - uHmin);
        float clear = smoothstep(0.0, 380.0, uY - terrain);

        float dist = length(vW.xz - cameraPosition.xz);
        float near = smoothstep(700.0, 3400.0, dist);
        float haze = smoothstep(26000.0, 120000.0, dist);
        float a = c.a * clear * near * (1.0 - haze * 0.20);
        if (a < 0.006) discard;
        gl_FragColor = vec4(mix(c.rgb, uHorizon, haze * 0.88), a);
      }`,
  })
);
cloudSea.rotation.x = -Math.PI / 2;
cloudSea.position.y = CLOUD_Y;
cloudSea.renderOrder = 2;
scene.add(cloudSea);
CLOUD_TEX.repeat.set(1, 1);

/* --- controls: drag to orbit, wheel to zoom -------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(SUMMIT);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.42;
controls.zoomSpeed = 0.75;
controls.minDistance = 4200;
controls.maxDistance = 9000;
controls.minPolarAngle = 1.16;
controls.maxPolarAngle = Math.PI/2 + 0.06;   // slightly below the summit, looking up at it
controls.autoRotate = true;             // drifts until the visitor takes hold
controls.autoRotateSpeed = 0.16;
controls.addEventListener('start', () => { controls.autoRotate = false; });
controls.update();

/* The camera orbits, so a fixed sun leaves half the rotation looking at an
   unlit black mass. Keep the sun off the camera's shoulder. */
const SUN_R = 14000, SUN_H = 8200, SUN_OFF = 0.85;
scene.add(sun.target);
function trackSun() {
  const dx = camera.position.x - SUMMIT.x, dz = camera.position.z - SUMMIT.z;
  const az = Math.atan2(dz, dx) + SUN_OFF;
  sun.position.set(SUMMIT.x + Math.cos(az) * SUN_R, SUMMIT.y + SUN_H,
                   SUMMIT.z + Math.sin(az) * SUN_R);
  sun.target.position.copy(SUMMIT);
  sun.target.updateMatrixWorld();
}

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  cloudSea.material.uniforms.uTime.value = t;
  trackSun();
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

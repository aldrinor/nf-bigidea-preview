<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Everest</title>
<style>
  :root{ --ink:#1f2327; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#c9d8e6;overflow:hidden;
    font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #c{display:block;position:fixed;inset:0}
  .plate{position:fixed;left:6vw;top:16vh;z-index:2;color:var(--ink)}
  .plate h1{font-size:clamp(28px,4.6vw,64px);font-weight:600;line-height:1.06;
    letter-spacing:-.015em}
  .plate p{margin-top:14px;font-size:clamp(15px,1.35vw,19px);font-weight:440;
    line-height:1.5;max-width:34ch;opacity:.82}
  .meta{position:fixed;left:6vw;bottom:9vh;z-index:2;text-align:left;
    font-family:"Space Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.06em;
    color:#fff;opacity:.9;line-height:1.9;text-shadow:0 1px 10px rgba(0,0,0,.45)}
  #load{position:fixed;inset:0;display:grid;place-items:center;z-index:5;
    background:#c9d8e6;font-family:"Space Mono",ui-monospace,monospace;
    font-size:11px;letter-spacing:.12em;color:#5a6570;transition:opacity .8s}
  #load.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="plate">
  <h1>It starts eight kilometres up.</h1>
  <p>Air moves. What it carries does not stop at the summit.</p>
</div>
<div class="meta">27&deg;59&prime;17&Prime;N&nbsp; 86&deg;55&prime;31&Prime;E<br>8 848 m<br>elevation and imagery, measured</div>
<div id="load">LOADING TERRAIN</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('c');

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

/* --- sky: a real gradient, deep at altitude, pale at the horizon --------- */
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(90000, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false,
    uniforms:{ top:{value:new THREE.Color(0x5f8fc4)}, bot:{value:new THREE.Color(0xdfe8f0)} },
    vertexShader:`varying float h; void main(){ h = normalize(position).y;
      gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`varying float h; uniform vec3 top; uniform vec3 bot;
      void main(){ float t = pow(clamp(h*1.05+0.05,0.0,1.0), 0.82);
        gl_FragColor = vec4(mix(bot, top, t), 1.0); }`
  })
);
scene.add(sky);
scene.fog = new THREE.FogExp2(0xcfdeea, 0.000062);

const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 20, 200000);

/* --- sun: low from the east, the light Everest is actually photographed in */
const sun = new THREE.DirectionalLight(0xfff0dc, 3.6);
sun.position.set(7400, 5200, 6200);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const S = 9000;
Object.assign(sun.shadow.camera, {left:-S, right:S, top:S, bottom:-S, near:1000, far:40000});
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 12;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x9dc0e4, 0x5c6672, 0.85));

const SUMMIT = new THREE.Vector3(152, 8750, 580);
const VIEWS = {
  hero:  [-4300, 9700, 7600],
  wide:  [-7000, 10200, 10400],
  low:   [-3100, 8600, 6100],
  north: [ 3800, 10000, 8200],
};
const view = VIEWS[q.get('v')] || VIEWS.hero;
camera.position.set(...view);
camera.lookAt(SUMMIT);

new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).load('./terrain/out/everest_hero_opt.glb', gltf => {
  gltf.scene.traverse(o => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      const m = o.material;
      m.roughness = 0.97; m.metalness = 0.0;
      if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
      m.needsUpdate = true;
    }
  });
  scene.add(gltf.scene);
  document.getElementById('load').classList.add('gone');
  window.__ready = true;
}, undefined, e => { window.__err = String(e); document.getElementById('load').textContent = 'TERRAIN FAILED'; });

const HEIGHT_META = {hmin:5332.8, hmax:8750.2, spanX:11795.3, spanZ:8905.6};
const HEIGHT_TEX = new THREE.TextureLoader().load('./terrain/out/everest_hero_height.webp');
HEIGHT_TEX.wrapS = HEIGHT_TEX.wrapT = THREE.ClampToEdgeWrapping;
HEIGHT_TEX.minFilter = HEIGHT_TEX.magFilter = THREE.LinearFilter;
HEIGHT_TEX.colorSpace = THREE.NoColorSpace;

/* --- cloud sea: at 8 848 m the summit is above the deck --------------------
   Two drifting fbm layers on wide planes. The lower one is the deck the peak
   rises out of; the upper one is thin banner cloud crossing the face.        */
const CLOUD = `
  varying vec2 vUv; varying vec3 vW;
  uniform sampler2D uHeight;
  uniform float uHmin, uHmax, uSpanX, uSpanZ, uY;
  uniform float uTime, uScale, uCover, uSoft, uOpacity, uSeed, uSlab;
  uniform vec3  uColor;
  vec2 h2(vec2 p){ p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
    return fract(sin(p)*43758.5453)*2.0-1.0; }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(dot(h2(i+vec2(0,0)), f-vec2(0,0)),
                   dot(h2(i+vec2(1,0)), f-vec2(1,0)), u.x),
               mix(dot(h2(i+vec2(0,1)), f-vec2(0,1)),
                   dot(h2(i+vec2(1,1)), f-vec2(1,1)), u.x), u.y);
  }
  float fbm(vec2 p){
    float v = 0.0, a = 0.5;
    for(int i=0;i<4;i++){ v += a*noise(p); p = p*2.03 + 17.3; a *= 0.5; }
    return v;
  }
  void main(){
    vec2 p = (vUv-0.5)*uScale + vec2(uSeed*3.7, uSeed*-2.1);
    vec2 dr = vec2(uTime*0.010, uTime*0.004);
    float n = fbm(p + dr) * 0.6 + fbm(p*2.7 - dr*1.7) * 0.4;
    float d = smoothstep(uCover, uCover + uSoft, n*0.5+0.5);
    // fade the plane out at its own edges so it never shows a rim
    float edge = smoothstep(0.5, 0.30, length(vUv-0.5));
    // Where the slice passes through the mountain it would otherwise paint a
    // hard band across the rock. Sample the terrain and thin the cloud out as it
    // approaches the surface, the way real cloud does against a slope.
    vec2 tuv = vec2(vW.x / uSpanX + 0.5, 0.5 - vW.z / uSpanZ);
    float terrain = uHmin;
    if (tuv.x > 0.0 && tuv.x < 1.0 && tuv.y > 0.0 && tuv.y < 1.0)
      terrain = uHmin + texture2D(uHeight, tuv).r * (uHmax - uHmin);
    float clear = smoothstep(0.0, 620.0, uY - terrain);

    float a = d * edge * uOpacity * uSlab * clear;
    if (a < 0.004) discard;
    // lit from the same side as the sun, so the tops catch light
    float lit = smoothstep(uCover, uCover+0.30, n*0.5+0.5);
    gl_FragColor = vec4(mix(uColor*0.80, vec3(1.0), lit), a);
  }`;
const CLOUD_V = `varying vec2 vUv; varying vec3 vW;
  void main(){ vUv = uv;
    vec4 wp = modelMatrix * vec4(position,1.0); vW = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp; }`;

function cloudSlice({y, size, scale, cover, soft, opacity, color, seed, slab}) {
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(size, size, 1, 1),
    new THREE.ShaderMaterial({
      vertexShader: CLOUD_V, fragmentShader: CLOUD,
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: {
        uTime:{value:0}, uScale:{value:scale}, uCover:{value:cover},
        uSoft:{value:soft}, uOpacity:{value:opacity}, uSeed:{value:seed},
        uSlab:{value:slab}, uColor:{value:new THREE.Color(color)},
        uHeight:{value:HEIGHT_TEX}, uHmin:{value:HEIGHT_META.hmin},
        uHmax:{value:HEIGHT_META.hmax}, uSpanX:{value:HEIGHT_META.spanX},
        uSpanZ:{value:HEIGHT_META.spanZ}, uY:{value:y}
      }
    })
  );
  m.rotation.x = -Math.PI/2;
  m.position.y = y;
  m.renderOrder = 3;
  scene.add(m);
  return m;
}

/* A single plane always shows its own edge cutting the mountain. A stack of
   slices, each sampling the noise field at a different offset and fading at the
   top and bottom of the slab, reads as depth instead. */
function cloudStack({base, top, n, size, scale, cover, soft, opacity, color, drift}) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const f = i / (n - 1);                       // 0 at base, 1 at top
    const slab = Math.sin(Math.PI * f) ** 0.7;   // soft at both faces
    out.push(cloudSlice({
      y: base + (top - base) * f, size, scale,
      cover: cover + f * 0.10,                   // thins toward the top
      soft, opacity, color, seed: i * 1.31, slab: slab * (drift ?? 1)
    }));
  }
  return out;
}

// the deck the summit stands out of
// One thin deck, well below the visible ridges and small enough that it never
// reaches the horizon. A stack of wide planes saturates when seen near edge-on
// and that saturation front reads as a grey wash across the sky -- three
// separate artifacts came from that one fact. Not worth a fourth attempt.
const deck = cloudStack({base:5900, top:6400, n:4, size:34000, scale:5.0,
                         cover:0.30, soft:0.40, opacity:0.30, color:0xdae7f3});
// thin banner cloud streaming off the ridge
const banner = [];
const clouds = deck.concat(banner);

/* --- controls: drag to orbit, wheel to zoom -------------------------------- */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(SUMMIT);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.42;
controls.zoomSpeed = 0.75;
controls.minDistance = 3200;
controls.maxDistance = 26000;
controls.minPolarAngle = 0.30;          // never fly under the terrain
controls.maxPolarAngle = Math.PI/2 - 0.06;
controls.autoRotate = true;             // drifts until the visitor takes hold
controls.autoRotateSpeed = 0.16;
controls.addEventListener('start', () => { controls.autoRotate = false; });
controls.update();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  for (let i = 0; i < clouds.length; i++)
    clouds[i].material.uniforms.uTime.value = t * (i < 14 ? 1.0 : 1.7);
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>

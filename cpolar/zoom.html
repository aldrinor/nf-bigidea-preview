<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keep going down — C-POLAR</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="stylesheet" href="./design_tokens.css">
<style>
/* One continuous zoom. You start beside a human hair and fall inward; each
   specimen swells to fill the frame, holds while its health findings are
   read, then passes as the next one arrives out of nothing.
   This is why a scroll works where a static chart cannot: a hair is 70,000 nm
   and a smoke particle is 40 nm, and no single frame holds both. */

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: auto; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); -webkit-font-smoothing: antialiased; }

/* the scroller is tall; everything visible is pinned inside it */
#track { position: relative; }
#stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }

/* ---- the specimen ------------------------------------------------------ */
#field { position: absolute; inset: 0; }
/* The specimen sits RIGHT of centre so the left third stays quiet for the
   type - the same rule the five application screens follow. This has to be on
   the original rule, not a later override: an earlier attempt added
   ".spec { left: 64% }" above this block and lost, because at equal
   specificity the later rule wins. */
.spec {
  position: absolute; left: 64%; top: 50%;
  transform-origin: 50% 50%;
  will-change: transform, opacity;
  pointer-events: none;
}
.spec img { display: block; width: 100%; height: 100%; object-fit: contain; }

/* ---- the panel --------------------------------------------------------- */
#panel {
  position: absolute; z-index: 3; left: 68px; top: 50%; transform: translateY(-50%);
  width: 430px; max-width: 42vw;
  pointer-events: none;
}
/* A wash over the left of the frame so the type reads whatever is behind it.
   A pseudo-element on the panel could not do this - it would have to sit
   behind its own parent AND above the specimens, which is not possible in one
   stacking context. So it is its own layer, between the two. */
#veil {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  background: linear-gradient(to right,
              rgba(237,240,242,.99) 0%, rgba(237,240,242,.97) 28%,
              rgba(237,240,242,.86) 40%, rgba(237,240,242,.42) 50%,
              rgba(237,240,242,0) 60%);
}
@media (max-width: 900px){
  #veil { background: linear-gradient(to top,
          rgba(237,240,242,.95) 0%, rgba(237,240,242,.85) 34%,
          rgba(237,240,242,0) 62%); }
}
.p-mark { display: flex; align-items: center; gap: 11px; margin: 0 0 16px;
  font-size: 12.5px; font-weight: var(--w-bold); letter-spacing: .9px;
  color: var(--ink-strong); }
.p-mark i { width: 10px; height: 10px; transform: rotate(45deg);
  border: 1.5px solid var(--ink-strong); font-style: normal; }
.p-name { margin: 0 0 6px; font-size: 40px; line-height: 1.12;
  font-weight: var(--w-normal); letter-spacing: -.3px; color: var(--ink-strong); }
.p-size { margin: 0 0 22px; font-size: 16px; color: var(--ink-mid); opacity: 1; }
.p-reach { margin: 0 0 22px; padding-left: 16px;
  border-left: 2px solid var(--ink);
  font-size: 16px; line-height: 1.55; color: var(--ink-strong); }
.p-list { list-style: none; margin: 0; padding: 0; }
.p-list li { margin: 0 0 15px; padding: 0 0 15px;
  border-bottom: 1px solid var(--rule);
  font-size: 17px; line-height: 1.55; color: var(--ink-strong); }
.p-list li:last-child { border-bottom: 0; }
#panel.swap { opacity: 0; }
#panel { transition: opacity .28s var(--ease); }

/* ---- the scale readout, bottom right ----------------------------------- */
#hud { position: absolute; right: 60px; bottom: 54px; text-align: right; }
#hud .now { margin: 0; font-size: 13px; letter-spacing: .8px;
  color: var(--ink); opacity: .55; }
#hud .mag { margin: 4px 0 0; font-size: 26px; font-weight: var(--w-normal);
  color: var(--ink-strong); font-variant-numeric: tabular-nums; }

/* the ladder of what is coming */
#ladder { position: absolute; right: 60px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 13px; align-items: flex-end; }
/* was opacity .34 over a bright specimen and Codex called it illegible.
   The menu now carries its own small backing so it reads on any frame. */
#ladder { background: linear-gradient(to left, rgba(237,240,242,.92) 0%,
          rgba(237,240,242,.72) 62%, rgba(237,240,242,0) 100%);
  padding: 18px 0 18px 42px; border-radius: 3px; }
#ladder button { background: none; border: 0; padding: 2px 0; cursor: pointer;
  font: inherit; font-size: 13.5px; letter-spacing: .3px;
  color: var(--ink-mid); opacity: .78; transition: opacity .2s var(--ease), color .2s var(--ease); }
#ladder button:hover { opacity: 1; }
/* the two that share a size are bracketed together */
#ladder button.twin-top { position: relative; }
#ladder button.twin-top::after {
  content: "both about 100 nm"; position: absolute; right: 0; top: 100%;
  margin-top: 1px; font-size: 10.5px; letter-spacing: .2px;
  color: var(--ink); opacity: .5; white-space: nowrap;
}
#ladder button.twin-bot { margin-top: 15px; }
#ladder button[aria-current="true"] { opacity: 1; color: var(--ink-strong);
  font-weight: var(--w-semi); }

/* ---- the opening and closing cards ------------------------------------- */
.card { position: absolute; z-index: 3; left: 68px; top: 50%; transform: translateY(-50%);
  width: 560px; max-width: 46vw; }
.card h1 { margin: 0 0 20px; font-size: var(--t-title); line-height: 1.14;
  font-weight: var(--w-normal); letter-spacing: -.3px; color: var(--ink-strong); }
.card p { margin: 0 0 14px; font-size: var(--t-body); line-height: var(--lh-body);
  color: var(--ink-mid); max-width: 46ch; }
.scroll-cue { margin-top: 26px; font-size: 13px; letter-spacing: .9px;
  color: var(--ink); opacity: .55; }

#foot { position: relative; z-index: 2; background: var(--bg);
  padding: 60px 68px 90px; }
#foot p { margin: 0; max-width: 82ch; font-size: 12.5px; line-height: 1.65;
  color: var(--ink); opacity: .64; }

@media (max-width: 900px) {
  .spec { left: 50%; top: 36%; }
  #panel, .card { left: 22px; width: auto; right: 22px; max-width: none; }
  #panel { top: auto; bottom: 26px; transform: none; }
  .p-name { font-size: 27px; }
  .p-list li { font-size: 14px; }
  .p-list li:nth-child(n+3) { display: none; }
  #ladder { display: none; }
  #hud { right: 22px; bottom: auto; top: 22px; }
  #foot { padding: 44px 22px 64px; }
}
@media (prefers-reduced-motion: reduce) { .spec { transition: none !important; } }
</style>
</head>
<body>

<div id="track">
  <div id="stage">
    <div id="field"></div>
    <div id="veil"></div>

    <div class="card" id="intro">
      <h1>Keep going down.</h1>
      <p>You are looking at a human hair. Everything C&#8209;POLAR is built to deal
         with is smaller than this — most of it thousands of times smaller.</p>
      <p>Scroll, and you fall inward. Each thing you pass is drawn at its true
         size against the one before it.</p>
      <p class="scroll-cue">Scroll down</p>
    </div>

    <div id="panel" hidden></div>

    <div id="ladder"></div>
    <div id="hud"><p class="now">you are here</p><p class="mag" id="mag"></p></div>
  </div>
</div>

<div id="foot"><p id="footText"></p></div>

<script src="./chart_data.js"></script>
<script>
(function(){
  var D = window.CHART_DATA;

  /* ---- the journey, largest first --------------------------------------
     `nm` is the real diameter. `art` is the photoreal render. Everything the
     zoom does is derived from nm, so the scale is honest by construction. */
  var STOPS = [
    {name:'A human hair', nm:70000, size:'70 µm', art:'assets/specimens/p_Hair.webp',
     reach:'Far too large to breathe in. It is here only so you have something to measure against.',
     impacts:[], ref:true},
    {name:'Pollen', nm:15000, size:'About 15 µm', art:'assets/specimens/p_Pollen.webp',
     reach:'Caught mostly in the nose and throat.',
     impacts:['The classic outdoor allergen — but it does not stay outside, and it does not stay whole.']},
    {name:'Fungal spores', nm:2500, size:'2 to 3 µm', art:'assets/specimens/p_Fungal_Spore.webp'},
    {name:'Bacteria', nm:1000, size:'0.5 to 2 µm', art:'assets/specimens/p_Bacteria.webp'},
    {name:'Viruses', nm:100, size:'About 100 nm', art:'assets/specimens/p_Virus.webp'},
    {name:'Ultrafine particles', nm:100, size:'Under 100 nm', art:'assets/specimens/p_Ultrafine_Particle.webp'},
    {name:'Wildfire smoke', nm:40, size:'30 to 50 nm', art:'assets/specimens/p_Wildfire_Smoke_Particle.webp'},
    {name:'PFAS', nm:1, size:'About 1 nm', art:'assets/specimens/p_PFAS.webp',
     reach:'A single molecule. Small enough that no filter mesh can strain it out.',
     impacts:['Known as forever chemicals because the bond that holds them together does not break down in the environment or in the body.']}
  ];

  /* fold in the measured sizes, the caveats and the sourced findings that are
     already in chart_data.js, so there is one source of truth for all of it */
  STOPS.forEach(function(s){
    var m = D.items.filter(function(i){ return i.name === s.name; })[0];
    if (!m) return;
    s.nm = m.nm; s.size = m.size;
    s.reach = s.reach || m.reach;
    s.note = m.note;
    if (!s.impacts) s.impacts = m.impacts.map(function(x){ return x.text; });
  });

  var field = document.getElementById('field');
  var panel = document.getElementById('panel');
  var intro = document.getElementById('intro');
  var ladder = document.getElementById('ladder');
  var magEl = document.getElementById('mag');

  /* ---- the zoom ---------------------------------------------------------
     Scroll maps LINEARLY to the logarithm of magnification, and each specimen
     is placed at its real diameter. Everything else falls out of that:

       screen size = real nm x zoom

     So the time you spend travelling between two things is proportional to
     the log of their real size ratio. Hair to pollen is 4.7:1 and passes
     quickly; wildfire smoke to PFAS is 40:1 and takes eight times longer.
     A virus and an ultrafine particle are both about 100 nm, so they arrive
     together rather than one after the other - which is the truth.

     The first version gave every stop an equal share of the scroll, which
     made a 1:1 step and a 40:1 step feel identical. That threw away the very
     thing the page exists to show. */

  var DEC_PER_SCREEN = 0.62;        /* decades of zoom per screen of scroll */
  var LEAD = 1.0;                   /* screens before the journey starts    */
  var TAIL = 1.1;

  var nmMax = Math.max.apply(null, STOPS.map(function(s){ return s.nm; }));
  var nmMin = Math.min.apply(null, STOPS.map(function(s){ return s.nm; }));
  var decades = Math.log10(nmMax / nmMin);
  var travel = decades / DEC_PER_SCREEN;

  document.getElementById('track').style.height =
    ((LEAD + travel + TAIL) * 100) + 'vh';

  /* two things sit at 100 nm; nudge them apart so both can be seen */
  var seen = {};
  STOPS.forEach(function(s){
    var k = String(s.nm);
    s.dx = seen[k] ? 0.30 : (seen[k] = true, 0);
    if (s.dx) s.dx = 0.30; else s.dx = 0;
  });
  STOPS.forEach(function(s, i){
    var twin = STOPS.filter(function(o){ return o.nm === s.nm; });
    if (twin.length > 1) s.dx = (twin.indexOf(s) === 0 ? -0.26 : 0.26);
  });

  var nodes = STOPS.map(function(s, i){
    var el = document.createElement('div');
    el.className = 'spec';
    el.innerHTML = '<img src="' + s.art + '" alt="" draggable="false">';
    el.style.opacity = '0';
    field.appendChild(el);

    var b = document.createElement('button');
    b.type = 'button';
    /* A virus and an ultrafine particle are both about 100 nm. Listed one
       under the other they looked like consecutive steps down, which is
       wrong - you arrive at both together. Brace them so the menu says so. */
    var twins = STOPS.filter(function(o){ return o.nm === s.nm; });
    b.textContent = s.name;
    if (twins.length > 1) b.classList.add(twins.indexOf(s) === 0 ? 'twin-top' : 'twin-bot');
    b.addEventListener('click', function(){
      /* a virus and an ultrafine particle are both about 100 nm, so the
         "closest to hero size" test cannot separate them. A click pins the
         one you asked for, and the pin releases once its size is behind you. */
      pinned = i;
      window.scrollTo({top: scrollFor(s.nm), behavior: 'smooth'});
    });
    ladder.appendChild(b);
    return {el: el, btn: b, s: s};
  });

  var vh = window.innerHeight, vw = window.innerWidth;
  window.addEventListener('resize', function(){ vh = window.innerHeight; vw = window.innerWidth; });
  /* On a phone the panel sits at the BOTTOM, not beside the specimen, so the
     specimen is not competing with it for width and can be far larger. On
     desktop it must leave the left third clear for the type. */
  var HERO = function(){
    return vw < 900 ? Math.min(vh * 0.44, vw * 0.82)
                    : Math.min(vh * 0.58, vw * 0.40);
  };

  /* zoom is 1 when the largest thing is at hero size, and grows from there */
  function zoomAt(t){                       /* t = screens scrolled */
    var into = Math.max(0, t - LEAD);
    return Math.pow(10, into * DEC_PER_SCREEN);
  }
  function scrollFor(nm){                   /* where that size fills the frame */
    var into = Math.log10(nmMax / nm) / DEC_PER_SCREEN;
    return (LEAD + into) * window.innerHeight;
  }

  var current = -1, pinned = -1;
  function paint(i){
    if (i === current) return;
    current = i;
    nodes.forEach(function(n, k){ n.btn.setAttribute('aria-current', k === i ? 'true' : 'false'); });
    if (i < 0){ panel.hidden = true; intro.style.opacity = '1'; return; }
    intro.style.opacity = '0';
    var s = STOPS[i];
    panel.hidden = false;
    panel.classList.add('swap');
    setTimeout(function(){
      panel.innerHTML =
        '<p class="p-mark"><i></i>' + (s.ref ? 'For scale' : 'What it does') + '</p>' +
        '<h2 class="p-name">' + s.name + '</h2>' +
        '<p class="p-size">' + s.size + '</p>' +
        (s.reach ? '<p class="p-reach">' + s.reach + '</p>' : '') +
        '<ul class="p-list">' +
          (s.impacts || []).slice(0, 4).map(function(t){ return '<li>' + t + '</li>'; }).join('') +
        '</ul>';
      panel.classList.remove('swap');
    }, 170);
  }

  function frame(){
    var t = (window.scrollY || 0) / vh;
    var z = zoomAt(t), hero = HERO();
    var best = -1, bestGap = 1e9;

    for (var i = 0; i < STOPS.length; i++){
      var s = STOPS[i], n = nodes[i];
      var d = (s.nm / nmMax) * hero * z;          /* true size on screen */

      if (d < 3 || d > vw * 7){
        if (n.el.style.opacity !== '0') n.el.style.opacity = '0';
        continue;
      }
      /* in as it emerges from nothing, out as it sweeps past the viewer */
      var o = 1;
      if (d < hero * 0.16) o = d / (hero * 0.16);
      if (d > hero * 1.5)  o = Math.max(0, 1 - (d - hero * 1.5) / (hero * 2.2));

      n.el.style.width  = d.toFixed(1) + 'px';
      n.el.style.height = d.toFixed(1) + 'px';
      n.el.style.transform = 'translate(calc(-50% + ' + (s.dx * hero).toFixed(1) + 'px),-50%)';
      /* Codex: "obscure which object is approaching versus receding". A real
         lens loses focus on what has swept past the plane you are looking at,
         so anything much larger than hero size goes soft while what is still
         arriving stays crisp. */
      /* A first attempt blurred up to 16px and Codex scored it DOWN, from 6
         to 4: the receding specimens became featureless clouds and the sense
         of a continuous descent went with them. The silhouette has to survive,
         so this is a hint of defocus, not a veil. */
      var past = Math.max(0, (d / hero) - 1.8);
      n.el.style.filter = past > 0 ? 'blur(' + Math.min(past * 1.4, 4).toFixed(1) + 'px)' : 'none';
      n.el.style.opacity = o.toFixed(3);
      n.el.style.zIndex = String(100 - i);

      var gap = Math.abs(Math.log(d / hero));
      if (o > 0.55 && gap < bestGap){ bestGap = gap; best = i; }
    }

    /* honour a pin while that specimen is still near reading size */
    if (pinned >= 0){
      var pd = (STOPS[pinned].nm / nmMax) * hero * z;
      if (pd > hero * 0.16 && pd < hero * 2.2) best = pinned; else pinned = -1;
    }
    paint(t < LEAD * 0.75 ? -1 : best);
    magEl.textContent = best >= 0 ? STOPS[best].size : '';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.getElementById('footText').textContent =
    'Every specimen is drawn at its true size relative to the one before it — the zoom is '
    + 'computed from the real diameters, so the journey from a 70 µm hair down to a 1 nm PFAS '
    + 'molecule is seventy thousand to one, travelled continuously. Sizes and health findings '
    + 'are carried over unchanged from the C-POLAR pollutant decks, which cite the World Health '
    + 'Organization, the US Environmental Protection Agency, the Health Effects Institute and '
    + 'the studies named on each deck. Each has a range; the figure shown is the one those '
    + 'decks work from. Airborne viruses and bacteria usually travel inside a larger droplet, '
    + 'so the particle actually breathed in is bigger than the organism drawn here. The renders '
    + 'are illustrative, not micrographs.';
})();
</script>
</body>
</html>

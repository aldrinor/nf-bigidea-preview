<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Screen 2 halo — scroll to scrub</title>
<style>html,body{margin:0;height:100%;background:#edf0f2;overflow:hidden;font-family:-apple-system,system-ui,Inter,sans-serif}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#edf0f2}
.hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;color:#5a6066;font-size:14px;z-index:5;pointer-events:none;transition:opacity .4s}
.hl{position:fixed;left:3vw;top:50%;transform:translateY(-50%);z-index:4;color:#1a1a1a;font-size:clamp(24px,3vw,44px);font-weight:600;line-height:1.15;letter-spacing:-.02em;max-width:44%}
.hl .r{color:#e23b3b;font-weight:700}</style></head>
<body>
<video id="v" src="screen2_full.mp4?v=1" muted playsinline preload="auto"></video>
<div class="hl">Most harmful pollutants<br>carry an <span class="r">electric charge.</span></div>
<div class="hint" id="hint">scroll down &nbsp;↓&nbsp; polluted room → devices power on → pollution sucked in → clean</div>
<script>
var v=document.getElementById('v'), hint=document.getElementById('hint');
var target=0, cur=0, dur=4;
v.addEventListener('loadedmetadata',function(){ dur=v.duration||4; v.pause(); v.currentTime=0; });
function tick(){ cur += (target-cur)*0.12; if(Math.abs(target-cur)<0.001) cur=target; try{ v.currentTime = cur*dur*0.999; }catch(e){} requestAnimationFrame(tick); }
requestAnimationFrame(tick);
function onWheel(e){ e.preventDefault(); target = Math.max(0, Math.min(1, target + (e.deltaY>0?0.12:-0.12))); if(target>0.02) hint.style.opacity=0; }
window.addEventListener('wheel', onWheel, {passive:false});
var ty=null; window.addEventListener('touchstart',function(e){ty=e.touches[0].clientY;},{passive:true});
window.addEventListener('touchmove',function(e){ if(ty==null)return; var dy=ty-e.touches[0].clientY; ty=e.touches[0].clientY; target=Math.max(0,Math.min(1,target+dy*0.004)); if(target>0.02)hint.style.opacity=0; e.preventDefault(); },{passive:false});
</script>
</body></html>

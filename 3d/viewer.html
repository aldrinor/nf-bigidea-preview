<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFOS Molecular Viewer - Charge Cloud</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
            z-index: 10;
        }

        #info-panel h1 {
            font-size: 18px;
            margin: 0 0 10px 0;
            font-weight: 500;
            letter-spacing: 1px;
        }

        #info-panel p {
            font-size: 12px;
            line-height: 1.5;
            margin: 0;
            color: #cccccc;
        }

        .charge-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff1133;
            box-shadow: 0 0 8px #ff1133;
            margin-right: 6px;
            vertical-align: middle;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>PFOS Specimen</h1>
        <p>
            <span class="charge-indicator"></span>Perfluorooctanesulfonic acid<br><br>
            The soft red field represents the negative electrostatic charge cloud of the pollutant, indicating its anionic state in solution.
        </p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // --- Core Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // --- Environment / IBL ---
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // --- Lighting (Subtle direct light to complement IBL) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        // --- Variables for Model and Cloud ---
        let modelGroup = new THREE.Group();
        scene.add(modelGroup);
        let chargeCloud = null;
        let modelBoundingRadius = 1;

        // --- Load GLTF Model ---
        const loader = new GLTFLoader();
        loader.load('PFOS.glb', (gltf) => {
            const model = gltf.scene;
            
            // Apply glossy atom materials
            model.traverse((child) => {
                if (child.isMesh) {
                    const oldMat = child.material;
                    child.material = new THREE.MeshPhysicalMaterial({
                        color: oldMat.color ? oldMat.color.clone() : new THREE.Color(0xffffff),
                        metalness: 0.1,
                        roughness: 0.15,
                        clearcoat: 1.0,
                        clearcoatRoughness: 0.1,
                        vertexColors: oldMat.vertexColors,
                        envMapIntensity: 1.2
                    });
                }
            });

            // Center the model and compute bounding sphere
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            modelBoundingRadius = maxDim / 2;

            model.position.sub(center); // Center model at origin
            modelGroup.add(model);

            // Adjust camera to fit model
            const fitDistance = modelBoundingRadius / Math.tan(Math.PI * camera.fov / 360);
            camera.position.set(0, 0, fitDistance * 1.8);
            controls.update();

            // Create the charge cloud now that we know the size
            createChargeCloud(modelBoundingRadius * 1.6);

        }, undefined, (error) => {
            console.error('Error loading PFOS.glb:', error);
        });

        // --- Charge Cloud Creation ---
        function createChargeCloud(radius) {
            const particleCount = 2000;
            const positions = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const phases = new Float32Array(particleCount);

            // Distribute particles in a spherical shell with some depth
            for (let i = 0; i < particleCount; i++) {
                // Vary radius slightly to create volume rather than a hard shell
                const r = radius * (0.7 + Math.random() * 0.3);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);

                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                sizes[i] = 1.5 + Math.random() * 2.5; // Varied particle sizes
                phases[i] = Math.random() * Math.PI * 2; // Random twinkle phase
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
            geometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));

            // Generate a soft radial gradient texture for premium volumetric look
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(0.5, 'rgba(255,255,255,0.3)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            const particleTexture = new THREE.CanvasTexture(canvas);

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uTexture: { value: particleTexture },
                    uColor: { value: new THREE.Color(0xff1133) },
                    uPixelRatio: { value: window.devicePixelRatio }
                },
                vertexShader: `
                    attribute float aSize;
                    attribute float aPhase;
                    uniform float uTime;
                    uniform float uPixelRatio;
                    varying float vAlpha;
                    
                    void main() {
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = aSize * uPixelRatio * (300.0 / -mvPosition.z);
                        gl_Position = projectionMatrix * mvPosition;
                        
                        // Gentle twinkle/pulse per particle
                        vAlpha = 0.4 + 0.6 * (0.5 + 0.5 * sin(uTime * 1.5 + aPhase));
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uTexture;
                    uniform vec3 uColor;
                    varying float vAlpha;
                    
                    void main() {
                        vec4 tex = texture2D(uTexture, gl_PointCoord);
                        // Keep overall opacity very low so it doesn't obscure the molecule
                        gl_FragColor = vec4(uColor, tex.a * vAlpha * 0.12);
                    }
                `,
                transparent: true,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });

            chargeCloud = new THREE.Points(geometry, material);
            modelGroup.add(chargeCloud); // Add to modelGroup so it stays centered during orbit
        }

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (chargeCloud) {
                // Update shader time for twinkling
                chargeCloud.material.uniforms.uTime.value = elapsedTime;
                
                // Gentle breathing/pulsing of the entire cloud
                const pulse = 1.0 + Math.sin(elapsedTime * 0.5) * 0.03;
                chargeCloud.scale.setScalar(pulse);
                
                // Slow drift/swirl
                chargeCloud.rotation.y += 0.0005;
                chargeCloud.rotation.x += 0.0002;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>

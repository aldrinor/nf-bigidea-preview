<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFOS Molecular Viewer - Charge Cloud</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
            z-index: 10;
        }

        #info-panel h1 {
            font-size: 18px;
            margin: 0 0 10px 0;
            font-weight: 500;
            letter-spacing: 1px;
        }

        #info-panel p {
            font-size: 12px;
            line-height: 1.5;
            margin: 0;
            color: #cccccc;
        }

        .charge-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff1133;
            box-shadow: 0 0 8px #ff1133;
            margin-right: 6px;
            vertical-align: middle;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>PFOS Specimen</h1>
        <p>
            <span class="charge-indicator"></span>Perfluorooctanesulfonic acid<br><br>
            The soft red field represents the negative electrostatic charge cloud of the pollutant, indicating its anionic state in solution.
        </p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // --- Core Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // --- Environment / IBL ---
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // --- Lighting (Subtle direct light to complement IBL) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        // --- Variables for Model and Cloud ---
        let modelGroup = new THREE.Group();
        scene.add(modelGroup);
        let chargeCloud = null;
        let auraMaterial = null;
        let modelBoundingRadius = 1;

        // --- Load GLTF Model ---
        const loader = new GLTFLoader();
        loader.load('PFOS.glb', (gltf) => {
            const model = gltf.scene;
            
            // Apply glossy atom materials
            model.traverse((child) => {
                if (child.isMesh) {
                    const oldMat = child.material;
                    child.material = new THREE.MeshPhysicalMaterial({
                        color: oldMat.color ? oldMat.color.clone() : new THREE.Color(0xffffff),
                        metalness: 0.1,
                        roughness: 0.15,
                        clearcoat: 1.0,
                        clearcoatRoughness: 0.1,
                        vertexColors: oldMat.vertexColors,
                        envMapIntensity: 1.2
                    });
                }
            });

            // Center the model and compute bounding sphere
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            modelBoundingRadius = maxDim / 2;

            model.position.sub(center); // Center model at origin
            modelGroup.add(model);

            // Adjust camera to fit model
            const fitDistance = modelBoundingRadius / Math.tan(Math.PI * camera.fov / 360);
            camera.position.set(0, 0, fitDistance * 1.8);
            controls.update();

            // Create the charge cloud now that we know the size
            createChargeCloud(model);

        }, undefined, (error) => {
            console.error('Error loading PFOS.glb:', error);
        });

        // --- Charge Cloud Creation ---
        // Conforming aura: clones the entire model, replaces every mesh material
        // with a single smooth red fresnel-emission additive material, and scales
        // the clone uniformly so the glow hugs the true molecular silhouette.
        function createChargeCloud(model) {
            // Single shared fresnel shader material for the whole clone.
            auraMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uColor: { value: new THREE.Color(0xff1133) },
                    uPower: { value: 4.0 }, // Sharpened fresnel for thinner rim
                    uIntensity: { value: 0.4 } // Lowered intensity to prevent solid blobs
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vViewDir;
                    void main() {
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        vNormal = normalize(normalMatrix * normal);
                        vViewDir = normalize(-mvPosition.xyz);
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform vec3 uColor;
                    uniform float uPower;
                    uniform float uIntensity;
                    uniform float uTime;
                    varying vec3 vNormal;
                    varying vec3 vViewDir;
                    void main() {
                        // Fresnel: transparent facing camera, glowing red at grazing rim.
                        float f = 1.0 - max(dot(vNormal, vViewDir), 0.0);
                        float fresnel = pow(f, uPower);
                        // Gentle breathing pulse.
                        float pulse = 0.90 + 0.10 * sin(uTime * 0.6);
                        float alpha = fresnel * uIntensity * pulse;
                        // Deep-to-bright red: darker at faint edges, brighter near rim peak.
                        vec3 col = mix(uColor * 0.3, uColor * 1.7, fresnel);
                        gl_FragColor = vec4(col, alpha);
                    }
                `,
                transparent: true,
                depthWrite: false,
                depthTest: true,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide
            });

            // Clone the whole model so the aura exactly matches the molecule geometry.
            const auraGroup = model.clone(true);

            // Replace every mesh material with the single shared aura material.
            auraGroup.traverse((child) => {
                if (child.isMesh) {
                    child.material = auraMaterial;
                    child.renderOrder = -1;
                }
            });

            // Uniform scale so the glow sits just outside each real atom (tight hug).
            auraGroup.scale.setScalar(1.08); // Reduced scale for thinner shell
            // Keep aura centered with the model (model was already recentered to origin).
            auraGroup.position.set(0, 0, 0);

            chargeCloud = auraGroup;
            modelGroup.add(chargeCloud); // Parent to modelGroup so it orbits with the molecule.
        }

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (chargeCloud && auraMaterial) {
                // Update shader time for breathing pulse.
                auraMaterial.uniforms.uTime.value = elapsedTime;

                // Gentle breathing/pulsing of the entire aura (1.08x..1.10x).
                const pulse = 1.08 + Math.sin(elapsedTime * 0.5) * 0.02;
                chargeCloud.scale.setScalar(pulse);

                // Very slow drift/swirl.
                chargeCloud.rotation.y += 0.0004;
                chargeCloud.rotation.x += 0.00015;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>

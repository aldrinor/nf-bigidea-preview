<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFOS Molecular Viewer - Charge Cloud</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
            z-index: 10;
        }

        #info-panel h1 {
            font-size: 18px;
            margin: 0 0 10px 0;
            font-weight: 500;
            letter-spacing: 1px;
        }

        #info-panel p {
            font-size: 12px;
            line-height: 1.5;
            margin: 0;
            color: #cccccc;
        }

        .charge-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff1133;
            box-shadow: 0 0 8px #ff1133;
            margin-right: 6px;
            vertical-align: middle;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
          }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="info-panel">
        <h1>PFOS Specimen</h1>
        <p>
            <span class="charge-indicator"></span>Perfluorooctanesulfonic acid<br><br>
            The soft red field represents the negative electrostatic charge cloud of the pollutant, indicating its anionic state in solution.
        </p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

        // --- Core Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // --- Environment / IBL ---
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // --- Lighting (Subtle direct light to complement IBL) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        // --- Variables for Model and Cloud ---
        let modelGroup = new THREE.Group();
        scene.add(modelGroup);
        let chargeCloud = null;
        let modelBoundingRadius = 1;

        // --- Load GLTF Model ---
        const loader = new GLTFLoader();
        loader.load('PFOS.glb', (gltf) => {
            const model = gltf.scene;
            
            // Apply glossy atom materials
            model.traverse((child) => {
                if (child.isMesh) {
                    const oldMat = child.material;
                    child.material = new THREE.MeshPhysicalMaterial({
                        color: oldMat.color ? oldMat.color.clone() : new THREE.Color(0xffffff),
                        metalness: 0.1,
                        roughness: 0.15,
                        clearcoat: 1.0,
                        clearcoatRoughness: 0.1,
                        vertexColors: oldMat.vertexColors,
                        envMapIntensity: 1.2
                    });
                }
            });

            // Center the model and compute bounding sphere
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            modelBoundingRadius = maxDim / 2;

            model.position.sub(center); // Center model at origin
            modelGroup.add(model);

            // Adjust camera to fit model
            const fitDistance = modelBoundingRadius / Math.tan(Math.PI * camera.fov / 360);
            camera.position.set(0, 0, fitDistance * 1.8);
            controls.update();

            // Create the charge cloud now that we know the size
            createChargeCloud(model);

        }, undefined, (error) => {
            console.error('Error loading PFOS.glb:', error);
        });

        // --- Charge Cloud Creation ---
        // Conforming aura: duplicates each atom mesh, scales it up slightly, and
        // applies a red fresnel-emission additive material. The aura exactly
        // follows the molecule silhouette (thin elongated chain), hugging every
        // atom tightly instead of forming a large detached sphere.
        function createChargeCloud(model) {
            const group = new THREE.Group();
            const shellMaterials = [];

            // Shared fresnel shader: bright at grazing rim, transparent facing camera.
            const makeShellMaterial = (power, intensity, color, scale) => new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0 },
                    uColor: { value: new THREE.Color(color) },
                    uPower: { value: power },
                    uIntensity: { value: intensity },
                    uScale: { value: scale }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vViewDir;
                    varying vec3 vLocalPos;
                    void main() {
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        vNormal = normalize(normalMatrix * normal);
                        vViewDir = normalize(-mvPosition.xyz);
                        vLocalPos = position;
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform vec3 uColor;
                    uniform float uPower;
                    uniform float uIntensity;
                    uniform float uTime;
                    uniform float uScale;
                    varying vec3 vNormal;
                    varying vec3 vViewDir;
                    varying vec3 vLocalPos;
                    void main() {
                        // Fresnel: bright at silhouette, transparent facing camera.
                        float f = 1.0 - max(dot(vNormal, vViewDir), 0.0);
                        float fresnel = pow(f, uPower);
                        // Gentle breathing pulse.
                        float pulse = 0.88 + 0.12 * sin(uTime * 0.6);
                        // Subtle volumetric shimmer driven by position.
                        float shimmer = 0.92 + 0.08 * sin(uTime * 0.9 + vLocalPos.y * 3.0 + vLocalPos.x * 2.0);
                        float alpha = fresnel * uIntensity * pulse * shimmer;
                        // Deep-to-bright red: darker at faint edges, brighter near rim peak.
                        vec3 col = mix(uColor * 0.35, uColor * 1.6, fresnel);
                        gl_FragColor = vec4(col, alpha);
                    }
                `,
                transparent: true,
                depthWrite: false,
                depthTest: true,
                blending: THREE.AdditiveBlending,
                side: THREE.FrontSide
            });

            // Traverse the model and create a scaled shell for each atom mesh.
            // Using two layers: a tight inner shell (1.18x) and a softer outer
            // shell (1.45x) per atom, so the aura hugs the true molecular shape.
            model.traverse((child) => {
                if (child.isMesh && child.geometry) {
                    // Inner tight shell per atom.
                    const innerShell = new THREE.Mesh(child.geometry, makeShellMaterial(3.0, 0.85, 0xff1133, 1.18));
                    innerShell.scale.copy(child.scale).multiplyScalar(1.18);
                    innerShell.position.copy(child.position);
                    innerShell.quaternion.copy(child.quaternion);
                    innerShell.renderOrder = -2;
                    group.add(innerShell);
                    shellMaterials.push(innerShell.material);

                    // Outer soft falloff per atom.
                    const outerShell = new THREE.Mesh(child.geometry, makeShellMaterial(2.0, 0.4, 0xcc0a22, 1.45));
                    outerShell.scale.copy(child.scale).multiplyScalar(1.45);
                    outerShell.position.copy(child.position);
                    outerShell.quaternion.copy(child.quaternion);
                    outerShell.renderOrder = -1;
                    group.add(outerShell);
                    shellMaterials.push(outerShell.material);
                }
            });

            chargeCloud = group;
            chargeCloud.userData.materials = shellMaterials;
            modelGroup.add(chargeCloud); // Parent to modelGroup so it hugs during orbit.
        }

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (chargeCloud) {
                // Update shader time for breathing/shimmer on all shells.
                const mats = chargeCloud.userData.materials;
                for (let i = 0; i < mats.length; i++) {
                    mats[i].uniforms.uTime.value = elapsedTime;
                }

                // Gentle breathing/pulsing of the entire aura.
                const pulse = 1.0 + Math.sin(elapsedTime * 0.5) * 0.025;
                chargeCloud.scale.setScalar(pulse);

                // Slow drift/swirl.
                chargeCloud.rotation.y += 0.0005;
                chargeCloud.rotation.x += 0.0002;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>

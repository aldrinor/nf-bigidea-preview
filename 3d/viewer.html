<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Molecular Viewer — Charged Specimen</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#ddd}
  #info{position:fixed;top:12px;left:12px;background:rgba(10,10,12,.72);padding:10px 14px;border-radius:8px;border:1px solid #2a2a2a;font-size:13px;line-height:1.5;max-width:300px;backdrop-filter:blur(6px);z-index:10}
  #info b{color:#fff}
  #info .red{color:#ff5a4a}
  #info .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3a2a;box-shadow:0 0 8px #ff3a2a;margin-right:6px;vertical-align:middle}
  #load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:14px;background:#000;z-index:20}
  canvas{display:block}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="info">
  <b>Molecular Viewer</b><br>
  Drag to orbit · Scroll to zoom<br>
  <span class="dot"></span><span class="red">Red aura</span> = negative electrostatic charge cloud hugging the specimen surface.
</div>
<div id="load">Building scene…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const loadEl = document.getElementById('load');

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ---------- Scene & camera ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 2, 30);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 6;
controls.maxDistance = 80;

// ---------- IBL ----------
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Subtle direct lights to keep atoms crisp & glossy
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(8, 10, 12);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.35);
fill.position.set(-10, -4, -8);
scene.add(fill);

// ---------- Specimen (glossy atoms + bonds) ----------
const specimen = new THREE.Group();
scene.add(specimen);

const atomGeom = new THREE.IcosahedronGeometry(1, 4);
const atomPalette = [0xff6b4a, 0x4aa0ff, 0x9a7aff, 0x4ad0a0, 0xffd24a, 0xe8eef5];
const atoms = [];

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng = mulberry32(20240617);
const rand = () => rng();

function addAtom(pos, r, colorIdx){
  const mat = new THREE.MeshPhysicalMaterial({
    color: atomPalette[colorIdx],
    metalness: 0.15,
    roughness: 0.22,
    clearcoat: 0.7,
    clearcoatRoughness: 0.18,
    envMapIntensity: 1.0
  });
  const m = new THREE.Mesh(atomGeom, mat);
  m.position.copy(pos);
  m.scale.setScalar(r);
  specimen.add(m);
  atoms.push(m);
}

// central atom
addAtom(new THREE.Vector3(0,0,0), 1.5, 0);
// inner ring
const N = 14;
for(let i=0;i<N;i++){
  const a = (i/N)*Math.PI*2;
  const rr = 3.2 + rand()*0.6;
  const y = (rand()-0.5)*1.6;
  addAtom(new THREE.Vector3(Math.cos(a)*rr, y, Math.sin(a)*rr), 0.7+rand()*0.5, 1+Math.floor(rand()*5));
}
// outer branches
for(let i=0;i<24;i++){
  const a = rand()*Math.PI*2;
  const b = (rand()-0.5)*Math.PI;
  const rr = 4.6 + rand()*2.6;
  addAtom(new THREE.Vector3(Math.cos(a)*Math.cos(b)*rr, Math.sin(b)*rr, Math.sin(a)*Math.cos(b)*rr), 0.4+rand()*0.5, Math.floor(rand()*6));
}
// small hydrogens
for(let i=0;i<48;i++){
  const a = rand()*Math.PI*2;
  const b = (rand()-0.5)*Math.PI;
  const rr = 5.6 + rand()*2.0;
  addAtom(new THREE.Vector3(Math.cos(a)*Math.cos(b)*rr, Math.sin(b)*rr, Math.sin(a)*Math.cos(b)*rr), 0.22+rand()*0.18, 5);
}

// bonds
const bondMat = new THREE.MeshStandardMaterial({ color:0xb8b8c0, metalness:0.35, roughness:0.45 });
for(let i=0;i<atoms.length;i++){
  for(let j=i+1;j<atoms.length;j++){
    const d = atoms[i].position.distanceTo(atoms[j].position);
    if(d < 2.3 && d > 0.6){
      const mid = atoms[i].position.clone().add(atoms[j].position).multiplyScalar(0.5);
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,d,8), bondMat);
      cyl.position.copy(mid);
      cyl.lookAt(atoms[j].position);
      cyl.rotateX(Math.PI/2);
      specimen.add(cyl);
    }
  }
}

// ---------- Bounding sphere & centering ----------
const box = new THREE.Box3().setFromObject(specimen);
const center = box.getCenter(new THREE.Vector3());
const sphere = new THREE.Sphere();
box.getBoundingSphere(sphere);
const R = Math.max(0.5, sphere.radius);
specimen.position.sub(center); // specimen now centered at origin

// ---------- Tight red aura (particle shell 1.05R .. 1.45R) ----------
const auraCount = 4500;
const auraPositions = new Float32Array(auraCount*3);
const auraPhases    = new Float32Array(auraCount);
const auraRadii     = new Float32Array(auraCount);
const auraDir       = new Float32Array(auraCount*3);

for(let i=0;i<auraCount;i++){
  // uniform direction on sphere
  const u = rand(), v = rand();
  const theta = 2*Math.PI*u;
  const phi = Math.acos(2*v-1);
  const dx = Math.sin(phi)*Math.cos(theta);
  const dy = Math.sin(phi)*Math.sin(theta);
  const dz = Math.cos(phi);
  // radius biased toward inner edge (dense near molecule, fast falloff outward)
  const t = Math.pow(rand(), 1.9); // 0..1, biased to 0
  const r = R * (1.05 + 0.40 * t);  // 1.05R .. 1.45R
  auraPositions[i*3]   = dx * r;
  auraPositions[i*3+1] = dy * r;
  auraPositions[i*3+2] = dz * r;
  auraDir[i*3]   = dx;
  auraDir[i*3+1] = dy;
  auraDir[i*3+2] = dz;
  auraRadii[i]  = r;
  auraPhases[i] = rand() * Math.PI * 2;
}

const auraGeom = new THREE.BufferGeometry();
auraGeom.setAttribute('position', new THREE.BufferAttribute(auraPositions, 3));
auraGeom.setAttribute('aPhase',   new THREE.BufferAttribute(auraPhases, 1));
auraGeom.setAttribute('aRadius',  new THREE.BufferAttribute(auraRadii, 1));
auraGeom.setAttribute('aDir',     new THREE.BufferAttribute(auraDir, 3));

const auraMat = new THREE.ShaderMaterial({
  uniforms: {
    uTime:        { value: 0 },
    uPulse:       { value: 1.0 },
    uColorInner:  { value: new THREE.Color(0xff3a22) },
    uColorOuter:  { value: new THREE.Color(0x6a0010) },
    uPixelRatio:  { value: renderer.getPixelRatio() },
    uSize:        { value: 22.0 }
  },
  vertexShader: `
    attribute float aPhase;
    attribute float aRadius;
    attribute vec3  aDir;
    uniform float uTime;
    uniform float uPulse;
    uniform float uPixelRatio;
    uniform float uSize;
    varying float vAlpha;
    varying float vRad;
    varying float vTw;
    void main(){
      // slow swirl: rotate direction around Y by small angle (phase + time)
      float ang = uTime * 0.18 + aPhase * 0.6;
      float ca = cos(ang), sa = sin(ang);
      vec3 d = vec3(ca*aDir.x + sa*aDir.z, aDir.y, -sa*aDir.x + ca*aDir.z);

      // breathing pulse (1.0 .. 1.05)
      float r = aRadius * uPulse;

      // tiny radial wobble for "alive" feel
      r += sin(uTime * 1.3 + aPhase * 4.0) * 0.035 * aRadius;

      vec3 pos = d * r;

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mv;

      // twinkle
      float tw = 0.5 + 0.5 * sin(uTime * 2.2 + aPhase * 6.2831);
      vTw = tw;

      gl_PointSize = uSize * uPixelRatio * (1.0 / -mv.z) * (0.55 + 0.85 * tw);

      // normalized radius position in shell: 0 (inner) .. 1 (outer)
      float tnorm = clamp((aRadius - 1.05) / 0.40, 0.0, 1.0);
      // dense near inner, fast falloff outward
      float falloff = 1.0 - smoothstep(0.0, 1.0, tnorm);
      falloff = pow(falloff, 1.6);

      vAlpha = falloff;
      vRad = tnorm;
    }
  `,
  fragmentShader: `
    uniform vec3 uColorInner;
    uniform vec3 uColorOuter;
    varying float vAlpha;
    varying float vRad;
    varying float vTw;
    void main(){
      vec2 uv = gl_PointCoord - 0.5;
      float d = length(uv);
      if(d > 0.5) discard;
      // soft round sprite
      float soft = smoothstep(0.5, 0.0, d);
      soft = pow(soft, 1.5);
      // bright hot core
      float core = pow(1.0 - d * 2.0, 4.0);
      vec3 col = mix(uColorInner, uColorOuter, vRad);
      col += uColorInner * core * 0.7;
      float alpha = vAlpha * soft * (0.35 + 0.65 * vTw);
      gl_FragColor = vec4(col, alpha);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: true
});

const aura = new THREE.Points(auraGeom, auraMat);
aura.renderOrder = -1;
specimen.add(aura);

// ---------- Fresnel rim glow hugging the silhouette ----------
const rimMat = new THREE.ShaderMaterial({
  uniforms: {
    uColor: { value: new THREE.Color(0xff2a16) },
    uTime:  { value: 0 },
    uPulse: { value: 1.0 }
  },
  vertexShader: `
    varying vec3 vN;
    varying vec3 vP;
    void main(){
      vN = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vP = mv.xyz;
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    uniform vec3 uColor;
    uniform float uTime;
    uniform float uPulse;
    varying vec3 vN;
    varying vec3 vP;
    void main(){
      vec3 V = normalize(-vP);
      float fres = pow(1.0 - max(dot(vN, V), 0.0), 3.0);
      float pulse = 0.85 + 0.15 * sin(uTime * 1.4);
      float a = fres * 0.5 * pulse;
      gl_FragColor = vec4(uColor, a);
    }
  `,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: true,
  side: THREE.FrontSide
});

// Slightly inflated shell so the rim reads along the molecule's outer silhouette
const rimGeom = new THREE.SphereGeometry(R * 1.015, 64, 48);
const rimMesh = new THREE.Mesh(rimGeom, rimMat);
rimMesh.renderOrder = -0.5;
specimen.add(rimMesh);

// ---------- Animate ----------
const clock = new THREE.Clock();
function animate(){
  const t = clock.getElapsedTime();
  // breathing: 1.0 .. 1.05
  const pulse = 1.0 + 0.025 * (0.5 + 0.5 * Math.sin(t * 0.8));

  auraMat.uniforms.uTime.value  = t;
  auraMat.uniforms.uPulse.value = pulse;
  rimMat.uniforms.uTime.value  = t;
  rimMat.uniforms.uPulse.value = pulse;

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  auraMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
});

loadEl.remove();
animate();
</script>
</body>
</html>

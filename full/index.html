<meta charset="utf-8">

<title>Peak to city</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#b7ceed;overflow-x:hidden}
  #stage{position:fixed;inset:0;z-index:0}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  /* The mountain sits on top and is dissolved away inside its own whiteout. The city
     is underneath the whole time, already running, so nothing has to start at the
     handover -- a scene that begins mid-transition always shows the join. */
  #city{opacity:0}
  #mtn{opacity:1}
  #scroller{pointer-events:none}
  .bar{position:fixed;left:0;right:0;top:0;z-index:6;display:flex;align-items:center;
    justify-content:space-between;padding:52px 76px 0 76px;pointer-events:none}
  .bar img{height:44px;width:auto;pointer-events:auto}
  .bar nav{display:flex;align-items:center;gap:34px;pointer-events:auto}
  .bar nav a{font-family:Montserrat,Arial,sans-serif;font-size:16.5px;font-weight:620;
    line-height:1.3;color:#000;text-decoration:none;padding:10px 0;
    transition:opacity .25s ease}
  .bar nav a:hover{opacity:.58}
  .bar nav a.pill{border:1.5px solid #000;border-radius:8px;padding:13px 18px;font-weight:650}
  .bar nav a.pill:hover{opacity:1;background:#000;color:#fff}
  @media (max-width:900px){
    .bar{padding:20px 20px 0}
    .bar img{height:26px}
    .bar nav a{display:none}
    .bar nav a.pill{display:block;font-size:12.5px;padding:8px 11px}
  }
  #load{position:fixed;inset:0;display:grid;place-items:center;z-index:9;background:#b7ceed;
    font:650 12px/1.2 Montserrat,Arial,sans-serif;letter-spacing:.12em;color:#3f5a7a;
    transition:opacity .7s}
  #load.gone{opacity:0;pointer-events:none}
</style>
</head>

<div id="stage">

<div id="scroller"></div>

<script>
/* ---------------------------------------------------------------------------
   One scrollbar, two scenes.

   The wrapper owns the page scroll and drives each scene by setting its own
   scrollTop. Both frames are same-origin, so this is a direct call rather than a
   postMessage handshake -- fewer moving parts, and no risk of the two drifting apart
   by a frame, which is what would show at the join.

   The handover happens INSIDE the mountain's whiteout. That is the whole trick: at
   that point the mountain page is formless grey from edge to edge, so there is nothing
   whose shape could fail to line up with the city behind it. The two scenes never have
   to match geometrically, only in tone -- and both are the same grey there.
   --------------------------------------------------------------------------- */

const MTN_END   = 0.42;    // how far into the mountain's own scroll we go before leaving
const FADE_IN   = 0.345;   // the whiteout is total from about here...
const FADE_OUT  = 0.415;   // ...to about here

/* The wrapper's height is the two scenes' scroll lengths, in their own proportions, so
   neither one is sped up or slowed down relative to how it was built and judged. */
const MTN_VH  = 1040 * MTN_END;   // the mountain page is 1040vh
const CITY_VH = 660;              // the city page is 660vh
const TOTAL_VH = Math.round(MTN_VH + CITY_VH);

const scroller = document.getElementById('scroller');
scroller.style.height = TOTAL_VH + 'vh';

const mtn = document.getElementById('mtn');
const city = document.getElementById('city');
const split = MTN_VH / TOTAL_VH;   // fraction of the wrapper scroll that is mountain

let ready = 0;
function whenReady(frame, fn){
  const check = () => {
    try {
      const w = frame.contentWindow;
      if (w && w.document && w.document.readyState === 'complete') { fn(); return; }
    } catch (e) { /* still loading */ }
    setTimeout(check, 120);
  };
  check();
}
function armed(){
  if (++ready < 2) return;
  document.getElementById('load').classList.add('gone');
  try { mtn.contentDocument.querySelector('.bar').style.display = 'none'; } catch (e) {}
  requestAnimationFrame(tick);
}
whenReady(mtn, armed);
whenReady(city, armed);

function smootherstep(a, b, x){
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t*t*t*(t*(t*6 - 15) + 10);
}

function drive(frame, p){
  try {
    const w = frame.contentWindow, d = w.document.documentElement;
    const max = Math.max(1, d.scrollHeight - w.innerHeight);
    w.scrollTo(0, p * max);
  } catch (e) { /* frame not ready yet */ }
}

let last = -1, cityLive = true, mtnLive = true;
function tick(){
  const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
  const p = Math.min(1, Math.max(0, scrollY / max));

  if (p !== last){
    last = p;
    /* The mountain keeps being driven a little past the handover, and the city is
       already moving before it. Both scenes stay alive across the join, so neither one
       pops into motion when it becomes visible. */
    const mp = Math.min(MTN_END + 0.03, (p / split) * MTN_END);
    const cp = Math.max(0, (p - split) / (1 - split));
    drive(mtn, mp / 1.0);
    drive(city, cp);

    const fade = smootherstep(FADE_IN, FADE_OUT, mp);
    mtn.style.opacity = (1 - fade).toFixed(3);
    city.style.opacity = fade.toFixed(3);

    /* only the scene on screen renders; the other one is switched off entirely */
    const cityOn = mp > FADE_IN - 0.08;
    const mtnOn  = mp < FADE_OUT + 0.04;
    if (cityOn !== cityLive){ city.style.display = cityOn ? 'block' : 'none'; cityLive = cityOn; }
    if (mtnOn  !== mtnLive){  mtn.style.display  = mtnOn  ? 'block' : 'none'; mtnLive  = mtnOn; }
    /* only the visible scene should take the drag, or the two look-arounds fight */
    mtn.style.pointerEvents  = fade < 0.5 ? 'auto' : 'none';
    city.style.pointerEvents = fade < 0.5 ? 'none' : 'auto';
  }
  requestAnimationFrame(tick);
}

/* A frame that has the pointer swallows the wheel, so the page would stop scrolling the
   moment the cursor was over a scene. Forward it back out. */
function forwardWheel(frame){
  try {
    frame.contentWindow.addEventListener('wheel', e => {
      window.scrollBy({top: e.deltaY, behavior: 'instant'});
    }, {passive: true});
  } catch (e) {}
}
whenReady(mtn, () => forwardWheel(mtn));
whenReady(city, () => forwardWheel(city));

addEventListener('resize', () => { last = -1; });
window.__setP = v => {
  const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
  window.scrollTo(0, v * max);
};
</script>
